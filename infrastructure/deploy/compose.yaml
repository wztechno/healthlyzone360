name: healthy360-deploy

# Deployed stack for the online test instance.
#
# Differences from the root compose.yaml that matter:
#   * the API image carries the code (no bind mounts, so nothing on the host
#     can change a running container's behaviour);
#   * Postgres and Redis publish no host ports — they are reachable only on
#     this compose network, never from the internet;
#   * Caddy terminates TLS in front of nginx and is the only listener exposed;
#   * Garage is absent. Only three services touch a disk (B2B exports, KYC
#     documents, kitchen workbook import) and FILESYSTEM_DISK=local serves them
#     from the api storage volume, so an S3 node would be a moving part with
#     nothing to do.

services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddydata:/data
            - caddyconfig:/config
        depends_on:
            - web

    web:
        image: nginx:1.29-alpine
        restart: unless-stopped
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            # Route rules generated from the export at package time.
            - ./dynamic-routes.conf:/etc/nginx/dynamic-routes.conf:ro
            # The Expo web export. Read-only: nginx has no business writing here.
            - ./web:/srv/web:ro
        depends_on:
            api:
                condition: service_healthy

    api:
        build:
            context: .
        image: healthy360/api:deployed
        restart: unless-stopped
        env_file:
            - .env.deploy
        volumes:
            - apistorage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'pidof php-fpm']
            interval: 10s
            timeout: 5s
            retries: 5

    queue:
        image: healthy360/api:deployed
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon']
        env_file:
            - .env.deploy
        volumes:
            - apistorage:/var/www/html/storage
        depends_on:
            api:
                condition: service_healthy
        # Horizon terminates on SIGTERM only after its workers finish their
        # current job; give it room rather than killing mid-job.
        stop_grace_period: 30s

    scheduler:
        image: healthy360/api:deployed
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        env_file:
            - .env.deploy
        volumes:
            - apistorage:/var/www/html/storage
        depends_on:
            api:
                condition: service_healthy

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
            # Read by the init script below, which runs once on an empty volume.
            H360_MIGRATOR_PASSWORD: ${DB_MIGRATIONS_PASSWORD:?DB_MIGRATIONS_PASSWORD is required}
            H360_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
        volumes:
            - pgdata:/var/lib/postgresql
            - ./postgres-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
    redisdata:
    apistorage:
    caddydata:
    caddyconfig:
