; Healthy360 php-fpm pool, layered over the official image's www.conf (the
; file sorts after it, so these values win).
;
; The image's default is 5 workers. A browse page fires several API calls at
; once, and on the dev droplet (2026-10-20) the sixth simply waited for a
; worker. A Laravel worker here holds 30-60MB, and prod and dev share one 4GB
; droplet, so 10 per stack is roughly 1GB at worst. Raise it with the RAM.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle a worker now and then so slow leaks cannot accumulate.
pm.max_requests = 500
