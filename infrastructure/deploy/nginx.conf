# One origin for both halves of the product.
#
# The Expo web export is served at / and the Laravel API at /api — same scheme,
# same host, same port. That is deliberate: it removes CORS from the picture
# entirely (config/cors.php still carries the allow-list for native clients),
# lets Sanctum's cookie session work without cross-site cookie rules, and means
# the bundle can be built against one origin it will always be served from.

map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https   on;
}

server {
    listen 80;
    # The image's entrypoint normally appends this itself, but it cannot edit a
    # read-only config mount — and without it `localhost` (which resolves to ::1
    # first) is refused inside the container while 127.0.0.1 answers fine.
    listen [::]:80;
    server_name _;

    root /srv/web;
    index index.html;

    charset utf-8;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # A test instance holding demo tenant data should not be indexed.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Horizon ships with the application and answers at /horizon wherever its
    # gate allows. The gate (HorizonServiceProvider) has an empty allow-list,
    # which closes it everywhere except local — and seeding this instance runs
    # a one-off container as local, because the demo seeders refuse to run in
    # any other environment. Rather than depend on that distinction holding,
    # the dashboard is closed at the edge, where nothing in the app can reopen it.
    location ^~ /horizon {
        return 404;
    }

    # Laravel's front controller. Every path the framework owns is named here
    # and handed straight to FPM: no filesystem probing, and this container
    # never needs a copy of the application code.
    location ~ ^/(?:api/|sanctum/|up$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Belt and braces alongside trustProxies(): PHP sees the request as
        # secure even before the framework inspects the forwarded headers.
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Hashed bundles and assets — the filename changes whenever the bytes do.
    location ^~ /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dynamic routes, generated from the export by package.sh: Expo names those
    # files after the pattern rather than the value, so /kitchens/some-kitchen
    # lives in `kitchens/[kitchen].html` and nothing but an explicit rule finds
    # it. Included after the API location so those paths are claimed first.
    include /etc/nginx/dynamic-routes.conf;

    # Everything else is a statically pre-rendered route: /marketplace is
    # marketplace.html, /kitchens is kitchens/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # A URL matching no export gets the exported not-found page *with a 404
    # status* — served through error_page rather than as a try_files fallback,
    # which would answer 200 and tell a crawler, a monitor and a tester
    # reporting a typo that the page exists. Deliberately not index.html:
    # that hands React the landing page's markup to hydrate against whatever
    # the router decides to render.
    error_page 404 /+not-found.html;
}
