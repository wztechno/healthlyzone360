; Healthy360 deployed PHP settings.
;
; The development counterpart (infrastructure/docker/php/php.ini) revalidates
; opcache on every request because the code is a bind mount that changes under
; the running process. Here the code is baked into the image, so timestamp
; validation is pure overhead: a code change means a new image, which means a
; new container with a cold cache anyway.
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 120
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Nothing about the runtime belongs in a response header or a response body.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
