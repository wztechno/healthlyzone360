packages:
  - apps/universal
  - packages/*

# React Native / Metro cannot follow pnpm's default symlinked store layout reliably,
# so the workspace uses a hoisted node_modules tree (dependency-compatibility.md).
nodeLinker: hoisted

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds` and takes a name -> boolean map.
# Only these packages may run install lifecycle scripts; everything else is blocked by default.
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# The npm registry is slow enough from some networks to trip the 60s default.
fetchTimeout: 600000

# `pnpm run` re-validates the dependency tree before every script. With the hoisted linker it
# periodically decides the modules directory needs replacing, and asks for confirmation — which no
# `turbo run` (or any other non-interactive parent) can give, so the task dies with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY instead of running. CI is unaffected because CI=true
# already implies this; the setting simply makes local runs behave the same way.
confirmModulesPurge: false

# expo-linking pins an older patch of expo-constants, which leaves two copies of a *native* module
# in the tree — a hard error for a native build and an expo-doctor failure. Both are SDK 57
# patches, so pinning the newer one is safe.
overrides:
  expo-constants: 57.0.8
  # Security patches for transitive build-time dependencies (Expo CLI, Metro, Jest preset).
  # Each selector stays inside the major the parent already uses, so no parent sees a breaking
  # version. Remove an entry once `pnpm audit` is clean without it.
  'shell-quote@>=1.8.4 <1.11.0': 1.12.0
  '@xmldom/xmldom@>=0.8.0 <0.8.15': 0.8.15
  '@xmldom/xmldom@>=0.9.0-0 <0.9.12': 0.9.12
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'compression@<1.8.2': 1.8.2
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.20
  'node-forge@<1.4.1': 1.4.1
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'postcss-selector-parser@>=6.0.0 <6.1.5': 6.1.5

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/metro-runtime@57.0.8'
  - '@expo/prebuild-config@57.0.10'
  - '@expo/ui@57.0.8'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-modules-core@57.0.8
  - expo-router@57.0.9
  - expo-system-ui@57.0.2
  - expo@57.0.9
  - jest-expo@57.0.3
