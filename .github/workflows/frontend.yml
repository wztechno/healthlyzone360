name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/universal/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/universal/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack takes the pnpm version from `packageManager` in package.json; the prompt would block a
  # non-interactive runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # ── static analysis, unit tests ────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm turbo run typecheck

      - name: ESLint
        run: pnpm turbo run lint

      - name: Prettier (format check)
        run: pnpm run format:check

      - name: Vitest (shared packages)
        run: pnpm turbo run test --filter=!universal --filter=!@healthy360/design-system

      - name: Jest Expo (design system and application)
        run: pnpm turbo run test --filter=universal --filter=@healthy360/design-system

  # ── Expo configuration and export ──────────────────────────────────────────────────────────────
  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # No Expo Doctor step: `expo-doctor` ships as its own package and is not a dependency here,
      # so the step could only ever fail on a clean install. It stays a local tool — run
      # `pnpm --filter universal run doctor` when dependency drift is the question being asked.

      # The one artefact everything runs against since ADR-0013: the all-dev api export.
      # (The mock export and its production negative gate died with the mock implementation;
      # the surviving production guard — a required EXPO_PUBLIC_API_URL — is asserted below.)
      - name: Web export — all-dev (api)
        working-directory: apps/universal
        env:
          APP_MODE: all-dev
          APP_ENV: development
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run build:web:api

      # Size budgets, checked on the `all-dev` export because it carries every area of the
      # application at once and is therefore a bound on every narrower build. The numbers and their
      # derivation live in the script.
      - name: Export size budgets
        working-directory: apps/universal
        run: pnpm run budget:export

      # One production-ready family, configured exactly as it would ship: production environment
      # and a real base URL. The host is a placeholder because nothing is fetched — the export only
      # has to *configure and bundle* under production rules.
      - name: Web export — customer (production)
        working-directory: apps/universal
        env:
          APP_MODE: customer
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.healthy360.invalid
        run: pnpm run build:web:api

  # ── Playwright read projects against the api export and the real Laravel API ──────────────────
  #
  # Same provisioning as `e2e-api` below; this job runs the parallel read-mostly projects while
  # `e2e-api` runs the single-worker `web-write` mutation project.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create database roles and databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
        run: bash infrastructure/docker/postgres/init/01-roles-and-databases.sh

      - name: Prepare API environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate and seed the demo world
        working-directory: apps/api
        run: php artisan migrate:fresh --database=pgsql_migrations --seed --force

      - name: Serve the API
        working-directory: apps/api
        env:
          QUEUE_CONNECTION: sync
          PHP_CLI_SERVER_WORKERS: "4"
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/up > /dev/null; do sleep 1; done'
          echo "API is up."

      - name: Install Chromium for Playwright
        working-directory: apps/universal
        run: pnpm exec playwright install --with-deps chromium

      - name: Web export (the artefact the suites run against)
        working-directory: apps/universal
        env:
          APP_MODE: all-dev
          APP_ENV: development
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run build:web:api

      - name: Playwright — web-ltr, web-rtl, a11y
        working-directory: apps/universal
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm exec playwright test --project=web-ltr --project=web-rtl --project=a11y --workers=4

      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: apps/universal/playwright-report
          retention-days: 7

  # ── Playwright against the exported api build and the real Laravel API ────────────────────────
  #
  # The `web-write` project: `dist-api` served statically, the Laravel
  # API on :8080 via `php artisan serve`, PostgreSQL and Redis as services — the same provisioning
  # backend.yml's test job uses. `artisan serve` rather than docker compose because compose builds
  # a custom PHP image and starts nginx, horizon and garage before a single test runs; the specs
  # observe none of that. Mail goes to the log (`MAIL_MAILER=log` in .env.example) and the queue
  # runs sync, so verification links land in `storage/logs/laravel.log` inline with the request —
  # exactly where the helpers read them.
  e2e-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create database roles and databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
        run: bash infrastructure/docker/postgres/init/01-roles-and-databases.sh

      - name: Prepare API environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate and seed the demo world
        working-directory: apps/api
        run: php artisan migrate:fresh --database=pgsql_migrations --seed --force

      - name: Serve the API
        working-directory: apps/api
        env:
          QUEUE_CONNECTION: sync
          PHP_CLI_SERVER_WORKERS: "4"
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/up > /dev/null; do sleep 1; done'
          echo "API is up."

      - name: Web export — api data (the artefact web-write runs against)
        working-directory: apps/universal
        env:
          APP_MODE: all-dev
          APP_ENV: development
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run build:web:api

      - name: Install Chromium for Playwright
        working-directory: apps/universal
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright — web-write (single worker, shared database)
        working-directory: apps/universal
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run e2e:write

      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-api-report
          path: |
            apps/universal/playwright-report
            apps/universal/test-results
            apps/api/storage/logs/laravel.log
          retention-days: 7

  # ── Visual regression, from the one machine allowed to have an opinion ─────────────────────────
  #
  # A screenshot baseline is a claim about how glyphs are rasterised, and that claim is only true on
  # the machine that made it. So the 38 committed baselines are captured and compared **only** inside
  # `mcr.microsoft.com/playwright:v1.62.0-noble`, pinned by tag, and the visual projects skip
  # anywhere else (see apps/universal/e2e/specs/visual-pages.ts).
  #
  # The container is started with `docker run` as locally, plus `--network host` — the visual
  # pages read the seeded API on :8080, and on a Linux runner host networking is how the pinned
  # container reaches it. (Locally on Docker Desktop, build the artefact against
  # `host.docker.internal:8080` instead; the script comment in package.json says so.)
  #
  # Everything except the browser runs on the host: the install and the export need pnpm and Expo,
  # and the runner is Linux too, so the mounted `node_modules` is usable from inside the image.
  visual:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create database roles and databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
        run: bash infrastructure/docker/postgres/init/01-roles-and-databases.sh

      - name: Prepare API environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate and seed the demo world
        working-directory: apps/api
        run: php artisan migrate:fresh --database=pgsql_migrations --seed --force

      - name: Serve the API
        working-directory: apps/api
        env:
          QUEUE_CONNECTION: sync
          PHP_CLI_SERVER_WORKERS: "4"
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/up > /dev/null; do sleep 1; done'
          echo "API is up."

      - name: Web export (the artefact the baselines describe)
        working-directory: apps/universal
        env:
          APP_MODE: all-dev
          APP_ENV: development
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run build:web:api

      - name: Playwright — visual, visual-rtl, visual-dark (pinned container, host network)
        run: >-
          docker run --rm --network host -v ./:/work -w /work/apps/universal
          -e PLAYWRIGHT_VISUAL=1 -e CI=true
          mcr.microsoft.com/playwright:v1.62.0-noble
          npx playwright test --project=visual --project=visual-rtl --project=visual-dark

      # The report carries the expected/actual/diff triptych for every failed comparison, which is
      # the only useful thing to look at when a baseline breaks.
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-visual-report
          path: |
            apps/universal/playwright-report
            apps/universal/test-results
          retention-days: 7
