name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/universal/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/universal/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack takes the pnpm version from `packageManager` in package.json; the prompt would block a
  # non-interactive runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # ── static analysis, unit tests ────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm turbo run typecheck

      - name: ESLint
        run: pnpm turbo run lint

      - name: Prettier (format check)
        run: pnpm run format:check

      - name: Vitest (shared packages)
        run: pnpm turbo run test --filter=!universal --filter=!@healthy360/design-system

      - name: Jest Expo (design system and application)
        run: pnpm turbo run test --filter=universal --filter=@healthy360/design-system

  # ── Expo configuration and export ──────────────────────────────────────────────────────────────
  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # No Expo Doctor step: `expo-doctor` ships as its own package and is not a dependency here,
      # so the step could only ever fail on a clean install. It stays a local tool — run
      # `pnpm --filter universal run doctor` when dependency drift is the question being asked.

      # The all-dev api export: every area of the application in one bundle, which is what makes
      # it the right thing to measure the size budgets against. `EXPO_PUBLIC_API_URL` is a
      # bundle-time value here and nothing is fetched — no stack is provisioned for this job.
      - name: Web export — all-dev (api)
        working-directory: apps/universal
        env:
          APP_MODE: all-dev
          APP_ENV: development
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: pnpm run build:web:api

      # Size budgets, checked on the `all-dev` export because it carries every area of the
      # application at once and is therefore a bound on every narrower build. The numbers and their
      # derivation live in the script.
      - name: Export size budgets
        working-directory: apps/universal
        run: pnpm run budget:export

      # One production-ready family, configured exactly as it would ship: production environment
      # and a real base URL. The host is a placeholder because nothing is fetched — the export only
      # has to *configure and bundle* under production rules.
      - name: Web export — customer (production)
        working-directory: apps/universal
        env:
          APP_MODE: customer
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.healthy360.invalid
        run: pnpm run build:web:api
