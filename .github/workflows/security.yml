name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  prohibited-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for files that must never be committed
        run: |
          set -e
          fail=0
          # Environment files (templates are allowed).
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::Committed environment files:"; echo "$bad"; fail=1; fi
          # Private keys and certificates.
          bad=$(git ls-files | grep -E '\.(pem|p12|pfx|key)$|(^|/)id_(rsa|ed25519)' || true)
          if [ -n "$bad" ]; then echo "::error::Committed key material:"; echo "$bad"; fail=1; fi
          # Dependency directories.
          bad=$(git ls-files | grep -E '(^|/)(vendor|node_modules)/' || true)
          if [ -n "$bad" ]; then echo "::error::Committed dependency directories:"; echo "$bad"; fail=1; fi
          # Oversized files (> 5 MB).
          while read -r f; do
            size=$(wc -c < "$f")
            if [ "$size" -gt 5242880 ]; then echo "::error::File over 5 MB: $f ($size bytes)"; fail=1; fi
          done < <(git ls-files)
          exit $fail

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
