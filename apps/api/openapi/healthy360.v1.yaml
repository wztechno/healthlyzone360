        the kind decides whether prices behind the channel are contract-private,
        and flipping a live b2b desk to `b2c_web` would reclassify every one of
        them in a single write with no record of what had been private.

        `status` **is** accepted here rather than being a POST action, unlike
        catalogue-item publication: activating a channel is operational
        configuration, not a decision about what reaches a customer.

        **`If-Match` required.** Requires `catalogue.manage_organisation`.
