            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueItemEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
