          description: The item and its channel assignments.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [item, channels]
                    properties:
                      item:
                        $ref: '#/components/schemas/AdminCatalogueItem'
                      channels:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminChannelAssignment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalogue/items/{item}/allergens:
    get:
      operationId: showCatalogueItemAllergens
      tags: [Sellable catalogue]
      summary: An item's derived allergen set
      description: |
        Read-only, and **there is no writer** — that is the point. An item's
        allergens are never authored here: they come from a published recipe
        version's frozen label, or from the union of the item's own listed
        ingredients' effective mappings. An endpoint that let a merchandiser
        type an allergen onto a listing would be an endpoint that lets a
        merchandiser overrule a chef.

        Computed on read, never stored. There is no roll-up column and no
        per-item allergen table: the joins are cheap, and a stored copy goes
        stale the moment a mapping changes. Stored labels exist exactly where
        freezing is the point — on a published recipe version.

        `meta.basis` says which source answered:

        - `recipe_version` — the linked recipe's published version. Its frozen
          rows are the answer, with `declared` preserved as `declared`.
        - `item_ingredients` — the union of the listed ingredients' effective
          mappings, strongest containment winning, with `source_ingredient_id`
          naming the ingredient that made the stronger claim.
        - `none` — an empty set that means **"nobody has said"**, never "no
          allergens". Silence is not a statement of absence, and the publish
          gate refuses a meal in this state.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The derived allergen set and the basis it was derived from.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [allergens]
                    properties:
                      allergens:
                        type: array
                        items:
                          $ref: '#/components/schemas/DerivedAllergen'
                  meta:
                    $ref: '#/components/schemas/DerivedAllergenMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /reference/diet-classifications:
    get:
      operationId: listDietClassifications
      tags: [Reference data]
      summary: The platform diet vocabulary
      security: []
      description: |
        **Anonymous.** A diet filter that only works after sign-in is not a
        diet filter — the argument the public allergen-class list makes,
        applied to the softer of the two vocabularies.

        Served through the public projection: one server-localised `name`
        chosen from `Accept-Language`, never both language columns. Inactive
        classifications are excluded.

        A classification is a **preference filter, never a medical
        restriction**. What a dish contains is its allergen declaration; this
        says how a person describes the pattern of what they eat.

        Unpaginated: the list is small and constant.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The active diet classifications, localised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicDietClassification'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        properties:
                          count:
                            type: integer
                            minimum: 0
                          locale:
                            type: string
                            enum: [en, ar]
                            description: The locale the names were rendered in.
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: healthy360_session
      description: |
        The Sanctum first-party session cookie, issued by `POST /auth/login`
        to clients whose `Origin` is a configured stateful domain.

        Before the first state-changing request the client calls
        `GET /sanctum/csrf-cookie` (outside `/api/v1`, part of the session
        handshake rather than the resource API) and then sends the
        `X-XSRF-TOKEN` header taken from the `XSRF-TOKEN` cookie.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A Sanctum personal access token from `POST /auth/token`, bound to a
        registered device and revocable at `DELETE /me/devices/{device}`.

  headers:
    XCorrelationId:
      description: |
        The server-generated correlation identifier for this request (UUIDv7).
        Returned on every response and repeated in the body.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0

    ETag:
      description: |
        The current `lock_version` of a lock-versioned resource, quoted. A
        client keeps it and sends it back as `If-Match` when it writes.
      required: true
      schema:
        type: string
        examples: ['"3"']

  parameters:
    XOrganisationId:
      name: X-Organisation-Id
      in: header
      required: false
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XOrganisationIdRequired:
      name: X-Organisation-Id
      in: header
      required: true
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: |
        The active branch. Validated against the membership scope: a
        branch-scoped membership may only work inside its own branch.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Locale negotiation. Regional subtags are accepted.
      schema:
        type: string
        examples: [ar-LB, en]
    XClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      description: |
        An opaque client-generated identifier for support correlation. Logged
        and echoed back; never used as the correlation identifier.
      schema:
        type: string
        maxLength: 128
    XAppMode:
      name: X-App-Mode
      in: header
      required: false
      description: The build family. Diagnostic only; never an authorisation input.
      schema:
        type: string
        enum: [customer, staff, kiosk, driver, all-dev]
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: The client version, for diagnostics and deprecation telemetry.
      schema:
        type: string
        examples: ['1.4.0']
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: The client platform.
      schema:
        type: string
        enum: [web, ios, android]

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `ETag` the resource was last served with. Required on writes to
        lock-versioned resources: absent is **428**
        `request.precondition_required`, stale is **409** `resource.conflict`
        carrying `details.current_lock_version`. `*` is accepted and means
        "as long as the resource exists".
      schema:
        type: string
        examples: ['"3"']
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `meta.next_cursor` of the previous page. Opaque — echo it back,
        never construct one. A cursor this endpoint did not issue is
        `400 request.invalid`, never a silent restart from the beginning.
      schema:
        type: string
        maxLength: 200
    CursorLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IngredientPath:
      name: ingredient
      in: path
      required: true
      description: The ingredient identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    AllergenCodePath:
      name: code
      in: path
      required: true
      description: The canonical allergen class code.
      schema:
        $ref: '#/components/schemas/AllergenCode'
    RecipePath:
      name: recipe
      in: path
      required: true
      description: The recipe identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecipeVersionPath:
      name: version
      in: path
      required: true
      description: |
        The version identifier, or its `version_number`. Both are accepted
        because both are natural — a client that walked the list holds
        identifiers, a human reading a technical sheet holds "version 3" — and
        a number cannot be mistaken for a UUID. The version is always resolved
        inside the recipe in the path, so one recipe's number can never reach
        another's version.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            pattern: '^\d+$'

    CatalogueItemPath:
      name: item
      in: path
      required: true
      description: |
        The item identifier, or its `slug`. Both are accepted because both are
        natural — a client that walked the list holds identifiers, a
        marketplace integration or a support engineer holds
        `harissa-paste-250g` — and a slug is unique per organisation and
        immutable, so the two answers cannot drift apart.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 140
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    SalesChannelPath:
      name: channel
      in: path
      required: true
      description: The channel identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

  responses:
    Accepted:
      description: Accepted for delivery.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
                    const: true
              meta:
                $ref: '#/components/schemas/Meta'

    LoginOutcome:
      description: |
        The sign-in resolved. `two_factor_required: false` means a session now
        exists; `true` means the client must complete
        `POST /auth/two-factor-challenge`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [two_factor_required]
                properties:
                  two_factor_required:
                    type: boolean
              meta:
                $ref: '#/components/schemas/Meta'

    PasswordConfirmationStatus:
      description: The step-up state of the calling credential.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [confirmed, timeout_seconds]
                properties:
                  confirmed:
                    type: boolean
                  timeout_seconds:
                    type: integer
                    minimum: 0
                    description: How long a confirmation remains valid.
              meta:
                $ref: '#/components/schemas/Meta'

    TwoFactorStateResponse:
      description: |
        The two-factor state of the account. `enabled` means a secret exists;
        `confirmed` means two-factor authentication is armed and will be
        demanded at the next sign-in.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/TwoFactorState'
              meta:
                $ref: '#/components/schemas/Meta'

    RecoveryCodes:
      description: Single-use recovery codes.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
              meta:
                $ref: '#/components/schemas/Meta'

    RequestInvalid:
      description: |
        The request could not be processed as sent — typically a session
        endpoint reached without a first-party `Origin`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.invalid
              message: This endpoint serves first-party session clients only; native clients must use /api/v1/auth/token.
              details:
                required_headers: [Origin]
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    ContextRequired:
      description: The endpoint is organisation-scoped and no `X-Organisation-Id` was sent.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_required
              message: An X-Organisation-Id header is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    Unauthenticated:
      description: No usable credential was presented.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.unauthenticated
              message: Authentication is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    EmailUnverified:
      description: The address has not been verified.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.email_unverified
              message: Your email address must be verified before you can use this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    StepUpRequired:
      description: |
        The action is sensitive and needs a recent password confirmation.
        **HTTP 403, never 423** (plan §13).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.step_up_required
              message: This action requires you to confirm your password again.
              details:
                confirmation_endpoint: /api/v1/auth/confirm-password
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    ContextDenied:
      description: |
        The organisation or branch could not be validated for this person. The
        message never reveals whether the organisation exists.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_forbidden
              message: You do not have an active membership in the requested organisation.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    ContextOrPermissionDenied:
      description: |
        The context was refused (`context.organisation_forbidden`,
        `context.branch_out_of_scope`) or the membership's roles do not grant
        the required permission (`authz.permission_denied`, with the denying
        RBAC step in `details.reason`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: authz.permission_denied
              message: You do not have permission to perform this action.
              details:
                reason: permission_not_granted
                permission: organisation.view_current
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    NotFound:
      description: The resource does not exist, or is not the caller's to see.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.not_found
              message: The requested resource does not exist.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    InvalidCredentials:
      description: |
        The credentials were rejected. Deliberately not a field-level
        validation error: clients branch on the code.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.invalid_credentials
              message: These credentials do not match our records.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    ValidationFailed:
      description: The submitted data is invalid.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: The submitted data is invalid.
              details:
                fields:
                  email:
                    - The email field must be a valid email address.
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    TooManyRequests:
      description: The rate limit for this endpoint was exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit.exceeded
              message: Too many requests. Please retry later.
              details:
                retry_after_seconds: 47
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    PreconditionRequired:
      description: |
        The resource is lock-versioned and the write carried no `If-Match`.
        **HTTP 428, not 409 and not 400**: the client has not lost a race — it
        never entered one — and the fix is to read the resource and retry with
        its validator.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.precondition_required
              message: This resource requires an If-Match header carrying the version you last read.
              details:
                required_headers: [If-Match]
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    ResourceConflict:
      description: |
        The change conflicts with the current state. On a lock-versioned
        write this is a lost race, and `details.current_lock_version` is the
        value to reload against, so a client can offer "reload" or "keep
        mine" without a second round trip.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This resource changed since you last read it. Reload it and reapply your change.
              details:
                current_lock_version: 4
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    AllergenBaselineWeakened:
      description: |
        The submitted data is invalid. On an allergen replacement this is
        usually the upgrade-only rule:
        `details.weakened_allergen_classes` names the platform baseline
        classes the request would have dropped or weakened.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: An organisation mapping may add to the platform allergen baseline but never weaken it.
              details:
                fields:
                  mappings:
                    - The platform baseline for this ingredient must be kept or strengthened.
                weakened_allergen_classes: [gluten]
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    RecipeArchiveBlocked:
      description: |
        The recipe still has a published version.
        `details.published_version_ids` names them. Withdrawing something from
        sale is retiring the version — its own action, its own permission —
        not a side effect of archiving.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This recipe still has a published version. Retire it before archiving the recipe.
              details:
                published_version_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40']
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    IngredientArchiveConflict:
      description: |
        Three codes share this status, because three different things can be
        wrong and the remedies differ.

        **`catalogue.in_use`** — the ingredient is still named by a recipe
        version that has not been retired. `details.recipe_ids` and
        `details.recipe_version_ids` name them, so the caller knows what to
        retire first. Retired versions are never a blocker: history is allowed
        to reference an archived ingredient.

        **`resource.conflict`** — either the ingredient is already archived, or
        the write lost a race and `details.current_lock_version` is the value
        to reload against.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This ingredient is still used by a recipe version that has not been retired.
              details:
                recipe_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41']
                recipe_version_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42']
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    VersionImmutableOrConflict:
      description: |
        Either the version is frozen (`catalogue.version_immutable` — it is
        published or retired, and no amount of reloading will make it writable;
        the answer is a new draft version) or the write lost a race
        (`resource.conflict`, carrying `details.current_lock_version`). Two
        codes, because the remedies are different.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.version_immutable
              message: A published recipe version cannot be changed. Create a new draft version instead.
              details:
                status: published
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    PublishBlocked:
      description: |
        The readiness evaluator refused. `details.reasons` carries **every**
        blocker rather than the first one found — a gate that reveals one
        problem per attempt turns a five-minute fix into five round trips.
        Each entry is a stable machine `reason` plus whatever identifies the
        offending rows.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This recipe version is not ready to be published.
              details:
                reasons:
                  - reason: line_quantity_missing
                    line_numbers: [2, 5]
                  - reason: ingredient_requires_review
                    ingredient_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d43']
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    AllergenUnmapped:
      description: |
        At least one line ingredient carries no allergen determination at all.
        Its own code rather than a `publish_blocked` reason because the fix is
        in a different place — the ingredient's mapping editor — and because
        silence must never be mistaken for a clean result. An ingredient
        passes when it holds a mapping row in any layer, **or** when its
        `verification_status` is `verified`, which is how "checked, and it
        carries nothing" is recorded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.allergen_unmapped
              message: Every ingredient in a published recipe must carry an allergen determination.
              details:
                ingredient_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d44']
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

    CatalogueItemPublishBlocked:
      description: |
        The K1.4 readiness gate refused. `details.reasons` carries **every**
        blocker rather than the first one found, so a kitchen fixes them in one
        pass.

        The vocabulary is `item_quarantined`, `item_not_a_draft`,
        `translation_incomplete`, `no_active_variant`, `no_allergen_basis` and
        `linked_recipe_quarantined`. The full readiness evaluator will add
        reasons to this list rather than replace the mechanism.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This catalogue item is not ready to be published.
              details:
                reasons:
                  - reason: translation_incomplete
                    fields: [name_ar]
                  - reason: linked_recipe_quarantined
                    recipe_id: '0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41'
                    recipe_version_ids: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42']
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d

  schemas:
    Uuid:
      type: string
      format: uuid
      description: A UUIDv7 identifier (plan §8).
      examples: ['0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c']

    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: true
      description: |
        Envelope metadata. Always carries the correlation identifier;
        collections add `count`, and `/me` adds `permissions_version`.

    ErrorCode:
      type: string
      description: |
        The stable Healthy360 error vocabulary. Mirrors
        `Healthy360\Support\Api\ErrorCode`; a Pest test asserts the two agree.
      enum:
        - validation.failed
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.email_unverified
        - auth.two_factor_required
        - auth.two_factor_invalid
        - auth.step_up_required
        - auth.csrf_token_mismatch
        - auth.invalid_signature
        - context.organisation_required
        - context.organisation_forbidden
        - context.branch_out_of_scope
        - authz.permission_denied
        - request.invalid
        - request.precondition_required
        - resource.not_found
        - resource.conflict
        - catalogue.in_use
        - catalogue.version_immutable
        - catalogue.allergen_unmapped
        - catalogue.publish_blocked
        - rate_limit.exceeded
        - server.internal_error

    Error:
      type: object
      required: [code, message, details, correlation_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A safe, human-readable summary. Never a stack trace.
        details:
          type: object
          description: |
            Structured, code-specific detail. `validation.failed` carries a
            `fields` map of field name to messages; `authz.permission_denied`
            carries the denying RBAC step; `auth.step_up_required` carries the
            confirmation endpoint.
          additionalProperties: true
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false

    User:
      type: object
      required: [id, email, email_verified, two_factor_enabled]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        two_factor_enabled:
          type: boolean
          description: True only once enrolment has been confirmed.

    Profile:
      description: |
        Person data for a global identity. Null until a profile exists.
      oneOf:
        - type: 'null'
        - type: object
          required: [given_name, family_name, preferred_language_code, timezone, numbering_system]
          properties:
            given_name:
              type: string
            family_name:
              type: string
            preferred_language_code:
              type: string
              minLength: 2
              maxLength: 2
              examples: [ar]
            country_code:
              type: [string, 'null']
              minLength: 2
              maxLength: 2
              examples: [LB]
            timezone:
              type: string
              examples: [Asia/Beirut]
            numbering_system:
              type: string
              enum: [latn, arab]
            date_of_birth:
              type: [string, 'null']
              format: date

    Organisation:
      type: object
      required: [id, slug, name, type, status, country_code, default_currency_code, default_language_code, capabilities]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          examples: [cedar-clinic]
        name:
          type: string
          examples: [Cedar Clinic]
        type:
          type: [string, 'null']
          description: The organisation type code.
          examples: [clinic]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        default_currency_code:
          type: string
          minLength: 3
          maxLength: 3
        default_language_code:
          type: string
          minLength: 2
          maxLength: 2
        capabilities:
          type: array
          description: Enabled capability codes.
          items:
            type: string
          examples:
            - [clinic_services]

    Branch:
      type: object
      required: [id, name, city, timezone, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        city:
          type: [string, 'null']
        timezone:
          type: string
        status:
          type: string
          enum: [active, closed]

    Membership:
      type: object
      required: [id, status, branch_id, joined_at, organisation, roles]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [invited, active, suspended]
          description: |
            Ended memberships are history and are never listed.
        branch_id:
          description: Set when the membership is scoped to a single branch.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        joined_at:
          type: [string, 'null']
          format: date-time
        organisation:
          $ref: '#/components/schemas/Organisation'
        roles:
          type: array
          description: Assigned role codes.
          items:
            type: string
          examples:
            - [organisation_owner]

    ActiveContext:
      description: |
        The validated working context. Null when nothing valid was claimed.
      oneOf:
        - type: 'null'
        - type: object
          required: [organisation, branch, membership_id, permissions, entitlements]
          properties:
            organisation:
              $ref: '#/components/schemas/Organisation'
            branch:
              oneOf:
                - $ref: '#/components/schemas/Branch'
                - type: 'null'
            membership_id:
              $ref: '#/components/schemas/Uuid'
            permissions:
              type: array
              description: Calculated permission codes, in `domain.action_scope` form.
              items:
                type: string
              examples:
                - [organisation.view_current, branch.view_current]
            entitlements:
              type: array
              description: Feature codes the organisation is currently entitled to.
              items:
                type: string

    PendingConsent:
      type: object
      required: [code, version, purpose]
      properties:
        code:
          type: string
          examples: [consent.health_data_processing]
        version:
          type: integer
          minimum: 1
        purpose:
          type: string
          examples: [health_data_processing]

    Device:
      type: object
      required: [id, device_name, platform, app_version, last_seen_at, created_at, is_current]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        device_name:
          type: string
          examples: [Nadia iPhone]
        platform:
          type: string
          enum: [ios, android, web]
        app_version:
          type: [string, 'null']
        last_seen_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        is_current:
          type: boolean
          description: Whether this device holds the credential making the request.

    TwoFactorState:
      type: object
      required: [enabled, confirmed, confirmed_at]
      properties:
        enabled:
          type: boolean
          description: A secret exists.
        confirmed:
          type: boolean
          description: Enrolment is complete and two-factor authentication is armed.
        confirmed_at:
          type: [string, 'null']
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, password_confirmation, given_name, family_name, accepts_terms, accepts_privacy]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
        given_name:
          type: string
          maxLength: 255
        family_name:
          type: string
          maxLength: 255
        preferred_language_code:
          type: string
          minLength: 2
          maxLength: 2
          description: An active platform language. Defaults to `en`.
        country_code:
          type: [string, 'null']
          minLength: 2
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
          description: An IANA timezone. Defaults to `UTC`.
        accepts_terms:
          type: boolean
          const: true
          description: Acceptance of the terms of service. Recorded as a consent grant.
        accepts_privacy:
          type: boolean
          const: true
          description: Acknowledgement of the privacy notice. Recorded as a consent grant.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false

    IssueTokenRequest:
      type: object
      required: [email, password, device_name, platform]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          description: A human-readable device name, shown in device management.
        platform:
          type: string
          enum: [ios, android, web]
        app_version:
          type: [string, 'null']
          maxLength: 64
        two_factor_code:
          type: [string, 'null']
          maxLength: 32
          description: Required when the account has confirmed two-factor authentication.
        recovery_code:
          type: [string, 'null']
          maxLength: 64
          description: An alternative to `two_factor_code`. Consumed and replaced on use.

    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password

    TwoFactorChallengeRequest:
      type: object
      description: Supply either `code` or `recovery_code`.
      properties:
        code:
          type: [string, 'null']
          description: The current one-time password.
        recovery_code:
          type: [string, 'null']
          description: A single-use recovery code.

    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [count, next_cursor, has_more]
          properties:
            count:
              type: integer
              minimum: 0
              description: Items on this page, after the extra look-ahead row is trimmed.
            next_cursor:
              type: ['string', 'null']
              description: Pass as `cursor` for the next page. Null when there is none.
            has_more:
              type: boolean
              description: |
                Whether another page exists. Answered by reading one row
                beyond the page rather than by a separate count, which would
                disagree with the page under concurrent writes.

    AllergenCode:
      type: string
      maxLength: 20
      pattern: '^[a-z][a-z0-9_]*$'
      description: |
        A canonical allergen class code — an immutable regulatory identity.
        Never renamed and never deleted; a class that should no longer be
        offered is deactivated instead. The fourteen seeded values match the
        universal client's `AllergenCode` union one for one.
      examples: [gluten, tree_nut, sulphites]

    IngredientStatus:
      type: string
      enum: [active, inactive, archived]
      description: |
        The operational lifecycle of an ingredient. Deliberately not the
        publication family (`draft`/`published`/…): an ingredient is never
        sold, so it has no publication state of its own.

    IngredientVerificationStatus:
      type: string
      enum: [verified, unverified, requires_review]
      description: |
        How much the platform trusts what it holds about this ingredient.
        `requires_review` is a recorded contradiction awaiting a human — the
        seeded burghul and pita rows carry it because the source workbook
        tags them allergen-free while its own allergen key does not.

    AvailabilityTier:
      type: ['string', 'null']
      enum: [core, common, specialty_imported, null]
      description: Local availability in the launch market. Null where the source does not say.

    AdminIngredient:
      type: object
      required:
        [
          id,
          organisation_id,
          is_platform,
          slug,
          name_en,
          name_ar,
          ingredient_category_id,
          ingredient_subcategory_id,
          default_unit_id,
          yield_factor,
          status,
          verification_status,
          lock_version,
        ]
      description: |
        The administrative shape of an ingredient. Carries **both** names and
        ignores `Accept-Language` for them: a bilingual editor has to see what
        it is editing. There is no public ingredient projection.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for a platform-library row.
        is_platform:
          type: boolean
          description: |
            Whether this is a platform-library row. On the wire so a client
            knows not to offer an edit control, rather than discovering it
            from a 403.
        slug:
          type: string
          maxLength: 120
        name_en:
          type: string
        name_ar:
          type: string
          description: Falls back to the English name where no Arabic exists.
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        default_unit_code:
          type: ['string', 'null']
        yield_factor:
          type: string
          description: Decimal with four places, as a string so no client rounds it.
          examples: ['1.0000']
        forked_from_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        status:
          $ref: '#/components/schemas/IngredientStatus'
        verification_status:
          $ref: '#/components/schemas/IngredientVerificationStatus'
        notes:
          type: ['string', 'null']
        source_system:
          type: ['string', 'null']
        source_ref:
          type: ['string', 'null']
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    IngredientEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [ingredient]
          properties:
            ingredient:
              $ref: '#/components/schemas/AdminIngredient'
        meta:
          $ref: '#/components/schemas/Meta'

    IngredientAlias:
      type: object
      required: [id, alias, alias_normalised]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alias:
          type: string
          maxLength: 160
          description: Verbatim, as the source or the operator wrote it.
        alias_normalised:
          type: string
          maxLength: 160
          description: |
            Server-derived: lower-cased, trimmed, internal whitespace
            collapsed. Deliberately conservative — it does not stem or strip
            punctuation, because "Paprika Sweet" and "Paprika Smoked" are
            different ingredients.
        locale:
          type: ['string', 'null']
          enum: [en, ar, null]
        source_system:
          type: ['string', 'null']
        source_ref:
          type: ['string', 'null']
      additionalProperties: false

    IngredientCategory:
      type: object
      required: [id, organisation_id, is_platform, parent_id, code, name_en, name_ar, display_order, is_active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_platform:
          type: boolean
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for a top-level category.
        code:
          type: string
          maxLength: 40
        name_en:
          type: string
        name_ar:
          type: string
        display_order:
          type: integer
        is_active:
          type: boolean
      additionalProperties: false

    IngredientCategoryEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [category]
          properties:
            category:
              $ref: '#/components/schemas/IngredientCategory'
        meta:
          $ref: '#/components/schemas/Meta'

    IngredientAllergenMapping:
      type: object
      required: [id, allergen_code, layer, organisation_id, containment, market_scope, source, verification_status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        layer:
          type: string
          enum: [platform_baseline, organisation_overlay]
          description: |
            Derived, not stored. The client renders a baseline row read-only
            and its own overlay editable; asking it to infer that from a
            nullable identifier is how a UI ends up offering an edit control
            that always 403s.
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        containment:
          type: string
          enum: [contains, may_contain]
          description: An ingredient of the ingredient, or a cross-contact risk. Legally different statements.
        market_scope:
          type: string
          enum: [all, us_only, eu_only]
          description: |
            EU-14 and US Big-9 are different lists. Coconut is a tree nut
            under US law and not an EU allergen, so it is carried as a
            `us_only` mapping rather than a note nobody reads.
        source:
          type: string
          enum: [master_list, technical_sheet, supplier_declaration, kitchen_declared, inferred]
        verification_status:
          type: string
          enum: [verified, unverified, requires_review, requires_supplier_confirmation]
        evidence:
          type: ['string', 'null']
          description: Free text supporting the statement — a supplier reference, a sheet, a note.
      additionalProperties: false

    IngredientAllergenCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IngredientAllergenMapping'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateIngredientRequest:
      type: object
      required: [name_en, default_unit_id]
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: ['string', 'null']
          maxLength: 255
          description: Falls back to the English name when absent.
        slug:
          type: ['string', 'null']
          maxLength: 110
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Derived from the name when absent, and de-duplicated within the organisation.
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        yield_factor:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9999
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        notes:
          type: ['string', 'null']
          maxLength: 2000
      additionalProperties: false

    UpdateIngredientRequest:
      type: object
      minProperties: 1
      description: |
        A partial update. `slug` and `status` are absent by design — the slug
        is the handle a re-import converges on, and status changes are
        lifecycle actions with their own routes.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        yield_factor:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9999
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        notes:
          type: ['string', 'null']
          maxLength: 2000
      additionalProperties: false

    ReplaceIngredientAllergensRequest:
      type: object
      required: [mappings]
      properties:
        market_scope:
          type: string
          enum: [all, us_only, eu_only]
          default: all
          description: The scope whose set is being replaced. Other scopes are untouched.
        mappings:
          type: array
          maxItems: 50
          description: |
            The complete statement for this scope and this layer. An empty
            array means "no allergens", which is a statement rather than a
            missing field — and is refused where a platform baseline would be
            weakened by it.
          items:
            type: object
            required: [allergen_code, containment]
            properties:
              allergen_code:
                $ref: '#/components/schemas/AllergenCode'
              containment:
                type: string
                enum: [contains, may_contain]
              source:
                type: ['string', 'null']
                enum: [master_list, technical_sheet, supplier_declaration, kitchen_declared, inferred, null]
              verification_status:
                type: ['string', 'null']
                enum: [verified, unverified, requires_review, requires_supplier_confirmation, null]
              evidence:
                type: ['string', 'null']
                maxLength: 2000
            additionalProperties: false
      additionalProperties: false

    RecipeStatus:
      type: string
      enum: [active, archived]
      description: |
        The operational lifecycle of a recipe *identity*. Deliberately not the
        publication family: a recipe is never published, its versions are.
        There is no `inactive` either — "temporarily not in use" is expressed
        by having no published version.

    RecipeConfidentiality:
      type: string
      enum: [internal, confidential]
      default: confidential
      description: |
        How guarded a formulation is. Defaults to `confidential` because a
        recipe is a kitchen's commercial secret until somebody decides
        otherwise, and a default that leaks is a default that is wrong exactly
        once. Neither value makes a formulation public: recipe lines are on
        the public denylist regardless.

    RecipeVersionStatus:
      type: string
      enum: [draft, review_required, published, retired]
      description: |
        The publication lifecycle of a version. `review_required` is a
        **stored** quarantine state, not a flag beside one: a critical
        allergen contradiction has to block publication structurally, and a
        boolean next to a status is something a publish path can forget to
        read. A quarantined version is still editable — the point is that
        somebody fixes it — and is as unpublishable as a draft.

        "Publishable" is never stored; it is the readiness evaluator's verdict
        at the moment of publication.

    RecipeCompleteness:
      type: string
      enum: [indicative, costed]
      description: |
        `indicative` is a formulation without costs — which is what the
        sauces-and-dressings source provides, and recording that honestly
        beats inventing figures. `costed` is what a technical sheet is.

    DerivationState:
      type: string
      enum: [current, stale, failed]
      description: |
        Whether the frozen allergen label still matches the ingredient
        mappings it was computed from. A new version is `stale` — nothing has
        been derived for it, and claiming `current` for an empty label would be
        the most dangerous default available. `failed` records that a recompute
        was attempted and could not complete, which must never be
        indistinguishable from "not tried yet".

    AllergenDerivation:
      type: string
      enum: [declared, derived]
      description: |
        Where a label row came from. `derived` was computed from the effective
        ingredient mappings and carries the ingredient that caused it;
        `declared` is a human statement — a chef who knows the fryer is shared
        — that no mapping implies. A derivation never weakens a declaration.

    AdminRecipe:
      type: object
      required:
        [
          id,
          organisation_id,
          slug,
          name_en,
          name_ar,
          confidentiality,
          status,
          published_version_number,
          lock_version,
        ]
      description: |
        The administrative shape of a recipe identity. Carries **both** names
        and ignores `Accept-Language` for them: a bilingual editor has to see
        what it is editing. There is no public recipe projection.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        slug:
          type: string
          maxLength: 120
        name_en:
          type: string
        name_ar:
          type: string
          description: Falls back to the English name where no Arabic exists.
        recipe_category:
          type: ['string', 'null']
          maxLength: 40
          description: |
            Free text, deliberately not an enumeration: the source vocabulary
            (sauce, dressing, marination, patty, topping, component) describes
            how one kitchen files its sheets, not a regulated identity, and an
            enum would turn "we started making dips" into a migration.
        source_kind:
          type: ['string', 'null']
          maxLength: 40
          description: The source sheet's `Kind`, verbatim.
        confidentiality:
          $ref: '#/components/schemas/RecipeConfidentiality'
        status:
          $ref: '#/components/schemas/RecipeStatus'
        notes:
          type: ['string', 'null']
        published_version_number:
          type: ['integer', 'null']
          minimum: 1
          description: |
            The live version, or null when nothing is published. Computed, not
            stored: there is no `current_version_id` column to fall out of
            step with the versions themselves.
        source_system:
          type: ['string', 'null']
        source_ref:
          type: ['string', 'null']
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    RecipeEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [recipe]
          properties:
            recipe:
              $ref: '#/components/schemas/AdminRecipe'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminRecipeVersion:
      type: object
      required:
        [
          id,
          recipe_id,
          version_number,
          status,
          completeness,
          waste_coefficient_percent,
          derivation_state,
          lock_version,
        ]
      description: |
        The header of a recipe version. `derived_input_hash` is deliberately
        absent from the wire: it is an internal fingerprint, and publishing it
        would invite clients to compare hashes instead of reading
        `derivation_state`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recipe_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RecipeVersionStatus'
        completeness:
          $ref: '#/components/schemas/RecipeCompleteness'
        yield_quantity:
          type: ['string', 'null']
          description: Decimal with four places, as a string so no client rounds it.
          examples: ['1000.0000']
        yield_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        yield_piece_count:
          type: ['integer', 'null']
          minimum: 1
        input_quantity_total:
          type: ['string', 'null']
          description: |
            The sum of the input lines, kept alongside the yield because the
            source sheets state both and they legitimately differ.
        waste_coefficient_percent:
          type: string
          description: |
            Decimal with two places, as a string. Defaults to `3.00` — the flat
            allowance the source technical sheets apply across the board.
          examples: ['3.00']
        derivation_state:
          $ref: '#/components/schemas/DerivationState'
        derived_at:
          type: ['string', 'null']
          format: date-time
        published_at:
          type: ['string', 'null']
          format: date-time
        review_reason:
          type: ['string', 'null']
          maxLength: 200
          description: Why this version is quarantined, when it is.
        notes:
          type: ['string', 'null']
        lock_version:
          type: integer
          minimum: 0
        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    RecipeVersionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [version]
          properties:
            version:
              $ref: '#/components/schemas/AdminRecipeVersion'
        meta:
          $ref: '#/components/schemas/Meta'

    RecipeLine:
      type: object
      required: [id, line_number, ingredient_id]
      description: |
        One formulation line.

        **No cost fields.** `recipe_version_lines` carries
        `unit_cost_amount`, `line_cost_amount` and `cost_currency_code`, and
        this projection reads none of them. The cost surface is K1.3, behind
        `recipe.view_costs_organisation`; until that permission exists there is
        no way to serve a cost to the right people, so the honest projection
        serves it to nobody.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        line_number:
          type: integer
          minimum: 1
          description: Server-authored from the submitted order.
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: ['string', 'null']
          description: |
            Decimal with four places, as a string. Null is legal only while the
            version is unpublished — the publish gate is where nullability
            ends.
        unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        source_designation:
          type: ['string', 'null']
          maxLength: 160
          description: The import source wording, verbatim.
        comment:
          type: ['string', 'null']
          maxLength: 255
      additionalProperties: false

    RecipeOutput:
      type: object
      required: [id, ingredient_id, output_quantity, unit_id, is_primary]
      description: |
        What a version produces. An ingredient with a row here is what the
        design used to call an "intermediate"; there is no kind column
        anywhere, because being an intermediate is a fact about some version's
        outputs and not a property of the ingredient.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        output_quantity:
          type: string
          examples: ['1000.0000']
        unit_id:
          $ref: '#/components/schemas/Uuid'
        is_primary:
          type: boolean
          description: At most one per version, enforced by a partial unique index.
      additionalProperties: false

    RecipeStep:
      type: object
      required: [id, step_number, instruction_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        step_number:
          type: integer
          minimum: 1
        instruction_en:
          type: string
        instruction_ar:
          type: ['string', 'null']
        minutes:
          type: ['integer', 'null']
          minimum: 0
      additionalProperties: false

    RecipeVersionAllergen:
      type: object
      required: [id, allergen_code, containment, derivation]
      description: |
        One row of a version's frozen label — the only part of a recipe version
        that is ever meant to reach a diner.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
          enum: [contains, may_contain]
        derivation:
          $ref: '#/components/schemas/AllergenDerivation'
        source_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The line ingredient a derived row came from. Provenance is what
            makes a warning trusted: "sesame, from tahini" is acted on where a
            bare "sesame" is clicked past.
        source_note:
          type: ['string', 'null']
          maxLength: 255
          description: |
            For a derived row, the market scopes that contributed. The label is
            one row per class, so a scope column would either duplicate rows or
            pick one scope and lose the rest.
      additionalProperties: false

    CostBasis:
      type: string
      enum: [as_recorded, recalculated]
      description: |
        Where a snapshot's arithmetic came from.

        `recalculated` is arithmetic this system performed over the version's
        lines: reproducible, and re-derivable from data still in the database.

        `as_recorded` is what a source technical sheet stated, stored verbatim
        **including its errors**. Several of the source sheets do their own
        arithmetic and do it wrong; correcting one on import destroys the
        evidence that it needs correcting, and trusting one puts a wrong number
        behind a right-looking label. Storing both and saying which is which is
        the only honest option. Written by the private importer only.

    TechnicalSheetLine:
      type: object
      required: [id, line_number, ingredient_id]
      description: |
        One costed formulation line. Served **only** from the technical sheet,
        behind `recipe.view_costs_organisation`; the ordinary `RecipeLine`
        projection carries none of these fields.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        line_number:
          type: integer
          minimum: 1
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: ['string', 'null']
          description: Decimal with four places, as a string so no client rounds it.
        unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        unit_cost_amount:
          type: ['string', 'null']
          description: |
            Major currency units with six decimal places, as a string. Floats
            cannot represent `0.1`, and a cost whose total depends on the order
            the lines were summed in is not a cost.
          examples: ['3.900000']
        line_cost_amount:
          type: ['string', 'null']
          description: |
            On the wire beside `unit_cost_amount` even though one is derivable
            from the other, because on an imported sheet they legitimately
            disagree: the source's own arithmetic is stored verbatim, and a
            reader who could only see the inputs would have no way to notice.
          examples: ['9.750000']
        cost_currency_code:
          type: ['string', 'null']
          minLength: 3
          maxLength: 3
        source_designation:
          type: ['string', 'null']
          maxLength: 160
        comment:
          type: ['string', 'null']
          maxLength: 255
      additionalProperties: false

    CostSnapshot:
      type: object
      required:
        [
          id,
          recipe_version_id,
          basis,
          currency_code,
          total_input_cost_amount,
          waste_coefficient_percent,
          basis_mismatch,
          calculated_at,
        ]
      description: |
        What one version cost, at one moment, on one basis. Append-only:
        `UPDATE` and `DELETE` are revoked from the application database role,
        so a snapshot is superseded by a newer one and never edited.

        The per-unit figures are null when the version does not say what it
        yields. Inventing a denominator to fill a column is the fabrication
        this programme exists to avoid.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recipe_version_id:
          $ref: '#/components/schemas/Uuid'
        basis:
          $ref: '#/components/schemas/CostBasis'
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Every amount on this snapshot is in this one currency. Nothing converts between currencies.
        total_input_cost_amount:
          type: string
          description: The sum of the line costs, major units, six decimal places.
          examples: ['10.000000']
        cost_per_yield_unit_amount:
          type: ['string', 'null']
          description: Total ÷ `yield_quantity`. Null unless the version states both a yield quantity and a yield unit.
        yield_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The unit `cost_per_yield_unit_amount` is per. A per-unit cost without its unit is a number, not a cost.
        cost_per_piece_amount:
          type: ['string', 'null']
          description: Total ÷ `yield_piece_count`. Null unless the version counts pieces.
        waste_coefficient_percent:
          type: string
          description: |
            Copied from the version at calculation time rather than joined at
            read time: a kitchen that later revises its allowance must not
            retroactively rewrite what an old snapshot said. The source sheets
            apply a flat `3.00`.
          examples: ['3.00']
        cost_per_yield_unit_with_waste_amount:
          type: ['string', 'null']
          description: The per-unit figure × (1 + waste ÷ 100), rounded once.
        cost_per_piece_with_waste_amount:
          type: ['string', 'null']
        source_label:
          type: ['string', 'null']
          maxLength: 60
          description: |
            The source sheet's own wording, verbatim — "Cost per kg", "U.P.".
            Kept as evidence and **never** consulted to decide what a number
            means: at least five source sheets label a figure "cost per kg"
            beside a piece count. The basis is derived from the version's yield
            fields instead.
        basis_mismatch:
          type: boolean
          description: |
            The label claims something the version's yield cannot support.
            Served with the figures and never without them: a number that looks
            authoritative while it is under review is worse than no number.
            Conservative by design — wording nobody can classify raises
            nothing, because a flag that cannot be substantiated teaches
            reviewers to ignore the flag.
        calculated_at:
          type: string
          format: date-time
        created_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    TechnicalSheet:
      type: object
      required:
        [version, completeness, currency_conflict, lines, uncosted_line_numbers, snapshots]
      description: The confidential cost projection of one recipe version.
      properties:
        version:
          $ref: '#/components/schemas/AdminRecipeVersion'
        completeness:
          $ref: '#/components/schemas/RecipeCompleteness'
        currency_code:
          type: ['string', 'null']
          minLength: 3
          maxLength: 3
          description: |
            The single currency the costed lines share. Null when nothing is
            costed **or** when an import left more than one behind;
            `currency_conflict` says which, because "no currency" and "several
            currencies" need different fixes.
        currency_conflict:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalSheetLine'
        uncosted_line_numbers:
          type: array
          description: |
            Lines that contributed nothing to a total, in line order — no
            quantity, no unit cost, or no currency. While this is non-empty no
            `recalculated` snapshot can be written, because a total that
            silently omits a line reads exactly like a total that did not.
          items:
            type: integer
            minimum: 1
        snapshots:
          type: object
          required: [recalculated, as_recorded]
          description: |
            The latest snapshot of each basis. Both keys are always present, so
            a client never has to guess whether a missing key means "none" or
            "not asked for"; either value may be null.
          properties:
            recalculated:
              oneOf:
                - $ref: '#/components/schemas/CostSnapshot'
                - type: 'null'
            as_recorded:
              oneOf:
                - $ref: '#/components/schemas/CostSnapshot'
                - type: 'null'
          additionalProperties: false
      additionalProperties: false

    CreateRecipeRequest:
      type: object
      required: [name_en]
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: ['string', 'null']
          maxLength: 255
          description: Falls back to the English name when absent.
        slug:
          type: ['string', 'null']
          maxLength: 110
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Derived from the name when absent, and de-duplicated within the organisation.
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recipe_category:
          type: ['string', 'null']
          maxLength: 40
        source_kind:
          type: ['string', 'null']
          maxLength: 40
        confidentiality:
          $ref: '#/components/schemas/RecipeConfidentiality'
        notes:
          type: ['string', 'null']
          maxLength: 2000
      additionalProperties: false

    UpdateRecipeRequest:
      type: object
      minProperties: 1
      description: |
        A partial update. `slug` and `status` are absent by design — the slug
        is the handle a re-import converges on, and status changes are
        lifecycle actions with their own routes.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recipe_category:
          type: ['string', 'null']
          maxLength: 40
        source_kind:
          type: ['string', 'null']
          maxLength: 40
        confidentiality:
          $ref: '#/components/schemas/RecipeConfidentiality'
        notes:
          type: ['string', 'null']
          maxLength: 2000
      additionalProperties: false

    CreateRecipeVersionRequest:
      type: object
      description: |
        An empty body opens a blank draft. `copy_from_version` is a version
        *number* — what a human reads on a technical sheet — resolved inside
        this recipe only.
      properties:
        copy_from_version:
          type: ['integer', 'null']
          minimum: 1
      additionalProperties: false

    UpdateRecipeVersionRequest:
      type: object
      minProperties: 1
      description: |
        A partial update of a version header. `status`, `derivation_state`,
        `derived_at`, `published_at` and `published_by` are absent by design:
        each is a conclusion the server reached.
      properties:
        completeness:
          $ref: '#/components/schemas/RecipeCompleteness'
        yield_quantity:
          type: ['number', 'null']
          exclusiveMinimum: 0
          maximum: 99999999.9999
        yield_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        yield_piece_count:
          type: ['integer', 'null']
          minimum: 1
        input_quantity_total:
          type: ['number', 'null']
          exclusiveMinimum: 0
          maximum: 99999999.9999
        waste_coefficient_percent:
          type: number
          minimum: 0
          maximum: 999.99
        notes:
          type: ['string', 'null']
          maxLength: 2000
      additionalProperties: false

    ReplaceRecipeLinesRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 200
          description: |
            The complete formulation. An empty array is a legitimate statement
            ("this version has no lines yet"), not a missing field. The array
            order is the line sequence, and duplicate ingredients are allowed.
          items:
            type: object
            required: [ingredient_id]
            properties:
              ingredient_id:
                $ref: '#/components/schemas/Uuid'
              quantity:
                type: ['number', 'null']
                exclusiveMinimum: 0
                maximum: 99999999.9999
              unit_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              unit_cost_amount:
                type: ['number', 'string', 'null']
                description: |
                  What one `unit_id` of this ingredient costs, in **major**
                  currency units with up to six decimal places — `3.9` is three
                  dollars ninety (master plan v2 §4.4). Prices are a different
                  concept on a different table and stay integer minor units;
                  nothing sums one into the other.

                  Zero is legal and meaningful: a donated or self-produced
                  input costs nothing, and saying so is not the same as saying
                  nothing.

                  Requires `recipe.view_costs_organisation` **in addition to**
                  `recipe.manage_organisation`, otherwise `403`. So does
                  replacing a set that already carries costs *without* them —
                  that erases money the caller could not see, and positional
                  line identity means it cannot be put back.

                  `line_cost_amount` is not accepted anywhere: it is quantity ×
                  unit cost, the server derives it, and a derived value a
                  client can supply is one that can disagree with its inputs.
                minimum: 0
                maximum: 999999999999.999999
              cost_currency_code:
                type: ['string', 'null']
                minLength: 3
                maxLength: 3
                description: |
                  ISO 4217, case-insensitive on the way in and canonical on the
                  way out. Required whenever `unit_cost_amount` is present and
                  refused when it is absent — an amount without a currency is
                  not a monetary value, and a currency without an amount is not
                  one either.

                  Every costed line of one version must share a single
                  currency; a second is `422 validation.failed`.
              source_designation:
                type: ['string', 'null']
                maxLength: 160
              comment:
                type: ['string', 'null']
                maxLength: 255
            additionalProperties: false
      additionalProperties: false

    CreateCostSnapshotRequest:
      type: object
      required: [basis]
      description: |
        No amounts, deliberately. Every figure on a `recalculated` snapshot is
        derived from the version's own lines and yield.
      properties:
        basis:
          type: string
          enum: [recalculated]
          description: |
            Only `recalculated` is accepted here. `as_recorded` exists on the
            table and means "this is what a source technical sheet stated" —
            the private importer's basis, never an endpoint's.
      additionalProperties: false

    ReplaceRecipeOutputsRequest:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: array
          maxItems: 20
          description: |
            An empty array is legitimate. A non-empty one must name exactly one
            primary, and may not name the same ingredient twice.
          items:
            type: object
            required: [ingredient_id, output_quantity, unit_id]
            properties:
              ingredient_id:
                $ref: '#/components/schemas/Uuid'
              output_quantity:
                type: number
                exclusiveMinimum: 0
                maximum: 99999999.9999
              unit_id:
                $ref: '#/components/schemas/Uuid'
              is_primary:
                type: ['boolean', 'null']
                default: false
            additionalProperties: false
      additionalProperties: false

    ReplaceRecipeStepsRequest:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          maxItems: 100
          description: The complete method. The array order is the step sequence.
          items:
            type: object
            required: [instruction_en]
            properties:
              instruction_en:
                type: string
                maxLength: 4000
              instruction_ar:
                type: ['string', 'null']
                maxLength: 4000
              minutes:
                type: ['integer', 'null']
                minimum: 0
                maximum: 10000
            additionalProperties: false
      additionalProperties: false

    PublicAllergenClass:
      type: object
      required: [code, name, regulatory_ref, is_eu_14, is_us_big_9, us_declaration_required, display_order]
      description: |
        The anonymous projection of an allergen class: exactly one
        server-localised name and description, plus the regulatory metadata a
        customer needs to read a label correctly.
      properties:
        code:
          $ref: '#/components/schemas/AllergenCode'
        name:
          type: string
          description: Localised from `Accept-Language` (`en` or `ar`).
        description:
          type: ['string', 'null']
        regulatory_ref:
          type: string
          maxLength: 20
          examples: [ALG-01]
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
          type: boolean
          description: Whether US labelling requires a declaration above a threshold.
        us_threshold_ppm:
          type: ['integer', 'null']
          description: The declaration threshold in parts per million — 10 for sulphites.
        display_order:
          type: integer
      additionalProperties: false

    AdminAllergenClass:
      type: object
      required:
        [code, name_en, name_ar, regulatory_ref, is_eu_14, is_us_big_9, us_declaration_required, display_order, is_active]
      description: |
        The governance shape: both languages, and the activation flag the
        public projection has no business carrying.
      properties:
        code:
          $ref: '#/components/schemas/AllergenCode'
        name_en:
          type: string
        name_ar:
          type: string
        description_en:
          type: ['string', 'null']
        description_ar:
          type: ['string', 'null']
        regulatory_ref:
          type: string
          maxLength: 20
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
          type: boolean
        us_threshold_ppm:
          type: ['integer', 'null']
        display_order:
          type: integer
        is_active:
          type: boolean
      additionalProperties: false

    AllergenClassEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [allergen_class]
          properties:
            allergen_class:
              $ref: '#/components/schemas/AdminAllergenClass'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateAllergenClassRequest:
      type: object
      required: [code, name_en, name_ar, regulatory_ref, is_eu_14, is_us_big_9]
      properties:
        code:
          $ref: '#/components/schemas/AllergenCode'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        description_en:
          type: ['string', 'null']
          maxLength: 2000
        description_ar:
          type: ['string', 'null']
          maxLength: 2000
        regulatory_ref:
          type: string
          maxLength: 20
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
          type: ['boolean', 'null']
        us_threshold_ppm:
          type: ['integer', 'null']
          minimum: 1
        display_order:
          type: ['integer', 'null']
          minimum: 0
      additionalProperties: false

    UpdateAllergenClassRequest:
      type: object
      minProperties: 1
      description: |
        `code` is deliberately absent and is actively rejected rather than
        ignored: a request that appeared to rename a regulatory identity and
        quietly did nothing would be worse than one that failed.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        description_en:
          type: ['string', 'null']
          maxLength: 2000
        description_ar:
          type: ['string', 'null']
          maxLength: 2000
        regulatory_ref:
          type: string
          maxLength: 20
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
          type: boolean
        us_threshold_ppm:
          type: ['integer', 'null']
          minimum: 1
        display_order:
          type: integer
          minimum: 0
      additionalProperties: false

    CatalogueItemType:
      type: string
      enum: [product, meal, subscription_plan]
      description: |
        Which kind of sellable thing an item is — the discriminator that lets
        products, meals and subscription plans share one table, one price path,
        one availability table and one publication gate. What genuinely differs
        between them is nullable columns and child tables, not the apparatus
        around them.

    CatalogueItemStatus:
      type: string
      enum: [draft, review_required, published, retired]
      description: |
        The publication lifecycle of a sellable item — the **same** four-state
        family a recipe version carries, and deliberately not the
        `active | archived` pair the operational tables use.

        `review_required` is a stored **quarantine**, not a queue position: a
        critical allergen contradiction must make publication structurally
        impossible rather than decorate the row with a flag a publish path can
        forget to read.

        `retired` is terminal for consumer visibility and keeps the row,
        because an order or a price snapshot may point at it forever. Sellable
        items **retire; they never archive**.

    CatalogueVariantType:
      type: string
      enum: [pack, plan_configuration]
      description: |
        Whether a variant is a pack of a product or one configuration of a
        subscription plan. Derived from the item's own type and never accepted
        from a client; a meal has neither.

    CatalogueVariantStatus:
      type: string
      enum: [draft, active, archived]
      description: |
        The operational lifecycle of a variant. **Not** the publication family,
        and the asymmetry with the parent item is deliberate: a pack is not
        separately published. Publishing the 500 g jar while the 1 kg jar sits
        in draft is not a state a kitchen wants, it is a state a kitchen ends
        up in.

    CataloguePackFormat:
      type: string
      enum: [bottle, bag, can, gallon, bunch, loose]
      description: |
        The container a pack comes in. `loose` is a real answer, not a missing
        one, which is why the field is nullable *and* carries this value: "the
        kitchen said loose" and "nobody has said" are different facts.

    CatalogueProductionMode:
      type: string
      enum: [production, supplier, both]
      description: |
        Whether the kitchen makes this, buys it in, or both. `both` is not
        indecision: several source articles are produced in-house when volume
        allows and bought in when it does not.

    SalesChannelKind:
      type: string
      enum: [b2c_web, b2b, pos, marketplace, corporate, insurance]
      description: |
        What sort of route to market a channel is. The *kind* is a closed
        vocabulary a projection branches on; the *channel* is a row an
        organisation owns, because two kitchens legitimately run two different
        wholesale desks. The universal client's `SalesChannel` union is the
        prototype's flattening of the two.

    SalesChannelStatus:
      type: string
      enum: [active, inactive]
      description: |
        Whether a channel is currently trading. Operational, never the
        publication family: nothing a customer sees is a channel — what a
        customer sees is the items available through one.

    AdminSalesChannel:
      type: object
      required: [id, organisation_id, code, channel_kind, name_en, name_ar, status, lock_version]
      description: |
        The administrative shape of a sales channel. Carries **both** names and
        ignores `Accept-Language` for them.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 40
          description: Immutable after creation — a price list and an order's provenance name it.
        channel_kind:
          $ref: '#/components/schemas/SalesChannelKind'
        name_en:
          type: string
        name_ar:
          type: string
        order_source:
          type: ['string', 'null']
          maxLength: 30
          description: |
            How orders arriving here label themselves in a partner's system.
            Deliberately unconstrained: that is somebody else's vocabulary.
        status:
          $ref: '#/components/schemas/SalesChannelStatus'
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    SalesChannelEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [sales_channel]
          properties:
            sales_channel:
              $ref: '#/components/schemas/AdminSalesChannel'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateSalesChannelRequest:
      type: object
      required: [code, channel_kind, name_en]
      properties:
        code:
          type: string
          maxLength: 40
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        channel_kind:
          $ref: '#/components/schemas/SalesChannelKind'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: ['string', 'null']
          maxLength: 255
        order_source:
          type: ['string', 'null']
          maxLength: 30
      additionalProperties: false

    UpdateSalesChannelRequest:
      type: object
      minProperties: 1
      description: |
        `code` and `channel_kind` are deliberately absent. Changing either
        means creating the new channel and deactivating the old one — which is
        what actually happened.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        order_source:
          type: ['string', 'null']
          maxLength: 30
        status:
          $ref: '#/components/schemas/SalesChannelStatus'
      additionalProperties: false

    AdminCatalogueItem:
      type: object
      required:
        [
          id,
          organisation_id,
          catalogue_id,
          item_type,
          slug,
          name_en,
          name_ar,
          is_market_priced,
          is_assorted,
          status,
          data_quality_flags,
          lock_version,
        ]
      description: |
        The administrative shape of a sellable item. Carries **both** names and
        ignores `Accept-Language` for them: a bilingual editor has to see what
        it is editing.

        **No price, cost or margin field exists here or on any child shape**,
        because no such column exists on any table in this family. Money lives
        in the pricing tables; the admin contract's confidential
        `marginPercent` is a presentation figure derived from a confirmed price
        and a recipe cost per serving, and has no server-side home in this
        slice.

        There is no public projection yet. When one arrives it will be a
        separate schema with its own denylist sweep, never this one with fields
        removed.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_id:
          $ref: '#/components/schemas/Uuid'
        item_type:
          $ref: '#/components/schemas/CatalogueItemType'
        slug:
          type: string
          maxLength: 140
          description: |
            Immutable after creation. A rename changes the names and nothing
            else: a slug is what a link, a marketplace listing and a partner's
            integration hold.
        name_en:
          type: string
        name_ar:
          type: string
          description: |
            The empty string is the "not yet translated" state, and the publish
            gate refuses it. Unlike a recipe, there is **no fallback** to the
            English name: a customer-facing name has to be visible as
            untranslated.
        description_en:
          type: ['string', 'null']
        description_ar:
          type: ['string', 'null']
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The merchandising shelf, not the purchasing taxonomy.
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The recipe a meal is produced from. Its **published** version is
            the first choice of allergen basis.
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The ingredient a resold raw good simply is.
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
          description: |
            Goods priced at the day's market rate carry no confirmed amount at
            all. Not a price field — a fact about the article that pricing
            reads.
        is_assorted:
          type: boolean
          description: True for a row that stands for a mixed selection rather than one article.
        status:
          $ref: '#/components/schemas/CatalogueItemStatus'
        review_reason:
          type: ['string', 'null']
          maxLength: 200
          description: Why the item is quarantined.
        image_placeholder_id:
          type: ['string', 'null']
          maxLength: 80
        data_quality_flags:
          type: array
          description: Unresolved import findings, e.g. `dual_pack_single_price`.
          items:
            type: string
        source_system:
          type: ['string', 'null']
        source_ref:
          type: ['string', 'null']
        lock_version:
          type: integer
          minimum: 0
          description: |
            Also served as the `ETag` of the single-resource GET, and the
            validator every sub-resource write sends back as `If-Match`.
        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time
      additionalProperties: false

    CatalogueItemEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [item]
          properties:
            item:
              $ref: '#/components/schemas/AdminCatalogueItem'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminCatalogueItemVariant:
      type: object
      required: [id, variant_type, code, is_default, status, pack, lock_version]
      description: The thing a price actually points at — one pack, or one plan configuration.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        variant_type:
          $ref: '#/components/schemas/CatalogueVariantType'
        code:
          type: string
          maxLength: 60
          description: Stable within the item, and what a price list names.
        name_en:
          type: ['string', 'null']
        name_ar:
          type: ['string', 'null']
        is_default:
          type: boolean
          description: |
            Exactly one per item, enforced by a partial unique index rather
            than by a service remembering to clear the incumbent first.
        status:
          $ref: '#/components/schemas/CatalogueVariantStatus'
        pack:
          oneOf:
            - $ref: '#/components/schemas/CataloguePackDetail'
            - type: 'null'
          description: Present for a pack variant, null for a plan configuration.
        lock_version:
          type: integer
          minimum: 0
      additionalProperties: false

    CataloguePackDetail:
      type: object
      required: [pack_quantity, pack_unit_id]
      properties:
        pack_quantity:
          type: string
          description: A decimal(12,4) as a string, so no precision is lost in transport.
        pack_unit_id:
          $ref: '#/components/schemas/Uuid'
        pack_piece_count:
          type: ['integer', 'null']
          minimum: 1
          description: Units inside the pack — a tray of twelve is `12`.
        pack_format:
          oneOf:
            - $ref: '#/components/schemas/CataloguePackFormat'
            - type: 'null'
        net_weight_grams:
          type: ['integer', 'null']
          minimum: 1
          description: |
            Nullable, and **never derived** from `pack_quantity`: that
            conversion needs a density this system does not hold, and
            fabricating one for a bunch of parsley is exactly the invented
            figure this programme refuses to produce.
      additionalProperties: false

    AdminCatalogueItemIngredient:
      type: object
      required: [id, ingredient_id, is_representative, display_order]
      description: |
        One line of the public ingredient list — what a diner is told is in the
        dish. **Not a formulation**: there is no quantity here and there will
        not be.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        is_representative:
          type: boolean
          description: Whether a listing card shows this one among the handful it has room for.
        display_order:
          type: integer
          minimum: 1
          description: Server-authored from the submitted order.
      additionalProperties: false

    AdminChannelAssignment:
      type: object
      required: [id, sales_channel_id, catalogue_item_variant_id, is_available, available_from, available_to]
      description: |
        One statement that a channel offers this item, optionally narrowed to
        one variant and one date window. There is deliberately no price here.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sales_channel_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null offers the item as a whole.
        is_available:
          type: boolean
        available_from:
          type: ['string', 'null']
          format: date
        available_to:
          type: ['string', 'null']
          format: date
      additionalProperties: false

    DerivedAllergen:
      type: object
      required: [allergen_code, containment, derivation, source_ingredient_id]
      properties:
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
          enum: [contains, may_contain]
          description: |
            The strongest claim any source makes for this class. `contains`
            beats `may_contain`, never the other way round.
        derivation:
          type: string
          enum: [declared, derived]
          description: |
            `declared` is a human's statement that no mapping implies — a chef
            who knows the fryer is shared. It survives a recomputation and is
            never weakened by one. Only a recipe version can carry a
            declaration; the ingredient-list basis is always `derived`.
        source_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Which ingredient implied it. "Why does this dish say sesame" has to
            be answerable from the label alone.
      additionalProperties: false

    DerivedAllergenSet:
      type: object
      required: [basis, recipe_version_id, allergens]
      properties:
        basis:
          type: string
          enum: [recipe_version, item_ingredients, none]
          description: |
            Which source answered. `none` is an empty set that means "nobody
            has said", never "no allergens".
        recipe_version_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/DerivedAllergen'
      additionalProperties: false

    DerivedAllergenMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [basis, recipe_version_id]
          properties:
            basis:
              type: string
              enum: [recipe_version, item_ingredients, none]
            recipe_version_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'

    CreateCatalogueItemRequest:
      type: object
      required: [item_type, name_en]
      description: |
        Derived and server-authored values are absent by construction:
        `status` (always `draft`), `lock_version`, `organisation_id` and the
        source-provenance fields are not accepted, and neither are variants,
        ingredients, diet tags or channels — each of those is its own
        set-replace endpoint.
      properties:
        item_type:
          $ref: '#/components/schemas/CatalogueItemType'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: ['string', 'null']
          maxLength: 255
        slug:
          type: ['string', 'null']
          maxLength: 130
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description_en:
          type: ['string', 'null']
          maxLength: 4000
        description_ar:
          type: ['string', 'null']
          maxLength: 4000
        catalogue_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Omit to use (and create on demand) the organisation's `default` catalogue.
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
        is_assorted:
          type: boolean
        image_placeholder_id:
          type: ['string', 'null']
          maxLength: 80
      additionalProperties: false

    UpdateCatalogueItemRequest:
      type: object
      minProperties: 1
      description: |
        `slug` and `item_type` are deliberately absent and are actively
        **rejected** rather than ignored: a request that appeared to move a
        slug and quietly did nothing would be worse than one that failed.
        `status` is absent because publication and retirement are POST
        sub-resource actions.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: ['string', 'null']
          maxLength: 255
        description_en:
          type: ['string', 'null']
          maxLength: 4000
        description_ar:
          type: ['string', 'null']
          maxLength: 4000
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
        is_assorted:
          type: boolean
        image_placeholder_id:
          type: ['string', 'null']
          maxLength: 80
      additionalProperties: false

    RetireCatalogueItemRequest:
      type: object
      description: |
        A kitchen withdrawing a seasonal line owes nobody an explanation, so a
        reason is optional; where one is given it is recorded on the audit
        event.
      properties:
        reason:
          type: ['string', 'null']
          maxLength: 200
      additionalProperties: false

    ReplaceCatalogueItemVariantsRequest:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          maxItems: 100
          description: |
            The complete set. An empty array is a legitimate statement ("this
            item has no variants") and is accepted; absent codes are archived,
            not deleted.
          items:
            type: object
            required: [code]
            properties:
              id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
                description: |
                  Optional. Checked against this item and against the code, so
                  a client holding an identifier cannot silently retarget it.
              code:
                type: string
                maxLength: 60
              name_en:
                type: ['string', 'null']
                maxLength: 255
              name_ar:
                type: ['string', 'null']
                maxLength: 255
              is_default:
                type: boolean
                description: |
                  Two marked defaults is a stated contradiction and is refused.
                  None is not: the first submitted wins.
              status:
                $ref: '#/components/schemas/CatalogueVariantStatus'
              pack:
                oneOf:
                  - $ref: '#/components/schemas/CataloguePackDetail'
                  - type: 'null'
                description: |
                  Required for a pack — a pack with no size is not a pack — and
                  refused for a plan configuration.
            additionalProperties: false
      additionalProperties: false

    ReplaceCatalogueItemIngredientsRequest:
      type: object
      required: [ingredients]
      properties:
        ingredients:
          type: array
          maxItems: 100
          description: |
            The complete list, in the order it should be named. There is no
            `display_order` field: the array order is the sequence.
          items:
            type: object
            required: [ingredient_id]
            properties:
              ingredient_id:
                $ref: '#/components/schemas/Uuid'
              is_representative:
                type: boolean
            additionalProperties: false
      additionalProperties: false

    ReplaceCatalogueItemDietClassificationsRequest:
      type: object
      required: [diet_classifications]
      properties:
        diet_classifications:
          type: array
          maxItems: 20
          description: |
            Platform codes. One that does not resolve to an *active*
            classification is a validation failure carrying
            `details.unknown`, never an invitation to create one.
          items:
            type: string
            maxLength: 40
      additionalProperties: false

    ReplaceCatalogueItemChannelsRequest:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          maxItems: 50
          description: |
            The complete availability list. An empty array withdraws the item
            from every channel.
          items:
            type: object
            required: [sales_channel_id]
            properties:
              sales_channel_id:
                $ref: '#/components/schemas/Uuid'
              catalogue_item_variant_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              is_available:
                type: boolean
                default: true
              available_from:
                type: ['string', 'null']
                format: date
              available_to:
                type: ['string', 'null']
                format: date
            additionalProperties: false
      additionalProperties: false

    PublicDietClassification:
      type: object
      required: [code, name, display_order]
      description: |
        The public projection of a diet classification: **one** server-localised
        name, never both language columns.
      properties:
        code:
          type: string
          maxLength: 40
          description: |
            The platform vocabulary, matching the universal client's
            `DietClassification` union one for one.
        name:
          type: string
        display_order:
          type: integer
          minimum: 0
      additionalProperties: false
