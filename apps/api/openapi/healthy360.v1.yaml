          description: The created channel.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalogue/sales-channels/{channel}:
    get:
      operationId: showSalesChannel
      tags: [Sellable catalogue]
      summary: A sales channel
      description: |
        Returns `ETag: "<lock_version>"` — the channel's validator, which a
        write sends back as `If-Match`.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/SalesChannelPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The channel.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
