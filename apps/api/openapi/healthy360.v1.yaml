  /catalogue/items:
    get:
      operationId: listCatalogueItems
      tags: [Sellable catalogue]
      summary: List catalogue items
      description: |
        Everything this organisation sells — products, meals and subscription
        plans in one cursor-paginated list, discriminated by `item_type`.

        Retired items are excluded unless `status=retired` is asked for by
        name: a list that offered withdrawn articles by default invites
        somebody to price one.

        **No item here carries a price, a cost or a margin**, and none ever
        will: money lives in the pricing family, and the admin contract's
        confidential `marginPercent` is a presentation figure with no
        server-side home.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match over both names and the slug.
          schema:
            type: string
            maxLength: 160
        - name: status
          in: query
          required: false
          description: |
            Restrict to one publication state. Omitted, everything except
            `retired` is listed.
          schema:
            $ref: '#/components/schemas/CatalogueItemStatus'
        - name: item_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CatalogueItemType'
        - name: product_category_id
          in: query
          required: false
          description: Exact match on the merchandising category.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of catalogue items.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCatalogueItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createCatalogueItem
      tags: [Sellable catalogue]
      summary: Create a catalogue item
      description: |
        Creates a **draft**. Nothing is ever created published: publication is
        a separate action, with a separate permission, behind a readiness gate.

        `slug` is derived from the English name unless one is supplied, and is
        immutable thereafter.

        `name_ar` may be omitted and is then stored as the empty string, which
        is the "not yet translated" state the publish gate refuses. Unlike a
        recipe, the Arabic name does **not** fall back to the English one: a
        catalogue item is customer-facing, so an untranslated name has to be
        visible as untranslated.

        `catalogue_id` may be omitted; the organisation's `default` catalogue
        is created on demand.

        Variants, ingredients, diet tags and channels are each their own
        set-replace endpoint and are not accepted here.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
