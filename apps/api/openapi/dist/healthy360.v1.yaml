                          maxLength: 40
                      channels:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminChannelAssignment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateCatalogueItem
      tags:
        - Sellable catalogue
      summary: Update a catalogue item
      description: |
        A rename changes the names. `slug` and `item_type` are **refused**
        rather than ignored — a slug is what a link, a marketplace listing and
        a partner's integration hold, and silently dropping a field a client
        believed it was writing teaches nobody anything.

        `status` is absent for the same reason it is on every lifecycle-bearing
        resource: publication and retirement are POST sub-resource actions with
        their own permission and their own audit events.

        A retired item is frozen and every write to it is `409
        resource.conflict`. A **published** one stays editable: an item is a
