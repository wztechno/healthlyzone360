      description: |
        A **band, not a target**. The source kitchens sell brackets, and a
        bracket is an honest statement about portioning; a single number would
        imply a per-customer energy calculation this programme does not do.

        Ordered by `display_order` then by `min_kcal`, so a kitchen that never
