        "intermediate" ingredient is simply one that appears here.

        An empty set is legitimate — a component whose yield nobody has
        measured. A non-empty set must name **exactly one** primary; zero or
        two is `422 validation.failed`, because "the thing this recipe makes"
        has to be answerable without a tie-break.

