  /catalogue/price-lists:
    get:
      operationId: listPriceLists
      tags:
        - Pricing
      summary: List price lists
      description: |
        Every tariff this organisation quotes, cursor-paginated. Unlike the
        sales-channel list this one pages: a kitchen has a handful of channels
        but can accumulate a tariff per corporate client.

        Archived lists are excluded unless `status=archived` is asked for by
        name — a list offered by default is a list somebody assigns to a
        channel.

        **No amounts.** The header carries a currency and a status, never a
        price. Embedding rows here would serve an entire kitchen's negotiated
        pricing in one response, and a cursor page is exactly the shape that
        gets exported wholesale.

        Requires `price_list.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
