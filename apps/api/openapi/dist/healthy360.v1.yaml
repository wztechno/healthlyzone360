  /catalogue/plan-vocabulary/combinations:
    get:
      operationId: listMealCombinationOptions
      tags:
        - Subscription plans
      summary: The meal combinations a kitchen sells plans in
      description: |
        Which meals of the day a plan delivers — "lunch and dinner", "full
        day". A kitchen's own vocabulary: there is no platform library, because
        "full board" means what each kitchen sells it as.

        Not paginated. The vocabulary is a handful of rows a client renders as
        a set of options in one pass, and paging a set of radio buttons would
        hand a form half of itself.

        **Deactivated rows are served too**, with their `is_active` flag: there
        being no delete, one that vanished from the list would be withdrawn for
        good.

        `includes_*` and `meals_per_day` are **not** the same fact.
        The flags say which sittings are covered; the count says how many
        portions leave the kitchen, which is what a per-day price is quoted
        against. They agree for the ordinary combinations and stop agreeing the
        moment a kitchen sells "lunch, twice".

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
