    ReplacePlanVariantsRequest:
      type: object
      required:
        - cells
      description: |
        The complete matrix. `cells` is required but may be empty: an empty
        array archives every configuration, which is a decision a kitchen makes
        and not a field they forgot.

        `variant_type` is not a field â€” it is derived from the item's own type â€”
        and neither is `catalogue_item_id`, which is in the URL.
      properties:
        cells:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - meal_combination_option_id
              - meals_per_day
            properties:
              code:
                type:
                  - string
                  - 'null'
                maxLength: 60
                description: |
                  Omitted is the ordinary case: the server derives
                  `combination-tier[-band]` from the cell's own coordinates, so
                  a 4 Ã— 2 Ã— 5 matrix needs no hand-typed identifiers.
              name_en:
                type:
                  - string
                  - 'null'
                maxLength: 255
              name_ar:
                type:
                  - string
                  - 'null'
                maxLength: 255
              status:
                oneOf:
                  - $ref: '#/components/schemas/CatalogueVariantStatus'
                  - type: 'null'
              meal_combination_option_id:
                $ref: '#/components/schemas/Uuid'
              energy_band_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              service_tier:
                oneOf:
                  - $ref: '#/components/schemas/ServiceTier'
                  - type: 'null'
              includes_snacks:
                type:
                  - boolean
                  - 'null'
                description: |
                  Must agree with `snacks_per_day`: the contradiction is 422,
                  not a silent resolution.
              meals_per_day:
                type: integer
                minimum: 1
                maximum: 12
              snacks_per_day:
                type:
                  - integer
                  - 'null'
                minimum: 0
                maximum: 12
            additionalProperties: false
      additionalProperties: false
    ReplacePlanVariantDurationsRequest:
      type: object
      required:
        - assignments
      description: |
        The complete set of configuration Ã— duration pairings. Empty removes
        every one of them.

        Each row names its configuration by `catalogue_item_variant_id` **or**
        `variant_code`, and its duration by `plan_duration_id` **or**
        `duration_code`.
      properties:
        assignments:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              catalogue_item_variant_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              variant_code:
                type:
                  - string
                  - 'null'
                maxLength: 60
              plan_duration_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              duration_code:
                type:
                  - string
                  - 'null'
                maxLength: 40
              discount_percent:
                type:
                  - number
                  - string
                  - 'null'
                minimum: 0
                exclusiveMaximum: 100
                description: |
                  **Omitted or null means nobody has stated a discount**, and it
                  is stored and returned as null. Send `0` to state that there
                  is none â€” that is a different row for every reader afterwards.
              is_available:
                type:
                  - boolean
                  - 'null'
            additionalProperties: false
      additionalProperties: false
    DeliveryZoneStatus:
      type: string
      description: |
        The **operational** lifecycle of a zone, not the sellable family. A
        zone is configuration; what a customer sees is whether their address
        can be delivered to.

        `inactive` is a suspension a kitchen expects to reverse and it **keeps**
        its area claims; `archived` is terminal and **releases** them.
      enum:
        - active
        - inactive
        - archived
    DeliveryZoneScope:
      type: string
      description: |
        Whether the zone is the organisation's default map or one branch's
        override. Stated rather than inferred from a null `branch_id`, so a
        client does not have to know that NULL is a meaningful value here.
      enum:
        - organisation
        - branch
    DeliveryZone:
      type: object
      required:
        - id
        - organisation_id
        - branch_id
        - scope
        - code
        - name_en
        - name_ar
        - currency_code
        - delivery_fee_minor
        - minimum_order_minor
        - estimated_minutes
        - status
        - is_active
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null is the organisation-wide map.
        scope:
          $ref: '#/components/schemas/DeliveryZoneScope'
        code:
          type: string
          maxLength: 40
          description: Fixed at creation. A request carrying it on update is refused.
        name_en:
          type: string
        name_ar:
          type: string
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: |
            ISO 4217. Both amounts on this zone are denominated in it, so they
            are comparable by construction and there is no cross-currency
            arithmetic anywhere.
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Integer minor units, never a formatted string and never a float.
            **Null means nobody has decided what delivery costs**; `0` means
            delivery is free. Those are different commercial statements and one
            is never rendered as the other.
        minimum_order_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Integer minor units. Null means no minimum has been stated.
        estimated_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          description: A promise, not a measurement. Null means none has been made.
        status:
          $ref: '#/components/schemas/DeliveryZoneStatus'
        is_active:
          type: boolean
          description: |
            Whether this zone actually serves. Derived from `status`, so it
            cannot disagree with it — only an `active` zone quotes a delivery.
        source_system:
          type:
            - string
            - 'null'
          maxLength: 40
        source_ref:
          type:
            - string
            - 'null'
          maxLength: 160
        lock_version:
          type: integer
          minimum: 0
          description: |
            The optimistic-concurrency validator, echoed as the `ETag`. The
            zone's **area set** is versioned against this same number.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    DeliveryZoneEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
