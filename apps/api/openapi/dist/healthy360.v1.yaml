  /catalogue/plan-vocabulary/combinations/{combination}:
    patch:
      operationId: updateMealCombinationOption
      tags:
        - Subscription plans
      summary: Edit or withdraw a meal combination
      description: |
        **No `If-Match`.** These rows carry no `lock_version`, and the
        concurrency contract applies only to resources that do: sending a
        validator a resource cannot honour would be worse than sending none.

        `code` is **refused, not ignored** — a plan configuration's identifier
        is derived from it, so moving it would rename variants a price already
        points at.

        `is_active: false` is the withdrawal, and the only one there is. A
        vocabulary row a configuration references cannot be deleted at all: the
        foreign keys are `RESTRICT`.

        Requires `plan.manage_organisation`.
