        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null is the organisation-wide map.
        scope:
          $ref: '#/components/schemas/DeliveryZoneScope'
        code:
          type: string
          maxLength: 40
          description: Fixed at creation. A request carrying it on update is refused.
        name_en:
          type: string
        name_ar:
          type: string
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: |
            ISO 4217. Both amounts on this zone are denominated in it, so they
            are comparable by construction and there is no cross-currency
            arithmetic anywhere.
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Integer minor units, never a formatted string and never a float.
            **Null means nobody has decided what delivery costs**; `0` means
            delivery is free. Those are different commercial statements and one
            is never rendered as the other.
        minimum_order_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Integer minor units. Null means no minimum has been stated.
        estimated_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          description: A promise, not a measurement. Null means none has been made.
        status:
          $ref: '#/components/schemas/DeliveryZoneStatus'
        is_active:
          type: boolean
          description: |
            Whether this zone actually serves. Derived from `status`, so it
            cannot disagree with it — only an `active` zone quotes a delivery.
        source_system:
          type:
            - string
            - 'null'
          maxLength: 40
        source_ref:
          type:
            - string
            - 'null'
          maxLength: 160
        lock_version:
          type: integer
          minimum: 0
          description: |
            The optimistic-concurrency validator, echoed as the `ETag`. The
            zone's **area set** is versioned against this same number.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    DeliveryZoneEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - delivery_zone
          properties:
            delivery_zone:
              $ref: '#/components/schemas/DeliveryZone'
        meta:
          $ref: '#/components/schemas/Meta'
    DeliveryZoneDetailEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - delivery_zone
          properties:
            delivery_zone:
              $ref: '#/components/schemas/DeliveryZone'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                area_count:
                  type: integer
                  minimum: 0
                  description: How many places this zone covers. The places themselves are one request away.
    DeliveryZonesEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryZone'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AdminDeliveryArea:
      type: object
      required:
        - id
        - country_code
        - code
        - name_en
        - name_ar
        - region
        - display_order
        - is_active
      description: |
        A platform place as an administrator sees it — both language columns
        and the active flag, because a kitchen choosing areas needs to know
        that one it already serves has been withdrawn.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        code:
          type: string
          maxLength: 60
          description: Unique within the country, never globally — place names repeat across borders.
        name_en:
          type: string
        name_ar:
          type: string
        region:
          type:
            - string
            - 'null'
          maxLength: 60
          description: |
            Governorate or district. **Null on every row today** (OD-12): the
            source does not record it, and an invented grouping would look
            exactly like data.
        display_order:
          type: integer
        is_active:
          type: boolean
      additionalProperties: false
    MarketplaceMoney:
      type: object
      description: |
        An integer number of minor units and its currency code. `4200` with
        `AED` is 42.00 AED. Amounts are never formatted server-side and never
        travel without their currency (master plan v2 §4.4).
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
      additionalProperties: false
    MarketplaceSalesChannels:
      type: object
      description: |
        The eight consumer switches, derived from the kitchen's **active**
        sales channels. The platform stores six channel *kinds*, and the
        mapping is: `b2c_web` sets `b2c`, `b2b` sets `b2b`, `pos` sets `pos`,
        `marketplace` sets `marketplace`, `corporate` sets `corporate`, and
        `insurance` sets nothing (there is no consumer switch for it, and
        mapping it onto `corporate` would tell a diner that a kitchen with an
        insurer agreement takes corporate orders).

        **`subscription`, `delivery` and `pickup` are always `false`.** That is
        a statement rather than an omission: `subscription` is a property of
        what is sold, not of a route to market, and no column anywhere records a
        delivery or pickup arrangement. Deriving them from something adjacent —
        "it has a delivery zone, so it delivers" — would publish an inference as
        a fact on the one surface where a customer acts on it.
      required:
        - b2c
        - b2b
        - marketplace
        - pos
        - subscription
        - delivery
        - pickup
        - corporate
      properties:
        b2c:
          type: boolean
        b2b:
          type: boolean
        marketplace:
          type: boolean
        pos:
          type: boolean
        subscription:
          type: boolean
        delivery:
          type: boolean
        pickup:
          type: boolean
        corporate:
          type: boolean
      additionalProperties: false
    MarketplaceDeliveryZone:
      type: object
      description: |
        One kitchen's published terms for reaching a set of places. The fee and
        the minimum are what the kitchen *charges*, never what the food costs
        it — which is why they are publishable at all.
      required:
        - id
        - name
        - area
        - country_code
        - delivery_fee
        - minimum_order
        - estimated_minutes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: Localised. One server-chosen language, never both columns.
        area:
          type: string
          description: |
            The zone's claimed areas, localised and joined in the locale's own
            punctuation. The consumer contract carries a single free-form label
            while a zone claims a set, and publishing only the first would tell a
            customer in one place that a zone covers another.
        country_code:
          type: string
          maxLength: 2
        delivery_fee:
          oneOf:
            - $ref: '#/components/schemas/MarketplaceMoney'
            - type: 'null'
        minimum_order:
          oneOf:
            - $ref: '#/components/schemas/MarketplaceMoney'
            - type: 'null'
        estimated_minutes:
          type:
            - integer
            - 'null'
          minimum: 0
      additionalProperties: false
    MarketplaceOpeningHours:
      type: object
      description: |
        One configured day. A closed day is a **row with no times**, not a
        missing one: "we are shut on Friday" and "nobody has filled in Friday"
        are different facts, and only the days a kitchen has configured appear.
      required:
        - weekday
        - opens_at
        - closes_at
        - order_cut_off_at
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: '`1` is Monday, per ISO 8601.'
        opens_at:
          type:
            - string
            - 'null'
          description: '`HH:MM`, in the branch''s own timezone.'
        closes_at:
          type:
            - string
            - 'null'
        order_cut_off_at:
          type:
            - string
            - 'null'
          description: Last time an order for that same day is accepted.
      additionalProperties: false
    MarketplaceBranch:
      type: object
      required:
        - id
        - kitchen_id
        - name
        - area
        - country_code
        - time_zone
        - delivery_zones
        - opening_hours
        - supports_pickup
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kitchen_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        area:
          type: string
          description: |
            The branch's city. The street address is deliberately not published:
            it is where a kitchen takes deliveries, and printing it beside an
            opening time turns a discovery page into a directory of unstaffed
            back doors.
        country_code:
          type: string
          maxLength: 2
        time_zone:
          type: string
        delivery_zones:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceDeliveryZone'
        opening_hours:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceOpeningHours'
        supports_pickup:
          type: boolean
          description: |
            Always `false`. No column records a pickup arrangement anywhere in
            the platform, and an honest constant beats a guess.
        is_active:
          type: boolean
      additionalProperties: false
    MarketplaceKitchen:
      type: object
      required:
        - id
        - name
        - slug
        - tagline
        - description
        - country_code
        - cuisines
        - diet_classifications
        - channels
        - branches
        - rating
        - rating_count
        - image_placeholder_id
        - is_verified
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: The registered organisation name. Not localised — a business name is not translated.
        slug:
          type: string
        tagline:
          type: string
          description: Always empty; the platform stores no marketing copy.
        description:
          type: string
          description: Always empty; the platform stores no marketing copy.
        country_code:
          type: string
          maxLength: 2
        cuisines:
          type: array
          description: Always empty; nothing records how a kitchen cooks.
          items:
            type: string
        diet_classifications:
          type: array
          description: Derived from the kitchen's own published meals.
          items:
            type: string
        channels:
          $ref: '#/components/schemas/MarketplaceSalesChannels'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceBranch'
        rating:
          type:
            - number
            - 'null'
          description: Always null; no reviews exist.
        rating_count:
          type: integer
          minimum: 0
        image_placeholder_id:
          type: string
          description: |
            A generated placeholder identifier (`kitchen-<slug>`), never a remote
            image URL. The clients load no third-party assets.
        is_verified:
          type: boolean
          description: |
            Always `false`. There is no verification module yet, so the platform
            has verified nobody — which is the fact rather than a placeholder.
      additionalProperties: false
    MarketplaceAvailability:
      type: object
      description: |
        One day of the fourteen-day ordering calendar, derived from the
        branches' operating weeks and cut-offs. A day is orderable when at least
        one active branch is open on it and that branch's cut-off has not
        passed; a day nobody has configured is not orderable.
      required:
        - date
        - available
        - remaining
        - order_cut_off_at
      properties:
        date:
          type: string
          format: date
        available:
          type: boolean
        remaining:
          type:
            - integer
            - 'null'
          description: Always null — the platform stores no stock counts, and a zero would say sold out.
        order_cut_off_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    MarketplaceMeal:
      type: object
      required:
        - id
        - kitchen_id
        - kitchen_name
        - name
        - slug
        - description
        - meal_types
        - diet_classifications
        - cuisines
        - allergens
        - serving
        - nutrition
        - price
        - preparation_minutes
        - image_placeholder_id
        - availability
        - channels
        - rating
        - rating_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kitchen_id:
          $ref: '#/components/schemas/Uuid'
        kitchen_name:
          type: string
        name:
          type: string
          description: Localised. One server-chosen language, never both columns.
        slug:
          type: string
        description:
          type: string
        meal_types:
          type: array
          description: |
            Always empty. Nothing on a catalogue item records whether a dish is a
            breakfast or a dinner; a kitchen selling a lunch box and a breakfast
            box sells two items.
          items:
            type: string
        diet_classifications:
          type: array
          items:
            type: string
        cuisines:
          type: array
          items:
            type: string
        allergens:
          type: array
          description: |
            Derived from the published recipe version's frozen label, or from the
            meal's own ingredient list. Carries **both** containment levels:
            dropping "may contain" would let a filter for "no peanuts" return a
            dish made where peanuts cannot be ruled out.
          items:
            $ref: '#/components/schemas/AllergenCode'
        serving:
          type: 'null'
          description: |
            Always null. See `nutrition` — the platform records no serving size
            because it records no per-serving figures to attach one to.
        nutrition:
          type: 'null'
          description: |
            **Always null, and a deliberate deviation from the proposed draft**,
            which typed this as a required facts object. The platform has no
            authoritative nutrition source. Emitting plausible figures would put
            invented numbers in front of somebody choosing food for a medical
            reason, and zeroes would be worse — a zero is a claim. Phase N1 owns
            nutrition and is gated on a real source arriving.
        price:
          $ref: '#/components/schemas/MarketplaceMoney'
        preparation_minutes:
          type:
            - integer
            - 'null'
          description: Always null; no column records how long a dish takes to make.
        image_placeholder_id:
          type: string
        availability:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceAvailability'
        channels:
          $ref: '#/components/schemas/MarketplaceSalesChannels'
        rating:
          type:
            - number
            - 'null'
        rating_count:
          type: integer
          minimum: 0
      additionalProperties: false
    MarketplaceEnergyBand:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: integer
        max:
          type: integer
      additionalProperties: false
    MarketplacePlanVariant:
      type: object
      required:
        - id
        - plan_id
        - name
        - energy_range
        - protein_range
        - carbohydrate_range
        - fat_range
        - meals_per_day
        - snacks_per_day
        - price_per_week
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        plan_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        energy_range:
          description: |
            A calorie **bracket**, never a per-person target: a single number
            would imply an energy calculation this programme does not do. Null
            when the configuration names no band.
          oneOf:
            - $ref: '#/components/schemas/MarketplaceEnergyBand'
            - type: 'null'
        protein_range:
          type: 'null'
        carbohydrate_range:
          type: 'null'
        fat_range:
          type: 'null'
        meals_per_day:
          type: integer
          minimum: 1
        snacks_per_day:
          type: integer
          minimum: 0
        price_per_week:
          description: |
            Derived from the confirmed price on the basis the plan declares:
            `per_week` unchanged, `per_day` multiplied by seven. A plan priced as
            a `total` has no weekly figure and its configurations are omitted
            rather than divided into one nobody quoted.
          oneOf:
            - $ref: '#/components/schemas/MarketplaceMoney'
            - type: 'null'
      additionalProperties: false
    MarketplacePlanDuration:
      type: object
      description: |
        **A documented widening of the proposed draft** (master plan v2 §4.3,
        amending OD-3). The draft typed a duration as one of `1w`, `2w`, `4w`,
        `12w`. The platform stores an explicit `kind` (`one_off` or
        `fixed_days`) and a nullable number of days, precisely so that
        "not a subscription, just one order" stops being a magic zero a per-day
        calculation divides by — and real kitchen runs of 5, 20, 40 and 60 days
        are not expressible in the draft's enumeration at all.
      required:
        - code
        - name
        - kind
        - days
        - discount_percent
        - total_price
      properties:
        code:
          type: string
          description: The kitchen's own duration code.
        name:
          type: string
          description: Localised.
        kind:
          type: string
          enum:
            - one_off
            - fixed_days
        days:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Null exactly when `kind` is `one_off`.
        discount_percent:
          type:
            - string
            - 'null'
          description: |
            A decimal string, or null. Null means **nobody has stated a
            discount**, which is a different fact from stating there is none —
            and null again when two configurations state different ones, because
            a plan page showing "10% off" when only one configuration gets it
            would be a price claim the kitchen did not make.
        total_price:
          description: |
            The whole-run price, and null unless every number in it was agreed:
            a confirmed per-day price and a fixed number of days. Rounded
            half-up to the minor unit once, at the end.
          oneOf:
            - $ref: '#/components/schemas/MarketplaceMoney'
            - type: 'null'
      additionalProperties: false
    MarketplacePlan:
      type: object
      required:
        - id
        - kitchen_id
        - name
        - slug
        - summary
        - description
        - category_slugs
        - diet_classifications
        - variants
        - durations
        - sample_meal_ids
        - image_placeholder_id
        - rating
        - rating_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kitchen_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
        description:
          type: string
        category_slugs:
          type: array
          description: Always empty; nothing groups plans into marketing categories.
          items:
            type: string
        diet_classifications:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MarketplacePlanVariant'
        durations:
          type: array
          items:
            $ref: '#/components/schemas/MarketplacePlanDuration'
        sample_meal_ids:
          type: array
          description: |
            Always empty. No table links a plan to the meals a representative
            week would contain, and assembling one from the catalogue would be
            the system writing a menu.
          items:
            $ref: '#/components/schemas/Uuid'
        image_placeholder_id:
          type: string
        rating:
          type:
            - number
            - 'null'
        rating_count:
          type: integer
          minimum: 0
      additionalProperties: false
    MarketplaceListMeta:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required:
            - locale
            - unsupported_filters
          properties:
            locale:
              type: string
              enum:
                - en
                - ar
              description: The locale the localised fields were rendered in.
            unsupported_filters:
              type: array
              description: |
                Parameters the caller sent that this deployment stores no data
                for. They had no effect and are named rather than ignored: a
                person who filters to "under 500 kcal" and is shown everything
                has been told a falsehood by omission.
              items:
                type: string
    MarketplaceKitchensEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceKitchen'
        meta:
          $ref: '#/components/schemas/MarketplaceListMeta'
    MarketplaceMealsEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceMeal'
        meta:
          $ref: '#/components/schemas/MarketplaceListMeta'
    MarketplacePlansEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketplacePlan'
        meta:
          $ref: '#/components/schemas/MarketplaceListMeta'
    PublicDeliveryArea:
      type: object
      required:
        - id
        - country_code
        - code
        - name
        - region
        - display_order
      description: |
        The public projection: **one** server-localised `name`, never both
        language columns.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        code:
          type: string
          maxLength: 60
        name:
          type: string
          description: Rendered in the locale `meta.locale` names.
        region:
          type:
            - string
            - 'null'
          maxLength: 60
        display_order:
          type: integer
      additionalProperties: false
    PublicDeliveryAreasEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicDeliveryArea'
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
            - type: object
              properties:
                locale:
                  type: string
                  enum:
                    - en
                    - ar
                  description: The locale the names were rendered in.
                country_code:
                  type: string
                  minLength: 2
                  maxLength: 2
    DeliveryZoneAreasEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDeliveryArea'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                count:
                  type: integer
                  minimum: 0
                inactive_area_count:
                  type: integer
                  minimum: 0
                  description: |
                    How many of these places the platform has since withdrawn.
                    The claims are kept rather than silently dropped; this is
                    what a screen puts a warning badge on.
                scope:
                  $ref: '#/components/schemas/DeliveryZoneScope'
    DeliveryWindow:
      type: object
      required:
        - id
        - organisation_id
        - code
        - name_en
        - name_ar
        - starts_at
        - ends_at
        - weekdays
        - display_order
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 30
          description: Fixed at creation. A request carrying it on update is refused.
        name_en:
          type: string
        name_ar:
          type: string
        starts_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: |
            A clock face in the branch's own timezone, `HH:MM` — not an
            instant. Null exactly when `ends_at` is: a window somebody named
            before deciding its hours is a legitimate half-finished state.
        ends_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: |
            Strictly after `starts_at`. **Overnight windows are not supported
            yet** — a rollover rule order capture has not agreed to would be a
            rule nobody has tested — so 22:00–02:00 is modelled as two windows.
        weekdays:
          type: array
          maxItems: 7
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: |
            ISO-8601 weekdays, 1 = Monday … 7 = Sunday. **An empty array means
            every day**, and it is the only encoding of that fact: all seven
            normalises to `[]` on the way in, so two windows that run daily
            never compare as different.
        display_order:
          type: integer
        is_active:
          type: boolean
          description: The only withdrawal there is. No DELETE exists.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    DeliveryWindowEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - delivery_window
          properties:
            delivery_window:
              $ref: '#/components/schemas/DeliveryWindow'
        meta:
          $ref: '#/components/schemas/Meta'
    DeliveryWindowsEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWindow'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                count:
                  type: integer
                  minimum: 0
                active_count:
                  type: integer
                  minimum: 0
    BranchOperatingDay:
      type: object
      required:
        - id
        - branch_id
        - weekday
        - is_open
        - opens_at
        - closes_at
        - order_cut_off_at
      description: |
        One weekday of one branch's week. A **closed day is a row** with both
        times null — "we are shut on Sunday" and "nobody has filled in Sunday"
        are different facts, and only the first is stored as a row.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          $ref: '#/components/schemas/Uuid'
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 'ISO-8601: 1 = Monday … 7 = Sunday.'
        is_open:
          type: boolean
          description: Derived from the times, so it cannot disagree with them.
        opens_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: A clock face in the branch's own timezone. Null exactly when `closes_at` is.
        closes_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Strictly after `opens_at`. No overnight service in this phase.
        order_cut_off_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: |
            The last moment an order for this day is accepted. **Null means
            until the van leaves** — a kitchen with no cut-off has none, and
            that is an answer rather than an omission. Only an open day may
            carry one; it may fall outside the opening hours.
      additionalProperties: false
    BranchOperatingEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/BranchOperatingDay'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                configured_weekdays:
                  type: array
                  maxItems: 7
                  items:
                    type: integer
                    minimum: 1
                    maximum: 7
                open_day_count:
                  type: integer
                  minimum: 0
                  maximum: 7
                is_complete:
                  type: boolean
                  description: Whether all seven days have been decided. Days nobody has decided about are absent, never invented.
    CreateDeliveryZoneRequest:
      type: object
      required:
        - code
        - name_en
      description: |
        No `status`: a zone is created active, archiving is a POST action and
        suspension is `is_active` on the update (master plan v2 §4.15).
      properties:
        code:
          type: string
          maxLength: 40
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
          description: Defaults to the organisation's own currency.
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Omitted or null draws the organisation-wide map.
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Leave it out to say nobody has decided. Send `0` to say delivery is free.
        minimum_order_minor:
          type:
            - integer
            - 'null'
          minimum: 0
        estimated_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
      additionalProperties: false
    UpdateDeliveryZoneRequest:
      type: object
      description: |
        Every field optional. `code` and `status` are **rejected**, not
        ignored — a client that sent one believed it was writing something.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Re-scopes the zone **and its area claims together**. Refused with
            `409 area_already_served` when the destination scope is taken.
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          minimum: 0
        minimum_order_minor:
          type:
            - integer
            - 'null'
          minimum: 0
        estimated_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
        is_active:
          type: boolean
          description: |
            The reversible half of the lifecycle: `false` suspends the zone and
            **keeps** its area claims. Archiving is the POST action, and it
            releases them.
      additionalProperties: false
    ReplaceDeliveryZoneAreasRequest:
      type: object
      required:
        - service_area_ids
      description: |
        The desired **whole** map. Areas absent from it are released, which is
        the only way to hand a place to a different zone. An empty array is a
        zone that covers nowhere — a legitimate intermediate state while a
        kitchen redraws.
      properties:
        service_area_ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    CreateDeliveryWindowRequest:
      type: object
      required:
        - code
        - name_en
      properties:
        code:
          type: string
          maxLength: 30
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        starts_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          description: Both times or neither. Refused with the missing half named.
        ends_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
        weekdays:
          type:
            - array
            - 'null'
          maxItems: 7
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Omitted, null, empty or all seven all mean **every day**, and all store as `[]`.
        display_order:
          type:
            - integer
            - 'null'
          minimum: 0
        is_active:
          type:
            - boolean
            - 'null'
      additionalProperties: false
    UpdateDeliveryWindowRequest:
      type: object
      description: |
        Every field optional; `code` is **rejected**, not ignored. The pairing
        and ordering rules run against the **merged** row, so sending only one
        end compares it with the stored other.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        starts_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
        ends_at:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
        weekdays:
          type:
            - array
            - 'null'
          maxItems: 7
          items:
            type: integer
            minimum: 1
            maximum: 7
        display_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean
      additionalProperties: false
    ReplaceBranchOperatingRequest:
      type: object
      required:
        - days
      description: |
        The desired **whole** week. An omitted weekday is a day nobody has
        decided about; a day sent with no times is closed. An empty array
        clears the week back to unconfigured.

        There is no `branch_id`: the branch comes from `X-Branch-Id`, validated
        against the caller's membership scope.
      properties:
        days:
          type: array
          maxItems: 7
          items:
            type: object
            required:
              - weekday
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: ISO-8601. Each weekday at most once — two rows for one day is a contradiction, not a split shift.
              opens_at:
                type:
                  - string
                  - 'null'
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
              closes_at:
                type:
                  - string
                  - 'null'
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
              order_cut_off_at:
                type:
                  - string
                  - 'null'
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
                description: Only an open day may carry one. It may fall outside the opening hours.
            additionalProperties: false
      additionalProperties: false
    CartStatus:
      type: string
      description: |
        Three states, two of them terminal. `converted` and `expired` both mean
        "no longer shoppable" and are kept apart because only one is a success:
        a converted cart has an order behind it, an expired one is somebody who
        changed their mind. Collapsing them would make basket abandonment
        unanswerable.
      enum:
        - open
        - converted
        - expired
    OrderStatus:
      type: string
      description: |
        `placed → confirmed → fulfilled`, with `cancelled` reachable from the
        first two and from nowhere else. A fulfilled order is not cancellable:
        the food has been delivered, and what happens next is a refund or a
        complaint — different objects with different money attached.

        Deliberately absent: anything about payment (there is one method and it
        happens at the door), anything about production stages (the kitchen
        display's vocabulary), and any `pending` or `draft` — an order that has
        not been placed is a cart.
      enum:
        - placed
        - confirmed
        - fulfilled
        - cancelled
    CancellationReason:
      type: string
      description: |
        Why an order was cancelled. A fixed vocabulary rather than free text
        because the answer is read by machines as often as by people: free text
        turns a count into a search problem, and it is how personal data ends up
        in a column nobody classified.

        `delivery_unavailable` is separate from `kitchen_unable_to_fulfil`
        because the food could be made but not delivered — the kitchen's fault
        in a different way, and the one an operations team can fix.
        `payment_failed` is **not** here: there is nothing to fail.
      enum:
        - customer_requested
        - kitchen_unable_to_fulfil
        - delivery_unavailable
        - address_unreachable
    PaymentMethod:
      type: string
      description: |
        One value, and the field exists anyway: an order has to record how it
        was paid for, and a column that appears the day a second method does
        would leave every earlier order unable to say.
      enum:
        - cash_on_delivery
    OpenCartRequest:
      type: object
      required:
        - channel_code
      properties:
        channel_code:
          type: string
          maxLength: 40
          description: |
            The sales channel's own code, resolved across organisations. Which
            kitchen owns it is the server's answer, not the client's assertion —
            which is why there is no `organisation_id` here.
          examples:
            - b2c_web
      additionalProperties: false
    AddCartItemRequest:
      type: object
      required:
        - catalogue_item_id
      properties:
        catalogue_item_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The pack or plan configuration, when the article has variants.
        quantity:
          type:
            - number
            - string
          description: |
            How many, defaulting to 1. Numeric rather than integer because a
            line can be 0.35 kg, and accepted as a string as well as a number so
            a client holding a decimal can send it without a float round trip.
            Zero is refused: removing a line is its own action, not a quantity
            of nothing.
          examples:
            - '0.3500'
            - 2
        delivery_date:
          type:
            - string
            - 'null'
          format: date
          description: |
            The day the line is wanted, `YYYY-MM-DD`. Part of the line's
            identity rather than a decoration: two quantities of the same meal
            for two different days are two lines.
      additionalProperties: false
    SetCartItemQuantityRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type:
            - number
            - string
          description: |
            The quantity the customer wants, not a delta. Reprobed by the
            server, and refusable — raising can cross a tier priced in another
            currency, lowering can fall below the only tier that priced the
            article at all.
          examples:
            - '3.0000'
            - 3
      additionalProperties: false
    CartLine:
      type: object
      required:
        - id
        - catalogue_item_id
        - catalogue_item_variant_id
        - quantity
        - delivery_date
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          type:
            - string
            - 'null'
          format: uuid
        quantity:
          type: string
          description: |
            A decimal **string**, never a number. It is matched against pricing
            tiers of the same scale, and a 0.3 kg line that arrived back as
            0.29999999 would sit on the wrong side of a tier boundary.
          examples:
            - '0.3500'
        delivery_date:
          type:
            - string
            - 'null'
          format: date
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    Cart:
      type: object
      required:
        - id
        - organisation_id
        - sales_channel_id
        - branch_id
        - status
        - currency_code
        - expires_at
        - lock_version
        - line_count
        - lines
        - created_at
        - updated_at
      description: |
        **No amount of any kind appears here, and none ever will.** The cart
        tables hold no price column: the server's probe establishes that a line
        is orderable and discards its price, because a cart price is advisory and
        every line is repriced at placement. A subtotal here would be a number no
        table holds and no checkout will honour.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        sales_channel_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Where the food would be produced. Null until the customer has
            chosen: naming one for them would silently pick whose cut-off and
            whose delivery terms apply.
        status:
          $ref: '#/components/schemas/CartStatus'
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          examples:
            - AED
        expires_at:
          type: string
          format: date-time
          description: |
            When an untouched basket is closed by the sweep. Carried because a
            basket that quietly vanishes is the complaint the TTL would
            otherwise generate; every line write pushes it out.
        lock_version:
          type: integer
          minimum: 0
          description: |
            Served as an `ETag` so a client can tell a stale render from a
            current one. **No cart write demands `If-Match`**: the header
            prevents a lost update, and a basket has exactly one author.
        line_count:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    CartEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - cart
          properties:
            cart:
              $ref: '#/components/schemas/Cart'
        meta:
          $ref: '#/components/schemas/Meta'
    CartLineEnvelope:
      type: object
      required:
        - data
        - meta
      description: |
        The line the request was about, **and** the basket around it. The write
        moved the cart's validator and pushed its expiry out, so a response
        carrying only the line would hand a client two stale facts.
      properties:
        data:
          type: object
          required:
            - line
            - cart
          properties:
            line:
              $ref: '#/components/schemas/CartLine'
            cart:
              $ref: '#/components/schemas/Cart'
        meta:
          $ref: '#/components/schemas/Meta'
    PlaceOrderRequest:
      type: object
      required:
        - cart_id
        - customer_address_id
      properties:
        cart_id:
          $ref: '#/components/schemas/Uuid'
        customer_address_id:
          $ref: '#/components/schemas/Uuid'
        delivery_window_code:
          type:
            - string
            - 'null'
          maxLength: 40
          description: |
            The slot the customer chose, as the window's own code. Whether that
            slot is offered on that day by that branch is a scheduling question
            answered during placement, with the cut-off rules in hand.
          examples:
            - evening
        requested_delivery_date:
          type:
            - string
            - 'null'
          format: date
          description: |
            The day asked for. Wins over a day the basket's lines name, and a
            disagreement is `mixed_delivery_dates` rather than a silent
            preference: this phase's order carries exactly one delivery date.
      additionalProperties: false
      description: |
        Four fields, and none of them is a price. Every amount is decided during
        placement, against the tariff standing at that moment; a body that could
        state a total would be a client quoting the server its own prices.
    CancelOrderRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/CancellationReason'
      additionalProperties: false
    OrderLineAllergen:
      type: object
      required:
        - allergen_code
        - containment
      description: |
        The customer-facing allergen label, and nothing else. The derivation and
        the source ingredient are dropped at snapshot time: a source ingredient
        names part of a formulation, and an order line is the most likely row on
        the platform to be handed to a courier or a marketplace partner.
      properties:
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
      additionalProperties: false
    CustomerOrderLine:
      type: object
      required:
        - id
        - catalogue_item_id
        - catalogue_item_variant_id
        - name_en
        - name_ar
        - variant_label
        - quantity
        - unit_price_minor
        - line_total_minor
        - currency_code
        - allergens
        - pack_summary
      description: |
        The article as it stood the moment the order was placed — a snapshot,
        not a join. Renaming the catalogue item tomorrow does not rewrite what a
        customer bought.

        `price_list_id` and `price_list_item_id` exist on the row and are
        **never** on this shape: they answer "why was this the price?" a year
        later, and on a receipt they would name a kitchen's tariff structure to
        the person being charged by it.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          type:
            - string
            - 'null'
          format: uuid
        name_en:
          type: string
        name_ar:
          type: string
        variant_label:
          type:
            - string
            - 'null'
        quantity:
          type: string
          description: The decimal string the line total was computed from, never a number.
          examples:
            - '2.0000'
        unit_price_minor:
          type: integer
          description: Minor units. Never formatted server-side — `4500` with `AED`, never `"45.00 AED"`.
        line_total_minor:
          type: integer
          description: |
            Rounded exactly once, here. The unit price times the quantity is an
            integer times a decimal, and rounding the unit price instead would
            compound the error across the order.
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineAllergen'
        pack_summary:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            The pack as the customer bought it — size, unit, pieces, net weight.
            Never a cost and never a supplier.
      additionalProperties: false
    KitchenOrderLine:
      allOf:
        - $ref: '#/components/schemas/CustomerOrderLine'
        - type: object
          required:
            - price_list_id
            - price_list_item_id
          properties:
            price_list_id:
              type:
                - string
                - 'null'
              format: uuid
            price_list_item_id:
              type:
                - string
                - 'null'
              format: uuid
          description: |
            The snapshot's provenance, served to the seller and to nobody else.
            An `allOf` here is a documentation convenience only — the server
            builds the two shapes independently rather than by subtraction,
            because a narrow shape produced by unsetting keys from a wide one is
            one careless refactor away from leaking.
    CustomerOrderDelivery:
      type: object
      required:
        - label
        - line_one
        - line_two
        - city
        - area_name_en
        - area_name_ar
        - area_id
        - window_code
        - requested_date
      description: |
        The address as it stood when the order was placed, copied. Editing the
        address later must not change where this order was sent.
      properties:
        label:
          type:
            - string
            - 'null'
        line_one:
          type: string
        line_two:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
          description: |
            The gazetteer's region — the governorate or district. Usually null:
            the platform data leaves it unpopulated, and the field exists because
            a courier manifest has a city line and a snapshot that could not fill
            it would send somebody back to a table that has since changed.
        area_name_en:
          type:
            - string
            - 'null'
        area_name_ar:
          type:
            - string
            - 'null'
        area_id:
          type:
            - string
            - 'null'
          format: uuid
        window_code:
          type:
            - string
            - 'null'
        requested_date:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    KitchenOrderDelivery:
      allOf:
        - $ref: '#/components/schemas/CustomerOrderDelivery'
        - type: object
          required:
            - zone_id
          properties:
            zone_id:
              type:
                - string
                - 'null'
              format: uuid
              description: |
                Which slice of the kitchen's delivery map the address fell into,
                and what set the fee. The seller's operating arrangement, so it
                is not on the customer's shape.
    CustomerOrder:
      type: object
      required:
        - id
        - order_number
        - status
        - currency_code
        - subtotal_minor
        - delivery_fee_minor
        - total_minor
        - payment_method
        - delivery
        - placed_at
        - confirmed_at
        - fulfilled_at
        - cancelled_at
        - cancellation_reason
        - line_count
        - lines
        - created_at
      description: |
        The receipt. **Five things on the row are deliberately absent**, each
        for its own reason:

        * `price_list_id` / `price_list_item_id` — a kitchen's tariff structure
          named to the person being charged by it; on an agreement list, one
          customer's negotiated position is reconstructable from which list
          priced their line.
        * `organisation_id` — the seller's internal key. The customer bought
          from a kitchen, not from a UUID. *That this shape carries no kitchen
          identity at all is a stated gap*: naming the kitchen means a public
          projection of an organisation, which belongs to the marketplace
          family.
        * `created_by` — for a self-service order this is the customer and says
          nothing; for a staff-placed order it names an employee to a member of
          the public.
        * `lock_version` — the validator of a resource this audience cannot
          write. Serving one with no writer invites `If-Match` at an endpoint
          that would ignore it.
        * `branch_id`, `sales_channel_id`, `delivery_zone_id` — the kitchen's
          operating arrangements; none of them changes anything the customer can
          do.

        The **amounts are here**, and that is not an oversight. What somebody was
        charged is printed on their own receipt; what the food cost the kitchen
        is the confidential figure, and no column on either table carries it.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_number:
          type: string
          description: The human-readable reference, unique across the platform.
          examples:
            - H360-2026-000173
        status:
          $ref: '#/components/schemas/OrderStatus'
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        subtotal_minor:
          type: integer
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          description: Null when no zone charged one — which is not the same as zero.
        total_minor:
          type: integer
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        delivery:
          $ref: '#/components/schemas/CustomerOrderDelivery'
        placed_at:
          type: string
          format: date-time
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        fulfilled_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        cancellation_reason:
          oneOf:
            - $ref: '#/components/schemas/CancellationReason'
            - type: 'null'
        line_count:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrderLine'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    KitchenOrder:
      type: object
      required:
        - id
        - order_number
        - organisation_id
        - customer_account_id
        - sales_channel_id
        - branch_id
        - status
        - currency_code
        - subtotal_minor
        - delivery_fee_minor
        - total_minor
        - payment_method
        - delivery
        - placed_at
        - confirmed_at
        - fulfilled_at
        - cancelled_at
        - cancellation_reason
        - created_by
        - lock_version
        - line_count
        - lines
        - created_at
        - updated_at
      description: |
        The seller's view of the same row. Built independently of the customer
        shape rather than as a superset of it: a wide shape and a narrow one
        derived from it by subtraction is how a column added next year quietly
        reaches a receipt.

        `lock_version` is here because this is the audience that **writes** — a
        screen that could not read the validator could not send the `If-Match`
        the three lifecycle actions demand.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_number:
          type: string
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        customer_account_id:
          $ref: '#/components/schemas/Uuid'
        sales_channel_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        subtotal_minor:
          type: integer
        delivery_fee_minor:
          type:
            - integer
            - 'null'
        total_minor:
          type: integer
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        delivery:
          $ref: '#/components/schemas/KitchenOrderDelivery'
        placed_at:
          type: string
          format: date-time
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        fulfilled_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        cancellation_reason:
          oneOf:
            - $ref: '#/components/schemas/CancellationReason'
            - type: 'null'
        created_by:
          type:
            - string
            - 'null'
          format: uuid
        lock_version:
          type: integer
          minimum: 0
        line_count:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/KitchenOrderLine'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    CustomerOrderEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - order
          properties:
            order:
              $ref: '#/components/schemas/CustomerOrder'
        meta:
          $ref: '#/components/schemas/Meta'
    KitchenOrderEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - order
          properties:
            order:
              $ref: '#/components/schemas/KitchenOrder'
        meta:
          $ref: '#/components/schemas/Meta'
    GuestSessionGrade:
      type: string
      enum:
        - checkout_draft
        - place_order
      description: |
        How much a guest token is allowed to do — the entire authorisation model
        for the guest journey, in two values. `checkout_draft` is what an
        anonymous browser is handed on its first request: enough to build a
        basket, price it and choose a slot, none of which creates an obligation
        to anybody. `place_order` is what that becomes once a passcode has
        proven a contact point.

        The grade is raised only by an act the server witnessed, and the
        database refuses the higher value without a `contact_verified_at`.
    GuestContactChannel:
      type: string
      enum:
        - email
        - phone
      description: |
        What kind of destination a contact point names — deliberately not the
        transport. An address has one way to reach it; a number has three, and
        which is used is a property of the message.
    GuestOtpDeliveryChannel:
      type: string
      enum:
        - email
        - sms
        - whatsapp
      description: |
        How a passcode travels. Optional on every request that accepts it: the
        server knows which drivers are real in this deployment and falls back
        when one is not, so a client that insisted would get a refusal where the
        server would have found a route.
    GuestCustomerAccount:
      type: object
      description: |
        The guest's own customer account. A guest **is** a `customer_accounts`
        row in one of the three shapes that table has always enforced — not a
        new kind of thing — which is why addresses, orders and dietary
        declarations all work on one without knowing a guest exists.

        `account_number` is absent: it is confidential, no guest screen needs
        it, and the reference somebody quotes on the telephone is the order
        number.
      required:
        - id
        - account_type
        - status
        - origin
        - preferred_language_code
        - country_code
        - guest_expires_at
        - converted_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_type:
          type: string
          enum:
            - b2c
            - b2b
            - guest
          description: '`guest` until conversion, `b2c` after it.'
        status:
          type: string
          enum:
            - provisional
            - active
            - suspended
            - closed
        origin:
          type: string
          enum:
            - self_service
            - guest
            - b2b_provisioning
            - staff
            - import
          description: |
            Stays `guest` after conversion. Origin is history: an account that
            arrived through the guest door came from there permanently.
        preferred_language_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        guest_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the guest identity itself lapses and its data is purged. Null
            once the account has converted — an account with a user is no longer
            on a retention clock.
        converted_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    GuestSession:
      type: object
      description: |
        A guest session's own state. **There is no `token` field and there
        cannot be one**: the plaintext exists only in the response to
        `POST /guest/sessions`, and the digest is a credential derivative that is
        never served. The IP and User-Agent fingerprints are absent too — they
        exist for abuse investigation, and echoing a person's own pseudonymised
        fingerprint back to them helps nobody but whoever gets hold of the
        response.
      required:
        - id
        - grade
        - contact_verified
        - contact_verified_at
        - expires_at
        - last_used_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        grade:
          $ref: '#/components/schemas/GuestSessionGrade'
        contact_verified:
          type: boolean
          description: |
            What a checkout screen branches on. Carried beside the timestamp
            rather than derived from it, so the schema's own CHECK constraint
            does not have to be reimplemented in JavaScript.
        contact_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute, never a countdown. A "seconds remaining" computed on the
            server is stale the moment it is serialised.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    StartedGuestSession:
      type: object
      description: The one payload in the API that carries a guest credential.
      required:
        - token
        - grade
        - expires_at
        - account_expires_at
        - customer_account
      properties:
        token:
          type: string
          description: |
            The plaintext bearer token, sent as `X-Guest-Token` on every
            subsequent guest request. **Returned exactly once and stored
            nowhere** — the row keeps a digest. It must never be logged, and a
            client that loses it has lost the basket.
        grade:
          $ref: '#/components/schemas/GuestSessionGrade'
        expires_at:
          type: string
          format: date-time
          description: When this token stops being accepted.
        account_expires_at:
          type: string
          format: date-time
          description: |
            When the guest identity behind the token lapses. The longer of the
            two windows, so a client whose token expired can be told honestly
            that the basket is gone rather than that the person never existed.
        customer_account:
          $ref: '#/components/schemas/GuestCustomerAccount'
      additionalProperties: false
    GuestSessionEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - session
            - customer_account
          properties:
            session:
              $ref: '#/components/schemas/GuestSession'
            customer_account:
              $ref: '#/components/schemas/GuestCustomerAccount'
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/Meta'
    StartGuestSessionRequest:
      type: object
      description: |
        Every field is optional and the empty body is the normal case. A
        required field here would mean a person cannot open a basket until they
        have answered a question, which is the friction the guest journey exists
        to remove. Both values are presentation hints, not references: an
        unrecognised code degrades to the platform default rather than refusing
        the session.
      properties:
        preferred_language_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
      additionalProperties: false
    RequestGuestContactVerificationRequest:
      type: object
      required:
        - channel
        - value
      properties:
        channel:
          $ref: '#/components/schemas/GuestContactChannel'
        value:
          type: string
          maxLength: 255
          description: |
            The address or number itself. Carries no format rule beyond a length
            guard: what counts as a valid destination is the normaliser's single
            judgement, and a second opinion in the request layer would refuse
            values the store accepts.
        delivery_channel:
          $ref: '#/components/schemas/GuestOtpDeliveryChannel'
      additionalProperties: false
    ConfirmGuestContactVerificationRequest:
      type: object
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 16
          description: |
            A string, never an integer — a passcode with a leading zero is a
            passcode, and JSON numbers eat leading zeros. No length rule: how
            long a code is belongs to the verification configuration, and a
            client-facing rule restating it would start refusing valid codes the
            day an operator lengthened them.
      additionalProperties: false
    GuestOtpChallenge:
      type: object
      description: |
        A passcode in flight. Every field exists because a screen cannot be
        built without it: the resend countdown is absolute so a client with a
        wrong clock still gets it right, `attempts_remaining` is the difference
        between retyping carefully and being locked out without warning, and
        `destination_masked` is server-authored because a client-side mask of a
        value the client was given would mean the value was given.
      required:
        - challenge_id
        - purpose
        - channel
        - destination_masked
        - expires_at
        - resend_available_at
        - resend_cooldown_seconds
        - attempts_remaining
        - resends_remaining
        - available_channels
        - simulated
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          type: string
          const: guest_order
        channel:
          $ref: '#/components/schemas/GuestOtpDeliveryChannel'
        destination_masked:
          type: string
          examples:
            - n••••••••••@example.test
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time
        resend_cooldown_seconds:
          type: integer
          minimum: 0
        attempts_remaining:
          type: integer
          minimum: 0
        resends_remaining:
          type: integer
          minimum: 0
        available_channels:
          type: array
          description: What "try another way" may offer in this deployment.
          items:
            type: object
            required:
              - channel
              - simulated
            properties:
              channel:
                $ref: '#/components/schemas/GuestOtpDeliveryChannel'
              simulated:
                type: boolean
            additionalProperties: false
        simulated:
          type: boolean
          description: |
            Whether this challenge was delivered by a driver that does not
            really send anything. Never true outside local and testing.
        debug_code:
          type: string
          description: |
            Present only when the deployment exposes codes *and* the environment
            is local or testing, so the developer affordance for channels that
            do not really deliver cannot exist in production.
      additionalProperties: false
    GuestOtpChallengeEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - challenge
          properties:
            challenge:
              $ref: '#/components/schemas/GuestOtpChallenge'
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/Meta'
    PlaceGuestOrderRequest:
      type: object
      description: |
        The same body as the authenticated `POST /orders`. Nothing about money
        and nothing about the seller: the currency, the totals, the organisation
        and the channel are all decided at placement from the cart and the
        tariff standing at that moment. A body carrying a total would make the
        client the authority on what the kitchen charges.
      required:
        - cart_id
        - customer_address_id
      properties:
        cart_id:
          $ref: '#/components/schemas/Uuid'
        customer_address_id:
          $ref: '#/components/schemas/Uuid'
        delivery_window_code:
          type:
            - string
            - 'null'
          maxLength: 40
          description: The chosen slot, as the delivery window's own code.
        requested_delivery_date:
          type:
            - string
            - 'null'
          format: date
          description: |
            A plain date, never a datetime. The order stores a day; accepting an
            instant would invite a timezone argument nobody can win about which
            day `2026-08-02T23:30:00Z` is.
      additionalProperties: false
    GuestOrderStatus:
      type: string
      enum:
        - placed
        - confirmed
        - fulfilled
        - cancelled
    GuestOrderDelivery:
      type: object
      description: |
        Where the food goes, as it stood when the order was placed. The area
        name carries one server-chosen language; the free-text parts are the
        customer's own address, copied onto the order so a later edit to the
        address book cannot rewrite where a delivered order went.
      required:
        - label
        - line_one
        - line_two
        - city
        - area
        - window_code
        - requested_date
      properties:
        label:
          type:
            - string
            - 'null'
        line_one:
          type: string
        line_two:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        area:
          type:
            - string
            - 'null'
        window_code:
          type:
            - string
            - 'null'
        requested_date:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    GuestOrderLineAllergen:
      type: object
      description: |
        The frozen allergen statement, exactly as the customer was shown it.
        Never re-derived from the catalogue on read — a person told "contains
        sesame" must still be told it after the kitchen reformulates.
      required:
        - allergen_code
        - containment
      properties:
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
      additionalProperties: false
    GuestOrderLine:
      type: object
      description: |
        One article on the order, as it stood the moment the order was placed.
        `name` is **one** server-chosen language rather than a pair of columns
        (master plan v2 §4.8), and the price-list identifiers behind the amount
        are absent: they exist so "why was this the price?" is answerable a year
        later and they never leave the server.
      required:
        - id
        - catalogue_item_id
        - name
        - variant_label
        - quantity
        - unit_price_minor
        - line_total_minor
        - currency_code
        - allergens
        - pack_summary
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        variant_label:
          type:
            - string
            - 'null'
        quantity:
          type: string
          description: |
            A decimal string, not a number. `2.0000` survives a round trip
            through JSON and back into PostgreSQL's numeric; `2.0` does not
            reliably survive anything.
          examples:
            - '2.0000'
        unit_price_minor:
          type: integer
          minimum: 0
        line_total_minor:
          type: integer
          minimum: 0
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/GuestOrderLineAllergen'
        pack_summary:
          type:
            - object
            - 'null'
          additionalProperties: true
      additionalProperties: false
    GuestOrder:
      type: object
      description: |
        A guest's own order. Amounts are integers of minor units with the
        currency beside them and are never formatted server-side — `4500` with
        `AED`, never `"45.00 AED"` — because a server that formats money has
        decided a locale on the client's behalf and made the number unusable for
        arithmetic.

        `lock_version` is absent, and so is an `ETag`: a guest has no write
        surface on an order, so a validator would be a token for a request
        nobody can make. The seller's identifiers are absent too — naming the
        kitchen properly means a projection, and that shape already exists on
        the marketplace surface.
      required:
        - id
        - order_number
        - status
        - currency_code
        - subtotal_minor
        - delivery_fee_minor
        - total_minor
        - payment_method
        - delivery
        - placed_at
        - confirmed_at
        - cancelled_at
        - cancellation_reason
        - lines
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_number:
          type: string
          description: The reference a person quotes on the telephone.
        status:
          $ref: '#/components/schemas/GuestOrderStatus'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        subtotal_minor:
          type: integer
          minimum: 0
        delivery_fee_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Null is a value: nobody decided a fee for this zone. Never
            flattened to `0`, which would say delivery is free.
        total_minor:
          type: integer
          minimum: 0
        payment_method:
          type: string
          enum:
            - cash_on_delivery
          description: |
            One case, and no reserved others: a reserved case is a value
            something eventually writes.
        delivery:
          $ref: '#/components/schemas/GuestOrderDelivery'
        placed_at:
          type: string
          format: date-time
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        cancellation_reason:
          type:
            - string
            - 'null'
          enum:
            - customer_requested
            - kitchen_unable_to_fulfil
            - delivery_unavailable
            - address_unreachable
            - null
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GuestOrderLine'
      additionalProperties: false
    GuestOrderEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - order
          properties:
            order:
              $ref: '#/components/schemas/GuestOrder'
          additionalProperties: false
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                replayed:
                  type: boolean
                  description: |
                    True when this envelope is an idempotent replay of a
                    placement that already happened. Present on
                    `POST /guest/orders` only.
    GuestConversionEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - customer_account
          properties:
            customer_account:
              $ref: '#/components/schemas/GuestCustomerAccount'
          additionalProperties: false
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - guest_token_revoked
              properties:
                guest_token_revoked:
                  type: boolean
                  const: true
                  description: |
                    The `X-Guest-Token` used to reach this endpoint stopped
                    working with this response. Stated in the body so a client
                    does not discover it as a `401` on its next request.
    RequestGuestDeletionRequest:
      type: object
      required:
        - channel
        - value
      properties:
        channel:
          $ref: '#/components/schemas/GuestContactChannel'
        value:
          type: string
          maxLength: 255
        delivery_channel:
          $ref: '#/components/schemas/GuestOtpDeliveryChannel'
      additionalProperties: false
    ConfirmGuestDeletionRequest:
      type: object
      description: |
        The address is submitted again rather than carried in a challenge
        identifier from step one, because step one has none to give: a nullable
        identifier is a boolean in disguise, and the boolean is "this address is
        known to us".
      required:
        - channel
        - value
        - code
      properties:
        channel:
          $ref: '#/components/schemas/GuestContactChannel'
        value:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 16
      additionalProperties: false
    GuestDeletionAcknowledgement:
      type: object
      description: |
        The same answer whether or not there is anything to delete. Every field
        is derived from the request: the mask comes from the value just
        submitted, and the two remaining fields come from configuration.
      required:
        - accepted
        - destination_masked
        - verification_required
        - expires_in_seconds
      properties:
        accepted:
          type: boolean
          const: true
        destination_masked:
          type: string
          description: |
            Masked from the value the caller just submitted, so the echo needs
            no lookup and therefore cannot depend on one.
          examples:
            - n••••••••••@example.test
        verification_required:
          type: boolean
        expires_in_seconds:
          type: integer
          minimum: 30
      additionalProperties: false
    GuestPurgeReport:
      type: object
      description: |
        What the purge did — counts only, never identities. An erasure that
        recorded what it erased would have rebuilt in one place exactly what it
        removed from another.
      required:
        - contacts_deleted
        - addresses_deleted
        - challenges_deleted
        - sessions_deleted
        - suppressions_written
        - account_anonymised
        - orders_retained
      properties:
        contacts_deleted:
          type: integer
          minimum: 0
        addresses_deleted:
          type: integer
          minimum: 0
        challenges_deleted:
          type: integer
          minimum: 0
        sessions_deleted:
          type: integer
          minimum: 0
        suppressions_written:
          type: integer
          minimum: 0
          description: |
            The one thing an erasure is allowed to leave behind: a hash of each
            destination, so the next import does not silently re-add the person
            who asked to be forgotten.
        account_anonymised:
          type: boolean
        orders_retained:
          type: integer
          minimum: 0
          description: |
            How many order records this purge deliberately left alone. A guest
            order is a commercial and tax record with a statutory retention of
            its own; saying so is what stops "purged" being read as "everything
            is gone".
      additionalProperties: false
    GuestDeletionOutcome:
      type: object
      description: |
        One indistinguishable shape for every refusal — a wrong code, any code
        against an unknown address, an expired challenge, a locked-out contact
        — and the report only for a caller who has proven they hold the
        destination.
      required:
        - accepted
        - purged
      properties:
        accepted:
          type: boolean
          const: true
        purged:
          type: boolean
        report:
          $ref: '#/components/schemas/GuestPurgeReport'
      additionalProperties: false
    OtpPurpose:
      type: string
      enum:
        - contact_verification
        - guest_order
        - guest_deletion
        - closure_step_up
        - payment_details_step_up
        - b2b_signatory
      description: |
        What a passcode is being asked for. The vocabulary is complete rather
        than grown per phase, because a purpose scopes the one-live-challenge
        index and is what a step-up consumer checks before honouring a
        verification — a code obtained for a harmless purpose must not be
        replayable against a dangerous one.
    StepUpPurpose:
      type: string
      enum:
        - closure_step_up
        - payment_details_step_up
      description: |
        The purposes that grant an `otp` step-up. Contact verification is
        deliberately absent: a code proving somebody holds an address must never
        unlock a payment change.
    OtpDeliveryChannel:
      type: string
      enum:
        - email
        - sms
        - whatsapp
      description: |
        How a passcode travels. Distinct from a contact point's `channel`: an
        email address has one way to reach it, a phone number has three, and
        which is used is a property of the message rather than of the number.
    OtpChallengeState:
      type: string
      enum:
        - pending
        - verified
        - expired
        - failed
        - superseded
      description: |
        The stored lifecycle of a challenge. Not sufficient on its own — expiry
        is a moment rather than an event, so a row stays `pending` past its
        window until something writes the transition. Read `is_live` instead.
    OtpAvailableChannel:
      type: object
      required:
        - channel
        - simulated
      properties:
        channel:
          $ref: '#/components/schemas/OtpDeliveryChannel'
        simulated:
          type: boolean
          description: |
            The driver writes to a log rather than delivering. Never true
            outside local and testing, so a production client can offer every
            listed channel without checking.
    OtpChallengeResult:
      type: object
      required:
        - challenge_id
        - purpose
        - channel
        - destination_masked
        - expires_at
        - resend_available_at
        - resend_cooldown_seconds
        - attempts_remaining
        - resends_remaining
        - available_channels
        - simulated
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          $ref: '#/components/schemas/OtpDeliveryChannel'
        destination_masked:
          type: string
          description: |
            **Server-authored.** The client never sees the address, so it cannot
            mask it — and a client-side mask of a value the client was given
            would mean the value was given.
          examples:
            - a•••@example.com
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time
          description: |
            When the resend button unlocks. Sent as an instant rather than left
            to the client to compute, because a client using its own clock gets
            it wrong for exactly the users whose clocks are wrong.
        resend_cooldown_seconds:
          type: integer
          minimum: 0
        attempts_remaining:
          type: integer
          minimum: 0
          description: |
            "2 tries left" is the difference between a person retyping carefully
            and a person locked out without warning.
        resends_remaining:
          type: integer
          minimum: 0
        available_channels:
          type: array
          description: What "try another way" may offer.
          items:
            $ref: '#/components/schemas/OtpAvailableChannel'
        simulated:
          type: boolean
        debug_code:
          type: string
          description: |
            The plaintext passcode. Present **only** when
            `verification.otp.expose_codes` is set *and* the environment is
            local or testing, so the developer affordance for channels that do
            not really deliver cannot exist in production. Never present on a
            deployed environment.
      description: |
        What a caller learns when a challenge is issued or resent. Every field
        exists because a screen cannot be built without it.
    OtpChallengeEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - challenge
          properties:
            challenge:
              $ref: '#/components/schemas/OtpChallengeResult'
        meta:
          $ref: '#/components/schemas/Meta'
    VerificationChallenge:
      type: object
      required:
        - challenge_id
        - purpose
        - channel
        - destination_masked
        - status
        - is_live
        - attempts_remaining
        - resends_remaining
        - expires_at
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          $ref: '#/components/schemas/OtpDeliveryChannel'
        destination_masked:
          type: string
          examples:
            - a•••@example.com
        status:
          $ref: '#/components/schemas/OtpChallengeState'
        is_live:
          type: boolean
          description: |
            Still `pending` **and** still inside its window. The field a client
            branches on; `status` alone would offer an attempt that cannot
            succeed.
        attempts_remaining:
          type: integer
          minimum: 0
        resends_remaining:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type:
            - string
            - 'null'
          format: date-time
        last_sent_at:
          type:
            - string
            - 'null'
          format: date-time
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
      description: |
        A challenge's state. Carries no passcode and no derivative of one — every
        field is drawn from columns that outlive the request.
    VerificationChallengeEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - challenge
          properties:
            challenge:
              $ref: '#/components/schemas/VerificationChallenge'
        meta:
          $ref: '#/components/schemas/Meta'
    VerifiedContact:
      type: object
      required:
        - id
        - channel
        - destination_masked
        - is_primary
        - is_login_identity
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        channel:
          $ref: '#/components/schemas/ContactChannel'
        destination_masked:
          type: string
          description: |
            Taken from the challenge rather than recomputed: the challenge
            recorded what the person was shown when the code was sent, and
            answering with anything else would tell them a code went somewhere
            it did not.
          examples:
            - a•••@example.com
        is_primary:
          type: boolean
        is_login_identity:
          type: boolean
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
    ContactVerifiedEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - verified
            - contact
          properties:
            verified:
              type: boolean
              const: true
              description: |
                Always `true` when this envelope is served. Every other outcome
                is an error with its own `otp.*` code, because the remedies
                differ and a boolean cannot carry them.
            contact:
              $ref: '#/components/schemas/VerifiedContact'
        meta:
          $ref: '#/components/schemas/Meta'
    StepUpConfirmationEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - confirmed
            - method
            - expires_in_seconds
          properties:
            confirmed:
              type: boolean
              const: true
            method:
              type: string
              const: otp
              description: |
                Never `password`. The two methods are tracked separately and
                neither satisfies the other — a shared flag would mean a
                password confirmation silently unlocking a passcode-gated
                action, defeating the only reason to ask for a passcode.
            expires_in_seconds:
              type: integer
              minimum: 1
              description: |
                Much shorter than a password confirmation's, because the
                assurance is about the present moment rather than a secret the
                person knows: a passcode confirmed at breakfast says nothing
                about who is at the keyboard after lunch.
        meta:
          $ref: '#/components/schemas/Meta'
    SubmitPasscodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{4,10}$
          description: |
            A **string** of digits, never a number. Leading zeros are half the
            reason the generator pads them: `012345` cast to an integer becomes
            a different code, and throwing a tenth of a million-wide keyspace
            away at the parsing layer is not a rounding error.
          examples:
            - '012345'
    ResendChallengeRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/OtpDeliveryChannel'
      description: |
        `channel` is optional and its absence means "the same way as last time"
        rather than "the default for this contact" — somebody who chose WhatsApp
        once should not be quietly moved back to SMS by pressing resend.
    StepUpChallengeRequest:
      type: object
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/StepUpPurpose'
      description: |
        No `channel`. A step-up goes to the destination the account has already
        proven, and letting the caller pick the transport for a challenge that
        unlocks account closure would hand an attacker the one decision the
        server should be making.
    ConfirmStepUpRequest:
      type: object
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,10}$
          examples:
            - '012345'
      description: |
        The challenge is named in the body rather than in the path, unlike every
        other verification endpoint: a client that has just been refused with
        `auth.step_up_required` holds an identifier and a code, not a resource it
        is navigating to.
    ContactChannel:
      type: string
      enum:
        - email
        - phone
      description: |
        The kind of destination a contact point names — deliberately not the
        transport. Modelling it as `sms | whatsapp | email` would mean storing
        the same number twice and asking a customer to verify it twice.
    CustomerAccountStatus:
      type: string
      enum:
        - provisional
        - active
        - suspended
        - closed
      description: |
        `provisional` is a real state rather than a nicer word for incomplete:
        an account in it exists, holds addresses and declarations, and cannot
        order — which is what lets onboarding be interrupted and resumed.
        `active` is the activation evaluator's verdict made durable; nothing
        else writes it. Closure is terminal.
    CustomerAccountChecklistItem:
      type: object
      required:
        - code
        - satisfied
        - required
      properties:
        code:
          type: string
          enum:
            - account.email_unverified
            - account.phone_unverified
            - account.no_served_address
            - account.dietary_declaration_missing
            - account.consents_outstanding
        satisfied:
          type: boolean
        required:
          type: boolean
          description: |
            `account.phone_unverified` is **not** required by default. Demanding
            a proven phone while the SMS driver writes to a log file would lock
            every real customer out of their own account, so the requirement is
            configuration plus the existence of a channel that really delivers.
      description: |
        One requirement, met or not, in a stable order. Distinct from
        `outstanding` because a checklist showing only what is missing loses the
        sense of progress that makes people finish it — and because "phone
        verification is not required here" is itself something the screen has to
        be able to say.
    CustomerAccountOutstandingReason:
      type: object
      required:
        - code
        - context
      properties:
        code:
          type: string
          examples:
            - account.no_served_address
        context:
          type: object
          additionalProperties: true
          description: |
            Structured detail the screen needs. `account.no_served_address`
            carries `has_address`, because "add an address" and "we do not
            deliver there yet" need different words.
          examples:
            - has_address: true
    CustomerAccount:
      type: object
      required:
        - id
        - account_number
        - account_type
        - status
        - origin
        - is_ready
        - outstanding
        - checklist
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_number:
          type: string
          description: |
            `Confidential` on the record and served anyway, because this shape
            reaches only the person the number belongs to — it is what they
            quote to support.
        account_type:
          type: string
          enum:
            - b2c
            - b2b
            - guest
        status:
          $ref: '#/components/schemas/CustomerAccountStatus'
        origin:
          type: string
          enum:
            - self_service
            - guest
            - b2b_provisioning
            - staff
            - import
        display_name:
          type:
            - string
            - 'null'
        preferred_language_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        is_ready:
          type: boolean
          description: |
            Nothing is outstanding. Not the same as `status == active`: an
            account can be ready and still provisional for as long as it takes
            the activation attempt to run.
        outstanding:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountOutstandingReason'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountChecklistItem'
        activated_at:
          type:
            - string
            - 'null'
          format: date-time
        provisional_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Stamped at creation and never recomputed — an account opened under a
            thirty-day window must not silently acquire a shorter one when the
            setting changes. Coming back resets nothing but does protect the
            account from the abandonment purge.
        last_activity_at:
          type:
            - string
            - 'null'
          format: date-time
        lock_version:
          type: integer
          minimum: 0
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    CustomerAccountEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - account
          properties:
            account:
              $ref: '#/components/schemas/CustomerAccount'
        meta:
          $ref: '#/components/schemas/Meta'
    CustomerContact:
      type: object
      required:
        - id
        - channel
        - value
        - is_login_identity
        - is_primary
        - is_verified
        - source
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        channel:
          $ref: '#/components/schemas/ContactChannel'
        value:
          type: string
          description: |
            The canonical form — lowercased for an address, E.164 for a number —
            served **in the clear**, because the audience is the person who
            typed it and a masked address book is one on which nobody can tell
            which number is the old one.
        label:
          type:
            - string
            - 'null'
        is_login_identity:
          type: boolean
          description: |
            The notification mirror of `users.email`. Cannot be retired: an
            account whose only route back in has been withdrawn is one nobody
            can recover.
        is_primary:
          type: boolean
        is_verified:
          type: boolean
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
        source:
          type: string
          examples:
            - self_service
            - registration
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    CustomerContactEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - contact
          properties:
            contact:
              $ref: '#/components/schemas/CustomerContact'
        meta:
          $ref: '#/components/schemas/Meta'
    CustomerContactsEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerContact'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - count
              properties:
                count:
                  type: integer
                  minimum: 0
    AddCustomerContactRequest:
      type: object
      required:
        - channel
        - value
      properties:
        channel:
          $ref: '#/components/schemas/ContactChannel'
        value:
          type: string
          maxLength: 255
          description: |
            An email address, or a phone number **already in E.164**. The
            platform does not infer a country code: guessing one would send
            somebody else's handset a passcode that unlocks this account.
          examples:
            - '+96170123456'
        label:
          type:
            - string
            - 'null'
          maxLength: 60
        is_primary:
          type:
            - boolean
            - 'null'
      description: |
        `is_login_identity` and `verified_at` are absent by construction. The
        login mirror is written once, at registration; and a contact one may
        declare proven is a contact nobody has proven.
    CustomerAddressType:
      type: string
      enum:
        - delivery
        - billing
      description: |
        Only `delivery` is checked against the served areas. An invoice goes
        wherever the customer says.
    CustomerAddress:
      type: object
      required:
        - id
        - address_type
        - delivery_area_id
        - line_one
        - is_default
        - is_deliverable
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        address_type:
          $ref: '#/components/schemas/CustomerAddressType'
        delivery_area_id:
          $ref: '#/components/schemas/Uuid'
        label:
          type:
            - string
            - 'null'
        line_one:
          type: string
        line_two:
          type:
            - string
            - 'null'
        building:
          type:
            - string
            - 'null'
        floor:
          type:
            - string
            - 'null'
        apartment:
          type:
            - string
            - 'null'
        directions:
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        contact_point_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The number a driver calls, when it is not the primary one.
        is_default:
          type: boolean
        is_deliverable:
          type: boolean
          description: |
            Whether anybody serves this area **today**, recomputed on every read.
            Not the same as "was accepted": a zone can be paused after an address
            was saved, and a book that showed only what was true at save time
            would let somebody choose an address nothing can be sent to.
        lock_version:
          type: integer
          minimum: 0
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    CustomerAddressEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - address
          properties:
            address:
              $ref: '#/components/schemas/CustomerAddress'
        meta:
          $ref: '#/components/schemas/Meta'
    CustomerAddressesEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAddress'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - count
              properties:
                count:
                  type: integer
                  minimum: 0
    AddCustomerAddressRequest:
      type: object
      required:
        - address_type
        - delivery_area_id
        - line_one
      properties:
        address_type:
          $ref: '#/components/schemas/CustomerAddressType'
        delivery_area_id:
          $ref: '#/components/schemas/Uuid'
        label:
          type:
            - string
            - 'null'
          maxLength: 60
        line_one:
          type: string
          maxLength: 255
        line_two:
          type:
            - string
            - 'null'
          maxLength: 255
        building:
          type:
            - string
            - 'null'
          maxLength: 120
        floor:
          type:
            - string
            - 'null'
          maxLength: 40
        apartment:
          type:
            - string
            - 'null'
          maxLength: 40
        directions:
          type:
            - string
            - 'null'
          maxLength: 1000
        postal_code:
          type:
            - string
            - 'null'
          maxLength: 20
        contact_point_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_default:
          type:
            - boolean
            - 'null'
          description: |
            The first address of a type becomes the default whether or not this
            is set. An address book with no default makes the checkout ask a
            question that has one possible answer.
    UpdateCustomerAddressRequest:
      type: object
      properties:
        delivery_area_id:
          $ref: '#/components/schemas/Uuid'
        label:
          type:
            - string
            - 'null'
          maxLength: 60
        line_one:
          type: string
          maxLength: 255
        line_two:
          type:
            - string
            - 'null'
          maxLength: 255
        building:
          type:
            - string
            - 'null'
          maxLength: 120
        floor:
          type:
            - string
            - 'null'
          maxLength: 40
        apartment:
          type:
            - string
            - 'null'
          maxLength: 40
        directions:
          type:
            - string
            - 'null'
          maxLength: 1000
        postal_code:
          type:
            - string
            - 'null'
          maxLength: 20
        contact_point_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
      description: |
        `address_type` and `is_default` are absent, and both would be quietly
        wrong rather than merely unsupported — see the operation description.
    AllergenSeverity:
      type: string
      enum:
        - avoidance
        - intolerance
        - allergy
        - anaphylaxis
      description: |
        How badly this person reacts. `avoidance` is a preference;
        `anaphylaxis` excludes traces, and a kitchen reads the difference.
    FoodExclusionKind:
      type: string
      enum:
        - dislike
        - forbidden
      description: |
        `forbidden` is frequently a belief rather than a preference, which is
        why an exclusion is handled as carefully as an allergy even though
        nobody's airway depends on it.
    CustomerAllergenDeclaration:
      type: object
      required:
        - allergen_code
        - severity
        - declared_at
      properties:
        allergen_code:
          type: string
          examples:
            - sesame
        severity:
          $ref: '#/components/schemas/AllergenSeverity'
        notes:
          type:
            - string
            - 'null'
        declared_at:
          type: string
          format: date-time
      description: |
        Carries no identifier of its own. The set is replaced whole on every
        write, so a row id would be a handle onto something that does not
        survive the next `PUT`; the allergen code is the identity that matters.
    CustomerFoodExclusion:
      type: object
      required:
        - id
        - kind
        - subject_kind
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/FoodExclusionKind'
        subject_kind:
          type: string
          enum:
            - ingredient
            - diet_classification
            - free_text
          description: |
            Which of the three columns is the one to read, so a client can render
            an exclusion without inspecting all three and guessing.
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        diet_classification_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        free_text:
          type:
            - string
            - 'null'
    CustomerDietaryProfile:
      type: object
      required:
        - has_declared
        - declares_no_allergens
        - allergens
        - exclusions
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null when nothing has ever been written.
        has_declared:
          type: boolean
          description: |
            **The field to branch on.** An unanswered question and a confident
            "I have none" are different facts, and only the second may activate
            an account that is about to be sent food.
        declared_at:
          type:
            - string
            - 'null'
          format: date-time
        declares_no_allergens:
          type: boolean
        diet_classification_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        religious_requirement:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAllergenDeclaration'
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/CustomerFoodExclusion'
        lock_version:
          type:
            - integer
            - 'null'
          minimum: 0
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    CustomerDietaryProfileEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - dietary_profile
          properties:
            dietary_profile:
              $ref: '#/components/schemas/CustomerDietaryProfile'
        meta:
          $ref: '#/components/schemas/Meta'
    ReplaceDietaryProfileRequest:
      type: object
      required:
        - allergens
      properties:
        allergens:
          type: array
          maxItems: 60
          description: |
            **Required even when empty.** An omitted key and an empty array would
            otherwise mean the same thing on the wire and different things to the
            person.
          items:
            type: object
            required:
              - allergen_code
            properties:
              allergen_code:
                type: string
                maxLength: 60
              severity:
                $ref: '#/components/schemas/AllergenSeverity'
              notes:
                type:
                  - string
                  - 'null'
                maxLength: 500
        exclusions:
          type: array
          maxItems: 100
          items:
            type: object
            description: |
              Must name **exactly one** of `ingredient_id`,
              `diet_classification_id` or `free_text`. Naming two or none is
              `validation.failed` on the offending index.
            properties:
              kind:
                $ref: '#/components/schemas/FoodExclusionKind'
              ingredient_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              diet_classification_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              free_text:
                type:
                  - string
                  - 'null'
                maxLength: 200
        diet_classification_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        religious_requirement:
          type:
            - string
            - 'null'
          maxLength: 120
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
    CustomerConsent:
      type: object
      required:
        - code
        - version
        - purpose
        - audience
        - is_required
        - status
        - display_order
      properties:
        code:
          type: string
          examples:
            - consent.marketing
        version:
          type: integer
          minimum: 1
        purpose:
          type: string
          examples:
            - marketing
        audience:
          type: string
          enum:
            - all
            - d2c
          description: |
            `all` is what everybody accepts; `d2c` is written for consumers.
            Without the filter this surface would start asking a kitchen's chef
            to confirm they are old enough to order food.
        is_required:
          type: boolean
          description: |
            Read from the consent catalogue rather than hard-coded, so a new
            required text takes effect by being seeded. A required consent still
            blocks activation when withdrawn — and may still be withdrawn.
        status:
          type: string
          enum:
            - granted
            - pending
          description: |
            Computed against **this** version. A code granted at version 1 is
            `pending` again once version 2 is published, because a status
            computed from the code alone would report somebody as having
            accepted words they have never seen.
        display_order:
          type: integer
          minimum: 0
    CustomerConsentsEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerConsent'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - count
              properties:
                count:
                  type: integer
                  minimum: 0
    GrantConsentsRequest:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
            maxLength: 80
          examples:
            - - consent.marketing
              - consent.health_data_processing
      description: |
        No version. A grant is written against the current version of each
        definition, read at the moment of writing — a body that named one could
        accept a text that has since been reissued.
    B2bApplicationStatus:
      type: string
      description: |
        The seven states a B2B application passes through.

        `info_requested` is not a rejection and not a pause: it hands editing
        rights back for named sections while the application keeps its place
        in the queue, which is what lets a status panel say "we need two
        things from you" instead of the same "under review" it showed
        yesterday.

        `withdrawn` is the applicant's exit and `declined` is the platform's.
        Collapsing them would make "how many did we turn down" unanswerable.
      enum:
        - draft
        - submitted
        - in_review
        - info_requested
        - approved
        - declined
        - withdrawn
    B2bApplicationSection:
      type: string
      description: |
        The field group a wizard step writes. A section is the unit of
        writing: a PATCH names one and carries only its fields, and anything
        else is refused with the name of the section that owns it.

        Documents are deliberately **not** a section — they have their own
        lifecycle and their own review, and folding them in would put a PATCH
        of a text box and an upload of a passport on one code path.
      enum:
        - company
        - signatory
        - trade_terms
        - logistics
    B2bApplicationContactRole:
      type: string
      description: |
        The four people an applicant company names, one per slot.

        `signatory` overlaps the `signatory_*` fields on the application and
        that is not duplication: the fields are the *declaration* about who
        can bind the company, and the contact row is where to reach that
        person about the paperwork. A company whose chief executive signs and
        whose office manager chases the emails has one of each.
      enum:
        - primary
        - billing
        - operations
        - signatory
    B2bPaymentTerms:
      type: string
      description: |
        How long a corporate buyer has to pay. The same vocabulary appears on
        the application (what was *asked for*) and on the agreement (what was
        *granted*), because the whole point of the review is to compare them.

        **Recorded, not enforced.** No invoicing exists — PAY1 is
        discovery-gated — so nothing in the platform will chase a net-30
        balance, and no surface may imply otherwise.
      enum:
        - prepaid
        - net_15
        - net_30
        - net_60
    B2bDocumentKind:
      type: string
      description: |
        What a document is supposed to prove. Two kinds are required before an
        application may be submitted — `commercial_registration` and
        `signatory_identification` — because one says the company exists and
        the other says the signatory is a real person who can be held to what
        they sign. Everything else is asked for when the case calls for it.

        `signed_agreement` is produced by the signing flow and is **not**
        accepted from a client: an applicant supplying their own idea of what
        they signed is the one document that must never be self-asserted.

        `other` exists because reviewers ask for things nobody anticipated,
        and the alternative is an applicant mislabelling a document.
      enum:
        - commercial_registration
        - tax_certificate
        - trade_licence
        - signatory_identification
        - authorisation_letter
        - proof_of_address
        - food_safety_certificate
        - insurance_certificate
        - signed_agreement
        - other
    KycDocumentReviewStatus:
      type: string
      description: |
        A human's verdict on a document. `superseded` is not a verdict anybody
        gives — it is what happens to an accepted document when a newer one of
        the same kind replaces it, so the earlier decision trail survives a
        re-upload.
      enum:
        - pending
        - accepted
        - rejected
        - superseded
    KycDocumentRejectionReason:
      type: string
      description: |
        Why a reviewer turned a document down. A closed vocabulary rather than
        free text, because this is the half of a rejection the applicant is
        shown and "please re-upload, it was illegible" is actionable in a way
        a reviewer's internal note is not.
      enum:
        - unreadable
        - wrong_document
        - expired
        - incomplete
        - mismatch
        - other
    KycDocumentScanStatus:
      type: string
      description: |
        Whether anything has looked inside the file for malware. **Every
        document B1 stores is `not_scanned`**, and this field exists so that
        fact is in the data rather than only in a risk register.

        Sniffing the leading bytes proves a PDF is a PDF; it proves nothing
        about what the PDF contains. `clean` and `infected` are declared and
        unreachable in this phase, and nothing may present a document as safe
        until a scanner fills them in (INT-008).
      enum:
        - not_scanned
        - clean
        - infected
    B2bAgreementStatus:
      type: string
      description: |
        `draft → pending_signature → active → suspended ⇄ active →
        terminated`.

        The transition that is *not* here is any route back into `draft` once
        terms have been put in front of a counterparty. Changing what somebody
        was asked to sign, in place, is the failure this vocabulary is shaped
        against; the supported move is a new version that supersedes the old.

        `suspended` is reversible and `terminated` is not.
      enum:
        - draft
        - pending_signature
        - active
        - suspended
        - terminated
    OrganisationInvitationStatus:
      type: string
      description: |
        **Derived, never stored.** `accepted_at`, `revoked_at` and
        `expires_at` are already on the row, and a status column would be a
        fourth copy that has to be kept in step with a clock — expiry being
        the first thing to drift.
      enum:
        - live
        - accepted
        - revoked
        - expired
    B2bApplication:
      type: object
      description: |
        A company's request to become a corporate buyer, as the applicant sees
        it.

        `completed_sections` is the applicant's own **claim** about their
        progress and is never consulted by the submission gate; the server's
        definition of complete arrives as `missing_fields` /
        `missing_documents` on the refusal. A surface that treated the claim
        as the answer would show a green wizard next to a 422.

        `writable_sections` is computed. In `info_requested` it is the
        reviewer's narrowing rather than the whole form.
      required:
        - id
        - reference
        - status
        - applicant_user_id
        - completed_sections
        - writable_sections
        - requires_invoice_per_location
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
          description: The code a person reads down a phone line.
          examples:
            - B2B-2026-7F3A9C21
        status:
          $ref: '#/components/schemas/B2bApplicationStatus'
        applicant_user_id:
          $ref: '#/components/schemas/Uuid'
        legal_name:
          type:
            - string
            - 'null'
        legal_name_ar:
          type:
            - string
            - 'null'
        trading_name:
          type:
            - string
            - 'null'
        business_type:
          type:
            - string
            - 'null'
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        commercial_registration_number:
          type:
            - string
            - 'null'
        tax_registration_number:
          type:
            - string
            - 'null'
        incorporated_on:
          type:
            - string
            - 'null'
          format: date
        website:
          type:
            - string
            - 'null'
        signatory_name:
          type:
            - string
            - 'null'
        signatory_title:
          type:
            - string
            - 'null'
        signatory_email:
          type:
            - string
            - 'null'
          format: email
          description: |
            The address the company says can bind it. The signature challenge
            requires the authenticated caller to hold this same address.
        signatory_phone:
          type:
            - string
            - 'null'
        requested_payment_terms:
          oneOf:
            - $ref: '#/components/schemas/B2bPaymentTerms'
            - type: 'null'
        requested_credit_limit_minor:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Minor units of `currency_code`. **Null is a value**: an applicant
            asking for nothing is asking to pay up front, which is a complete
            answer and why this is not required at submission.
        currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
        expected_volume_band:
          type:
            - string
            - 'null'
        expected_order_frequency:
          type:
            - string
            - 'null'
        product_categories:
          type: array
          items:
            type: string
        preferred_delivery_window:
          type:
            - string
            - 'null'
        lead_time_days:
          type:
            - integer
            - 'null'
          minimum: 0
        requires_invoice_per_location:
          type: boolean
        delivery_notes:
          type:
            - string
            - 'null'
        completed_sections:
          type: array
          items:
            $ref: '#/components/schemas/B2bApplicationSection'
        writable_sections:
          type: array
          items:
            $ref: '#/components/schemas/B2bApplicationSection'
        information_request:
          type:
            - string
            - 'null'
          description: What the reviewer asked for, verbatim. The applicant reads this.
        information_requested_sections:
          type: array
          items:
            $ref: '#/components/schemas/B2bApplicationSection'
        information_requested_at:
          type:
            - string
            - 'null'
          format: date-time
        applicant_message:
          type:
            - string
            - 'null'
          description: The half of a verdict the applicant is shown. Required on a decline.
        submitted_at:
          type:
            - string
            - 'null'
          format: date-time
        review_started_at:
          type:
            - string
            - 'null'
          format: date-time
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
        withdrawn_at:
          type:
            - string
            - 'null'
          format: date-time
        provisioned_organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null until the approval has been provisioned. Moves together with `customer_account_id` — a CHECK says so.
        customer_account_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        lock_version:
          type: integer
          minimum: 0
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    B2bApplicationReview:
      description: |
        The reviewer's view: everything the applicant sees, plus the internal
        half of the decision. `decision_note` never reaches the applicant —
        "we were not comfortable with the credit history" and "we are unable
        to approve your application at this time" can both be true, and only
        one of them travels.
      allOf:
        - $ref: '#/components/schemas/B2bApplication'
        - type: object
          properties:
            decision_note:
              type:
                - string
                - 'null'
              description: The reviewer's own record of why. Internal, always.
            reviewed_by:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            duplicate_of_application_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
              description: Set only by a human confirming that two applications are the same company.
    B2bApplicationSummary:
      type: object
      description: |
        The list row. Deliberately thin: a queue answers "which of these do I
        open next", and every confidential field carried in a list is a field
        displayed on a screen somebody walks past.
      required:
        - id
        - reference
        - status
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/B2bApplicationStatus'
        legal_name:
          type:
            - string
            - 'null'
        trading_name:
          type:
            - string
            - 'null'
        country_code:
          type:
            - string
            - 'null'
        submitted_at:
          type:
            - string
            - 'null'
          format: date-time
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
        reviewed_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        lock_version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    B2bApplicationContact:
      type: object
      description: |
        A person the applicant company named. **Transcribed paperwork, not a
        verified destination** — nothing here has been proved, which is why
        these are not contact points.
      required:
        - id
        - role
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/B2bApplicationContactRole'
        name:
          type: string
          maxLength: 160
        title:
          type:
            - string
            - 'null'
          maxLength: 120
        email:
          type:
            - string
            - 'null'
          format: email
        phone:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
    B2bApplicationLocation:
      type: object
      description: Somewhere the company wants food delivered, anchored to the platform gazetteer where the gazetteer covers it.
      required:
        - id
        - label
        - address_line1
        - is_primary
        - is_billing_address
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
          maxLength: 120
        delivery_area_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        address_line1:
          type: string
        address_line2:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        contact_name:
          type:
            - string
            - 'null'
        contact_phone:
          type:
            - string
            - 'null'
        delivery_notes:
          type:
            - string
            - 'null'
        is_primary:
          type: boolean
        is_billing_address:
          type: boolean
        expected_headcount:
          type:
            - integer
            - 'null'
          minimum: 1
    KycDocument:
      type: object
      description: |
        An identity, registration or licensing document — **metadata only**.
        There is no `url`, no `disk` and no `path` here and there never may
        be: the only route to the bytes is a short-lived signed link that
        expires and records who asked and why.

        `media_type_mismatch` is stated rather than left for a client to
        compute, because the difference between what the uploader claimed and
        what the bytes are is evidence.
      required:
        - id
        - document_kind
        - original_filename
        - mime_type
        - media_type_mismatch
        - byte_size
        - sha256
        - scan_status
        - review_status
        - uploaded_at
        - has_expired
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        document_kind:
          $ref: '#/components/schemas/B2bDocumentKind'
        original_filename:
          type: string
          description: Kept for a human to read. Never used to locate the object.
        mime_type:
          type: string
          description: What the leading bytes actually are — never the client's claim.
        declared_mime_type:
          type:
            - string
            - 'null'
          description: What the client said. Kept because a mismatch is evidence.
        media_type_mismatch:
          type: boolean
        byte_size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: What an agreement's signature evidence names.
        scan_status:
          $ref: '#/components/schemas/KycDocumentScanStatus'
        review_status:
          $ref: '#/components/schemas/KycDocumentReviewStatus'
        rejection_reason:
          oneOf:
            - $ref: '#/components/schemas/KycDocumentRejectionReason'
            - type: 'null'
        reviewed_at:
          type:
            - string
            - 'null'
          format: date-time
        uploaded_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        uploaded_at:
          type: string
          format: date-time
        expires_on:
          type:
            - string
            - 'null'
          format: date
        has_expired:
          type: boolean
    KycDocumentReview:
      description: |
        The platform shape: the same document plus the reviewer's private note
        and the retention deadline. `review_note` is internal and stays that
        way; `purge_after` is here rather than on the applicant shape because
        the retention window is a **placeholder** pending OQ-029, and showing
        an applicant a deadline the platform has not decided would present a
        guess as a commitment.
      allOf:
        - $ref: '#/components/schemas/KycDocument'
        - type: object
          properties:
            review_note:
              type:
                - string
                - 'null'
            reviewed_by:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            owner_kind:
              type: string
              enum:
                - user
                - b2b_application
                - organisation
            b2b_application_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            purge_after:
              type: string
              format: date-time
    KycDocumentDownload:
      type: object
      description: |
        A signed, expiring grant against object storage. Handed over as data
        rather than as a redirect so a client knows it holds a credential with
        a deadline — it can show the expiry, refresh before acting, and
        decline to cache it.
      required:
        - url
        - expires_at
      properties:
        url:
          type: string
          format: uri
          description: Treat as a secret. Do not log it, cache it or share it.
        expires_at:
          type: string
          format: date-time
          description: Computed before the signature is minted, so it is never later than the moment the link stops working.
    B2bAgreement:
      type: object
      description: |
        One version of the terms between the platform and a corporate buyer.

        The signature block is **evidence**: the digest of the bytes shown,
        the typed name, the stated capacity and the consent wording verbatim.
        What is absent is anything replayable — the hashed address and user
        agent stay server-side, and the passcode challenge is reduced to
        `signature_otp_verified`.

        **Never a qualified electronic signature.** This is a record that
        somebody clicked, with good evidence about who and when (INT-007
        covers real e-sign).

        Money is integers of minor units beside `currency_code`, never
        formatted.
      required:
        - id
        - b2b_application_id
        - version
        - status
        - title
        - auto_renews
        - signature_otp_verified
        - lock_version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        b2b_application_id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Stamped by provisioning. Null until the company is a tenant.
        version:
          type: integer
          minimum: 1
        supersedes_agreement_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/B2bAgreementStatus'
        title:
          type: string
        currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
        price_list_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Always a list whose `customer_scope` is `agreement`. Pointing an
            agreement at a public tariff would quietly publish a negotiated
            position.
        payment_terms:
          oneOf:
            - $ref: '#/components/schemas/B2bPaymentTerms'
            - type: 'null'
        credit_limit_minor:
          type:
            - integer
            - 'null'
          minimum: 0
        minimum_order_minor:
          type:
            - integer
            - 'null'
          minimum: 0
        delivery_lead_time_days:
          type:
            - integer
            - 'null'
          minimum: 0
        notice_period_days:
          type:
            - integer
            - 'null'
          minimum: 0
        starts_on:
          type:
            - string
            - 'null'
          format: date
        ends_on:
          type:
            - string
            - 'null'
          format: date
        auto_renews:
          type: boolean
        terms_summary:
          type:
            - string
            - 'null'
        signature_document_sha256:
          type:
            - string
            - 'null'
          pattern: ^[0-9a-f]{64}$
        signatory_name:
          type:
            - string
            - 'null'
        signatory_title:
          type:
            - string
            - 'null'
        signatory_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        signature_consent_statement:
          type:
            - string
            - 'null'
          description: The wording the signatory accepted, verbatim — not a version number pointing at copy somebody may later edit.
        signature_otp_verified:
          type: boolean
          description: |
            True exactly when a consumed `b2b_signatory` challenge belonging
            to the signatory is on file. Derived from the column, never from a
            caller's claim.
        signed_at:
          type:
            - string
            - 'null'
          format: date-time
        activated_at:
          type:
            - string
            - 'null'
          format: date-time
        suspended_at:
          type:
            - string
            - 'null'
          format: date-time
        terminated_at:
          type:
            - string
            - 'null'
