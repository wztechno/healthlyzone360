            application/json:
              schema:
                $ref: '#/components/schemas/PlanDurationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plan-vocabulary/durations/{duration}:
    patch:
      operationId: updatePlanDuration
      tags:
        - Subscription plans
      summary: Edit or withdraw a plan duration
      description: |
        Precondition-free, and `code` refused rather than ignored.

        The kind/days correspondence is applied to the **merged** row, so
        flipping a fixed run to `one_off` without also sending
        `duration_days: null` is `422` rather than a silent clearing: the two
        columns are one fact, and a client that changed half of it has stated a
        contradiction.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PlanDurationPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
