  /catalogue/recipes/{recipe}/versions/{version}/lines:
    put:
      operationId: replaceRecipeLines
      tags:
        - Recipes
      summary: Replace the lines of a version
      description: |
        A PUT because the body is the complete formulation. A PATCH surface
        would make "I removed the sesame line" and "I forgot to send the
        sesame line" the same request, and on a formulation that difference is
        the whole point. An empty `lines` array is a legitimate statement, not
        a missing field.

        `line_number` is not a field: the array order is the sequence, so a
        client never keeps numbering in step with an insertion. Duplicate
        ingredients are **allowed** — a sheet that adds olive oil to the
        marinade and again to the finish is two lines.

        `quantity` may be null while the version is unpublished: the
        sauces-and-dressings source lists typical ingredients with no amounts,
        and refusing to store that would mean fabricating numbers. The publish
        gate is where nullability ends.

        `If-Match` carries the **version's** `lock_version`, not a line's: the
        set is the unit of change.

        Requires `recipe.manage_organisation`.
