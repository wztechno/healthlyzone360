        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists/{priceList}:
    get:
      operationId: showPriceList
      tags:
        - Pricing
      summary: A price list and its channel assignments
      description: |
        Returns `ETag: "<lock_version>"` — the validator **every** write in
        this family sends back, entries and channel assignments included. A
        tariff's rows are one document even though they live in three tables,
        and two merchandisers repricing at once is the race the validator
        catches.

        Channel assignments come with it; the entries do not. A tariff runs to
        hundreds of rows and has its own cursor-paginated endpoint.

        `meta.entry_counts` says how many standing rows there are and how many
        of them are real prices — "312 priced, 8 owed" without paging.

        Requires `price_list.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The price list, with its channel assignments.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updatePriceList
      tags:
        - Pricing
      summary: Update a price list
      description: |
        `code` is **rejected**, not ignored: a client that sent it believed it
        was writing something.

        `currency_code` **is** accepted, and only while the list holds no price
        rows at all — history included. After that it is
        `409 resource.conflict` with `details.reason: currency_locked`, because
        changing it would silently re-denominate every amount in the list and
        cannot re-denominate the closed rows a past order points at. The answer
        is a new list, not a retry.

        `status` is absent (master plan v2 §4.15): activation and archiving are
        POST actions.

        `customer_scope` is editable — a tariff drafted as public that turns
        out to be one client's deal has to be reclassifiable — and every change
        lands in the audit trail naming both scopes.

        **`If-Match` required.** Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriceListRequest'
      responses:
        '200':
          description: The updated list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceListConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists/{priceList}/publish:
    post:
      operationId: publishPriceList
      tags:
        - Pricing
      summary: Activate a price list
      description: |
        Draft → active. Its own route and its own audit action, never a
        `PATCH status`.

        The gate is short, and what it does **not** check matters as much:
        placeholder and market-priced rows are welcome on an active list. A
        kitchen with forty confirmed prices and eight owed should trade on the
        forty; a gate that demanded a complete tariff would push somebody to
        invent the missing numbers. Keeping the unpriced rows away from a
        customer is the public projection's job.

        What it does check is that the list prices *something*: a tariff with
        no standing rows assigned to a live channel is a silent "nothing is for
        sale here" that looks identical to a working configuration.

        Gated by `catalogue.publish_organisation` rather than a pricing code of
        its own — activating a tariff is the same authority as deciding what is
        on sale, held by the same two roles.

        **`If-Match` required.**
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The activated list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceListPublishBlocked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists/{priceList}/archive:
    post:
      operationId: archivePriceList
      tags:
        - Pricing
      summary: Archive a price list
      description: |
        Refused while any channel still names the list —
        `409 resource.conflict` with `details.reason:
        channel_assignments_active` and the channels holding it. Detaching is
        the act that actually withdraws a tariff; archiving one a channel still
        quotes from would be a label that changed nothing.

        Nothing is deleted. Entries, history and supersession chains all
        survive, so an order placed last spring can still be explained. An
        archived list refuses every further edit.

        **`If-Match` required.** Gated by `catalogue.publish_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The archived list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceListConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists/{priceList}/entries:
    get:
      operationId: listPriceListEntries
      tags:
        - Pricing
      summary: The prices in a list
      description: |
        **Standing rows by default** — what the tariff says today, which is
        what a PUT will be diffed against. A default that returned history
        would make the obvious client (read, edit, put back) silently
        resurrect closed prices.

        `include_history=1` adds the closed rows and flips the ordering to
        **newest-first**: a history is read backwards from the most recent
        change, not paged to the end to find last week's price.

        Amounts are integers of minor units with `currency_code` repeated on
        every row — a row that travels into a table cell, a log line or an
        order snapshot must not arrive without its currency.

        Placeholder and market-priced rows are served **in full**, with their
        status and a null amount. This is the admin surface: the person whose
        job is to price the unpriced rows has to see which ones they are.

        Requires `price_list.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: include_history
          in: query
          required: false
          description: |
            `1`, `true` or `yes` includes closed rows and walks newest-first.
            Anything else — including `0` — means no.
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
              - 'yes'
              - 'no'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of price rows.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPriceListEntry'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                      - type: object
                        required:
                          - include_history
                          - currency_code
                          - entry_counts
                        properties:
                          include_history:
                            type: boolean
                          currency_code:
                            $ref: '#/components/schemas/CurrencyCode'
                          entry_counts:
                            $ref: '#/components/schemas/PriceListEntryCounts'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePriceListEntries
      tags:
        - Pricing
      summary: Replace the prices in a list
      description: |
        The body is the desired **current** pricing state — the whole tariff as
        it should stand after the call. The server works out what changed and
        writes the history:

        | submitted | standing | what happens |
        |---|---|---|
        | yes | no | a row opens, effective from today |
        | yes | yes, same amount and status | **nothing at all** |
        | yes | yes, different | the standing row closes and its replacement opens, linked by `superseded_by_id` |
        | no | yes | the standing row closes, with no successor |

        "Nothing at all" is load-bearing: a nightly importer reposting an
        unchanged sheet must not manufacture a supersession chain hundreds deep
        and destroy the ability to answer "when did this price actually
        change".

        A pricing point is `(catalogue_item_id, catalogue_item_variant_id,
        min_quantity)`. Stating one twice in a submission is `422`.

        There is no `effective_from`, no `effective_to` and no
        `superseded_by_id` in the body, deliberately: those are the server's
        account of when it was told, and a client that could write them could
        backdate a price change to before an order was taken.

        `unit_amount_minor` and `price_status` are **one fact**. A confirmed
        row must carry a positive integer; a placeholder or market-priced row
        must carry none. Both mismatches are `422` here and a CHECK constraint
        underneath, so no importer or backfill can produce them either.

        An empty `entries` array withdraws every price — closing each standing
        row rather than deleting it.

        **`If-Match` carries the price list's validator**, not a row's.
        Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceListEntriesRequest'
      responses:
        '200':
          description: The list and its standing rows after the write.
          headers:
