        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recipe_category:
          type:
            - string
            - 'null'
          maxLength: 40
        source_kind:
          type:
            - string
            - 'null'
          maxLength: 40
        confidentiality:
          $ref: '#/components/schemas/RecipeConfidentiality'
