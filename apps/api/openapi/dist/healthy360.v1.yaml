  /catalogue/price-lists/{priceList}/entries:
    get:
      operationId: listPriceListEntries
      tags:
        - Pricing
      summary: The prices in a list
      description: |
        **Standing rows by default** — what the tariff says today, which is
        what a PUT will be diffed against. A default that returned history
        would make the obvious client (read, edit, put back) silently
        resurrect closed prices.

        `include_history=1` adds the closed rows and flips the ordering to
        **newest-first**: a history is read backwards from the most recent
        change, not paged to the end to find last week's price.

        Amounts are integers of minor units with `currency_code` repeated on
        every row — a row that travels into a table cell, a log line or an
        order snapshot must not arrive without its currency.

        Placeholder and market-priced rows are served **in full**, with their
        status and a null amount. This is the admin surface: the person whose
        job is to price the unpriced rows has to see which ones they are.

        Requires `price_list.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: include_history
          in: query
          required: false
          description: |
            `1`, `true` or `yes` includes closed rows and walks newest-first.
            Anything else — including `0` — means no.
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
              - 'yes'
              - 'no'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of price rows.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPriceListEntry'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                      - type: object
                        required:
                          - include_history
                          - currency_code
                          - entry_counts
                        properties:
                          include_history:
                            type: boolean
                          currency_code:
                            $ref: '#/components/schemas/CurrencyCode'
                          entry_counts:
                            $ref: '#/components/schemas/PriceListEntryCounts'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePriceListEntries
      tags:
        - Pricing
      summary: Replace the prices in a list
      description: |
        The body is the desired **current** pricing state — the whole tariff as
        it should stand after the call. The server works out what changed and
        writes the history:

        | submitted | standing | what happens |
        |---|---|---|
        | yes | no | a row opens, effective from today |
        | yes | yes, same amount and status | **nothing at all** |
        | yes | yes, different | the standing row closes and its replacement opens, linked by `superseded_by_id` |
        | no | yes | the standing row closes, with no successor |

        "Nothing at all" is load-bearing: a nightly importer reposting an
        unchanged sheet must not manufacture a supersession chain hundreds deep
        and destroy the ability to answer "when did this price actually
        change".

        A pricing point is `(catalogue_item_id, catalogue_item_variant_id,
        min_quantity)`. Stating one twice in a submission is `422`.

        There is no `effective_from`, no `effective_to` and no
        `superseded_by_id` in the body, deliberately: those are the server's
        account of when it was told, and a client that could write them could
        backdate a price change to before an order was taken.

        `unit_amount_minor` and `price_status` are **one fact**. A confirmed
        row must carry a positive integer; a placeholder or market-priced row
        must carry none. Both mismatches are `422` here and a CHECK constraint
        underneath, so no importer or backfill can produce them either.

        An empty `entries` array withdraws every price — closing each standing
        row rather than deleting it.

        **`If-Match` carries the price list's validator**, not a row's.
        Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceListEntriesRequest'
      responses:
        '200':
          description: The list and its standing rows after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListEntriesEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceListConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists/{priceList}/channels:
    put:
      operationId: replacePriceListChannels
      tags:
        - Pricing
      summary: Replace the channels that quote from a list
      description: |
        The complete set, applied at once. **The array order is the priority**
        — index 0 is consulted first — so listing a negotiated sheet above a
        standing tariff states the override rather than requiring somebody to
        invent non-colliding integers for it. An explicit `priority` is still
        honoured, for an importer restoring a known configuration.

        A channel may hold several lists on purpose. Resolution walks them in
        priority order and **stops at the first that prices the point**: the
        lists are not merged, so a client's agreement can override two lines
        without restating the other four hundred, and a gap in it falls through
        to the tariff behind rather than becoming a hole.

        Naming one channel twice is `422` — that is a contradiction, not a
        richer configuration.

        An empty array detaches the list from every channel, which is how a
        tariff is withdrawn and the step `archive` insists on first.

        **`If-Match` required.** Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PriceListPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceListChannelsRequest'
      responses:
        '200':
          description: The list and its channel assignments after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListChannelsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceListConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plan-vocabulary/combinations:
    get:
      operationId: listMealCombinationOptions
      tags:
        - Subscription plans
      summary: The meal combinations a kitchen sells plans in
      description: |
        Which meals of the day a plan delivers — "lunch and dinner", "full
        day". A kitchen's own vocabulary: there is no platform library, because
        "full board" means what each kitchen sells it as.

        Not paginated. The vocabulary is a handful of rows a client renders as
        a set of options in one pass, and paging a set of radio buttons would
        hand a form half of itself.

        **Deactivated rows are served too**, with their `is_active` flag: there
        being no delete, one that vanished from the list would be withdrawn for
        good.

        `includes_*` and `meals_per_day` are **not** the same fact.
        The flags say which sittings are covered; the count says how many
        portions leave the kitchen, which is what a per-day price is quoted
        against. They agree for the ordinary combinations and stop agreeing the
        moment a kitchen sells "lunch, twice".

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every meal combination of the organisation, active or not.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealCombinationOption'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                        properties:
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createMealCombinationOption
      tags:
        - Subscription plans
      summary: Add a meal combination
      description: |
        A duplicate `code` within the organisation is `409`, not a silent
        update: the caller believed it was creating something. The same code in
        another kitchen is not a collision — these are one organisation's words.

        A combination that covers no sitting at all is `422`: a plan built on it
        would be a subscription to an empty box.

        `is_active` is not a field. A combination is created offered, and
        withdrawal is the PATCH.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealCombinationOptionRequest'
