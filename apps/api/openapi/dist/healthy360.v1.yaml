              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealCombinationOption'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                        properties:
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createMealCombinationOption
      tags:
        - Subscription plans
      summary: Add a meal combination
      description: |
        A duplicate `code` within the organisation is `409`, not a silent
        update: the caller believed it was creating something. The same code in
        another kitchen is not a collision — these are one organisation's words.

        A combination that covers no sitting at all is `422`: a plan built on it
        would be a subscription to an empty box.

        `is_active` is not a field. A combination is created offered, and
        withdrawal is the PATCH.

        Requires `plan.manage_organisation`.
      parameters:
