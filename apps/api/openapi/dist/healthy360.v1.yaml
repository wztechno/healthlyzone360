  /catalogue/items:
    get:
      operationId: listCatalogueItems
      tags:
        - Sellable catalogue
      summary: List catalogue items
      description: |
        Everything this organisation sells — products, meals and subscription
        plans in one cursor-paginated list, discriminated by `item_type`.

        Retired items are excluded unless `status=retired` is asked for by
        name: a list that offered withdrawn articles by default invites
        somebody to price one.

        **No item here carries a price, a cost or a margin**, and none ever
        will: money lives in the pricing family, and the admin contract's
        confidential `marginPercent` is a presentation figure with no
        server-side home.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
