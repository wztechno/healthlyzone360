                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createPriceList
      tags:
        - Pricing
      summary: Create a price list
      description: |
        Creates a **draft**. One created active would price customers before
        anybody had entered a price.

        `currency_code` is required and has no default: falling back to the
        organisation's default currency is the kind of helpfulness that
        produces a USD tariff in an AED kitchen with no way to tell whether
        anybody meant it. It is normalised to upper case, so a lowercase ISO
        code is not a second currency.

        A duplicate `code` is `409 resource.conflict`, not a second list.

        Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
