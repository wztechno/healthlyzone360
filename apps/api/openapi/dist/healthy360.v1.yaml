        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceListChannelsRequest'
      responses:
        '200':
          description: The list and its channel assignments after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
