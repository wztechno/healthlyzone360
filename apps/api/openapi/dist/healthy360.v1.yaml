            - string
            - 'null'
        lock_version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    OrganisationInvitation:
      type: object
      description: |
        An offer of membership. **There is no `token` field and there never
        may be** — the plaintext is delivered once, in the email, and only its
        SHA-256 is stored.
      required:
