        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Normalised to upper case, so a lowercase ISO code is not a second currency.
        customer_scope:
          $ref: '#/components/schemas/PriceListCustomerScope'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          type:
            - string
            - 'null'
          format: date
        valid_to:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    UpdatePriceListRequest:
      type: object
      minProperties: 1
      description: |
        `code` is deliberately absent and is **rejected** rather than ignored
        if sent. `status` is absent too: activation and archiving are POST
        sub-resource actions.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
