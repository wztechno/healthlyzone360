                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                          - derivation_state
                        properties:
                          count:
                            type: integer
                            minimum: 0
                          derivation_state:
                            $ref: '#/components/schemas/DerivationState'
                          derived_at:
                            type:
                              - string
                              - 'null'
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
