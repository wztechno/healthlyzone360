  /catalogue/items/{item}/allergens:
    get:
      operationId: showCatalogueItemAllergens
      tags:
        - Sellable catalogue
      summary: An item's derived allergen set
      description: |
        Read-only, and **there is no writer** — that is the point. An item's
        allergens are never authored here: they come from a published recipe
        version's frozen label, or from the union of the item's own listed
        ingredients' effective mappings. An endpoint that let a merchandiser
        type an allergen onto a listing would be an endpoint that lets a
        merchandiser overrule a chef.

        Computed on read, never stored. There is no roll-up column and no
        per-item allergen table: the joins are cheap, and a stored copy goes
        stale the moment a mapping changes. Stored labels exist exactly where
        freezing is the point — on a published recipe version.

        `meta.basis` says which source answered:

        - `recipe_version` — the linked recipe's published version. Its frozen
          rows are the answer, with `declared` preserved as `declared`.
        - `item_ingredients` — the union of the listed ingredients' effective
          mappings, strongest containment winning, with `source_ingredient_id`
          naming the ingredient that made the stronger claim.
        - `none` — an empty set that means **"nobody has said"**, never "no
          allergens". Silence is not a statement of absence, and the publish
          gate refuses a meal in this state.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The derived allergen set and the basis it was derived from.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - allergens
                    properties:
                      allergens:
                        type: array
                        items:
                          $ref: '#/components/schemas/DerivedAllergen'
                  meta:
                    $ref: '#/components/schemas/DerivedAllergenMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/diet-classifications:
    get:
      operationId: listDietClassifications
      tags:
        - Reference data
      summary: The platform diet vocabulary
      security: []
      description: |
        **Anonymous.** A diet filter that only works after sign-in is not a
        diet filter — the argument the public allergen-class list makes,
        applied to the softer of the two vocabularies.

        Served through the public projection: one server-localised `name`
        chosen from `Accept-Language`, never both language columns. Inactive
        classifications are excluded.

        A classification is a **preference filter, never a medical
        restriction**. What a dish contains is its allergen declaration; this
        says how a person describes the pattern of what they eat.

        Unpaginated: the list is small and constant.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
