        customer_scope:
          $ref: '#/components/schemas/PriceListCustomerScope'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          type:
            - string
            - 'null'
          format: date
        valid_to:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    ReplacePriceListEntriesRequest:
      type: object
      required:
        - entries
      description: |
        The desired **current** pricing state. `entries` is required but may be
        empty: an empty array withdraws every price, which is a decision a
        merchandiser makes and not a field they forgot.
      properties:
        entries:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - catalogue_item_id
              - price_status
            properties:
              catalogue_item_id:
                $ref: '#/components/schemas/Uuid'
              catalogue_item_variant_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              min_quantity:
                type:
                  - number
                  - string
                  - 'null'
                description: |
                  The tier threshold, above zero. Omitted or null is the base
                  price. Normalised to four decimal places, so `12`, `12.0` and
                  `"12.0000"` are one pricing point rather than three.
              unit_amount_minor:
                type:
                  - integer
                  - 'null'
                minimum: 1
                description: |
                  Required and positive when `price_status` is `confirmed`;
                  refused otherwise. Whole minor units — `1250` for 12.50 —
                  never a decimal and never a formatted string.
              price_status:
                $ref: '#/components/schemas/PriceStatus'
