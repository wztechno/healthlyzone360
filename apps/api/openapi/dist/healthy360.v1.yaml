            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueItemEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}/publish:
    post:
      operationId: publishCatalogueItem
      tags:
        - Sellable catalogue
      summary: Publish a catalogue item
      description: |
        Its own route, its own permission and its own audit action — never a
        `PATCH status`. Deciding what a customer can buy is a different
        authority from writing the listing.

        The **K1.4 gate is deliberately minimal** and the full readiness
        evaluator arrives later; what it can evaluate honestly today is:

        - only a `draft` publishes — `review_required` is a structural
          quarantine, `published` and `retired` are not candidates;
        - both language names are present;
        - a product has at least one `active` variant;
        - a meal has an allergen basis: a linked recipe with a published
          version, **or** at least one row on its public ingredient list;
        - a linked recipe carrying a live `review_required` version blocks the
          item too — a quarantine is an unresolved food-safety contradiction,
          and it propagates.

        Refusals are structured: `catalogue.publish_blocked` carries **every**
        reason at once, so a kitchen fixes them in one pass rather than one per
        attempt.

        The response includes the derived allergen set, because "what did I
        just tell a diner this contains" is the only question worth asking
        immediately afterwards.

        **`If-Match` required.** Requires `catalogue.publish_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The published item and the allergen set its listing will show.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - item
                      - allergens
                    properties:
                      item:
                        $ref: '#/components/schemas/AdminCatalogueItem'
                      allergens:
                        $ref: '#/components/schemas/DerivedAllergenSet'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogueItemPublishBlocked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}/retire:
    post:
      operationId: retireCatalogueItem
      tags:
        - Sellable catalogue
      summary: Retire a catalogue item
      description: |
        The only withdrawal a sellable item has. There is no archive action and
        no delete anywhere: an order or a price snapshot may point at a row
        forever, so a retired item keeps its history and disappears from every
        consumer read.

        Available from every state except `retired` itself, **including
        `draft`** — refusing to retire a draft would leave a kitchen with no
        way at all to withdraw a listing it decided against.

        A `reason` is optional; where one is given it is recorded on the audit
        event, because "why did this disappear" is the first question asked six
        months later.

        **`If-Match` required.** Requires `catalogue.publish_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireCatalogueItemRequest'
      responses:
        '200':
          description: The retired item.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueItemEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}/variants:
    put:
      operationId: replaceCatalogueItemVariants
      tags:
        - Sellable catalogue
      summary: Replace an item's variants
      description: |
        A PUT because the body is the complete set of packs or configurations.
        A PATCH surface would make "I did not touch the packs" and "I deleted
        every pack" the same request, and on the thing a price points at that
        difference is the whole point.

        Rows are matched by `code`, not by position and not by identifier: a
        code is stable within the item and is what a price list will name, so a
        submitted set keeps the identifiers a price already points at. An `id`
        may be sent and is checked for agreement.

        **Absent codes are archived, not deleted** — the catalogue never loses
        a row an order might reference — and re-submitting an archived code
        revives it.

        `variant_type` is derived from the item's own type and is never
        accepted: a product has packs, a subscription plan has configurations,
        and a **meal has neither**, so a submission against one is refused.
        A pack must state its size; a plan configuration must not carry one.

        Exactly one variant is the default. Two marked defaults is a stated
        contradiction and is refused; none is not, and the first submitted
        wins.

        **`If-Match` carries the item's `lock_version`**, not a variant's: the
        set is the unit of change. Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCatalogueItemVariantsRequest'
      responses:
        '200':
          description: |
            The item and **every** variant it now has, including the ones this
            call archived — so a client sees what the submission did rather
            than what it sent.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - item
                      - variants
                    properties:
                      item:
                        $ref: '#/components/schemas/AdminCatalogueItem'
                      variants:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCatalogueItemVariant'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}/ingredients:
    put:
      operationId: replaceCatalogueItemIngredients
      tags:
        - Sellable catalogue
      summary: Replace an item's public ingredient list
      description: |
        What a diner is told is in the dish, in the order the kitchen chose to
        name it. **Not the formulation**: there is no quantity field here and
        none is stored, because quantities are confidential and a shape that
        accepted one would put a competitor's proportions behind an endpoint
        whose whole purpose is what a customer reads.

        The array order **is** `display_order`: naming order is a labelling
        convention (descending by weight, in most regimes), not something to
        re-sort alphabetically.

        These rows are also a meal's **allergen basis of last resort** — the
        fallback the derivation uses when no published recipe version exists.

        An empty array is a legitimate statement and is accepted.

        **`If-Match` (the item's) required.** Requires
        `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCatalogueItemIngredientsRequest'
      responses:
        '200':
          description: The item and its public ingredient list.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - item
                      - ingredients
                    properties:
                      item:
                        $ref: '#/components/schemas/AdminCatalogueItem'
                      ingredients:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCatalogueItemIngredient'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
