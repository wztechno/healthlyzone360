  /catalogue/price-lists/{priceList}/channels:
    put:
      operationId: replacePriceListChannels
      tags:
        - Pricing
      summary: Replace the channels that quote from a list
      description: |
        The complete set, applied at once. **The array order is the priority**
        — index 0 is consulted first — so listing a negotiated sheet above a
        standing tariff states the override rather than requiring somebody to
        invent non-colliding integers for it. An explicit `priority` is still
        honoured, for an importer restoring a known configuration.

        A channel may hold several lists on purpose. Resolution walks them in
        priority order and **stops at the first that prices the point**: the
        lists are not merged, so a client's agreement can override two lines
        without restating the other four hundred, and a gap in it falls through
        to the tariff behind rather than becoming a hole.

        Naming one channel twice is `422` — that is a contradiction, not a
        richer configuration.

        An empty array detaches the list from every channel, which is how a
        tariff is withdrawn and the step `archive` insists on first.

        **`If-Match` required.** Requires `price_list.manage_organisation`.
