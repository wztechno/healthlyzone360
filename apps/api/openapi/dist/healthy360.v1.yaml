  /catalogue/recipes/{recipe}/versions/{version}/publish:
    post:
      operationId: publishRecipeVersion
      tags:
        - Recipes
      summary: Publish a version
      description: |
        Evaluates readiness, freezes the allergen label, and demotes whatever
        was published before to `retired` — one transaction.

        The gates:

        - **State.** Only a `draft` publishes. A quarantined version
          (`review_required`) is blocked *structurally*: that is what the
          state is for.
        - **Substance.** A version with no lines is a name, and a line without
          a quantity and a unit cannot be made twice the same way.
        - **Ingredient trust.** An ingredient marked `requires_review` — the
          burghul/pita contradiction the source workbook contains — blocks
          publication until a human resolves it.
        - **Allergen determination.** Every line ingredient must carry at
          least one mapping row in some layer, **or** be `verified`, which is
          how "checked, and it carries nothing" is recorded. Silence is not a
          statement of absence.

        The first three are reported together as **409**
        `catalogue.publish_blocked` with `details.reasons` — every blocker at
        once, so a kitchen fixes them in one pass instead of one per attempt.
        The fourth is **422** `catalogue.allergen_unmapped` with
        `details.ingredient_ids`, because the fix is in a different place: the
        ingredient's mapping editor, not the recipe.

        Requires **`recipe.publish_organisation`** — a permission of its own.
        Freezing a label that reaches a diner and withdrawing what was live is
        a different authority from editing a draft.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The published version and the label it froze.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - version
                      - allergens
                    properties:
                      version:
                        $ref: '#/components/schemas/AdminRecipeVersion'
                      allergens:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeVersionAllergen'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublishBlocked'
        '422':
          $ref: '#/components/responses/AllergenUnmapped'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions/{version}/retire:
    post:
      operationId: retireRecipeVersion
      tags:
        - Recipes
      summary: Retire a published version
      description: |
        Withdraws a published version. Terminal, deliberately: a retired
        version is history, and history is what makes an old allergen label
        reconstructable. Bringing a formulation back means publishing a new
        version, which recomputes the label against the mappings as they are
        now rather than as they were.

        Retiring anything that is not published is `409 resource.conflict`.

        Requires `recipe.publish_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The retired version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions/{version}/technical-sheet:
    get:
      operationId: showRecipeTechnicalSheet
      tags:
        - Recipes
      summary: The costed view of a formulation
      description: |
        The confidential cost projection — the only place in this API where a
        recipe line carries money.

        Requires **`recipe.view_costs_organisation`**, which is deliberately
        not `recipe.view_organisation`: a line cook needs the method and the
        allergen label to make the dish and must not thereby read the margin on
        it. Every other recipe endpoint serialises no cost field at all, to
        anybody, and a key sweep across that surface enforces it.

        The response answers what a paper technical sheet answers:

        - **What goes in and what it costs** — `lines`, with `unit_cost_amount`,
          `line_cost_amount` and `cost_currency_code`. The two amounts are both
          on the wire even though one is derivable from the other, because on
          an imported sheet they legitimately disagree: the source's own
          arithmetic is stored verbatim, errors included.
        - **What the whole thing costs** — `snapshots`, keyed by basis. Both
          keys are always present so a client never has to guess whether a
          missing key means "none" or "not asked for"; either may be `null`.
        - **What is missing** — `uncosted_line_numbers`, and `currency_conflict`
          for the import case where two currencies ended up on one sheet.

        **The snapshots are read, not recomputed.** A sheet that recalculated
        on every GET would show a figure no snapshot records, changing as
        ingredient prices move — precisely what a costed technical sheet exists
        to pin down. Recomputing is an explicit `POST` to `cost-snapshots`.

        Every successful read writes a `catalogue.technical_sheet_viewed` audit
        event carrying a purpose of use and the `confidential` classification.
        The event records identifiers and counts only: an audit row is readable
        with `audit.view_organisation`, so an amount there would route around
        the permission split entirely.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The costed sheet.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TechnicalSheet'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions/{version}/cost-snapshots:
    get:
      operationId: listRecipeCostSnapshots
      tags:
        - Recipes
      summary: The cost history of a version, newest first
      description: |
        An append-only ledger: `UPDATE` and `DELETE` are revoked from the
        application database role, so a snapshot is superseded by writing a
        newer one and never by editing an old one.

        Paginated where the *version* list is not, and for the opposite reason:
        a version list is bounded by how many times one kitchen revised one
        formulation, while this grows every time anybody asks what the recipe
        costs today.

        Newest first, because the question is almost always "what does it cost
        now". The keyset runs over when the snapshot was **recorded**, not over
        `calculated_at`: the importer can record a sheet dated last spring, and
        a cursor over a value the importer chooses would let a back-dated
        import interleave itself into a page a client is halfway through
        walking.

        Requires `recipe.view_costs_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of cost snapshots, newest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CostSnapshot'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRecipeCostSnapshot
      tags:
        - Recipes
      summary: Cost this version now and append the result
      description: |
        Recomputes the version's cost from its own lines and appends a
        snapshot.

        Requires **both** `recipe.manage_organisation` (this writes) and
        `recipe.view_costs_organisation` (what it writes is money). Neither
        alone is enough.

        No `If-Match`: a snapshot appends to a ledger beside the version rather
        than mutating it, so there is no lost update for a validator to
        prevent.

        `basis` may only be `recalculated`. `as_recorded` is a real value of
        the column and is deliberately not accepted here — it means "this is
        what a source technical sheet stated", and the only thing that holds a
        source sheet is the private importer. An endpoint accepting it would
        let somebody type figures in and have them stored as evidence of a
        document nobody read.

        No amounts in the body at all: every figure is derived from the lines
        and the yield, and a derived value a client can supply is one that can
        disagree with its inputs.

        Three refusals. A **retired** version is `409 resource.conflict` —
        retirement is terminal and a fresh cost for a withdrawn formulation has
        nowhere to go. A version that is **not fully costed** is
        `422 validation.failed` naming `uncosted_line_numbers`, and no snapshot
        is written: a total that silently omits a line reads exactly like a
        total that did not. Lines in **more than one currency** are
        `422 validation.failed` naming them, because there is no exchange rate
        anywhere in this system.

        Success does **not** touch `completeness`. Only publication flips a
        version to `costed`; letting an ad-hoc recalculation promote a draft
        would make the field mean "somebody once pressed a button".
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCostSnapshotRequest'
      responses:
        '201':
          description: The appended snapshot.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - snapshot
                    properties:
                      snapshot:
                        $ref: '#/components/schemas/CostSnapshot'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/allergen-classes:
    get:
      operationId: listAllergenClasses
      tags:
        - Reference data
      summary: The allergen vocabulary
      description: |
        **Anonymous.** An allergy filter that only works after sign-in is not
        an allergy filter, so this endpoint takes no credential.

        A public projection: one server-localised `name` and `description`
        chosen from `Accept-Language` (`en` or `ar`; anything else falls back
        to English rather than failing), never both language columns.
        Deactivated classes are excluded — a class the platform has withdrawn
        must not be offered to a customer, while every historical reference to
        its code still resolves internally.

        The list is small and constant, so it is not paginated.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The active allergen classes, in display order.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicAllergenClass'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        properties:
                          count:
                            type: integer
                            minimum: 0
                          locale:
                            type: string
                            enum:
                              - en
                              - ar
                            description: The locale the names were rendered in.
              example:
                data:
                  - code: gluten
                    name: Cereals containing gluten
                    description: Wheat, rye, barley, oats and their hybrids.
                    regulatory_ref: ALG-01
                    is_eu_14: true
                    is_us_big_9: true
                    us_declaration_required: false
                    us_threshold_ppm: null
                    display_order: 1
                meta:
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
                  count: 14
                  locale: en
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createAllergenClass
      tags:
        - Reference data
      summary: Create an allergen class
      description: |
        Platform operators only. Two gates, both required: `platform.context`
        (the selected organisation must itself be of type
        `platform_operator`) and the `reference.manage_platform` permission.
        An organisation that somehow held the permission still could not reach
        this endpoint, because an organisation type is not something a tenant
        can grant itself. Either gate denies with
        `authz.permission_denied` and `details.reason = policy_denied` or
        `permission_not_granted`.

        Adding a class is rare and irreversible in one respect: every
        organisation inherits it, and the `code` can never be taken back.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllergenClassRequest'
      responses:
        '201':
          description: The allergen class was created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenClassEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/allergen-classes/{code}:
    patch:
      operationId: updateAllergenClass
      tags:
        - Reference data
      summary: Update an allergen class
      description: |
        Names, translations, descriptions, market applicability and
        thresholds are editable. **The `code` is not.** It is a regulatory
        identity that mappings, customer declarations and frozen recipe
        labels all point at, so a request carrying `code` is refused with
        `422 validation.failed` rather than silently ignored.

        Inactive classes are reachable here on purpose: an administrator must
        be able to correct a withdrawn class's Arabic name so old labels keep
        rendering.

        Platform operators only — see `createAllergenClass` for the two gates.
      parameters:
        - $ref: '#/components/parameters/AllergenCodePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAllergenClassRequest'
      responses:
        '200':
          description: The updated allergen class.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenClassEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/allergen-classes/{code}/deactivate:
    post:
      operationId: deactivateAllergenClass
      tags:
