    CatalogueItemType:
      type: string
      enum:
        - product
        - meal
        - subscription_plan
      description: |
        Which kind of sellable thing an item is — the discriminator that lets
        products, meals and subscription plans share one table, one price path,
        one availability table and one publication gate. What genuinely differs
        between them is nullable columns and child tables, not the apparatus
        around them.
    CatalogueItemStatus:
      type: string
      enum:
        - draft
        - review_required
        - published
        - retired
      description: |
        The publication lifecycle of a sellable item — the **same** four-state
        family a recipe version carries, and deliberately not the
        `active | archived` pair the operational tables use.

        `review_required` is a stored **quarantine**, not a queue position: a
        critical allergen contradiction must make publication structurally
        impossible rather than decorate the row with a flag a publish path can
        forget to read.

        `retired` is terminal for consumer visibility and keeps the row,
        because an order or a price snapshot may point at it forever. Sellable
        items **retire; they never archive**.
    CatalogueVariantType:
      type: string
      enum:
        - pack
        - plan_configuration
      description: |
        Whether a variant is a pack of a product or one configuration of a
        subscription plan. Derived from the item's own type and never accepted
        from a client; a meal has neither.
    CatalogueVariantStatus:
      type: string
      enum:
        - draft
        - active
        - archived
      description: |
        The operational lifecycle of a variant. **Not** the publication family,
        and the asymmetry with the parent item is deliberate: a pack is not
        separately published. Publishing the 500 g jar while the 1 kg jar sits
        in draft is not a state a kitchen wants, it is a state a kitchen ends
        up in.
    CataloguePackFormat:
      type: string
      enum:
        - bottle
        - bag
        - can
        - gallon
        - bunch
        - loose
      description: |
        The container a pack comes in. `loose` is a real answer, not a missing
        one, which is why the field is nullable *and* carries this value: "the
        kitchen said loose" and "nobody has said" are different facts.
    CatalogueProductionMode:
      type: string
      enum:
        - production
        - supplier
        - both
      description: |
        Whether the kitchen makes this, buys it in, or both. `both` is not
        indecision: several source articles are produced in-house when volume
        allows and bought in when it does not.
    SalesChannelKind:
      type: string
      enum:
        - b2c_web
        - b2b
        - pos
        - marketplace
        - corporate
        - insurance
      description: |
        What sort of route to market a channel is. The *kind* is a closed
        vocabulary a projection branches on; the *channel* is a row an
        organisation owns, because two kitchens legitimately run two different
        wholesale desks. The universal client's `SalesChannel` union is the
        prototype's flattening of the two.
    SalesChannelStatus:
      type: string
      enum:
        - active
        - inactive
      description: |
        Whether a channel is currently trading. Operational, never the
        publication family: nothing a customer sees is a channel — what a
        customer sees is the items available through one.
    AdminSalesChannel:
      type: object
      required:
        - id
        - organisation_id
        - code
        - channel_kind
        - name_en
        - name_ar
        - status
        - lock_version
      description: |
        The administrative shape of a sales channel. Carries **both** names and
        ignores `Accept-Language` for them.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 40
          description: Immutable after creation — a price list and an order's provenance name it.
        channel_kind:
          $ref: '#/components/schemas/SalesChannelKind'
        name_en:
          type: string
        name_ar:
          type: string
        order_source:
          type:
            - string
            - 'null'
          maxLength: 30
          description: |
            How orders arriving here label themselves in a partner's system.
            Deliberately unconstrained: that is somebody else's vocabulary.
        status:
          $ref: '#/components/schemas/SalesChannelStatus'
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    SalesChannelEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - sales_channel
          properties:
            sales_channel:
              $ref: '#/components/schemas/AdminSalesChannel'
        meta:
          $ref: '#/components/schemas/Meta'
    CreateSalesChannelRequest:
      type: object
      required:
        - code
        - channel_kind
        - name_en
      properties:
        code:
          type: string
          maxLength: 40
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        channel_kind:
          $ref: '#/components/schemas/SalesChannelKind'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        order_source:
          type:
            - string
            - 'null'
          maxLength: 30
      additionalProperties: false
    UpdateSalesChannelRequest:
      type: object
      minProperties: 1
      description: |
        `code` and `channel_kind` are deliberately absent. Changing either
        means creating the new channel and deactivating the old one — which is
        what actually happened.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        order_source:
          type:
            - string
            - 'null'
          maxLength: 30
        status:
          $ref: '#/components/schemas/SalesChannelStatus'
      additionalProperties: false
    AdminCatalogueItem:
      type: object
      required:
        - id
        - organisation_id
        - catalogue_id
        - item_type
        - slug
        - name_en
        - name_ar
        - is_market_priced
        - is_assorted
        - status
        - data_quality_flags
        - lock_version
      description: |
        The administrative shape of a sellable item. Carries **both** names and
        ignores `Accept-Language` for them: a bilingual editor has to see what
        it is editing.

        **No price, cost or margin field exists here or on any child shape**,
        because no such column exists on any table in this family. Money lives
        in the pricing tables; the admin contract's confidential
        `marginPercent` is a presentation figure derived from a confirmed price
        and a recipe cost per serving, and has no server-side home in this
        slice.

        There is no public projection yet. When one arrives it will be a
        separate schema with its own denylist sweep, never this one with fields
        removed.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_id:
          $ref: '#/components/schemas/Uuid'
        item_type:
          $ref: '#/components/schemas/CatalogueItemType'
        slug:
          type: string
          maxLength: 140
          description: |
            Immutable after creation. A rename changes the names and nothing
            else: a slug is what a link, a marketplace listing and a partner's
            integration hold.
        name_en:
          type: string
        name_ar:
          type: string
          description: |
            The empty string is the "not yet translated" state, and the publish
            gate refuses it. Unlike a recipe, there is **no fallback** to the
            English name: a customer-facing name has to be visible as
            untranslated.
        description_en:
          type:
            - string
            - 'null'
        description_ar:
          type:
            - string
            - 'null'
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The merchandising shelf, not the purchasing taxonomy.
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The recipe a meal is produced from. Its **published** version is
            the first choice of allergen basis.
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The ingredient a resold raw good simply is.
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
          description: |
            Goods priced at the day's market rate carry no confirmed amount at
            all. Not a price field — a fact about the article that pricing
            reads.
        is_assorted:
          type: boolean
          description: True for a row that stands for a mixed selection rather than one article.
        status:
          $ref: '#/components/schemas/CatalogueItemStatus'
        review_reason:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Why the item is quarantined.
        image_placeholder_id:
          type:
            - string
            - 'null'
          maxLength: 80
        data_quality_flags:
          type: array
          description: Unresolved import findings, e.g. `dual_pack_single_price`.
          items:
            type: string
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
        lock_version:
          type: integer
          minimum: 0
          description: |
            Also served as the `ETag` of the single-resource GET, and the
            validator every sub-resource write sends back as `If-Match`.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    CatalogueItemEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - item
          properties:
            item:
              $ref: '#/components/schemas/AdminCatalogueItem'
        meta:
          $ref: '#/components/schemas/Meta'
    AdminCatalogueItemVariant:
      type: object
      required:
        - id
        - variant_type
        - code
        - is_default
        - status
        - pack
        - lock_version
      description: The thing a price actually points at — one pack, or one plan configuration.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        variant_type:
          $ref: '#/components/schemas/CatalogueVariantType'
        code:
          type: string
          maxLength: 60
          description: Stable within the item, and what a price list names.
        name_en:
          type:
            - string
            - 'null'
        name_ar:
          type:
            - string
            - 'null'
        is_default:
          type: boolean
          description: |
            Exactly one per item, enforced by a partial unique index rather
            than by a service remembering to clear the incumbent first.
        status:
          $ref: '#/components/schemas/CatalogueVariantStatus'
        pack:
          oneOf:
            - $ref: '#/components/schemas/CataloguePackDetail'
            - type: 'null'
          description: Present for a pack variant, null for a plan configuration.
        lock_version:
          type: integer
          minimum: 0
      additionalProperties: false
    CataloguePackDetail:
      type: object
      required:
        - pack_quantity
        - pack_unit_id
      properties:
        pack_quantity:
          type: string
          description: A decimal(12,4) as a string, so no precision is lost in transport.
        pack_unit_id:
          $ref: '#/components/schemas/Uuid'
        pack_piece_count:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Units inside the pack — a tray of twelve is `12`.
        pack_format:
          oneOf:
            - $ref: '#/components/schemas/CataloguePackFormat'
            - type: 'null'
        net_weight_grams:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            Nullable, and **never derived** from `pack_quantity`: that
            conversion needs a density this system does not hold, and
            fabricating one for a bunch of parsley is exactly the invented
            figure this programme refuses to produce.
      additionalProperties: false
    AdminCatalogueItemIngredient:
      type: object
      required:
        - id
        - ingredient_id
        - is_representative
        - display_order
      description: |
        One line of the public ingredient list — what a diner is told is in the
        dish. **Not a formulation**: there is no quantity here and there will
        not be.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        is_representative:
          type: boolean
          description: Whether a listing card shows this one among the handful it has room for.
        display_order:
          type: integer
          minimum: 1
          description: Server-authored from the submitted order.
      additionalProperties: false
    AdminChannelAssignment:
      type: object
      required:
        - id
        - sales_channel_id
        - catalogue_item_variant_id
        - is_available
        - available_from
        - available_to
      description: |
        One statement that a channel offers this item, optionally narrowed to
        one variant and one date window. There is deliberately no price here.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sales_channel_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null offers the item as a whole.
        is_available:
          type: boolean
        available_from:
          type:
            - string
            - 'null'
          format: date
        available_to:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    DerivedAllergen:
      type: object
      required:
        - allergen_code
        - containment
        - derivation
        - source_ingredient_id
      properties:
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
          enum:
            - contains
            - may_contain
          description: |
            The strongest claim any source makes for this class. `contains`
            beats `may_contain`, never the other way round.
        derivation:
          type: string
          enum:
            - declared
            - derived
          description: |
            `declared` is a human's statement that no mapping implies — a chef
            who knows the fryer is shared. It survives a recomputation and is
            never weakened by one. Only a recipe version can carry a
            declaration; the ingredient-list basis is always `derived`.
        source_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Which ingredient implied it. "Why does this dish say sesame" has to
            be answerable from the label alone.
      additionalProperties: false
    DerivedAllergenSet:
      type: object
      required:
        - basis
        - recipe_version_id
        - allergens
      properties:
        basis:
          type: string
          enum:
            - recipe_version
            - item_ingredients
            - none
          description: |
            Which source answered. `none` is an empty set that means "nobody
            has said", never "no allergens".
        recipe_version_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/DerivedAllergen'
      additionalProperties: false
    DerivedAllergenMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required:
            - basis
            - recipe_version_id
          properties:
            basis:
              type: string
              enum:
                - recipe_version
                - item_ingredients
                - none
            recipe_version_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    CreateCatalogueItemRequest:
      type: object
      required:
        - item_type
        - name_en
      description: |
        Derived and server-authored values are absent by construction:
        `status` (always `draft`), `lock_version`, `organisation_id` and the
        source-provenance fields are not accepted, and neither are variants,
        ingredients, diet tags or channels — each of those is its own
        set-replace endpoint.
      properties:
        item_type:
          $ref: '#/components/schemas/CatalogueItemType'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        slug:
          type:
            - string
            - 'null'
          maxLength: 130
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description_en:
          type:
            - string
            - 'null'
          maxLength: 4000
        description_ar:
          type:
            - string
            - 'null'
          maxLength: 4000
        catalogue_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Omit to use (and create on demand) the organisation's `default` catalogue.
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
        is_assorted:
          type: boolean
        image_placeholder_id:
          type:
            - string
            - 'null'
          maxLength: 80
      additionalProperties: false
    UpdateCatalogueItemRequest:
      type: object
      minProperties: 1
      description: |
        `slug` and `item_type` are deliberately absent and are actively
        **rejected** rather than ignored: a request that appeared to move a
        slug and quietly did nothing would be worse than one that failed.
        `status` is absent because publication and retirement are POST
        sub-resource actions.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        description_en:
          type:
            - string
            - 'null'
          maxLength: 4000
        description_ar:
          type:
            - string
            - 'null'
          maxLength: 4000
        product_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        production_mode:
          oneOf:
            - $ref: '#/components/schemas/CatalogueProductionMode'
            - type: 'null'
        recipe_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        purchasing_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        usage_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_market_priced:
          type: boolean
        is_assorted:
          type: boolean
        image_placeholder_id:
          type:
            - string
            - 'null'
          maxLength: 80
      additionalProperties: false
    RetireCatalogueItemRequest:
      type: object
      description: |
        A kitchen withdrawing a seasonal line owes nobody an explanation, so a
        reason is optional; where one is given it is recorded on the audit
        event.
      properties:
        reason:
          type:
            - string
            - 'null'
          maxLength: 200
      additionalProperties: false
    ReplaceCatalogueItemVariantsRequest:
      type: object
      required:
        - variants
      properties:
        variants:
          type: array
          maxItems: 100
          description: |
            The complete set. An empty array is a legitimate statement ("this
            item has no variants") and is accepted; absent codes are archived,
            not deleted.
          items:
            type: object
            required:
              - code
            properties:
              id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
                description: |
                  Optional. Checked against this item and against the code, so
                  a client holding an identifier cannot silently retarget it.
              code:
                type: string
                maxLength: 60
              name_en:
                type:
                  - string
                  - 'null'
                maxLength: 255
              name_ar:
                type:
                  - string
                  - 'null'
                maxLength: 255
              is_default:
                type: boolean
                description: |
                  Two marked defaults is a stated contradiction and is refused.
                  None is not: the first submitted wins.
              status:
                $ref: '#/components/schemas/CatalogueVariantStatus'
              pack:
                oneOf:
                  - $ref: '#/components/schemas/CataloguePackDetail'
                  - type: 'null'
                description: |
                  Required for a pack — a pack with no size is not a pack — and
                  refused for a plan configuration.
            additionalProperties: false
      additionalProperties: false
    ReplaceCatalogueItemIngredientsRequest:
      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          maxItems: 100
          description: |
            The complete list, in the order it should be named. There is no
            `display_order` field: the array order is the sequence.
          items:
            type: object
            required:
              - ingredient_id
            properties:
              ingredient_id:
                $ref: '#/components/schemas/Uuid'
              is_representative:
                type: boolean
            additionalProperties: false
      additionalProperties: false
    ReplaceCatalogueItemDietClassificationsRequest:
      type: object
      required:
        - diet_classifications
      properties:
        diet_classifications:
          type: array
          maxItems: 20
          description: |
            Platform codes. One that does not resolve to an *active*
            classification is a validation failure carrying
            `details.unknown`, never an invitation to create one.
          items:
            type: string
            maxLength: 40
      additionalProperties: false
    ReplaceCatalogueItemChannelsRequest:
      type: object
      required:
        - channels
      properties:
        channels:
          type: array
          maxItems: 50
          description: |
            The complete availability list. An empty array withdraws the item
            from every channel.
          items:
            type: object
            required:
              - sales_channel_id
            properties:
              sales_channel_id:
                $ref: '#/components/schemas/Uuid'
              catalogue_item_variant_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              is_available:
                type: boolean
                default: true
              available_from:
                type:
                  - string
                  - 'null'
                format: date
              available_to:
                type:
                  - string
                  - 'null'
                format: date
            additionalProperties: false
      additionalProperties: false
    PublicDietClassification:
      type: object
      required:
        - code
        - name
        - display_order
      description: |
        The public projection of a diet classification: **one** server-localised
        name, never both language columns.
      properties:
        code:
          type: string
          maxLength: 40
          description: |
            The platform vocabulary, matching the universal client's
            `DietClassification` union one for one.
        name:
          type: string
        display_order:
          type: integer
          minimum: 0
      additionalProperties: false
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: |
        An ISO 4217 code. Every amount in the pricing family carries or
        inherits exactly one, and no operation performs cross-currency
        arithmetic.
      examples:
        - AED
        - USD
    PriceListStatus:
      type: string
      enum:
        - draft
        - active
        - archived
      description: |
        The **operational** lifecycle of a tariff, deliberately not the
        sellable family (`draft | review_required | published | retired`). A
        price list is not published content; it is the instrument that prices
        content, so it has no review state and no retirement. What a customer
        sees is a *price*, and whether one reaches them is decided by the
        channel assignment and the public projection.

        An `active` list is still editable — that is the point of
        effective-dating. An `archived` one refuses every write.
    PriceListCustomerScope:
      type: string
      enum:
        - public
        - agreement
      description: |
        Who the tariff is for. `public` is the tariff anybody may be shown;
        `agreement` is one customer's negotiated position, and showing it to a
        second customer is the failure this module is built to prevent.

        A column rather than an inference from the channel kind, because one
        channel legitimately carries both.
    PriceStatus:
      type: string
      enum:
        - confirmed
        - placeholder
        - market_priced
      description: |
        What the row actually claims — the honest badge.

        - `confirmed` — a real number the kitchen stands behind. Carries
          `unit_amount_minor`. **The only status a public surface may serve.**
        - `placeholder` — the source stated no price and nobody has supplied
          one. Amount null, never public: a placeholder rendered as a price is
          a lie with a currency symbol on it, and rendered as zero it is a
          worse one.
        - `market_priced` — quoted at the time of sale. Amount null, and the
          absence *is* the statement, which is why it is a status rather than a
          missing row.

        The pairing is enforced by a database CHECK —
        `(price_status = 'confirmed') = (unit_amount_minor IS NOT NULL)` — so a
        client may branch on either half and get the same answer.
    AdminPriceList:
      type: object
      required:
        - id
        - organisation_id
        - code
        - name_en
        - name_ar
        - currency_code
        - customer_scope
        - status
        - lock_version
      description: |
        The administrative shape of a price list header. Carries **both** names
        and ignores `Accept-Language` for them.

        No amounts: the header is a name, a currency and a status. The numbers
        are behind `…/entries`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Usually null. A tariff is normally an organisation-wide instrument;
            naming a branch is for a kitchen that genuinely prices one location
            differently.
        code:
          type: string
          maxLength: 40
          description: Immutable after creation — an importer, a channel assignment and a runbook already name it.
        name_en:
          type: string
        name_ar:
          type: string
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        customer_scope:
          $ref: '#/components/schemas/PriceListCustomerScope'
        status:
          $ref: '#/components/schemas/PriceListStatus'
        valid_from:
          type:
            - string
            - 'null'
          format: date
          description: Inclusive.
        valid_to:
          type:
            - string
            - 'null'
          format: date
          description: |
            **Inclusive** — a human writing "valid to 30 June" means through
            the 30th. Deliberately not the convention an entry's `effective_to`
            uses, which is exclusive because it is written by the supersession
            machinery rather than by a person.
        source_system:
          type:
            - string
            - 'null'
          maxLength: 40
        source_ref:
          type:
            - string
            - 'null'
          maxLength: 160
        lock_version:
          type: integer
          minimum: 0
          description: |
            Also served as the `ETag` of the single-resource GET, and the
            validator **every** write in this family sends back — the entries
            and the channel assignments included.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    AdminPriceListEntry:
      type: object
      required:
        - id
        - catalogue_item_id
        - currency_code
        - price_status
        - effective_from
      description: |
        One price, for one pricing point, over one interval of time.

        The pricing point is `(catalogue_item_id, catalogue_item_variant_id,
        min_quantity)`. The **standing** row of a point is the one whose
        `effective_to` is null; everything else is history, and history is
        closed rather than edited.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_id:
          $ref: '#/components/schemas/Uuid'
        catalogue_item_variant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Null prices the article as a whole. Naming a variant prices exactly
            that pack or configuration; resolution prefers a variant's own row
            and falls back to the article's.
        min_quantity:
          type:
            - string
            - 'null'
          pattern: ^\d+\.\d{4}$
          description: |
            The tier threshold, as a fixed-scale decimal string. Null is the
            base price. A row applies from its threshold **upwards**, and
            resolution picks the highest threshold at or below the quantity
            asked for.

            A string rather than a number so the four decimal places survive
            the round trip: a client that parsed `10` and re-sent `10.0` would
            otherwise be describing a different key.
        unit_amount_minor:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            The price, as a whole number of the **minor units** of
            `currency_code` — `4500` for 45.00 AED. Never a decimal, never
            formatted, never zero.

            Null exactly when `price_status` is not `confirmed`. The pair is a
            single fact and a database CHECK enforces it.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        price_status:
          $ref: '#/components/schemas/PriceStatus'
        effective_from:
          type: string
          format: date
          description: Inclusive.
        effective_to:
          type:
            - string
            - 'null'
          format: date
          description: |
            **Exclusive**, and null on the standing row. The row governed
            `[effective_from, effective_to)`.

            Exclusive is forced rather than chosen: a replacement made today
            closes the incumbent at today and opens its successor at today, so
            an inclusive end would leave two rows both claiming to be the price
            on the day of the change. A row changed twice in one day therefore
            leaves a zero-length interval, which is honest — the price never
            governed a whole day, and the record that somebody stated it
            survives.
        superseded_by_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The row that replaced this one. Null on the standing row, and also
            null on a row that was simply withdrawn — "we stopped pricing this"
            is a different fact from "we now price it differently".
        created_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    PriceListChannelAssignment:
      type: object
      required:
        - id
        - sales_channel_id
        - price_list_id
        - priority
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sales_channel_id:
          $ref: '#/components/schemas/Uuid'
        price_list_id:
          $ref: '#/components/schemas/Uuid'
        priority:
          type: integer
          description: Lower is consulted first. Assigned from the submitted array order unless stated.
      additionalProperties: false
    PriceListEntryCounts:
      type: object
      required:
        - open
        - confirmed
      description: |
        How many standing rows the list has, and how many of those are real
        prices. The pair is what a merchandiser reads as "312 priced, 8 owed".
      properties:
        open:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
      additionalProperties: false
    PriceListEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - price_list
          properties:
            price_list:
              $ref: '#/components/schemas/AdminPriceList'
        meta:
          $ref: '#/components/schemas/Meta'
    PriceListDetailEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - price_list
            - channels
          properties:
            price_list:
              $ref: '#/components/schemas/AdminPriceList'
            channels:
              type: array
              items:
                $ref: '#/components/schemas/PriceListChannelAssignment'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - entry_counts
              properties:
                entry_counts:
                  $ref: '#/components/schemas/PriceListEntryCounts'
    PriceListEntriesEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - price_list
            - entries
          properties:
            price_list:
              $ref: '#/components/schemas/AdminPriceList'
            entries:
              type: array
              description: The **standing** rows after the write, so a client need not fetch them back.
              items:
                $ref: '#/components/schemas/AdminPriceListEntry'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required:
                - currency_code
              properties:
                currency_code:
                  $ref: '#/components/schemas/CurrencyCode'
    PriceListChannelsEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - price_list
            - channels
          properties:
            price_list:
              $ref: '#/components/schemas/AdminPriceList'
            channels:
              type: array
              items:
                $ref: '#/components/schemas/PriceListChannelAssignment'
        meta:
          $ref: '#/components/schemas/Meta'
    CreatePriceListRequest:
      type: object
      required:
        - code
        - name_en
        - currency_code
      properties:
        code:
          type: string
          maxLength: 40
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Normalised to upper case, so a lowercase ISO code is not a second currency.
        customer_scope:
          $ref: '#/components/schemas/PriceListCustomerScope'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          type:
            - string
            - 'null'
          format: date
        valid_to:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    UpdatePriceListRequest:
      type: object
      minProperties: 1
      description: |
        `code` is deliberately absent and is **rejected** rather than ignored
        if sent. `status` is absent too: activation and archiving are POST
        sub-resource actions.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: |
            Accepted only while the list holds no price rows at all, history
            included. Afterwards it is `409` with
            `details.reason: currency_locked`.
        customer_scope:
          $ref: '#/components/schemas/PriceListCustomerScope'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          type:
            - string
            - 'null'
          format: date
        valid_to:
          type:
            - string
            - 'null'
          format: date
      additionalProperties: false
    ReplacePriceListEntriesRequest:
      type: object
      required:
        - entries
      description: |
        The desired **current** pricing state. `entries` is required but may be
        empty: an empty array withdraws every price, which is a decision a
        merchandiser makes and not a field they forgot.
      properties:
        entries:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - catalogue_item_id
              - price_status
            properties:
              catalogue_item_id:
                $ref: '#/components/schemas/Uuid'
              catalogue_item_variant_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              min_quantity:
                type:
                  - number
                  - string
                  - 'null'
                description: |
                  The tier threshold, above zero. Omitted or null is the base
                  price. Normalised to four decimal places, so `12`, `12.0` and
                  `"12.0000"` are one pricing point rather than three.
              unit_amount_minor:
                type:
                  - integer
                  - 'null'
                minimum: 1
                description: |
                  Required and positive when `price_status` is `confirmed`;
                  refused otherwise. Whole minor units — `1250` for 12.50 —
                  never a decimal and never a formatted string.
              price_status:
                $ref: '#/components/schemas/PriceStatus'
            additionalProperties: false
      additionalProperties: false
    ReplacePriceListChannelsRequest:
      type: object
      required:
        - channels
      description: |
        The complete set of channels quoting from this list. Empty detaches it
        from all of them — the step `archive` insists on first.
      properties:
        channels:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - sales_channel_id
            properties:
              sales_channel_id:
                $ref: '#/components/schemas/Uuid'
              priority:
                type:
                  - integer
                  - 'null'
                description: |
                  Lower is consulted first. Omitted, it comes from the array
                  order, which is what a merchandiser is stating when they list
                  a negotiated sheet above a standing tariff.
            additionalProperties: false
      additionalProperties: false
    PlanDurationKind:
      type: string
      enum:
        - one_off
        - fixed_days
      description: |
        Whether a duration is a single purchase or a fixed run of days.

        **This is what replaced the zero-day sentinel.** The legacy model wrote
        "not a subscription, just a one-off order" as a duration of `0` days â€” a
        magic value that reads as data, that every consumer has to know the
        convention for, and that a per-day calculation divides by. Branch on
        this, never on the number.
    PlanType:
      type: string
      enum:
        - both
        - subscription
        - limited_time
      description: |
        How a plan may be bought. Deliberately not two booleans: "sold both
        ways" is a third answer a kitchen gives rather than the conjunction of
        the other two, and a pair of flags would additionally let a plan say
        neither.
    PlanPricingBasis:
      type: string
      enum:
        - per_day
        - per_week
        - total
      description: |
        What the number on a price row *means* for this plan. It lives on the
        plan rather than on the price because it is a fact about the plan's
        commercial shape: two lists quoting the same plan on two different bases
