  /catalogue/plan-vocabulary/durations:
    get:
      operationId: listPlanDurations
      tags:
        - Subscription plans
      summary: The runs a kitchen sells plans for
      description: |
        **`duration_kind` carries the meaning and `duration_days` carries the
        number.** A `one_off` row is a single purchase and has
        `duration_days: null`; a `fixed_days` row has a positive integer. There
        is no zero-day row and there will not be one — that sentinel is what
        this model replaced, and a client that divides by it would find out the
        hard way.

        Ordered with the one-off **first**: it is the shortest commitment there
        is, so it belongs at the top of a list a customer reads downwards into
        longer runs.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every duration of the organisation, active or not.
          headers:
