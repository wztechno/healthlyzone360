          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyBandEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plan-vocabulary/durations:
    get:
      operationId: listPlanDurations
      tags:
        - Subscription plans
      summary: The runs a kitchen sells plans for
      description: |
        **`duration_kind` carries the meaning and `duration_days` carries the
        number.** A `one_off` row is a single purchase and has
        `duration_days: null`; a `fixed_days` row has a positive integer. There
        is no zero-day row and there will not be one — that sentinel is what
        this model replaced, and a client that divides by it would find out the
        hard way.

        Ordered with the one-off **first**: it is the shortest commitment there
        is, so it belongs at the top of a list a customer reads downwards into
        longer runs.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every duration of the organisation, active or not.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanDurationOption'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                        properties:
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createPlanDuration
      tags:
        - Subscription plans
      summary: Add a plan duration
      description: |
        The kind decides whether the number is required or refused, and both
        mismatches are `422`: a one-off that carries a length, and a fixed run
        that does not. `duration_days: 0` is refused with a message about the
        sentinel rather than a range violation, because a client sending it is
        following the old convention and needs to be told that it is gone.

        A CHECK constraint enforces the same correspondence underneath, so no
        importer or backfill can produce either shape.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDurationRequest'
      responses:
        '201':
          description: The duration as stored.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDurationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plan-vocabulary/durations/{duration}:
    patch:
      operationId: updatePlanDuration
      tags:
        - Subscription plans
      summary: Edit or withdraw a plan duration
      description: |
        Precondition-free, and `code` refused rather than ignored.

        The kind/days correspondence is applied to the **merged** row, so
        flipping a fixed run to `one_off` without also sending
        `duration_days: null` is `422` rather than a silent clearing: the two
        columns are one fact, and a client that changed half of it has stated a
        contradiction.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/PlanDurationPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanDurationRequest'
      responses:
        '200':
          description: The duration after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDurationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plans/{item}/profile:
    get:
      operationId: showPlanProfile
      tags:
        - Subscription plans
      summary: A plan's commercial terms
      description: |
        **`profile` is null when nobody has written one**, rather than a
        fabricated set of defaults. "No commercial decision has been made about
        this plan" is exactly the state the publish gate refuses, and a surface
        that filled it in would leave a kitchen wondering why publication keeps
        failing on terms it can see on screen.

        A catalogue item that is not a subscription plan is `422`, not `404`:
        the caller can see the row perfectly well through
        `/catalogue/items/{item}`, so a 404 would send them hunting for a typo.

        The `ETag` is the **item's**, because that is the validator a PUT here
        has to carry.

        The one plan read that is **not** commercial, so it requires
        `catalogue.view_organisation` rather than `plan.manage_organisation`:
        these terms are what a customer will be shown on the plan page and what
        a chef needs to produce against. The discounts are the commercial part,
        and they are on `…/variant-durations`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and its terms, or a null profile.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: putPlanProfile
      tags:
        - Subscription plans
      summary: Write a plan's commercial terms
      description: |
        A PUT because the profile is one commercial statement, read whole to
        decide any part of it. A PATCH over eight interdependent switches would
        make "I left pausing alone" and "I turned pausing off" the same request,
        on a right a subscriber has been sold.

        Every field is optional and omitted ones take their documented
        defaults — `both`, `per_day`, skippable, pausable, 24 hours — so `{}`
        is the legitimate "the ordinary terms".

        **`change_cutoff_hours` defaults to 24 and the default is evidence**:
        the kitchen operating rule and the legacy amendment window say the same
        thing from opposite directions, so the merge keeps one column with that
        default. `0` is accepted — "change it until the van leaves" is a policy
        somebody may genuinely have.

        **`If-Match` carries the item's validator** and the write bumps it: the
        profile has no `lock_version` of its own, being the commercial face of
        the item rather than a separate thing to lock.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutPlanProfileRequest'
      responses:
        '200':
          description: The plan and its terms after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanProfileEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plans/{item}/variants:
    get:
      operationId: listPlanVariants
      tags:
        - Subscription plans
      summary: A plan's configuration matrix
      description: |
        Each cell carries its coordinates **and** the identity of the variant
        beneath it: the `catalogue_item_variant_id` a price row points at, the
        `code` a resubmission matches on, and the `status`.

        **Archived cells are served too**, so a grid can render "we used to sell
        this" differently from "nothing here" — which is what a merchandiser
        needs to know before trying to open a cell that is already occupied.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and every cell of its matrix.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePlanVariants
      tags:
        - Subscription plans
      summary: Replace a plan's configuration matrix
      description: |
        The body is *cells*; the server writes a `catalogue_item_variants` row
        and its plan profile for each, atomically. That is what keeps the thing
        a customer picks and the thing a price points at one object.

        **The code is derived and deterministic** —
        `combination-tier[-band]`, from the vocabulary rows' own codes — so the
        same cell submitted from two clients on two days produces the same
        variant and the same price keeps pointing at it. An explicit `code` is
        accepted for a kitchen migrating identifiers it already uses elsewhere.

        **Absent cells are archived, not deleted**, and their coordinates stay
        occupied: reviving a withdrawn cell means resubmitting *that* cell, not
        opening a second variant at the same address. Trying the second is
        `409` with the occupying code named.

        Stating one cell twice in a submission is `422` — and two cells that
        differ only by an omitted `energy_band_id` are the same cell, not two.

        `includes_snacks` and `snacks_per_day` are one fact stated twice, so
        the contradiction is `422` rather than silently resolved.

        A deactivated combination or band may keep a cell a plan already sells
        and may not open a new one.

        An empty `cells` array archives the whole matrix — a decision, not a
        forgotten field.

        **`If-Match` carries the item's validator.** Requires
        `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePlanVariantsRequest'
      responses:
        '200':
          description: |
            The plan and **every** cell it now has, including the ones this call
            archived — so a client sees what the submission did rather than what
            it sent.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanCellConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plans/{item}/variant-durations:
    get:
      operationId: listPlanVariantDurations
      tags:
        - Subscription plans
      summary: The runs each configuration may be bought for
      description: |
        **`discount_percent` is served as `null` where nobody has stated one** —
        never as `"0.00"` and never omitted. The absence has to be visible,
        because the person reading this screen is the person who has to go and
        find the number. `meta.unstated_discount_count` says how many rows are
        in that state.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and every duration assignment across its configurations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantDurationsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePlanVariantDurations
      tags:
        - Subscription plans
      summary: Replace a plan's duration assignments
      description: |
        The complete set of configuration × duration pairings, applied at once.
        A kitchen decides "every cell runs 5, 20 and 40 days, and the premium
        tier also runs 60" in one sitting, and splitting that across calls would
        make the half-applied states reachable and publishable.

        Rows name their configuration and duration by identifier **or by
        code**, so an importer holding codes does not have to round-trip through
        this API to learn identifiers it will never use again.

        **An absent `discount_percent` stays absent all the way to the
        column.** NULL is "nobody has stated one", `0` is "there is no
        discount", and this endpoint never turns the first into the second.

        **Absent rows are deleted**, and the asymmetry with the matrix is
        deliberate: an assignment carries nothing but itself, so there is
        nothing to strand. `is_available: false` is what says "we still run 40
        days, just not this month" without discarding the negotiated discount.

        A deactivated duration cannot be assigned.

        **`If-Match` carries the item's validator.** Requires
        `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePlanVariantDurationsRequest'
      responses:
        '200':
          description: The plan and its duration assignments after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantDurationsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones:
    get:
      operationId: listDeliveryZones
      tags:
        - Delivery
      summary: The delivery zones this organisation has drawn
      description: |
        Cursor-paginated. A kitchen with one map has three zones and a kitchen
        covering a country has a zone per district per branch, and the second
        is the one that has to keep working.

        Archived zones are excluded unless `status=archived` asks for them.

        `branch_id=organisation` selects the organisation-wide map — the one
        thing a plain identifier filter cannot express, because an absent
        parameter already means "no filter".

        The areas are **not** embedded: a zone can name a hundred places, and
        `…/{zone}/areas` answers that question one zone at a time.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          required: false
          description: Defaults to everything except `archived`.
          schema:
            $ref: '#/components/schemas/DeliveryZoneStatus'
        - name: branch_id
          in: query
          required: false
          description: |
            A branch identifier, or the literal `organisation` for the
            organisation-wide map.
          schema:
            oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: string
                const: organisation
        - name: query
          in: query
          required: false
          description: Case-insensitive substring over `name_en`, `name_ar` and `code`.
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of delivery zones.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZonesEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDeliveryZone
      tags:
        - Delivery
      summary: Draw a delivery zone
      description: |
        The zone is created `active` and covering nowhere, so there is no
        window in which a half-built map quotes a delivery. Areas are added
        through `PUT …/{zone}/areas`.

        `branch_id` is optional and usually absent: a zone with no branch is
        the organisation-wide map, and a branch-scoped zone overrides it for
        that branch.

        `currency_code` is optional and defaults to the organisation's own —
        unlike a price list, where a default would silently produce a USD
        tariff in an AED kitchen. A zone carries at most two amounts, in the
        kitchen's home market.

        A duplicate `code` inside the organisation is `409`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryZoneRequest'
      responses:
        '201':
          description: The zone as created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}:
    get:
      operationId: getDeliveryZone
      tags:
        - Delivery
      summary: One delivery zone
      description: |
        Returns `ETag: "<lock_version>"`. The **area set is versioned against
        this same number**: a zone and its map are one document, and two
        operators redrawing at once is the race the validator catches.

        `meta.area_count` comes with it, so a client can render "17 areas"
        without fetching them.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The delivery zone.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDeliveryZone
      tags:
        - Delivery
      summary: Rename, reprice or suspend a delivery zone
      description: |
        `code` and `status` are **rejected**, not ignored: a client that sent
        one believed it was writing something. Archiving is a POST action;
        suspension is `is_active`.

        Changing `branch_id` re-scopes the zone **and its area claims
        together**, in one transaction. It is refused with `409
        area_already_served` when another zone already serves one of those
        areas at the destination, and nothing is half-moved.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryZoneRequest'
      responses:
        '200':
          description: The zone after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryAreaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}/archive:
    post:
      operationId: archiveDeliveryZone
      tags:
        - Delivery
      summary: Withdraw a delivery zone
      description: |
        Terminal, and it **releases the zone's area claims**. An archived zone
        that kept them would occupy every place it ever served, and a kitchen
        redrawing its map would find the new zone refused by one nobody uses.

        A kitchen that wants to stop delivering *without* giving the areas up
        suspends the zone instead (`is_active: false` on the PATCH), which is
        reversible and keeps the map intact.

        Nothing is deleted: the fee, the promise and the name survive, so a
        delivery quoted from this zone last month can still be explained.

        There is deliberately no customer-address check. `customer_addresses`
        arrives in J1, so today there is nothing to consult and a blocker
        written against an empty table would be a permanently-green check.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The archived zone.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}/areas:
    get:
      operationId: listDeliveryZoneAreas
      tags:
        - Delivery
      summary: The places a zone covers
      description: |
        Unpaginated: the set is bounded by the gazetteer and is the unit a
        client edits, so a picker showing half a map with a cursor to fetch the
        rest would be a worse contract than one response.

        Each entry is the **platform area** in admin shape, `is_active`
        included — a kitchen must be able to see that a place it still serves
        has been withdrawn from the gazetteer. Those claims are kept rather
        than silently dropped, and `meta.inactive_area_count` is what a screen
        puts a warning badge on.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The areas this zone covers.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneAreasEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceDeliveryZoneAreas
      tags:
        - Delivery
      summary: Redraw the map of a zone
      description: |
        Set-replace: the body is the desired whole map, and areas absent from
        it are released. That release is the only way to hand a place to a
        different zone, because **one area is served by one zone per branch**.

        `If-Match` carries the **zone's** validator — a zone and its map are
        one document.

        Three refusals are worth knowing. A place already served by another
        zone **at the same scope** is `409 area_already_served`, naming the
        occupying zone rather than an index. An area in another country is
        `422 area_country_mismatch`: the gazetteer is keyed `(country, code)`
        precisely because place names repeat. An area the platform has
        withdrawn is `422 area_inactive` — unless this zone already claimed it,
        in which case the claim stands and `meta.inactive_area_count` says so.

        An organisation-wide zone and a branch-scoped zone **may** both claim
        one area. That is the override mechanism, not a hole: the branch claim
        wins when a branch is in context, and the organisation-wide one answers
        when none is.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDeliveryZoneAreasRequest'
      responses:
        '200':
          description: The areas this zone covers after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneAreasEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryAreaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-windows:
    get:
      operationId: listDeliveryWindows
      tags:
        - Delivery
      summary: The delivery slots this kitchen offers
      description: |
        Unpaginated, deliberately: a kitchen has morning, afternoon and
        evening, and perhaps a weekend slot. This is the set a checkout picker
        renders whole, so paging it would push every client into reassembling
        it.

        Deactivated windows are served **with** their flag rather than hidden —
        there is no delete, so the only way to see a withdrawn slot is to be
        shown it.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every delivery window, active and withdrawn.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDeliveryWindow
      tags:
        - Delivery
      summary: Name a delivery slot
      description: |
        No `If-Match`: these rows carry no `lock_version`, and the concurrency
        contract applies only to resources that do.

        A duplicate `code` inside the organisation is `409`; the same code in
        another kitchen is not a collision, because a window is one kitchen's
        word for one of its own slots.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryWindowRequest'
      responses:
        '201':
          description: The window as created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-windows/{window}:
    patch:
      operationId: updateDeliveryWindow
      tags:
        - Delivery
      summary: Edit or withdraw a delivery slot
      description: |
        **Precondition-free**: a window carries no `lock_version`, and
        `If-Match` applies only to resources that do.

        `code` is **rejected**, not ignored. `is_active: false` is the only
        withdrawal there is; there is no DELETE, because an order taken for the
        evening slot has to stay explainable.

        The pairing and ordering rules run against the **merged** row: sending
        only `ends_at` compares it with the stored `starts_at`. Turning a timed
        window back into an untimed one therefore means sending both as `null`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryWindowPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryWindowRequest'
      responses:
        '200':
          description: The window after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /kitchen/branch-operating:
    get:
      operationId: getBranchOperating
      tags:
        - Kitchen operations
      summary: The current branch's operating week
      description: |
        The branch comes from `X-Branch-Id`. `branch.context` permits an absent
        header — an organisation-wide membership may legitimately select no
        branch — so this endpoint refuses that case with
        `400 context.branch_required` rather than guessing which location the
        caller meant.

        **Unconfigured days are absent, not filled in.** A week with three rows
        means four days nobody has decided about; inventing `is_open: false`
        for them would tell a customer the branch is shut on Thursday when the
        truth is that nobody has said. `meta.is_complete` is what a screen puts
        the "finish setting this up" prompt behind.

        No `ETag`: these rows carry no `lock_version`, because the week is
        replaced whole in one transaction.

        Requires `branch.view_current`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XBranchIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The branch's week, in weekday order.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOperatingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceBranchOperating
      tags:
        - Kitchen operations
      summary: Replace the current branch's operating week
      description: |
        Set-replace, in one transaction. The week is the unit of change — "we
        now close at six, and Sundays are off" is one decision, and applying
        half of it produces a schedule nobody agreed to. That is also why there
        is no `If-Match`: there is no half-week for a validator to protect.

        A **closed day is a row** with no times; an omitted weekday is a day
        nobody has decided about. Both are storable, and only that distinction
        lets a checkout say "we are shut on Sundays" rather than "we cannot
        answer". An empty `days` clears the week back to unconfigured.

        Three per-row rules, each refused with the day and the field named: a
        day is open with both times or closed with neither; a branch closes
        after it opens (no overnight service yet); and a closed day carries no
        cut-off. A cut-off **outside** the opening hours is accepted — "order
        by 22:00 the night before" is a real rule, and which day a cut-off
        governs is order capture's question rather than this table's.

        There is deliberately no `branch_id` in the body: the branch comes from
        `X-Branch-Id`, which is validated against the caller's membership
        scope.

        Requires `branch.manage_current`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XBranchIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBranchOperatingRequest'
      responses:
        '200':
          description: The branch's week after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOperatingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/delivery-areas:
    get:
      operationId: listDeliveryAreas
      tags:
        - Reference data
      summary: The platform delivery gazetteer
      security: []
      description: |
        **Anonymous.** J1's onboarding asks a customer for their delivery area
        before an account exists, so an address form that only works after
        sign-in cannot be part of sign-up.

        Served through the public projection: one server-localised `name`
        chosen from `Accept-Language`, never both language columns. Inactive
        areas are excluded.

        **Cursor-paginated**, unlike the other two public vocabularies.
        Fourteen allergen classes and twelve diet classifications are
        constants; the gazetteer is 125 rows for one country today and grows
        with every market.

        `country_code` is **optional** — revised from K1.7's "required" when the
        consumer marketplace needed the whole gazetteer before it knew where
        the person was. The original argument was right about *defaults* and
        wrong about *absence*: a client that has not asked for a country has
        not asked for the wrong one, and `country_code` is embedded on every
        row, so an unfiltered page is unambiguous by construction. A code the
        platform does not recognise is still `400` rather than an empty page,
        which would read as "we do not deliver there yet".

        `region` is carried and is currently `null` on every row (OD-12): the
        source does not record which governorate a place belongs to, and a
        client that wants to group the picker can see that the platform has
        nothing to group by.
      parameters:
        - name: country_code
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2, case-insensitive. Omit for every active area
            in every market the platform serves.
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of delivery areas, localised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDeliveryAreasEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/kitchens:
    get:
      operationId: listMarketplaceKitchens
      tags:
        - Marketplace
      summary: List kitchens
      security: []
      description: |
        **Anonymous.** Every active kitchen with at least one open branch,
        cursor-paginated. A marketplace a person has to sign in to browse is not
        a marketplace.

        A kitchen appears when three things are true: its organisation type is
        `kitchen`, its own status is `active`, and it has at least one active
        branch. A suspended kitchen is **absent** rather than greyed out, and a
        kitchen with no open location has no calendar to offer.

        Served through a public projection (master plan v2 4.8). Several fields
        the consumer contract asks for have no column behind them and carry an
        honest empty value rather than an invented one: `tagline` and
        `description` are empty strings (the platform stores no marketing copy),
        `cuisines` is empty, `rating` is `null` with `rating_count: 0` (no
        reviews exist), and `is_verified` is `false` (there is no verification
        module yet, so the platform has verified nobody). `diet_classifications`
        **is** real: it is derived from the kitchen's own published meals.

        `name` is the organisation's single registered name and is *not*
        localised - a business name is not translated. Delivery-zone and area
        names are, and carry one server-chosen language, never both columns.

        `meta.unsupported_filters` names any parameter the caller sent that this
        deployment stores no data for, so a silently ignored filter is
        impossible.
      parameters:
        - name: query
          in: query
          required: false
          description: Free text over the kitchen name.
          schema:
            type: string
            maxLength: 120
        - name: country_code
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - name: area
          in: query
          required: false
          description: |
            A platform delivery-area `code` from `GET /reference/delivery-areas`.
            Matches kitchens whose **active** zones claim that area, so a kitchen
            that has paused a zone stops appearing for it while keeping the claim.
          schema:
            type: string
            maxLength: 60
        - name: channels
          in: query
          required: false
          description: |
            Comma-separated consumer switches. `subscription`, `delivery` and
            `pickup` have no stored channel kind behind them and therefore match
            no kitchen - see `MarketplaceSalesChannels`.
          schema:
            type: string
            examples:
              - b2c,marketplace
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of kitchens.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceKitchensEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/kitchens/{kitchen}:
    get:
      operationId: getMarketplaceKitchen
      tags:
        - Marketplace
      summary: Read one kitchen
      security: []
      description: |
        **Anonymous.** One kitchen, with its branches, their active delivery
        zones and their operating weeks.

        `{kitchen}` accepts the identifier or the slug. A kitchen that is
        suspended, has no active branch, or is not a kitchen answers
        `404 resource.not_found` - the same answer an identifier that never
        existed gets, because telling an anonymous caller which organisations
        exist and what the platform has done to them is nobody's business but the
        tenant's.
      parameters:
        - $ref: '#/components/parameters/MarketplaceKitchenPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The kitchen.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplaceKitchen'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/meals:
    get:
      operationId: listMarketplaceMeals
      tags:
        - Marketplace
      summary: List meals
      security: []
      description: |
        **Anonymous.** Published meals, offered through a consumer channel,
        carrying a confirmed price.

        **An unpriced meal is absent.** A placeholder row and a market-priced row
        resolve to no price at all, and the consumer contract has no shape for a
        meal without one: rendering `0` would be a lie, and a nullable price
        would push "we do not know what this costs" onto a surface with no way to
        act on it. The kitchen sees the difference on its own readiness screen.

        **Prices come only from consumer channels.** The resolver is restricted
        to channel kinds the domain declares non-private, so a negotiated
        wholesale, corporate or insurance tariff - and any volume tier on one -
        is structurally unreachable here rather than merely unrequested.

        `exclude_allergens` is an exclusion rather than an inclusion on purpose:
        a person filters by what they must avoid. It is applied over the derived
        allergen list at **both** containment levels, so a dish a kitchen cannot
        rule an allergen out of is excluded along with the ones that certainly
        contain it.

        **`nutrition` and `serving` are `null` on every meal, and that is a
        deliberate deviation from the proposed draft.** The platform has no
        authoritative nutrition source; inventing per-serving figures for
        somebody choosing food for a medical reason is the one thing this
        programme will not do. Phase N1 owns nutrition and is gated on a real
        source arriving.

        `meal_types`, `cuisines`, `preparation_minutes` and the ratings have no
        column behind them and carry honest empties.
      parameters:
        - name: query
          in: query
          required: false
          description: Free text over both name and both description columns.
          schema:
            type: string
            maxLength: 120
        - name: kitchen_ids
          in: query
          required: false
          description: Comma-separated kitchen identifiers.
          schema:
            type: string
        - name: diet_classifications
          in: query
          required: false
          description: |
            Comma-separated classification codes. Meals must carry **every** one:
            a person ticking vegan and gluten-free is stating two requirements.
          schema:
            type: string
        - name: exclude_allergens
          in: query
          required: false
          description: Comma-separated allergen codes. Meals carrying any of them are excluded.
          schema:
            type: string
            examples:
              - peanut,gluten
        - name: price_max
          in: query
          required: false
          description: Maximum price in minor units of the meal's own currency.
          schema:
            type: integer
            minimum: 0
        - name: available_on
          in: query
          required: false
          description: |
            Only meals orderable on this date. A date outside the published
            fortnight matches nothing: the kitchen has not said.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of meals.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceMealsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/meals/{meal}:
    get:
      operationId: getMarketplaceMeal
      tags:
        - Marketplace
      summary: Read one meal
      security: []
      description: |
        **Anonymous.** One meal, with its derived allergen declaration and the
        fortnight of dates it can be ordered for.

        `{meal}` accepts the identifier or the slug. An unpriced, unpublished,
        retired or quarantined meal answers `404 resource.not_found`: a meal
        nobody has priced is not on sale, and a detail page for one would have to
        invent a price or show a gap where the buy button goes.
      parameters:
        - $ref: '#/components/parameters/MarketplaceMealPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The meal.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplaceMeal'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/meal-plans:
    get:
      operationId: listMarketplaceMealPlans
      tags:
        - Marketplace
      summary: List subscription plans
      security: []
      description: |
        **Anonymous.** Published subscription plans of active kitchens.

        **An empty page is the expected answer today, and it is the correct
        one.** The imported real-kitchen world is entirely draft by design, and
        the demonstration plan is deliberately left unpublishable - one
        configuration carries no confirmed price, which is exactly what the plan
        publish gate refuses. Consumer plan pages therefore remain mock-backed
        after M1; this endpoint exists so that a kitchen finishing a plan makes
        it appear without another phase.

        Unlike a meal, a plan is not additionally gated on a channel-availability
        row: its own publish gate is the stronger statement, and a weaker second
        gate the publish path never asks for would hide a plan its kitchen had
        fully prepared.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: kitchen_ids
          in: query
          required: false
          description: Comma-separated kitchen identifiers.
          schema:
            type: string
        - name: duration
          in: query
          required: false
          description: A kitchen's own duration `code`, as published in `durations`.
          schema:
            type: string
            maxLength: 60
        - name: meals_per_day
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of subscription plans.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplacePlansEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /marketplace/meal-plans/{plan}:
    get:
      operationId: getMarketplaceMealPlan
      tags:
        - Marketplace
      summary: Read one subscription plan
      security: []
      description: |
        **Anonymous.** One published plan: its terms, the configurations a
        customer can buy and the runs those configurations are offered for.

        `{plan}` accepts the identifier or the slug. A configuration with no
        confirmed weekly price is **absent from `variants`** rather than listed
        without one.
      parameters:
        - $ref: '#/components/parameters/MarketplacePlanPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The subscription plan.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplacePlan'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /carts:
    post:
      operationId: openCart
      tags:
        - Cart
      summary: Open or re-find the caller's basket on a channel
      description: |
        Get-or-create. **200, not 201**, and the verb is still POST: the second
        call returns the basket the first one opened, and a client that saw
        `201` twice would reasonably conclude it had two baskets. It is not a
        `GET` either, because the first call genuinely writes a row and a
        `cart.opened` audit event — and a `GET` that creates rows is one a proxy
        will cache and a crawler will trigger.

        **One open cart per customer per channel**, held by a partial unique
        index rather than by a check-then-insert: two taps on a slow connection
        are a race, and a race that produces two baskets loses one of them
        silently.

        `channel_code` is a code rather than an identifier, and it is resolved
        **across organisations**. A shopper knows they are buying through the
        consumer web channel; they do not hold a channel UUID, and a client that
        had to fetch one first would need a kitchen-admin read permission to do
        it. Which kitchen owns the channel is therefore the server's answer, not
        the client's assertion — there is no `organisation_id` in the body, and
        a code naming no *active* channel is `404`, never a 422, because
        confirming that a code exists but is switched off leaks a kitchen's
        commercial state to anybody who can guess a string.

        **No amount of any kind is returned, and none ever will be from this
        family.** `carts` and `cart_items` hold no price column: the server's
        probe establishes that a line is *orderable* and throws its price away,
        because a cart price is advisory — the tariff can move between adding a
        line and paying for it — and every line is repriced at placement. A
        subtotal here would be a number no table holds and no checkout will
        honour.

        `ETag` is served because the cart carries `lock_version`, but **no
        `If-Match` is demanded on any cart write**: the header prevents a lost
        update, and a basket has exactly one author.

        Authenticated and email-verified. No permission code — the authority is
        ownership, and every row is scoped to the caller's own customer account.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCartRequest'
      responses:
        '200':
          description: The caller's open basket on that channel, with its lines.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /carts/{cart}/items:
    post:
      operationId: addCartItem
      tags:
        - Cart
      summary: Add a line to a basket
      description: |
        **The server validates on the way in.** A full price probe runs before
        anything is written: the article is published, the channel offers it on
        the requested day, there is a confirmed price, and that price is in the
        basket's currency. Accepting anything and discovering the problem at
        checkout is the shape of the prototype this programme replaces — a
        customer builds a basket for ten minutes and is told at the end that
        half of it was never orderable.

        **Lines merge rather than repeat.** Adding two of something the basket
        already holds one of produces one line of three. "Two of these" and "one
        of these twice" are the same basket, and a customer scrolling past three
        copies of one line has been shown the database's internal state instead
        of their order. The probe runs at the **combined** quantity, not the
        increment: a tier that begins at fifty is reached by the fiftieth unit
        however it was added.

        The response is still `201` on a merge. The status describes the
        request's outcome — here is the line you asked about — not the row count.

        A line's identity is `(article, pack, delivery date)`. Two quantities of
        the same meal for two different days are two lines.

        Refusals are **`422 cart.line_refused`** carrying `details.reasons`: one
        `{reason, …context}` entry per problem, **all of them at once**, from the
        vocabulary `item_unknown`, `item_not_published`, `variant_unknown`,
        `variant_not_active`, `channel_not_trading`, `channel_unavailable`,
        `unpriced`, `currency_mismatch`. A refusal that revealed one problem per
        attempt would turn one fix into three round trips.

        The whole cart comes back beside the line, because the write pushed the
        basket's expiry out and moved its `lock_version` — a response carrying
        only the line would hand a client two stale facts.
      parameters:
        - $ref: '#/components/parameters/CartPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: The line, and the basket it now belongs to.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLineEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /carts/{cart}/items/{item}:
    patch:
      operationId: setCartItemQuantity
      tags:
        - Cart
      summary: Set a basket line to an exact quantity
      description: |
        **Set, not adjust.** The body carries the quantity the customer wants,
        never a delta: a delta applied to a basket that moved underneath the
        client produces a number nobody asked for, and the one client that would
        send a delta is the one whose render is stale.

        **The new quantity is reprobed**, and can be refused. Raising a line can
        cross a tier the kitchen prices in another currency; lowering it can fall
        below the only tier that priced the article at all. Neither is visible
        from the number alone, which is why this is not a write the server may
        simply accept. Refusals are `422 cart.line_refused`, the same structured
        shape as the add.

        `quantity` is the only field. The article, the pack and the delivery date
        are what make this line *this* line, so changing any of them is removing
        a line and adding another — a PATCH that accepted `catalogue_item_id`
        would let a client mutate a row into a different line and collide with
        the index that keeps baskets free of duplicates.

        Zero is refused. Removing a line is its own action, not a quantity of
        nothing, so a client that means "delete" is told so rather than silently
        having written a row it must then notice is gone.
      parameters:
        - $ref: '#/components/parameters/CartPath'
        - $ref: '#/components/parameters/CartItemPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemQuantityRequest'
      responses:
        '200':
          description: The line at its new quantity, and the basket around it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLineEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: removeCartItem
      tags:
        - Cart
      summary: Remove a line from a basket
      description: |
        **A real delete**, and one of very few on the platform. Almost
        everything else archives, retires or deactivates, because a price a
        customer was charged and a label a diner was shown have to stay
        reconstructable. A basket line is neither: nothing has been promised and
        nothing has been charged, and a line somebody changed their mind about is
        not evidence of anything. The removal is audited as `cart.line_removed`,
        so the decision is still traceable without the row.

        Its own action rather than a quantity of zero: "none of this" and "remove
        this" are different intentions, and collapsing them lets a client delete
        by arithmetic accident.

        **No `ETag` on the 204.** The cart's validator did move, and a client
        that holds one must re-read the basket rather than trust a header on an
        empty body — serving a validator for a representation the response does
        not contain is how a client ends up confident about a basket it has not
        seen.

        A line that is not in this basket, and a basket that is not the caller's,
        are both `404`.
      parameters:
        - $ref: '#/components/parameters/CartPath'
        - $ref: '#/components/parameters/CartItemPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The line was removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders:
    post:
      operationId: placeOrder
      tags:
        - Orders
      summary: Place a basket as an order
      description: |
        The one irreversible act in the customer journey, and the place where
        every question the platform has been deferring is answered at once.

        **Every line is repriced here.** The cart's probe prices were advisory
        and were never stored; these are authoritative and become the snapshot.
        A tariff can change between filling a basket on Tuesday and paying for it
        on Friday, and the price that governs is the one standing when the
        customer commits. The consequence is that a line acceptable in the basket
        can be refused at checkout, and that is correct — the article was
        retired, the channel stopped offering it, the last confirmed price
        expired.

        **One currency, never converted.** The order takes the cart's currency,
        and any line — or delivery fee — priced in another refuses the whole
        placement. Converting would mean inventing an exchange rate, storing a
        number nobody quoted and producing a total that reconciles against
        nothing.

        **A replay repeats the original response exactly, status included.**
        `201` for a placement and `201` again on a replay, with
        `Idempotency-Replayed: true` to say which it was. A client that retried
        a request whose response it lost wants exactly the answer it missed —
        and the resource genuinely was created, so downgrading the status to
        `200` would be the reply that lies. The header is the signal; the status
        is the record.

        **`Idempotency-Key` is optional and is guarded twice.** The HTTP
        middleware answers a replay with the stored response envelope, which a
        service cannot do — by then the response is gone. The placement service
        claims the key *before* the order row exists, which is what makes a
        genuine race an insert conflict rather than a check-then-act two requests
        can both pass, and which also protects a placement made by a queued job.
        A key replayed against a **different** body is
        `409 request.idempotency_key_reused`; the fix is a new key, not a reload.

        Refusals are **`409 order.placement_refused`** carrying
        `details.reasons` — every blocker at once, from the vocabulary
        `account_not_ready`, `account_not_active`, `guest_not_verified`,
        `cart_empty`, `cart_not_open`, `address_not_owned`,
        `address_not_deliverable`, `area_not_served`, `zone_suspended`,
        `currency_mismatch`, `mixed_delivery_dates`, `cut_off_passed`,
        `branch_closed`, `date_in_the_past`, plus the whole line vocabulary
        folded in per line with the offending `cart_item_id`. A checkout that
        revealed one problem per attempt — verify your email, now add an address,
        now that article is withdrawn, now the cut-off has passed — is four round
        trips and a lost customer.

        A 409 rather than a 422 throughout: the request is well-formed and the
        customer meant it, and what moved is the world it describes.

        **`mixed_delivery_dates` is a refusal, not a flattening.** This phase's
        order carries exactly one delivery date; a basket asking for two days is
        a subscription-shaped order, and flattening it would deliver Wednesday's
        food on Monday.

        No `payment_method` in the body: there is one, it happens at the door,
        and a field with one legal value promises a choice the platform cannot
        honour. No total either — a body that could state one is a client quoting
        the server its own prices.

        The order comes back in the **customer** shape, which carries no
        `price_list_id`, `price_list_item_id`, `organisation_id`, `created_by`
        or `lock_version`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: |
            The order, with every line at the price it was placed at. A replay
            of a request this key already answered returns this same body and
            this same status, with `Idempotency-Replayed: true`; the command did
            not run a second time.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/orders:
    get:
      operationId: listMyOrders
      tags:
        - Orders
      summary: The caller's own order history
      description: |
        **Newest first, and the direction is a property of the endpoint rather
        than a parameter.** Order history is read from the top: the order
        somebody has a question about is almost always the last one. A collection
        walkable both ways from one cursor would need the direction inside the
        cursor to stay coherent, so no client may ask for the other.

        **No filters, deliberately.** A person has tens of orders, not thousands,
        and the whole history fits in a page or two; a parameter to document,
        version and test in exchange for saving a client one array filter is a
        bad trade. `GET /catalogue/orders` reads a book that grows for as long as
        the kitchen trades, which is why it has four — the asymmetry is the point
        rather than an inconsistency.

        **The lines come with each order.** A history showing only totals would
        send a client back once per row to render the one thing a person actually
        recognises: the names of the food.

        Served in the customer shape — no price-list provenance, no
        `organisation_id`, no `created_by`, no `lock_version`. That the shape
        carries no kitchen identity at all is a stated gap: naming the kitchen
        means a public projection of an organisation, which is the marketplace
        family's, not this one's.
      parameters:
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of the caller's orders, newest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/orders/{order}:
    get:
      operationId: showMyOrder
      tags:
        - Orders
      summary: One of the caller's own orders
      description: |
        Somebody else's order is **`404 resource.not_found`**, never 403.
        Confirming that an identifier exists while refusing to show it tells a
        stranger the order is real — and this is the resource a delivery address
        is snapshotted onto.

        **No `ETag`.** The row carries `lock_version` and this audience cannot
        write it: confirm, fulfil and cancel are the kitchen's actions behind the
        kitchen's permission. Serving a validator to a reader with no writer
        invites a client to send `If-Match` at an endpoint that does not exist
        for it. The kitchen's read of the same row does carry one.

        The allergen statement on each line is served exactly as it was
        snapshotted at placement — code and containment, never the derivation or
        the source ingredient. It is what the customer was told the food
        contains.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The order as the customer sees it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/orders:
    get:
      operationId: listKitchenOrders
      tags:
        - Kitchen orders
      summary: One kitchen's book
      description: |
        **The seller filter is not a filter — it is the isolation boundary.**
        `orders` carries no PostgreSQL policy and no global Eloquent scope,
        because the row belongs to a customer who is a member of nothing and an
        ambient organisation scope would hide an order from the person who placed
        it. The organisation therefore comes from the validated
        `X-Organisation-Id` context and never from a parameter, which would be a
        client asserting whose book it is reading.

        **Four filters, because this list grows without limit.** Unlike a
        person's own history, a kitchen's book accumulates for as long as the
        kitchen trades, and these are the questions staff actually ask it.

        `requested_delivery_date` matches the day the **food is wanted**, not the
        day the order was taken. Those diverge by design — an order placed on
        Monday for Friday is Friday's work — and a list keyed on the placement
        date would show a kitchen the wrong day's production every time.

        `query` searches the **order number only**, case-insensitively. Not the
        customer's name and not the address: a staff-facing search across
        confidential columns is how a directory of everybody a kitchen has ever
        delivered to gets built one query at a time. The number is what is
        printed on the receipt in the caller's hand.

        `branch_id` is a query parameter rather than `X-Branch-Id` because this
        is an organisation-wide book that may be *narrowed* to one production
        site. A kitchen manager holding an organisation-wide membership selects
        no branch, and an endpoint reading the header would show them nothing
        until they picked one.

        An omitted `status` hides nothing, unlike the catalogue lists. A retired
        article is a row nobody should price by accident; a cancelled order is
        part of the book, and a default that dropped it would make every total a
        kitchen reconciles against wrong.

        Served in the kitchen shape, which **does** carry `lock_version`: this is
        the audience that writes, and a screen that could not read the validator
        could not send the `If-Match` the lifecycle actions demand.

        Requires `order.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Restrict to one lifecycle state. Omitted, everything is listed.
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: requested_delivery_date
          in: query
          required: false
          description: |
            The day the food is wanted, `YYYY-MM-DD`. Deliberately strict: a
            relative expression resolves to a different day depending on when
            the request lands, which is not a filter a kitchen can plan against.
          schema:
            type: string
            format: date
        - name: branch_id
          in: query
          required: false
          description: Narrow the organisation's book to one production site.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match on the order number, and on nothing else.
          schema:
            type: string
            maxLength: 60
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of the organisation's orders, newest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KitchenOrder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/orders/{order}:
    get:
      operationId: showKitchenOrder
      tags:
        - Kitchen orders
      summary: One order, as the kitchen sees it
      description: |
        Another kitchen's order is **`404 resource.not_found`**, the same answer
        as an order that does not exist. There is no 403 on purpose: this table
        has no database policy behind it, so the only isolation is the seller
        filter, and a 403 would confirm to one kitchen that a given identifier is
        another's live order.

        **Returns `ETag: "<lock_version>"`**, which the three lifecycle actions
        send back as `If-Match`. That round trip is the whole
        optimistic-concurrency contract for this resource, and it matters more
        here than almost anywhere else on the platform: a kitchen screen showing
        an order list is stale the moment it renders, and two staff members
        confirming the same order at once is an ordinary Tuesday.

        The full delivery snapshot comes with it, street included. It is
        confidential and it is also where the food has to go; withholding it from
        the kitchen would be privacy theatre performed on the one party that
        needs the data to do the job.

        Requires `order.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The order with its lines and its delivery snapshot.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/orders/{order}/confirm:
    post:
      operationId: confirmKitchenOrder
      tags:
        - Kitchen orders
      summary: Confirm an order
      description: |
        Its own route and its own audit action, **never a `PATCH status`**. The
        three lifecycle actions are three decisions with three consequences and
        three separate timestamps; a status field would collapse them into one
        write a client could aim anywhere, and `placed → fulfilled` would become
        expressible by typing.

        Reachable from `placed` only. An illegal move is `409 resource.conflict`
        naming both ends and the transitions that *are* allowed, because the
        caller usually knows only one of them — a client sending "confirm" is
        working from a screen that may be seconds stale, and "this order is
        already cancelled" is the answer rather than "confirm is invalid".

        **`If-Match` required.** The validator is checked inside the same
        conditional `UPDATE` that performs the transition, so there is no window
        between reading the version and writing the row. The state machine
        refuses an illegal move anyway — the header guards against a *lost
        update*, not against an impossible one. A header present but not a
        Healthy360 validator is **400**, not 409: the client has not lost a race,
        it has sent nonsense.

        `confirmed_at` is stamped, in its own column. Separate timestamps rather
        than one `status_changed_at` because "how long between taking an order
        and confirming it" is answerable from columns and unanswerable from a
        field that has been overwritten twice.

        Requires `order.manage_organisation` — seeing the book and committing the
        kitchen to cook are different authorities.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The confirmed order, with its new validator.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrderEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/orders/{order}/fulfil:
    post:
      operationId: fulfilKitchenOrder
      tags:
        - Kitchen orders
      summary: Record an order as delivered
      description: |
        **Spelled `fulfil`**, and the path spells it that way because the
        platform is British throughout — `fulfilled_at`, the `fulfilled` status,
        `OrderLifecycle::fulfil()`. A URL disagreeing with the column, the enum
        and the method it drives would be one spelling nobody could predict from
        the other three.

        **The terminal state, and it is one-way.** A fulfilled order cannot be
        cancelled: the food has been delivered, and whatever happens next is a
        refund or a complaint — different objects with different money attached.
        Making that a transition would let a kitchen erase a delivery by changing
        a column.

        Reachable from `confirmed` only. Skipping confirmation is `409` rather
        than a convenience: an order nobody accepted is not an order anybody
        cooked.

        **`If-Match` required**, and it matters slightly more here than on the
        other two: this row is the last word on whether a customer received their
        food, and a lost update against it is a delivery the book says happened
        twice or not at all.

        Requires `order.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The fulfilled order, with its new validator.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrderEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/orders/{order}/cancel:
    post:
      operationId: cancelKitchenOrder
      tags:
        - Kitchen orders
      summary: Cancel an order
      description: |
        **A POST action, never a DELETE.** A cancelled order is not a removed
        one: it keeps its number, its lines and the prices they were sold at,
        because a kitchen reconciling a week needs to know what it did not sell
        as much as what it did. DELETE would promise an erasure this platform
        will not perform.

        **The reason is required**, which is the one thing here worth arguing
        about. A nullable reason would be honoured by roughly every client in a
        hurry, and one order cancelled "for no stated reason" is the row that
        makes every count wrong — a kitchen cannot tell stock problems from
        changes of mind from a column that is sometimes empty. A fixed vocabulary
        rather than free text for the second reason: free text turns a count into
        a search problem, and it is also how a customer's name ends up in a
        column nobody classified.

        `payment_failed` is deliberately **not** in the vocabulary. There is
        nothing to fail — orders are paid at the door — and reserving the value
        now would be designing for a phase that has not been designed.

        Reachable from `placed` and `confirmed`, and from nowhere else.

        **`If-Match` required.** Cancelling something a colleague confirmed one
        second ago is exactly the lost update the validator exists to catch, and
        it is the transition where getting it wrong costs a customer their
        dinner.

        Requires `order.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: The cancelled order, carrying the reason it was cancelled for.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrderEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/sessions:
    post:
      operationId: startGuestSession
      tags:
        - Guest
      summary: Open a guest session
      security: []
      description: |
        **Anonymous.** Opens a guest customer account and mints the bearer token
        every other guest operation is reached with.

        **This is the only response in the API that carries a plaintext guest
        token, and it carries it once.** The row stores a digest;
        `GET /guest/session` has no `token` field and nothing anywhere can
        re-derive one. A client that loses it has lost the basket, which is the
        correct outcome — a "recover my guest session" surface could only
        authenticate against the credential that was lost.

        Two windows come back and they are not the same. `expires_at` is how
        long this token is accepted; `account_expires_at` is how long the guest
        identity behind it survives. A session that outlived its account would
        resolve to a dead party; an account that expired with its session would
        break "finish the checkout you started this morning".

        The caller's IP and User-Agent are hashed server-side into the session's
        abuse fingerprints. Neither is accepted in the body — a caller who can
        choose their own fingerprint does not have one — and the raw values are
        never stored.

        `Idempotency-Key` is deliberately **not** honoured: a replay would have
        to return the original token, which is not stored, and any other answer
        would be a second credential wearing the first one's key. Two guest
        sessions cost two rows and no obligation to anybody.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XClientPlatform'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGuestSessionRequest'
      responses:
        '201':
          description: The guest session was opened and the token issued.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/StartedGuestSession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/session:
    get:
      operationId: showGuestSession
      tags:
        - Guest
      summary: Read the current guest session
      security:
        - guestToken: []
      description: |
        The session's own state: its grade, whether a contact point has been
        proven, when the token lapses, and the guest account behind it. Called
        on resume, when a token has been in local storage since yesterday and
        the only honest way to learn whether it still works is to use it.

        **Never the token.** The caller already holds it — that is how they
        reached here — so echoing it would put a credential into a response a
        client may cache or log, and buy nothing.

        A token that is unknown, expired, revoked or under-graded answers
        `401 guest.session_invalid`, with nothing distinguishing the four. That
        is deliberately not a `200` carrying `live: false`: a body describing a
        session the caller may not use would make every consumer branch twice,
        and the second branch is the one people forget.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The session is live.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/contacts:
    post:
      operationId: requestGuestContactVerification
      tags:
        - Guest
      summary: Send a guest a passcode
      security:
        - guestToken: []
      description: |
        The guest supplies somewhere we can reach them and a passcode goes to
        it. The first half of the only act that raises a session's grade:
        `place_order` exists because an order is a promise that somebody will be
        told when it is late, and a destination nobody proved is a promise made
        to a typo.

        **`channel` and `delivery_channel` are not the same question.** The
        first says what kind of destination this is — an address or a number —
        and is a property of the contact point. The second says how the passcode
        travels, and is a property of the message: one number is reachable by
        SMS and by WhatsApp, and which is used may differ between two codes sent
        to the same number. `delivery_channel` is optional because the server
        picks better: it knows which drivers are real in this deployment and
        falls back when one is not.

        `202`, not `201`. Nothing durable is created that the caller may then
        read — a challenge is a message in flight with no `GET` of its own —
        and the delivery is a queued job, so a `201` would be claiming a message
        was handed over by a driver that has not run yet.

        The response is candid, unlike the erasure surface: the caller holds a
        live token and typed the destination themselves, so the masked echo, the
        attempts remaining and the resend countdown tell them nothing they did
        not bring with them.

        Verifying a guest's contact deliberately does **not** mark the contact
        point verified platform-wide. The proof is recorded on the session —
        this browser, holding this token, proved this destination — because a
        guest claiming the one verified slot for an address would let anybody
        deny it to its real owner by ordering a salad.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestGuestContactVerificationRequest'
      responses:
        '202':
          description: A passcode is on its way.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOtpChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/contacts/verify:
    post:
      operationId: confirmGuestContactVerification
      tags:
        - Guest
      summary: Submit a guest passcode
      security:
        - guestToken: []
      description: |
        The passcode comes back and, if it holds, the session is promoted to
        `place_order`. The one act that raises a guest's grade — and
        `guest_sessions_grade_proof_check` makes that structural, so a bug that
        skipped this endpoint could not write the higher grade at all.

        **The challenge is resolved by account, not by identifier.** The lookup
        is scoped to this session's own customer account and to the `guest_order`
        purpose; an identifier that never existed, one belonging to another
        guest, and one issued for a deletion all answer `404`. "That challenge
        exists but is not yours" only ever helps somebody it should not help.

        The failure vocabulary is the one place this surface maps a domain
        result onto HTTP. `422 otp.invalid` carries `details.attempts_remaining`,
        because a screen that cannot show how many tries are left has to guess
        when to stop asking. `422 otp.expired` covers both a timed-out challenge
        and a superseded one — the remedy is identical and the distinction would
        say how many are in flight. `429 otp.attempts_exceeded` is a limit
        reached rather than a value rejected. `429 otp.locked` carries
        `details.locked_until`, because a fresh challenge will not help either
        and a client offering "resend" would be lying.

        On success the response is the same shape `GET /guest/session` serves: a
        client that has just been promoted needs exactly what a client resuming
        needs.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGuestContactVerificationRequest'
      responses:
        '200':
          description: The passcode held and the session was promoted.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/orders:
    post:
      operationId: placeGuestOrder
      tags:
        - Guest
      summary: Place a guest order
      security:
        - guestToken: []
      description: |
        A guest turns a basket into an obligation. **The same body, the same
        placement service and the same refusals as the authenticated
        `POST /orders`** — what differs is only which credential got the caller
        here.

        Requires a session of grade `place_order`; a session that has not proven
        a contact point is refused with the same indistinguishable `401` an
        unknown token gets, because a checkout answering "your session is real
        but not verified" would tell a token-guesser that a guess had landed.

        **The cart and the address must belong to this session's account.** A
        cart that does not exist and a cart belonging to another guest both
        answer `404`; the difference is only ever useful to somebody walking
        identifiers.

        **Nothing about money is accepted and nothing is trusted from the
        cart.** Every line is repriced at placement against the tariff standing
        at that moment, so a line acceptable in the basket can be refused at
        checkout — the article was retired, the channel stopped offering it, the
        last confirmed price expired. Those are things that really happened, and
        `409 order.placement_refused` names every one of them at once in
        `details.reasons` rather than one per attempt.

        `Idempotency-Key` is honoured twice over, and neither half subsumes the
        other. The middleware replays the *original envelope* — status, body and
        all — which a service cannot do, because by the time it is asked the
        response is gone; the placement service guarantees the *placement* runs
        once, which the middleware cannot promise for a checkout that arrives
        from a queue. A replay repeats the original response exactly and
        `meta.replayed: true`; a fresh placement answers `201`. A client shown
        `201` for an order it has already been told about will count it twice.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            A client-chosen replay key, scoped to this endpoint and this guest
            account. Replaying it with the same body returns the original
            envelope with `Idempotency-Replayed: true`; replaying it with a
            different body answers `409 request.idempotency_key_reused`.
          schema:
            type: string
            maxLength: 255
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceGuestOrderRequest'
      responses:
        '201':
          description: |
            The order was placed. A replay of a request this
            `Idempotency-Key` already answered returns this same body and this
            same status, with `Idempotency-Replayed: true` to say which it was.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/orders/{order}:
    get:
      operationId: showGuestOrder
      tags:
        - Guest
      summary: Read a guest order
      security:
        - guestToken: []
      description: |
        "Where is my food?" for somebody who never made an account. Scoped to
        the session's own customer account: an identifier naming nobody's order,
        another guest's order and a registered customer's order all answer
        `404`.

        **A signed-URL alternative is deferred, deliberately.** The obvious
        pattern for an order confirmation email is a signed link, and it is not
        built here because it would be a *second* credential for the same data
        with a different lifetime, a different revocation story and a different
        leak surface: a signed URL survives in mail archives, forwarded threads
        and referrer headers long after the session it was minted beside has
        lapsed, and revoking the session would not revoke it. Token-auth reading
        is sufficient for the journey this phase serves — the guest is in the
        browser that placed the order, holding the token that placed it, and the
        token outlives the checkout by days. When customer messaging arrives,
        the right shape is a short-lived single-order link issued by that message
        and expiring with it, not a general-purpose read credential invented in
        advance of the surface that needs it.

        Line names carry **one** server-chosen language from `Accept-Language`,
        never both columns, and they are the frozen snapshot taken at placement
        rather than the catalogue as it stands now. A person shown "contains
        sesame" must still be shown it after the kitchen reformulates.
      parameters:
        - name: order
          in: path
          required: true
          description: The order's identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The order.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/convert:
    post:
      operationId: convertGuestAccount
      tags:
        - Guest
      summary: Turn a guest into a registered customer
      security:
        - guestToken: []
      description: |
        "Keep my basket, my addresses and my order history — I want an account
        now." Registration and conversion as one act, because they are one act.

        **The body is the registration body**, identical to `POST /auth/register`,
        and it is validated by the same action. Restating those rules here would
        create a second authority that disagrees with the first the day either
        changes — silently, because whichever ran first would win.

        **Both halves run in one transaction, and the failure that prevents is
        not a tidy one.** A registered user whose guest account never converted
        has two identities with no surface that can join them, because
        conversion is the only thing that ever could and it has been consumed.
        A guest account pointed at a rolled-back `user_id` is a foreign key into
        nothing. Neither is repairable: one person holds at most one `b2c`
        account by partial unique index, so nobody can simply make the missing
        half without first deciding whose addresses win and what happens to
        orders on both sides.

        `origin` stays `guest` after conversion and that is the interesting
        part. The account becomes `b2c` — it has a user now, which is the
        definition — but origin is history, and analytics asking "how many
        customers arrived through the guest door" would otherwise answer zero
        forever.

        **The guest token is revoked by this call** and stops working with this
        response; `meta.guest_token_revoked` says so, so a client does not
        discover it as a `401` on its next request. No session is issued here —
        minting a credential is authentication's job — so the client follows
        with `POST /auth/login`.

        `409 resource.conflict` with `details.reason:
        user_already_has_consumer_account` is the refusal worth reading: somebody
        who ordered as a guest and then registered with an address they already
        had an account under is asking for two, and the merge is a product
        decision this phase declines to invent.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created and the guest account converted.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestConversionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/deletion-requests:
    post:
      operationId: requestGuestDeletion
      tags:
        - Guest
      summary: Ask for a guest's data to be erased
      security: []
      description: |
        **Anonymous, necessarily.** The premise of a guest is that there is no
        account to sign into, so the request arrives as a bare address from
        somebody we cannot identify. That gives this endpoint two properties it
        must hold at once, and they pull against each other: it must not become
        an enumeration oracle, and it must not become a deletion weapon.

        The resolution is to **always accept, never confirm, and require proof
        before acting**. The response is built entirely from the submitted value
        and from configuration — no field is read from the database — so it is
        byte-identical whether the address is one we hold or one nobody has ever
        typed. There is no challenge identifier and no "we sent you a code",
        because a nullable identifier is a boolean in disguise and the boolean is
        "this address is known to us".

        Always `202`. Every alternative status answers the question the `202`
        exists to refuse: a `404` says the address is unknown, a `201` says a
        challenge was created, and a `200` implies the work is done when nothing
        has been erased at all.

        The client's script is therefore identical in both cases: a code will
        arrive if the address is known, and any code entered against an address
        that is not fails exactly the way a wrong code does.

        `422 validation.failed` is reachable and discloses nothing — it is a
        statement about the submitted string being neither an address nor a
        number, derived entirely from what the caller typed.

        **The residual leak is timing**, and it is stated rather than papered
        over: a request for a known address also issues a challenge and queues a
        message. Closing it means a constant-time budget over the whole handler,
        which is not faked here with a sleep that the first slow query would
        defeat.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestGuestDeletionRequest'
      responses:
        '202':
          description: |
            Accepted. The same body whether or not the address is known to the
            platform.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/GuestDeletionAcknowledgement'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /guest/deletion-requests/verify:
    post:
      operationId: confirmGuestDeletion
      tags:
        - Guest
      summary: Prove and carry out a guest erasure
      security: []
      description: |
        **Anonymous.** The passcode comes back and, if it holds, the erasure
        happens.

        **Enumeration resistance survives the second step or it was never
        there.** An attacker told nothing by step one would simply submit six
        digits and read the refusal instead. So there is exactly one failure
        shape, and the list it covers is the point: a wrong code against an
        address we hold, any code against one we do not, an expired challenge,
        and a contact point locked out after repeated failures. The last is the
        least obvious and the most important — a distinct "locked out" is a
        perfect oracle, because only a real contact point can produce it. The
        lockout is enforced and simply not described.

        Hence `202` for a refusal as well as for a purge, and hence no error
        envelope anywhere on this path: a `422` for a bad code would be a
        different-shaped response, and a different shape is a different answer.

        **The success shape is allowed to differ.** `purged: true` and the
        counts appear only when the passcode verified, which means the caller
        demonstrably received a message at that destination and has proven they
        hold it. `purged` is always present, so the two refusal cases cannot be
        told apart by key set either.

        The address is submitted again rather than carried in a challenge
        identifier from step one, for the reason step one has none: a nullable
        identifier would be the disclosure the whole design refuses.

        `orders_retained` in the report is the honest half. A guest order is a
        commercial and tax record with a statutory retention of its own and is
        deliberately not deleted; saying so is what stops "purged" being read as
        "everything is gone".
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGuestDeletionRequest'
      responses:
        '202':
          description: |
            Accepted. One indistinguishable shape for every refusal; the purge
            report only when the passcode held.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/GuestDeletionOutcome'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/email/challenges:
    post:
      operationId: issueEmailVerificationChallenge
      tags:
        - Verification
      summary: Send a passcode to my email address
      description: |
        Issues a six-digit passcode to the caller's own login address and hands
        the message to the queue.

        **Reachable before the email is verified**, and that is the point rather
        than a concession: a caller behind the verification gate could never ask
        for the code that lifts it.

        There is no body. The destination is read from the account rather than
        accepted from the request — an endpoint that took an address would send
        codes to addresses the caller does not hold, and would answer "does this
        address have an account here" one attempt at a time.

        `202`, not `201`: a challenge row exists, but the thing the caller is
        waiting for is an email that has not arrived yet.

        Refusals arrive as `otp.cooldown_active` (a resend inside the 45-second
        window), `otp.locked` (too many failures on this contact) or
        `otp.channel_unavailable` (no driver can reach the destination); the
        first two are `429` and the last is `422`.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          description: The passcode has been queued for delivery.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/email/verify:
    post:
      operationId: verifyEmailWithPasscode
      tags:
        - Verification
      summary: Verify my email address with a passcode
      description: |
        The inline-OTP twin of the signed link. The verification message carries
        both, and this is the half a native client uses: a link opens a browser,
        and the round trip back into the app loses the session often enough to
        be the most common place an onboarding is abandoned.

        Both halves settle **the same two facts** — the contact point is proven
        and `users.email_verified_at` is stamped — inside one transaction, so
        the mirror can never disagree with the account.

        **Reachable before the email is verified**, necessarily.

        No challenge identifier is asked for. There is at most one live
        contact-verification challenge per contact — a partial unique index
        makes that structural — so the server finds the only candidate itself
        rather than asking a client to echo something it would have had to parse
        out of an email.

        No live challenge is `otp.expired` rather than `404`: the challenge is a
        transient credential, the caller has done nothing wrong, and the remedy
        the code names — ask for a new one — is the right one.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPasscodeRequest'
      responses:
        '200':
          description: The address is now verified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactVerifiedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/challenges/{challenge}:
    get:
      operationId: showVerificationChallenge
      tags:
        - Verification
      summary: Read a challenge's state
      description: |
        How long is left, how many attempts remain, when the resend button
        unlocks. A client that has been away — backgrounded on a phone, reloaded
        in a tab — cannot reconstruct a countdown from its own clock without
        being wrong for exactly the users whose clocks are wrong.

        **Never the passcode, and never a hint of it.** Every field is drawn
        from columns that outlive the request; the plaintext exists between
        generation and delivery and nowhere else.

        `is_live` is carried beside `status` because expiry is a moment rather
        than an event: a row stays `pending` past its window until something
        writes the transition, so a client branching on the column alone would
        offer an attempt that cannot succeed.

        A challenge belonging to somebody else is indistinguishable from one
        that does not exist: both are `resource.not_found`.
      parameters:
        - name: challenge
          in: path
          required: true
          description: The challenge identifier, as issued.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The challenge.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/challenges/{challenge}/verify:
    post:
      operationId: verifyChallenge
      tags:
        - Verification
      summary: Submit a passcode against a challenge
      description: |
        Checks the code and, if it is right, marks the destination proven — and
        when that destination is the login mirror, settles
        `users.email_verified_at` in the same transaction.

        The attempt is counted **before** the code is compared, under a row
        lock, so two concurrent requests see attempts 1 and 2 rather than both
        seeing 0, and a process killed between counting and answering has spent
        the attempt rather than granting a free one.

        Every failure has its own code, because the remedies differ:
        `otp.invalid` (422, carries `details.attempts_remaining`) means read the
        message again; `otp.expired` (422) means ask for a new code;
        `otp.attempts_exceeded` (429) means the challenge is burned; `otp.locked`
        (429, carries `details.locked_until`) means the *contact* is locked and a
        fresh challenge will not help either.

        `contact.already_in_use` (409) is possible and only ever on a **verified**
        collision: two people may both claim an address, and refusing an
        unverified claim would let anybody deny an address to its real owner by
        typing it first.
      parameters:
        - name: challenge
          in: path
          required: true
          description: The challenge identifier, as issued.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPasscodeRequest'
      responses:
        '200':
          description: The passcode was correct and the destination is proven.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactVerifiedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/challenges/{challenge}/resend:
    post:
      operationId: resendChallenge
      tags:
        - Verification
      summary: Send the same challenge again
      description: |
        The code is **regenerated** rather than resent, because the plaintext is
        not kept — only its digest is stored, which is the property that makes a
        database dump useless. A resend is therefore a new code on the same
        challenge: the attempt counter and the expiry window carry over, so
        nobody buys three fresh attempts by pressing the button.

        `channel` is optional and its absence means "the same way as last time"
        rather than "the default for this contact" — somebody who chose WhatsApp
        once should not be quietly moved back to SMS. A channel that cannot
        reach the destination is `otp.channel_unavailable` (422) with
        `details.available_channels` naming what would work.

        Inside the cooldown it is `otp.cooldown_active` (429) with
        `details.retry_after_seconds`; past the allowance the challenge simply
        stops resending.
      parameters:
        - name: challenge
          in: path
          required: true
          description: The challenge identifier, as issued.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendChallengeRequest'
      responses:
        '202':
          description: A fresh passcode has been queued for delivery.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/step-up/challenges:
    post:
      operationId: issueStepUpChallenge
      tags:
        - Verification
      summary: Ask for a step-up passcode
      description: |
        A step-up passcode answers a different question from a password
        confirmation. "Does this person know the secret" and "is this person
        present right now" are not the same assurance, which is why the two
        methods are tracked separately, neither satisfies the other, and the
        passcode window is ten minutes against the password's three hours.

        **The destination is chosen by the server** — the primary proven contact
        where there is one, any proven contact otherwise. A caller that could
        name a destination for a challenge unlocking account closure would be
        handed the one decision the server exists to make.

        `purpose` is confined to those that grant a step-up. A code obtained for
        contact verification must never be replayable against a payment change,
        which is what the purpose column exists to prevent.

        Requires a verified email address (`auth.email_unverified` otherwise) —
        a caller who has proven nothing has nowhere to receive a step-up.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpChallengeRequest'
      responses:
        '202':
          description: The step-up passcode has been queued for delivery.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /verification/step-up/confirm:
    post:
      operationId: confirmStepUp
      tags:
        - Verification
      summary: Spend a step-up passcode
      description: |
        Stamps the `otp` step-up method that `step-up:otp` reads, bound to the
        **calling credential** — the personal access token, or the session when
        there is none — so confirming in a browser cannot unlock a sensitive
        action for a phone holding a stolen token.

        The purpose is checked **before** the code is compared, and the ordering
        is the security property: verifying first would spend one of three
        attempts on a challenge that was never going to be honoured, letting an
        attacker burn a victim's allowance by pointing this endpoint at their
        contact-verification challenge. A challenge whose purpose does not grant
        a step-up is `validation.failed` on `challenge_id`.

        Confirming never marks a contact verified. Presence and proof of a
        destination are separate facts, and folding them together would let a
        closure step-up quietly satisfy an activation requirement.

        `expires_in_seconds` is the guard's own timeout rather than a number
        restated by the client, which would guess wrong.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmStepUpRequest'
      responses:
        '200':
          description: The step-up is confirmed for this credential.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpConfirmationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /customer-account:
    get:
      operationId: showCustomerAccount
      tags:
        - Customer account
      summary: My customer account and what it still needs
      description: |
        The account plus the activation checklist, in one call. `outstanding`
        and `checklist` come from the same evaluator that guards activation, so
        the screen and the gate cannot disagree about what is missing — and the
        checklist carries the satisfied items too, because a list showing only
        what is absent loses the sense of progress that makes people finish it.

        **`404` when there is none**, rather than an empty object or an invented
        provisional shape. A kitchen operator has an identity and no customer
        account, and manufacturing one for them would put an onboarding
        checklist in front of somebody who is not onboarding.

        `status` is read-only here and everywhere. Nothing on this surface can
        set an account `active`.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The customer account.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccountEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: openCustomerAccount
      tags:
        - Customer account
      summary: Open, or resume, my customer account
      description: |
        **An unmet requirement is not an error here**, and that is the shape of
        the whole endpoint. Onboarding is interruptible by design: `provisional`
        is a real state in which an account exists, holds addresses and
        declarations, and cannot order. Refusing a caller who has not yet added
        an address would turn a checklist into a form that must be completed in
        one sitting, and would give the client nothing to render.

        **Idempotent, and the status code says which happened**: `201` the first
        time, `200` every time after. One `b2c` account per person is enforced
        by a partial unique index, and the lifecycle converges on the existing
        row rather than colliding with it.

        **Activation is attempted, never requested.** The caller does not ask
        for `active` and could not: the evaluator is consulted and the account
        moves only if nothing is outstanding. An account that were active
        without meeting the requirements is one that can order food with no
        deliverable address and no answer to the allergy question.

        A closed account is never reopened by posting here — closure is
        terminal, and the answer is a new account.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The account already existed; its current state is returned.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccountEnvelope'
        '201':
          description: The account was opened.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccountEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/contacts:
    get:
      operationId: listMyContacts
      tags:
        - Customer account
      summary: My contact points
      description: |
        The destinations this person has told us about, retired ones excluded.

        **The value is served in the clear**, unlike the masked destination on a
        challenge. A mask exists so a challenge can name where a code went
        without telling an unauthenticated caller whose address it is; here the
        audience is the account holder reading their own list, `/me` already
        serves them their own email, and a list of `a•••@example.com` rows is
        one on which nobody can tell which number is the old one.

        `value_hash` appears nowhere and never will — publishing it would turn
        the duplicate-detection index into an oracle for "does this address have
        an account here".

        Not cursor-paginated: a person has a handful of destinations, and
        `meta.count` is what the screen needs.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The caller's live contact points.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContactsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: addMyContact
      tags:
        - Customer account
      summary: Add a contact point
      description: |
        The row is created **unverified**, always. Declaring a destination proves
        that somebody typed it into a form, not that they hold it.

        **Idempotent by channel and value**: adding the same number twice yields
        one contact, so a double tap cannot litter an account with duplicates.
        The response is `201` either way — distinguishing "created" from
        "already yours" would report on the database's history rather than on
        the caller's request, which succeeded in both cases.

        A phone number must already be in E.164. The platform does not infer a
        country code, because guessing one would send somebody else's handset a
        passcode that unlocks this account.

        A value already **proven** by somebody else is `contact.already_in_use`
        (409) — and only when proven, so nobody can deny an address to its real
        owner by typing it first.

        Requires an open customer account; without one the answer is
        `account.verification_required` (403) carrying `account_opened: false`.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerContactRequest'
      responses:
        '201':
          description: The contact point was recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContactEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/contacts/{contact}:
    delete:
      operationId: removeMyContact
      tags:
        - Customer account
      summary: Withdraw a contact point
      description: |
        **Retired, not deleted.** The row survives with a tombstone, which is
        what lets the value be claimed again by somebody else — the partial
        unique index excludes retired rows — while keeping the record of who
        held it, which a closure or an abuse investigation needs. `verified_at`
        is kept for the same reason: the destination *was* proven.

        **The login mirror cannot be withdrawn**, and the refusal is
        `resource.conflict` rather than a validation failure: nothing about the
        request is malformed, and the same request against any other contact
        would succeed. It is where a password reset and a verification message
        are sent, and an account whose only route back in has been retired is
        one nobody can recover.

        A contact belonging to somebody else, or already retired, is
        `resource.not_found`.
      parameters:
        - name: contact
          in: path
          required: true
          description: The contact point identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The contact point was retired.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/contacts/{contact}/primary:
    post:
      operationId: makeContactPrimary
      tags:
        - Customer account
      summary: Nominate the primary contact point
      description: |
        A POST sub-resource action rather than a `PATCH is_primary`: setting the
        flag means clearing it on the incumbent, and the partial unique index
        refuses a second primary, so a caller performing it as a field write
        would collide with itself between the two statements. The transaction
        that demotes and promotes together is the one this endpoint asks for.

        **Step-up protected.** Changing the primary destination is how an
        attacker holding a hijacked session redirects the codes that would
        otherwise stop them — the same class of act as revoking a device, and
        guarded the same way. A caller without a recent confirmation is
        `auth.step_up_required` (403) with `details.confirmation_endpoint`.

        The default is per channel, so promoting a phone leaves the primary
        email alone.
      parameters:
        - name: contact
          in: path
          required: true
          description: The contact point identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The contact point is now primary for its channel.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContactEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/addresses:
    get:
      operationId: listMyAddresses
      tags:
        - Customer account
      summary: My address book
      description: |
        Both types in one list. A checkout wants the delivery addresses and an
        invoice wants the billing one; `address_type` separates them in one
        round trip, where two endpoints would be two calls for one screen.

        `is_deliverable` is computed per row rather than trusted from save time,
        because coverage moves: a zone is paused, a kitchen closes, and an
        address reachable in March is not in April. A book showing only what was
        true when the address was typed would let somebody choose one nothing
        can be sent to, and they would find out at checkout.

        **An empty list when no customer account has been opened**, rather than
        a refusal: a person who has not started onboarding genuinely has no
        addresses, and that is a truer answer than a 403.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The caller's addresses, defaults first within each type.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: addMyAddress
      tags:
        - Customer account
      summary: Add an address
      description: |
        The served-area rule is checked at save time and refused as
        `address.area_not_served` (422) — the area is a perfectly valid
        reference, and what fails is the usefulness of the combination rather
        than its shape.

        Checking now rather than at checkout is deliberate: a person moving to
        an uncovered district is told while they are looking at the address
        form, which is the only moment they can do anything about it. It applies
        to delivery addresses only — an invoice goes wherever the customer says,
        and applying the rule to a billing address would refuse a perfectly good
        one in a city no kitchen reaches.

        The **first** address of a type becomes the default whether or not it
        was asked for: an address book with no default makes the checkout ask a
        question that has exactly one possible answer.

        Requires an open customer account; without one the answer is
        `account.verification_required` (403).
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerAddressRequest'
      responses:
        '201':
          description: The address was added.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/addresses/{address}:
    patch:
      operationId: updateMyAddress
      tags:
        - Customer account
      summary: Correct an address
      description: |
        A partial update rather than a replace, because that is what the act is:
        somebody adds a floor number they left out, or renames "Home". A `PUT`
        would make a client resend every field to change one, and the first
        client that forgot a field would silently erase the directions a driver
        needs.

        **`address_type` is not accepted.** The served-area rule is checked
        against the type the address has and the attributes are written
        afterwards, so a body carrying a new type would be checked under the old
        rule and stored under the new one. Changing what an address is for is a
        new address.

        **`is_default` is not accepted either** — promotion is
        `POST /me/addresses/{address}/default`, which demotes the incumbent in
        the same transaction.

        `delivery_area_id` **is** accepted; moving house is the ordinary case,
        and coverage is rechecked before the write.

        No `If-Match`. The row carries `lock_version` and it is served on every
        read, but this resource has one writer — its owner, on their own device
        — so the race optimistic concurrency exists to solve does not arise.
      parameters:
        - name: address
          in: path
          required: true
          description: The address identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerAddressRequest'
      responses:
        '200':
          description: The address as it now stands.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: removeMyAddress
      tags:
        - Customer account
      summary: Remove an address
      description: |
        A real delete, unlike a contact point. An address is not evidence of
        anything: no account recovery depends on it, no duplicate index has to
        remember it was claimed, and a person who has moved is entitled to have
        their old street stop being stored. The audit trail records that an
        address was removed **without recording the address**.

        Removing the default promotes a replacement inside the same transaction
        — an account with addresses and no default makes the checkout ask which
        one, every time, for no reason.

        Deleting the last delivery address is allowed and will make the account
        unable to activate. That is honest: the checklist says so on the next
        read, and refusing would trap somebody in a district nobody serves.
      parameters:
        - name: address
          in: path
          required: true
          description: The address identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The address was removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/addresses/{address}/default:
    post:
      operationId: makeAddressDefault
      tags:
        - Customer account
      summary: Nominate the default address
      description: |
        A POST sub-resource action, never a `PATCH is_default` (master plan v2
        §4.15), and here the reason is mechanical as well as stylistic:
        promoting means demoting the incumbent, the partial unique index refuses
        a second default per type, and a client doing it as two field writes
        would collide with itself between them.

        The default is **per type**, so promoting a billing address leaves the
        delivery default alone. They answer different questions, and one flag
        serving both would move an invoice to somebody's office because they
        ordered lunch there once.

        An address that is no longer deliverable may still be made default:
        coverage can change back, refusing would leave the account with no
        default at all, and `is_deliverable` on every read says plainly whether
        anything can currently be sent.
      parameters:
        - name: address
          in: path
          required: true
          description: The address identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The address is now the default for its type.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/dietary-profile:
    get:
      operationId: showMyDietaryProfile
      tags:
        - Customer account
      summary: My dietary declaration
      description: |
        The **store of record** for what this person eats. The onboarding wizard
        pre-fills from it and writes back to it, and the meal configurator
        prefers it over anything typed into a basket: one answer in one place,
        so a customer who declared a sesame allergy never has to declare it
        again.

        **`has_declared` is the field to branch on, not an empty allergen
        list.** An unanswered question and a confident "I have none" are
        different facts, and only the second may activate an account that is
        about to be sent food.

        A read that reads: a profile never written is presented as
        `has_declared: false` rather than created on the way past. The same
        answer is given when no customer account has been opened, because
        somebody who has not started onboarding has genuinely declared nothing.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The dietary profile, declared or not.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDietaryProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceMyDietaryProfile
      tags:
        - Customer account
      summary: Record a complete dietary declaration
      description: |
        **A replace, not a merge — which is why it is a `PUT`.** A person
        removing an allergy from the list means they no longer have it, and
        under a merge there would be no way to say so through the ordinary path:
        the set would only ever grow. The client sends the complete set and the
        service swaps it inside one transaction, because a half-applied allergy
        list is the one state this table must never be observed in.

        **`allergens` is required even when empty.** An omitted key and an empty
        array would otherwise mean the same thing on the wire and different
        things to the person — "I did not touch this" against "I have no
        allergies" — and only the second may activate an account.

        Declaring is an act and the act is recorded: `declared_at` is stamped
        for an empty list too, because "I have none" is an answer and it is the
        one the activation gate is waiting for.

        Each exclusion must name **exactly one** of an ingredient, a diet
        classification or free text; naming two or none is `validation.failed`
        on the offending index.

        `200` rather than `201` on first write: the profile is a singleton of
        the account, has no identifier a client navigates to, and cannot be
        created twice.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDietaryProfileRequest'
      responses:
        '200':
          description: The declaration as it now stands.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDietaryProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/consents:
    get:
      operationId: listMyConsents
      tags:
        - Customer account
      summary: My consent position
      description: |
        **One list, not two.** A screen receiving only the outstanding texts
        could not show somebody what they have already accepted, and a person
        who cannot see what they consented to cannot meaningfully withdraw it —
        which is the right the whole ledger exists to serve.

        `status` is computed against the **current version** of each definition,
        not against "has this code ever been granted". A grant is recorded
        against one version; when a text is reissued the old grant stays true
        history and the new version is outstanding again, and a status computed
        from the code alone would report somebody as having accepted words they
        have never seen.

        Filtered to the consumer audience plus the texts everybody holds.
        Without the filter this endpoint would start asking a kitchen's chef to
        confirm they are old enough to order food.

        The body of each text is not served here: it is two long localised
        columns, the list renders as a checklist, and a client wanting the words
        asks for them where they are published.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every consumer consent text and whether the caller holds it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerConsentsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: grantMyConsents
      tags:
        - Customer account
      summary: Record acceptance of consent texts
      description: |
        A list rather than a single code, because that is how the screen works:
        an onboarding step presents several texts with several checkboxes and
        the person ticks them in one act. Splitting that into several requests
        would let a network failure record half a decision, and half a consent
        decision is the one thing a regulator will ask about.

        The grant is written against the **current version** of each definition,
        read at the moment of writing. A client cannot name a version — that is
        the guarantee rather than a limitation, because a body carrying one
        could accept a text that has since been reissued.

        Re-granting something already held is a no-op, so a retried request
        cannot duplicate the audit trail. Unknown codes are skipped rather than
        refused: a client sending one has a stale catalogue.

        `200` with the caller's full position rather than `201` with what was
        written — the answer to a grant is what the person now holds, from the
        same builder `GET /me/consents` uses, so the screen after the tick
        cannot disagree with the screen before it. Skipped codes are visible by
        still being `pending`.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentsRequest'
      responses:
        '200':
          description: The caller's consent position after the grant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerConsentsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/consents/{code}:
    delete:
      operationId: withdrawMyConsent
      tags:
        - Customer account
      summary: Withdraw a consent
      description: |
        **A state transition, never a deletion.** The grant row survives with
        `status = withdrawn` and a timestamp, because "this person consented on
        the 3rd and withdrew on the 9th" is the fact a regulator asks for and a
        deleted row answers neither half of it. The row-level-security policies
        enforce it from underneath: there is no DELETE policy at all.

        **A required consent may be withdrawn**, and the consequence is visible
        rather than prevented — the activation checklist reports it outstanding
        on the next read. Refusing would make a right conditional on not needing
        the service, which is not how consent works.

        Withdrawing something never granted is a no-op and still `204`: the
        caller's intent is satisfied either way, and an opt-out that failed for
        somebody who never opted in would be an unpleasant surprise.

        An **unknown code** is `404` — the one thing this endpoint refuses.
        Answering `204` to a typo would let it look like a successful withdrawal
        forever.
      parameters:
        - name: code
          in: path
          required: true
          description: |
            The consent definition's stable code, never a grant identifier. The
            person is withdrawing "marketing", and which version of it they hold
            is something only the ledger knows.
          schema:
            type: string
            maxLength: 80
            examples:
              - consent.marketing
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The consent is withdrawn, or was never held.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications:
    post:
      operationId: createB2bApplication
      tags:
        - B2B applications
      summary: Begin a B2B application
      description: |
        Creates an empty draft. The body is empty on purpose: a draft is a
        container, and asking somebody to name their company before they have
        seen the form is how a wizard acquires a step nobody wanted.
        Everything arrives through the section PATCHes.

        **One live application per person.** A second attempt while one is in
        progress is `409 resource.conflict` naming the existing application
        and its status, never a silent second draft that orphans the first.

        No permission code. The applicant is a member of nothing; ownership is
        stamped here and is what every later write is checked against.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '201':
          description: The new draft.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listB2bApplications
      tags:
        - B2B applications
      summary: The caller's own applications
      description: |
        Scoped to the caller in the query rather than filtered afterwards:
        `b2b_applications` is deliberately not organisation-scoped and carries
        no row-level-security policy, so the `where` **is** the isolation.

        **Newest first.** There is normally one live application and then a
        tail of history — a withdrawn attempt, a decline from last year — and
        the question this list answers is "where is the one I am filling in".
        The platform queue walks the other way, because a queue is fair in
        arrival order.

        The rows carry the summary shape rather than the full file: a list is
        a navigation aid, and confidential detail belongs on a resource
        somebody deliberately opened.
      parameters:
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of the caller's applications.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/B2bApplicationSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}:
    get:
      operationId: showB2bApplication
      tags:
        - B2B applications
      summary: One application, with its contacts and locations
      description: |
        Returns `ETag: "<lock_version>"` — the client's half of the
        optimistic-concurrency contract: read the resource, keep the
        validator, send it back as `If-Match` when writing a section,
        submitting or withdrawing.

        The contacts and the locations come with it, because opening an
        application and immediately asking "who did we name, and where did we
        say to deliver" is one interaction rather than three, and both sets
        are bounded by what a human typed into one form.

        Documents and agreements are **not** here. Both have their own
        lifecycle and their own review, and folding them in would mean a
        wizard polling a passport scan's review state every time it re-read
        the form.

        `writable_sections` is computed rather than stored, and in
        `info_requested` it is the reviewer's narrowing — a wizard that had to
        infer it from the status alone would reopen the whole form.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The application, its contacts and its locations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/sections/{section}:
    patch:
      operationId: updateB2bApplicationSection
      tags:
        - B2B applications
      summary: Save one step of the wizard
      description: |
        **The section is in the path, not the body**, and that is what makes
        the endpoint honest: a wizard step is a unit of intent, and naming it
        in the URL lets the server refuse a payload that wandered outside it.

        A key the named section does not own is **refused, never ignored**,
        and the refusal says which section does own it. Silently dropping a
        field somebody believed they were saving turns a five-minute bug into
        a support ticket about vanishing data six weeks later.

        In `info_requested` the writable set narrows to the sections the
        reviewer named, and a write to any other section is `409
        b2b.application_state_invalid` carrying `details.writable_sections`.

        `If-Match` is required despite there being one editor, and the reason
        is the reviewer rather than the applicant: a stale tab that saved over
        a narrowing it never saw would put answers into fields the review had
        already closed.

        An unknown `{section}` is `400 request.invalid` with
        `details.parameter`, not a 404 — the application exists, and the
        client sent a word this API does not have.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/B2bApplicationSectionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateB2bApplicationSectionRequest'
      responses:
        '200':
          description: The application after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/contacts:
    put:
      operationId: replaceB2bApplicationContacts
      tags:
        - B2B applications
      summary: Replace the people the company names
      description: |
        Set-replace, not a merge: a client that removed a row has to be able
        to say so, and `{"contacts": []}` is the payload that expresses it.

        **One contact per role.** The four slots are the shape; a duplicate
        role is refused by name. There is no `id` and no ordering, because the
        rows are replaced wholesale and an identifier a client held would be
        stale the moment it was used.

        A contact needs a name and at least one way to reach them. That rule
        is answered per row — `contacts.2.email` — rather than as two
        independent field errors that neither explain.

        **No `If-Match` and no `ETag`.** The set is replaced in one
        transaction, so there is no half-list for a validator to protect, and
        these rows carry no `lock_version` because a per-row validator would
        let two editors replace different halves of one roster.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceB2bApplicationContactsRequest'
      responses:
        '200':
          description: The stored contacts, as normalised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - contacts
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: '#/components/schemas/B2bApplicationContact'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/locations:
    put:
      operationId: replaceB2bApplicationLocations
      tags:
        - B2B applications
      summary: Replace where the company wants food
      description: |
        Set-replace, on the same argument as the contacts endpoint: a company
        that closed an office has to be able to say so, and
        `{"locations": []}` is how.

        `delivery_area_id` anchors a location to the platform gazetteer where
        the gazetteer covers it, and is **optional** because it often does
        not. A corporate park in a city nobody has mapped is still somewhere a
        van can go, and refusing the address until the gazetteer catches up
        would make the platform's incompleteness the applicant's problem.

        At most one primary and at most one billing address. Both are answered
        as errors about the *set*, because blaming an arbitrary row for a
        problem the row does not have helps nobody.

        No `If-Match` and no `ETag`, for the reasons the contacts endpoint
        gives.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceB2bApplicationLocationsRequest'
      responses:
        '200':
          description: The stored locations, as normalised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - locations
                    properties:
                      locations:
                        type: array
                        items:
                          $ref: '#/components/schemas/B2bApplicationLocation'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/documents:
    post:
      operationId: uploadKycDocument
      tags:
        - B2B applications
      summary: Upload an identity or registration document
      description: |
        **`multipart/form-data`** — the one operation in this family that is
        not JSON in. Base64 in a JSON body would inflate every upload by a
        third and put ten megabytes through the request pipeline as a value
        rather than as a file on disk.

        **The client's `Content-Type` and filename decide nothing.** The
        server sniffs the leading bytes, and *that* result becomes
        `mime_type`; the claim is kept in `declared_mime_type` because a
        mismatch is evidence. An unrecognised or unaccepted format is refused
        naming what the platform accepts — never what it thought the file was,
        because that would make this endpoint a scanner people could query.
        The uploader's filename never reaches the object key.

        `signed_agreement` is **not** an acceptable `document_kind` here. A
        countersigned agreement is produced by the signing flow; accepting one
        from a client would let an applicant supply their own idea of what
        they signed.

        `expires_on` is accepted for every kind and stored only for the kinds
        that expire. Refusing it would mean a client had to know the expiry
        table to send a valid request.

        **Re-uploading identical bytes returns the existing document** rather
        than refusing, which is what makes a flaky connection or a
        double-tapped button harmless. The status is still `201`: the client
        asked for the document to exist, and it does.

        Every document B1 stores has `scan_status: not_scanned`. Nothing may
        present it as safe (INT-008).
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadKycDocumentRequest'
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png, image/webp, image/heic
      responses:
        '201':
          description: The stored document's metadata.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocumentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listKycDocuments
      tags:
        - B2B applications
      summary: The document pack — metadata only
      description: |
        **There is no URL in this response and there must never be one.** The
        only route to the bytes is a short-lived signed link from the download
        operation, which records who asked and why. A listing that carried
        links would defeat the expiry, the audit trail and the per-access
        purpose at once — and a listing is exactly the response somebody
        pastes into a chat.

        **Rejected and superseded documents are listed too**, with their
        reasons. An applicant looking at their own paperwork needs to see the
        scan that was turned down and why, or the rejection is a dead end.

        Not paginated: the set is bounded by a checklist of ten document kinds
        plus re-uploads.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every document filed against this application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KycDocument'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/documents/{document}/download:
    get:
      operationId: downloadKycDocument
      tags:
        - B2B applications
      summary: A temporary link to a document's bytes
      description: |
        **A URL in the envelope, not a `302`.** A redirect would be the
        shorter implementation and the worse contract: the link is a signed,
        expiring grant against object storage, and handing it over as data
        means a client knows it holds a credential with a deadline — it can
        show the expiry, refresh before acting, and decline to cache it. A
        redirect makes the same credential invisible, landing it in browser
        history, the referrer chain and every proxy log on the way to the
        bucket.

        **`purpose` is required**, non-blank, and is written onto the access
        audit event. A document read with no stated reason is the read an
        audit trail cannot explain afterwards. Neither the object path nor the
        URL is ever recorded there — either would put a live grant of access
        into a table read by more people than the document is.

        `expires_at` is computed before the signature is minted, so it is
        always at or before the moment the link actually stops working.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/KycDocumentPath'
        - $ref: '#/components/parameters/KycAccessPurpose'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A short-lived signed URL and when it stops working.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocumentDownloadEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/submit:
    post:
      operationId: submitB2bApplication
      tags:
        - B2B applications
      summary: Send the application for review
      description: |
        Its own operation and its own audit event, never a `PATCH status`
        (§4.15). Sending is a decision made once; modelling it as a field
        would put it on the same code path as correcting a typo.

        **The server decides what complete means.** `completed_sections` is
        the applicant's own progress claim and is never consulted: readiness
        is computed from the data actually present *and* from the required
        document kinds, so a checklist enforced only in a wizard is not one an
        API client can skip.

        Both failures come back at once — `details.missing_fields` and
        `details.missing_documents` — because somebody should learn everything
        that is wrong in one round trip. The **code** is
        `422 b2b.documents_incomplete` when anything is missing from the
        document checklist and `422 validation.failed` when only form fields
        are, because those send a client to different screens.

        Duplicate registrations are recorded on the submission event and shown
        to the reviewer. They **surface and never decide**: a second
        application against the same registration is routine, and
        auto-rejecting it would make the platform's convenience the customer's
        problem.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The submitted application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/B2bDocumentsIncomplete'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/withdraw:
    post:
      operationId: withdrawB2bApplication
      tags:
        - B2B applications
      summary: Withdraw the application
      description: |
        The applicant's own exit, and a **different terminal state from a
        decline**. Collapsing the two would make "how many companies did we
        turn down" an unanswerable question, and it would also be a small lie
        told to the person who changed their mind.

        Not a `DELETE`: nothing is removed. The application stays, the
        documents stay, the trail of who applied and what happened stays — and
        the applicant's one live slot is freed, so they may start again.

        `If-Match` decides the race that actually happens here: an applicant
        withdrawing at the moment a reviewer approves. Exactly one may win.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The withdrawn application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/agreements:
    get:
      operationId: listB2bAgreements
      tags:
        - B2B applications
      summary: Every version of the agreement
      description: |
        **All of them, including superseded ones**, which is the point of
        versioning rather than editing. An active agreement is immutable; the
        way to change what is in force is a new version that supersedes the
        old, and a list showing only the current terms would hide the history
        a company needs to answer "what were we on before".
        `supersedes_agreement_id` chains them.

        Not paginated: versions are counted on one hand — a renegotiation is a
        conversation, not an event stream.

        There is no separate consumer shape. An agreement is a document
        *between* two parties, so there is nothing on it the company may not
        see; the one internal field, the passcode challenge behind the
        signature, is reduced to a boolean for everybody.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every agreement version, newest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/B2bAgreement'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/agreements/{agreement}:
    get:
      operationId: showB2bAgreement
      tags:
        - B2B applications
      summary: One version of the terms
      description: |
        Returns `ETag: "<lock_version>"`. Signing does not consume it — the
        service refuses on the agreement's *state*, which is a stronger
        guarantee than "only if nobody edited it since you looked" — but the
        validator is still the honest thing to serve.

        The agreement is resolved **inside** the application in the path, so
        one company's identifier can never reach another's negotiated
        position. That matters more here than anywhere else: a credit limit
        and a price list are the most commercially sensitive rows the platform
        stores.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/B2bAgreementPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The agreement version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bAgreementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/agreements/{agreement}/signature-challenges:
    post:
      operationId: createB2bSignatureChallenge
      tags:
        - B2B applications
      summary: Send the named signatory a passcode
      description: |
        The question this operation answers is not "may this person sign?" but
        "**is this person the one the company said would sign?**" Only the
        second is answerable from the data.

        Three steps, and the order matters.

        1. The application's `signatory_email` is recorded as an
           application-owned contact point — evidence of *who was named*, kept
           whether or not they ever sign, and recorded before the ownership
           check so it survives a refusal.
        2. The authenticated caller must hold that same address as one of
           their own contacts, compared on normalised values so
           `Ali@Example.COM ` and `ali@example.com` are one address. Failing
           this is **403 `b2b.signatory_required`**: the named signatory has
           to sign in and sign for themselves, and an office manager who can
           reach the mailbox is not the person the company bound itself
           through.
        3. The challenge is issued against the **caller's own** contact, so
           `otp_challenges.user_id` is set. A challenge raised against the
           ownerless application contact would carry no user and could never
           satisfy the check signing performs.

        The caller's contact does not have to be verified already: the
        passcode is what proves control of the address, and demanding prior
        proof would be demanding the thing being established.

        `202`, not `201` — a challenge has been raised and a message
        dispatched; whether it arrives is the channel's business.
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/B2bAgreementPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          description: |
            The challenge, with a masked destination, a resend countdown and
            an attempts counter. `debug_code` appears only in local and
            testing environments with code exposure switched on.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/B2bSignatoryRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /b2b/applications/{application}/agreements/{agreement}/sign:
    post:
      operationId: signB2bAgreement
      tags:
        - B2B applications
      summary: Accept the terms
      description: |
        Records click-wrap evidence: the digest of the exact bytes the
        signatory was shown, their typed name, their stated capacity, the
        consent wording verbatim, and keyed digests of the address and user
        agent the acceptance came from. The last two are hashed because their
        job is corroboration, and they are **taken from the request** rather
        than accepted in the body — a client-supplied corroboration is not
        corroboration.

        **A verified passcode is required, not recorded hopefully.** The code
        is spent first, and the service then independently demands a
        *consumed* `b2b_signatory` challenge belonging to the person signing.
        That is not redundant: the service is reachable from a console command
        and a queued job, and a rule that depended on a controller remembering
        to enforce it holds only until somebody adds a second caller.

        The challenge is matched **by owner and by purpose before the code is
        compared**, so a challenge belonging to somebody else, or raised for
        logging in, is refused without spending one of three attempts —
        otherwise anybody could burn a signatory's allowance. All such
        refusals answer `403 b2b.signatory_required` with no detail about
        which condition failed.

        Only an agreement in `pending_signature` may be signed; anything else
        is `409`.

        **This is never a qualified electronic signature** and no surface may
        describe it as one (INT-007 covers real e-sign).
      parameters:
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/B2bAgreementPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignB2bAgreementRequest'
      responses:
        '200':
          description: The agreement, now active.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bAgreementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/B2bSignatoryRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications:
    get:
      operationId: listPlatformB2bApplications
      tags:
        - B2B platform review
      summary: The review queue
      description: |
        **Oldest first**, unlike every other list in the platform. This is a
        queue rather than a feed: the fair order to work applications in is
        the order they arrived, and newest-first would leave a company that
        applied in March behind one that applied this morning for as long as
        the queue keeps growing.

        **Drafts are excluded unless `status=draft` asks for them.** A draft
        is somebody's half-typed form that has not been sent to anybody;
        putting it in a reviewer's queue would show the platform a company's
        private working-out and invite somebody to act on an application that
        was never submitted.

        `query` matches the legal name, the trading name and the reference —
        the three things a person holds when they ring up.

        Requires `b2b_application.view_platform` inside the platform-operator
        organisation.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: |
            Restrict to one workflow state. Omitted, everything except `draft`
            is listed.
          schema:
            $ref: '#/components/schemas/B2bApplicationStatus'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match over the legal name, the trading name and the reference.
          schema:
            type: string
            maxLength: 160
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of the review queue.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/B2bApplicationSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}:
    get:
      operationId: showPlatformB2bApplication
      tags:
        - B2B platform review
      summary: The whole file, as a reviewer sees it
      description: |
        Everything a decision rests on arrives in one response — the answers,
        the people, the sites, the document pack, what the checklist still
        owes, and the duplicate matches — because a reviewer who has to make
        five calls to form one judgement will eventually make four.

        `decision_note` and `reviewed_by` appear here and **only** here: the
        internal half of a verdict is not something the company it concerns
        should read.

        **Documents are metadata only, and opening one is a second
        permission's business.** The pack is listed so a reviewer can see what
        has been filed; fetching the bytes needs `kyc_document.view_platform`,
        which is deliberately narrower — being able to work a queue is not by
        itself a reason to look at somebody's passport.

        `duplicate_matches` is the count and `duplicate_applications` is the
        list behind it. A count with no way to reach the matches is a number a
        reviewer cannot act on. Nothing here is a verdict: duplicates surface
        and never decide.

        Requires `b2b_application.view_platform`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The application, its people, its pack and its duplicates.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationReviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/claim:
    post:
      operationId: claimB2bApplication
      tags:
        - B2B platform review
      summary: Claim an application for review
      description: |
        Stamps the reviewer and takes the application to `in_review`, which is
        what stops two people working the same case in parallel and finding
        out afterwards.

        **`If-Match` is what makes the claim exclusive.** Two reviewers who
        both opened the queue hold the same validator, and the second write
        finds `lock_version` moved and loses with a `409` naming the current
        state. Without it both would succeed and the last one would silently
        own the case.

        There is no unclaim operation, and that absence is deliberate: the
        state machine has no route from `in_review` back to `submitted`,
        because "I picked this up and put it down again" is not a state the
        applicant should watch their application oscillate through. A reviewer
        who cannot finish hands over by asking for information, or by
        deciding.

        Requires `b2b_application.review_platform`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The claimed application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationReviewOnlyEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/request-information:
    post:
      operationId: requestB2bApplicationInformation
      tags:
        - B2B platform review
      summary: Hand the application back with a question
      description: |
        This is what makes `info_requested` worth being a state rather than a
        flag: editing rights go back to the applicant **for named sections
        only**, while the application keeps its place in the queue.

        The narrowing is the point. "We need your trade terms again" reopens
        the trade-terms fields and nothing else, so a company cannot use a
        question about payment as an opportunity to restate a legal name a
        reviewer has already checked against a certificate. Naming **no**
        sections is legitimate and means "we need documents, not answers" —
        nothing on the form reopens.

        `information_request` is prose and is required. What a reviewer needs
        is rarely a field, and a closed vocabulary would force every real
        question through an `other` that says nothing. The applicant reads it
        verbatim.

        The answer rejoins the queue as `submitted` rather than `in_review`:
        whether the same reviewer picks it up again is their decision.

        Requires `b2b_application.review_platform`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestB2bApplicationInformationRequest'
      responses:
        '200':
          description: The application, now awaiting the applicant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationReviewOnlyEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/approve:
    post:
      operationId: approveB2bApplication
      tags:
        - B2B platform review
      summary: Approve the application
      description: |
        **Approval records the decision and creates nothing.** The
        organisation, the trading account and the first invitations arrive
        from the provisioning operation, behind a third permission again. That
        split is the important one: an approval can be revisited and a
        provisioned tenant cannot be un-provisioned, so the person who signs
        off commercially need not be the person trusted to create tenants.

        Both notes are optional, and the asymmetry with a decline is
        deliberate: an approval is self-explanatory, and demanding a sentence
        would produce "approved" typed four hundred times.
        `internal_note` is never served to the applicant; `applicant_message`
        is what the company reads.

        Requires `b2b_application.decide_platform` — the judgement, and a
        **separate code** from working the queue.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveB2bApplicationRequest'
      responses:
        '200':
          description: The approved application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationReviewOnlyEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/decline:
    post:
      operationId: declineB2bApplication
      tags:
        - B2B platform review
      summary: Decline the application
      description: |
        **`applicant_message` is required**, and a blank one is refused. An
        unexplained refusal is not a decision the company can act on: they
        cannot tell whether to correct a document, apply again next year, or
        stop trying. Thirty seconds of a reviewer's time is the difference
        between a decision and a wall.

        A decline is terminal and **distinct from a withdrawal**, which is the
        applicant's own exit. Collapsing them would make "how many did we turn
        down" unanswerable. Declining frees the applicant's one live slot, so
        a company that fixes what was wrong may start again.

        Requires `b2b_application.decide_platform` — the same authority as
        approving, because a refusal is as much a decision as an acceptance.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineB2bApplicationRequest'
      responses:
        '200':
          description: The declined application.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bApplicationReviewOnlyEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/provision:
    post:
      operationId: provisionB2bApplication
      tags:
        - B2B platform review
      summary: Turn an approval into a tenant
      description: |
        One transaction creates the corporate `Organisation`, opens the `b2b`
        `CustomerAccount`, stamps the links back onto the application and its
        agreements, and issues an invitation to every named contact that has
        an email address.

        **No memberships are created.** A membership is granted when a named
        person signs in and accepts their invitation, not when a reviewer
        clicks provision — creating them here would mint access for addresses
        nobody has proved control of, which is the exact failure the
        invitation token exists to prevent.

        **`Idempotency-Key` is mandatory.** Absent or blank is `400
        request.invalid` with `details.header`. A retry with no key against a
        command that creates an organisation, a trading account and a set of
        invitations would be unrecoverable rather than merely wasteful. A
        replay of the *same* request is answered from the stored envelope with
        `Idempotency-Replayed: true`; two genuinely different requests — a
        reviewer with two tabs open — are answered by the service, which finds
        the application already linked and returns the existing records.
        `invitations_issued` is `0` on that path, so a caller can tell a
        replay from fresh work.

        **No `If-Match`.** `If-Match` protects a lost update, and this command
        has no such shape: it refuses unless the status is `approved` and
        refuses to run twice at all. A validator would only stop a reviewer
        who had re-read the file in another tab.

        `200`, not `201`: several records were created and no one of them is
        *the* thing this operation made, so a `Location` header would have to
        pick one and lie about the rest.

        Requires `b2b_application.provision_platform`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: What now exists.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2bProvisioningEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/B2bApplicationStateInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/applications/{application}/documents/{document}/download:
    get:
      operationId: downloadPlatformKycDocument
      tags:
        - B2B platform review
      summary: Open an applicant's identity document
      description: |
        Requires `kyc_document.view_platform`, which is **narrower than the
        application read on purpose**. A KYC pack is identity documents
        belonging to a named person, and being able to work a review queue is
        not by itself a reason to open one.

        `purpose` is required and goes straight onto the audit event. This is
        the operation that rule exists for: an applicant fetching back their
        own upload is unremarkable, and a member of platform staff opening a
        stranger's passport is the access an audit trail must be able to
        explain afterwards. Neither the object path nor the signed URL is
        recorded there.

        A URL in the envelope rather than a `302`, for the reason the
        applicant's operation gives.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/B2bApplicationPath'
        - $ref: '#/components/parameters/KycDocumentPath'
        - $ref: '#/components/parameters/KycAccessPurpose'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A short-lived signed URL and when it stops working.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocumentDownloadEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/documents/{document}/review:
    post:
      operationId: reviewKycDocument
      tags:
        - B2B platform review
      summary: Accept or reject a document
      description: |
        **Two permissions, stacked**: `kyc_document.view_platform` *and*
        `b2b_application.review_platform`. Deciding whether a passport scan is
        acceptable needs both the authority to look at it and the authority to
        work the case; somebody who may open documents but not review
        applications is an auditor, and somebody who may review applications
        but not open documents cannot have formed a view about this one.

        The document is addressed **without its application in the path**,
        unlike every other document operation here: a verdict is about the
        file rather than about the file's owner.

        Accepting **supersedes** the previously accepted document of the same
        kind, so a company that re-uploads a clearer scan has one current
        registration document and the old row stays as the trail of what was
        looked at. A second verdict on the same document is `409` — a decision
        that could be quietly retaken is not a decision.

        A rejection must carry a `rejection_reason` from the closed
        vocabulary, because that half is what the applicant is shown and
        "please re-upload, it was illegible" is actionable where a reviewer's
        private note is not. `note` stays internal.

        No `If-Match`: `kyc_documents` carries no `lock_version`, and the
        already-reviewed conflict is a stronger guarantee than a validator —
        it refuses a second verdict outright rather than only a stale one.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/KycDocumentPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewKycDocumentRequest'
      responses:
        '200':
          description: The reviewed document, with the internal note.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocumentReviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organisations/{organisation}/invitations:
    post:
      operationId: createOrganisationInvitation
      tags:
        - Invitations
      summary: Invite somebody into an organisation
      description: |
        **The token is never in this response.** It is returned exactly once,
        to the mail that carries it; only its SHA-256 reaches the database. So
        a database read, a backup and a replica are all useless for accepting
        an invitation, and the platform genuinely cannot resend the original —
        re-inviting issues a new token and revokes the old, which is both the
        honest behaviour and the safe one.

        Issuing to an address that already has a live offer **supersedes** it
        rather than failing on the partial unique index: two live tokens for
        one seat means revoking one achieves nothing.

        The `{organisation}` in the path must be the one `X-Organisation-Id`
        selected; a mismatch is **404**, because "no such organisation, as far
        as you are concerned" is the honest answer and confirming that another
        tenant exists is not.

        Requires `membership.invite_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OrganisationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganisationInvitationRequest'
      responses:
        '201':
          description: The invitation — without its token.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationInvitationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listOrganisationInvitations
      tags:
        - Invitations
      summary: Who has been offered a place
      description: |
        **Accepted and revoked invitations are listed too**, and only the
        `status` filter narrows to the live ones. An administrator asking "who
        did we invite" needs the ones that were taken up and the ones that
        were withdrawn as much as the ones still outstanding.

        `status` is **derived, not stored** — an invitation is live, accepted,
        revoked or expired, and three of those four are already facts on the
        row. A stored column would be a fourth copy that has to be kept in
        step with a clock, and expiry would be the first thing to drift.

        Newest first: an invitation list is read to find something recent.

        Requires `membership.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OrganisationPath'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Restrict to one derived state.
          schema:
            $ref: '#/components/schemas/OrganisationInvitationStatus'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of invitations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganisationInvitation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organisations/{organisation}/invitations/{invitation}:
    delete:
      operationId: revokeOrganisationInvitation
      tags:
        - Invitations
      summary: Withdraw an outstanding offer
      description: |
        **`DELETE`, but nothing is deleted.** `revoked_at` and `revoked_by`
        are stamped and the row stays, because who was invited and who
        withdrew it is exactly the trail an access review reads. The verb
        describes the effect the caller cares about — the offer is gone — and
        the record of it having existed is not theirs to remove. The retention
        job eventually clears *expired* offers, which are the ones holding an
        address for no remaining purpose; revoked and accepted rows are kept.

        Revoking an already-revoked invitation is a no-op that still answers
        `204`: the caller asked for the offer to be gone and it is gone, and
        making a retry fail would punish a client for a lost response.
        Revoking an *accepted* one is `409`, because the answer there is
        different work — remove the membership.

        Requires `membership.end_organisation` — the same authority as ending
        a membership, because withdrawing an offer somebody has not yet
        accepted and removing somebody who has are the same decision taken at
        two moments.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OrganisationPath'
        - $ref: '#/components/parameters/OrganisationInvitationPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The offer is withdrawn. No body, per the envelope's documented exception.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{token}/accept:
    post:
      operationId: acceptOrganisationInvitation
      tags:
        - Invitations
      summary: Take up an offer of membership
      description: |
        **Authenticated and email-verified, with no organisation context, and
        that absence is the entire point** — the acceptor is not a member of
        anything yet, so requiring a context would mean requiring the
        membership this request exists to create. They must be signed in so
        acceptance is attributable, and verified so the identity is reachable.

        **B1 acceptance is a shell.** The row is marked accepted and the
        membership write is not performed, so `membership_created` is `false`
        and `membership` is `null` on every response. Saying so plainly is the
        point: a response that quietly implied a provisioned member would let
        a client show somebody a workspace they cannot enter. The keys are
        present rather than omitted so the wire shape does not change when the
        write lands.

        **Every failure is the same `404`** — wrong token, expired, revoked,
        already accepted. Distinguishing them would tell somebody holding a
        guessed token that they guessed right.

        The token is a path segment because that is what the emailed link
        carries. The cost is real and worth naming — path segments reach
        access logs, referrer headers and browser history in a way bodies do
        not — and what makes it tolerable is that the token is single-use and
        consumed here, short-lived, stored only as a digest, and useless
        without an authenticated session.
      parameters:
        - $ref: '#/components/parameters/OrganisationInvitationTokenPath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The accepted invitation, and an honest statement that no membership was created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /subscriptions:
    post:
      operationId: createSubscription
      tags:
        - Subscriptions
      summary: Start a subscription
      description: |
        Buying twenty days of food.

        **Not under `/me`, and the asymmetry with `GET /me/subscriptions` is the
        one `/carts` and `/me/orders` already draw**: a creation names no
        existing resource of the caller's, while a list of standing arrangements
        is a *collection of mine*.

        **`Idempotency-Key`, exactly as `POST /orders` carries it**, and this is
        the more expensive of the two: a double tap on a slow connection produces
        a second standing arrangement and the customer finds out when twice the
        food starts arriving every morning. A replay repeats the original
        response exactly — `201` again, with `Idempotency-Replayed: true`. The
        key is optional for the reason it is everywhere: refusing unkeyed
        requests would break every caller that has ever worked, to protect them
        from a risk they may not have.

        The refusal carries **every** reason at once, and the price is resolved
        and captured server-side — there is no field a client could quote a price
        in.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: The subscription, with its captured price and its opening balance.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /subscriptions/quote:
    get:
      operationId: quoteSubscription
      tags:
        - Subscriptions
      summary: What a plan configuration would cost
      description: |
        A quote and not a hold: nothing is reserved and nothing is written.

        **Authenticated rather than anonymous**, which is the one thing about
        this operation worth arguing over. `price_list_items` is the single
        catalogue table with a row-level-security policy, on the ground that a
        negotiated price says what a kitchen will accept and from whom. The
        marketplace's plan pages already carry a *published consumer* price
        through the public projection, which is a different number reached a
        different way; serving this resolver anonymously would hand anybody a
        probe for every tariff a kitchen has attached to a channel, one
        configuration at a time.

        A refusal is a `409`, not an empty `200`: `unpriced`,
        `duration_not_offered`, `duration_ambiguous`, `duration_not_fixed`,
        `plan_not_subscription` and `pricing_basis_unsupported` are all facts
        about the world rather than about the request's shape.
        `pricing_basis_unsupported` names itself deliberately — a per-week plan
        is refused on principle, and collapsing it into "unpriced" would send a
        kitchen hunting for a tariff row that is not missing.

        **Reachable from what the storefront publishes.** The operation used to
        take a `sales_channel_id` and a `plan_duration_id`, and a shopper could
        obtain neither: sales channels live behind `/catalogue/sales-channels`,
        a tenant surface, and the public plan read publishes durations as
        `{code, kind, days}` with no identifier. Both are resolved server-side
        now. The channel comes from the plan's own kitchen and is restricted to
        its *consumer* channels, which is narrower than the validator it
        replaced — a `b2b`, `corporate` or `insurance` tariff can no longer be
        probed through this operation at all. The run is named by its number of
        days, the fact the public projection already carries; nothing was added
        to that projection to make this work.

        `available_weekdays` is the point of the enrichment. Until it existed a
        configurator learnt which days a plan delivers on by pricing the same
        subscription seven times and reading which answers carried a warning.
      parameters:
        - name: catalogue_item_id
          in: query
          required: true
          description: The plan.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: catalogue_item_variant_id
          in: query
          required: true
          description: The configuration — the matrix cell.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: plan_duration_days
          in: query
          required: true
          description: |
            The run being priced, in delivery days — `MarketplacePlanDuration.days`
            from the public plan read. Days rather than the kitchen's own
            duration `code`, because the code is an authored slug and the day
            count is the fact; two offered runs sharing a day count are a
            configuration mistake and are refused `duration_ambiguous` rather
            than guessed between.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The current quote for this configuration on this run.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanQuoteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '409':
          $ref: '#/components/responses/SubscriptionRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions:
    get:
      operationId: listMySubscriptions
      tags:
        - Subscriptions
      summary: The caller's own standing arrangements
      description: |
        **Unpaginated, and unlike the order history that is not a shortcut.** A
        person holds one subscription, or two, or a handful across kitchens; the
        collection has a natural ceiling that order history does not, and a
        cursor on a list nobody can fill would be a parameter to document,
        version and test in exchange for nothing.

        **Live ones first, then the rest by recency.** Somebody opening this
        screen is nearly always looking at what is running now.

        **No `balance` on the list rows.** Computing it counts skipped days per
        subscription, which is a query per row; the list carries
        `remaining_days` and `next_delivery_date` from columns the row already
        holds, and the single read carries the full balance.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every subscription the caller holds, live ones first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}:
    get:
      operationId: showMySubscription
      tags:
        - Subscriptions
      summary: One of the caller's own subscriptions, with its balance
      description: |
        Somebody else's is `404 resource.not_found`, never 403: the row carries a
        delivery address, a weekday pattern and a price somebody negotiated, and
        confirming that a guessed identifier names a real standing arrangement is
        a disclosure on its own.

        Carries an `ETag`. Nothing requires the client to send it back — the
        writes accept `If-Match` rather than demanding it, because a subscription
        has one author and the race would have to be run by a customer against
        themselves — but a client holding two tabs open cannot protect itself
        with a validator it was never given.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The subscription and its balance.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/pause:
    post:
      operationId: pauseSubscription
      tags:
        - Subscriptions
      summary: Stop the deliveries, keep the days
      description: |
        A POST sub-resource action, never a `PATCH status`. Pausing, resuming and
        cancelling are three decisions with three consequences, three timestamps
        and three journal events; a status field would collapse them into one
        write a client could aim anywhere.

        **Nothing here consumes a balance day**, and the response carries the
        balance so the screen can say so rather than implying it. A paused
        subscription has no `next_delivery_date` at all.

        The refusal a customer most often sees is `inside_cut_off`: the next
        delivery is nearer than the plan's window allows, so it proceeds and the
        pause takes effect after it.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The paused subscription and its untouched balance.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/resume:
    post:
      operationId: resumeSubscription
      tags:
        - Subscriptions
      summary: Start again from the first day a change can still reach
      description: |
        The response's `next_delivery_date` is the whole answer, and is why this
        is not a `PATCH status`: resuming does not restart from tomorrow, it
        restarts from the first weekday the subscription delivers on that is
        still outside the plan's change window — because a resume producing a
        delivery the customer had no chance to stop would be worse than one that
        waited a day.

        `exhausted` is the refusal worth knowing about: a spent balance cannot be
        resumed, and the answer is a renewal rather than a change.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The resumed subscription, with the recomputed next delivery date.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/cancel:
    post:
      operationId: cancelSubscription
      tags:
        - Subscriptions
      summary: End a subscription and record what is owed
      description: |
        **The credit memo comes back in the same response, and that is the point
        of the operation rather than a convenience.** The refund is recorded as
        an obligation for manual settlement — no money moves — and a customer
        who cancels twelve unused days of a plan they paid for is owed a number
        on the screen at that moment. A client that had to make a second call
        would render "cancelled" with nothing beside it, which reads as "and that
        is that".

        `credit_memo` is **null** when nothing is owed, which is not the same as
        an empty object: a zero memo would be an obligation somebody eventually
        tries to settle.

        There is no DELETE. A cancelled subscription keeps its captured price and
        its history, because the memo multiplies the price it actually paid and a
        deleted row could not explain the number.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: The cancelled subscription and the credit memo, or null when nothing is owed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCancellationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/skips:
    post:
      operationId: skipSubscriptionDay
      tags:
        - Subscriptions
      summary: Skip one delivery day
      description: |
        **A sub-collection rather than an action, because a skip is a thing that
        exists afterwards**: it creates a delivery row for the named day with
        `status: skipped_customer` and `consumed: false`, which the ledger then
        shows. `201` for the same reason.

        **It costs nothing, and the response proves it** — the balance comes back
        beside the created day so the screen can show `remaining_days` unchanged.

        The row is written *before* the day is ever generated, which is what
        makes the unique index on `(subscription_id, delivery_date)` the thing
        that stops generation producing an order for a day already skipped.
        Skipping a settled day is `already_settled` rather than a silent no-op:
        the food is coming and the customer needs to know.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipSubscriptionDayRequest'
      responses:
        '201':
          description: The skipped day, and the unchanged balance beside it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSkipEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/address:
    put:
      operationId: updateSubscriptionAddress
      tags:
        - Subscriptions
      summary: Move a subscription to another of the caller's addresses
      description: |
        **A `PUT` on a named sub-resource rather than a `PATCH` on the
        subscription**, and the three of address, window and weekdays are
        separated because each asks a different question of the world. Changing
        the address re-runs the delivery map — the kitchen may not go to the new
        area at all — while changing the window asks nothing of it. A single
        `PATCH` accepting all three would have to run every check on every call,
        and a client changing a delivery slot would be refused because it moved
        house in the same body.

        **The subscription follows the customer; the orders already placed do
        not.** Each generated order snapshots the address at placement, so
        somebody who moves has tomorrow's delivery follow them while last week's
        still says where it went.

        `area_not_served` and `zone_suspended` are worth rendering distinctly:
        the first means nobody delivers there, the second that this kitchen's
        zone is suspended and somebody else might.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionAddressRequest'
      responses:
        '200':
          description: The subscription, now delivering to the named address.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/window:
    put:
      operationId: updateSubscriptionWindow
      tags:
        - Subscriptions
      summary: Change which slot the food arrives in
      description: |
        The lightest of the three replacements: it asks nothing of the delivery
        map and nothing of the plan's rights, only whether the next delivery is
        still changeable.

        `null` is a legal value and means "no preference"; the field is required
        and nullable so that both saying and unsaying are expressible.

        The code is **not** checked against the branch's configured windows.
        Which slots a kitchen offers on which weekdays is scheduling data that
        changes without reference to standing subscriptions, and validating here
        would turn a kitchen retiring a slot into a refusal on somebody else's
        unrelated edit.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionWindowRequest'
      responses:
        '200':
          description: The subscription, with its new delivery window.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/weekdays:
    put:
      operationId: updateSubscriptionWeekdays
      tags:
        - Subscriptions
      summary: Change which weekdays the subscription delivers on
      description: |
        A replacement rather than a merge: dropping Wednesday means no longer
        wanting Wednesday, and a merge cannot express a removal.

        **The generation cursor is recomputed, and the response is where a client
        sees it.** The old one may name a day the subscription no longer delivers
        on, and a cursor pointing at a day that will never come is a subscription
        that silently stops.

        **The balance does not change.** Fewer weekdays means the same number of
        days spread over more calendar time, not fewer days.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionWeekdaysRequest'
      responses:
        '200':
          description: The subscription, with the new weekday set and the recomputed next delivery date.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/choices:
    put:
      operationId: replaceSubscriptionChoices
      tags:
        - Subscriptions
      summary: Choose ahead on a Free Selection day
      description: |
        **One day per call, named in the body rather than in the path.** A date
        is not an identifier of anything — the delivery row usually does not
        exist yet, which is the whole point — so `.../choices/{date}` would be a
        path segment that looks like a resource and is not one.

        **An empty `meals` array is a real payload**: it is a customer saying "I
        have not chosen; send me the kitchen's default".

        Only `customer`-source rows are replaced. A `substituted` row is
        generation's record that something chosen was unsafe and what went
        instead, and letting a later `PUT` delete it would erase the substitution
        audit — the one audit an allergy complaint needs most. A day that has
        already been generated is refused outright rather than partially
        rewritten.

        **No allergen verdict in the response, and that is deliberate.** Safety
        is checked at generation against the customer's declarations as they
        stand *then*; answering "this is safe" here would be a verdict that goes
        stale the moment somebody adds an allergy, and a client once told "safe"
        would have no reason to ask again.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSubscriptionChoicesRequest'
      responses:
        '200':
          description: The day's chosen meals as recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionChoicesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubscriptionChangeRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/subscriptions/{subscription}/deliveries:
    get:
      operationId: listSubscriptionDeliveries
      tags:
        - Subscriptions
      summary: The subscription's ledger
      description: |
        **The rows that exist, and only those.** Deliberately *not* the
        customer's version of the kitchen's projection: it lists real delivery
        days — generated, skipped, delivered — newest first. What is *coming* is
        `next_delivery_date` plus the weekday pattern, which the client already
        holds; serving projections here would put days into somebody's ledger
        that nothing has committed to, and the first support question would be
        why a delivery "disappeared" when the plan was paused.

        **The meal choices ride along**, carrying `source` and
        `replaced_catalogue_item_id`: the substitution promise is worth nothing
        if the only place it is recorded is an audit table.

        `unsafe_allergen_classes` is not served — it is health data, and what a
        customer needs from this screen is that a substitution happened, not a
        restatement of their medical profile on a delivery row.
      parameters:
        - $ref: '#/components/parameters/SubscriptionPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every delivery day this subscription has, newest first, with the balance in `meta`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDeliveriesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/subscription-schedule:
    get:
      operationId: listSubscriptionSchedule
      tags:
        - Subscriptions
      summary: The kitchen's forward book of standing arrangements
      description: |
        **The operation that makes one-day-ahead generation affordable.** A
        single delivery is generated ahead so the order book stays truthful, and
        the obvious objection is that a kitchen then cannot see next week. It
        sees next week here: the delivery rows that exist, laid over the weekday
        patterns of every active subscription, bounded by each one's remaining
        balance. **Nothing on this path writes anything** — a projection that
        materialised rows would be the phantom orders the design exists to avoid,
        and would have to be un-materialised on every skip, pause and
        cancellation.

        **Every row says whether it is `actual` or `projected`**, and a kitchen
        planning production must never confuse them: an actual day has an order
        behind it, and a projected one is a customer who has not yet had the
        chance to skip. `meta.daily_counts` is the number a production plan is
        built from, with skipped and cancelled days already excluded.

        `subscription.view_organisation` — not `order.view_organisation`, because
        a subscription is a standing commercial arrangement with a captured price
        and reading today's order list is not by itself a reason to see who is
        committed to what and for how long; and not
        `plan.manage_organisation`, because a production planner needs to read
        the schedule without being able to change what the kitchen sells.

        Organisation-scoped, not branch-scoped: a manager with an
        organisation-wide membership selects no branch, and an operation reading
        `X-Branch-Id` would show them nothing until they picked one.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/SubscriptionScheduleFrom'
        - $ref: '#/components/parameters/SubscriptionScheduleTo'
        - $ref: '#/components/parameters/SubscriptionScheduleBranch'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The window's deliveries, actual and projected, with the daily counts in `meta`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionScheduleEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/closure-requests:
    post:
      operationId: openClosureRequest
      tags:
        - Account closure
      summary: Ask to stop the marketing, or to be forgotten
      description: |
        **One operation for both scopes, because it is one screen.** Somebody who
        has decided to stop hearing from a service is frequently deciding whether
        to stop being a customer, and making them find two different pages is how
        a platform ends up with an opt-out nobody could find and a closure nobody
        meant.

        **The status says which half happened.** `marketing_opt_out` comes back
        `200` already `completed` — the consents are withdrawn and the
        suppression written before the response returns, because the expectation
        is that "stop emailing me" has taken effect by the time the page reloads.
        `full` comes back `202`: accepted, passcode in flight, nothing erased.

        **A blocked request is a `202`, not an error.** `blocked` and `blockers`
        are fields in a successful body and the request survives so somebody can
        come back when their last order has arrived. No passcode is sent for a
        request that cannot proceed — asking somebody to prove their identity for
        an act already decided against is friction for nothing.

        **No step-up middleware**, and this is the most destructive act a
        customer can perform. The journey carries a stronger proof of its own: a
        passcode sent to the account's verified destination and bound to *this
        request* on its row. A purpose-scoped step-up flag would stop a
        contact-verification code unlocking a closure and would not stop *a*
        closure code finalising *another* one.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenClosureRequestRequest'
      responses:
        '200':
          description: A marketing opt-out, already completed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAcknowledgementEnvelope'
        '202':
          description: A full closure, accepted. A passcode is in flight, or the request is blocked and says so.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAcknowledgementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '409':
          $ref: '#/components/responses/ClosureRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/closure-requests/live:
    get:
      operationId: showLiveClosureRequest
      tags:
        - Account closure
      summary: The closure request in flight, and what stands in its way
      description: |
        **`/live` rather than an index, because there is at most one.** A
        collection would be a list that is always empty or a singleton, and every
        client would have to write `[0]`. Completed and cancelled requests are
        deliberately not listed at all: a history of somebody's previous attempts
        to leave is not something the platform has a reason to hand back.

        **`closure_request` is null when nothing is in flight, and `blockers` is
        filled in regardless.** That pairing is the operation: a closure screen
        has to render *before* anybody asks, and re-evaluating on render is what
        makes it truthful — a subscription started this morning is exactly what a
        verdict cached on the request row would miss.

        The verdicts include `advisory` ones, so a client must branch on `status`
        rather than on the presence of a row. `blocked` summarises the `blocking`
        ones alone.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The live request if there is one, and the freshly evaluated blockers either way.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveClosureRequestEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/closure-requests/{closureRequest}/verify:
    post:
      operationId: verifyClosureRequest
      tags:
        - Account closure
      summary: Prove a closure with the passcode
      description: |
        **The authenticated user is the actor, always**, and that is not
        decoration: the server refuses when the actor is not the person the
        request is about. Support may *open* a closure on somebody's behalf and
        may never finish one, because staff who could do both would be staff who
        can erase anybody.

        **There is no separate challenge operation.** The passcode is issued when
        the request is opened and bound to it on the row, which is what stops a
        code obtained for one closure finalising another. A client that needs a
        fresh code uses `POST /verification/challenges/{challenge}/resend`; a
        second issuing surface here would be a second place for the binding to be
        got wrong.

        **A blocked request comes back `200` and stays `verified`.** The person
        proved who they were, and making them do it again after their last order
        arrives would be punishing them for the platform's scheduling.

        Otherwise the request moves to `scheduled` and finalisation is queued for
        the moment the grace window closes — zero-length by default.
        `scheduled_for` is the moment after which there is nothing left to
        cancel.

        Every way of failing the passcode — mistyped, expired, superseded, locked
        out — answers `422 otp.invalid` with nothing that tells them apart.
      parameters:
        - $ref: '#/components/parameters/ClosureRequestPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyClosureRequestRequest'
      responses:
        '200':
          description: The proven request — scheduled, or still verified and blocked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAcknowledgementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClosureRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/closure-requests/{closureRequest}:
    delete:
      operationId: cancelClosureRequest
      tags:
        - Account closure
      summary: Call off a closure request
      description: |
        **A `DELETE` that stamps rather than removes.** The row is marked
        `cancelled` with `cancelled_because`, and who asked to leave and then
        changed their mind is exactly the trail a data-protection enquiry reads.
        Nothing is erased by cancelling an erasure.

        **It answers with the row rather than `204`.** Somebody calling off an
        account deletion needs to see that it is off, not an empty body.

        Legal up to and including `scheduled`. After finalisation there is
        nothing left to cancel — the data is gone — and offering it would be an
        undo that does not exist.
      parameters:
        - $ref: '#/components/parameters/ClosureRequestPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The cancelled request.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledClosureRequestEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClosureRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/customer-accounts/{account}/closure-requests:
    post:
      operationId: openClosureRequestForCustomer
      tags:
        - Account closure
      summary: Open a closure on a customer's behalf
      description: |
        Support opening a closure — a phone call, an accessibility need.

        **Support may open one and may never finish one**, and that asymmetry is
        the entire reason this is separate from the customer's own operation.
        There is no platform `verify` route and there never will be: the passcode
        goes to the *customer's* verified destination, the server refuses a
        support actor entering it, and the customer's inbox is the second factor
        — the only one they have.

        **Two gates.** `platform.context` asserts the selected organisation *is*
        the platform operator; `customer_account.close_platform` asserts the
        member holds the code. A tenant that somehow acquired the permission
        still cannot reach this, because an organisation type is not something a
        tenant can grant itself — and this is the one operation on the platform
        that starts the deletion of a named person's data.

        **Keyed on the customer account rather than the user**: an agent is
        looking at an account, and an operation taking a `users` identifier would
        make "which person is this login" a lookup against a table they have no
        other reason to read. `b2c` only — a corporate account belongs to the
        company, outlives the individual who opened it, and is offboarding's to
        end. An account with no owner is `422`: closure is about an identity, and
        a guest has their own deletion journey.

        The actor is recorded and every audit row carries
        `purpose_of_use = support` rather than `self_service`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - name: account
          in: path
          required: true
          description: The customer account whose owner is being closed.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenClosureRequestRequest'
      responses:
        '200':
          description: A marketing opt-out, already completed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAcknowledgementEnvelope'
        '202':
          description: A full closure, accepted. The passcode has gone to the customer.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureAcknowledgementEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClosureRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings:
    post:
      operationId: startOffboarding
      tags:
        - B2B offboarding
      summary: Serve notice and open a wind-up
      description: |
        **Platform-driven, with no organisation-side variant.** A tenant does not
        decide that its own trading relationship ends. An organisation *request*
        to be offboarded is a real future need and is deferred rather than
        approximated: it needs a state before `notice_served` and a human
        decision at the platform, and an operation that let a company put itself
        straight into `notice_served` would look like the same thing while ending
        its own trading with nobody in the loop.

        **`201`, and what it creates is the wind-up rather than the ending.**
        Notice is served, `effective_on` is computed once from the agreement's
        own `notice_period_days` and copied onto the row, and nothing has been
        taken away from anybody. Every subsequent step is a separate deliberate
        act, because revocation ends people's access to a system they use for
        work.

        An organisation already being wound up is refused here as well as by the
        partial unique index, so an operator gets a sentence rather than a
        constraint violation.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOffboardingRequest'
      responses:
        '201':
          description: The wind-up, at `notice_served`, with its computed effective date.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}:
    get:
      operationId: showOffboarding
      tags:
        - B2B offboarding
      summary: Where a wind-up has got to
      description: |
        **The states exist so an operator can see where a wind-up has stalled**,
        which is the whole reason nothing cascades. So the shape carries every
        stage's timestamps rather than a single `status` and a guess.

        `allowed_transitions` travels with the row: a screen renders buttons, and
        a client that had to reimplement the state machine to know which ones to
        enable would be a second copy of it — the one that disagrees after the
        first change.

        The `ETag` is served, and none of the actions demands `If-Match`: the
        transitions are guarded by the state machine, which is a stronger
        guarantee than "only if nobody touched it since you looked" —
        `signed_off` to `signed_off` is illegal whatever validator a caller
        holds.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The wind-up in full.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/settlement-checks:
    post:
      operationId: runOffboardingSettlementChecks
      tags:
        - B2B offboarding
      summary: Run every settlement check and record what each found
      description: |
        **A sub-collection rather than an action, because re-running is the
        normal case.** The company pays, somebody runs the checks again, and
        `settlement_pending` to `settlement_pending` is a legal transition for
        exactly that reason.

        **The response is where the honesty lands.** A check that cannot run
        reports `not_applicable` with a reason rather than `clear`, so a screen
        renders "2 clear, 1 not checked (no payments module)" instead of "all
        clear" — a summary that reads as an all-clear when it is a gap is the
        specific failure this shape exists to prevent.

        A clear assessment moves the wind-up to `awaiting_signoff` in the same
        call and writes **two** audit rows: "the checks ran" and "settlement
        resolved" are separate facts, and a wind-up that jumped straight to
        `awaiting_signoff` would leave no record that anything was ever checked.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The wind-up with the assessment recorded, moved to `awaiting_signoff` if everything was clear.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/settlement-waiver:
    post:
      operationId: waiveOffboardingSettlement
      tags:
        - B2B offboarding
      summary: Set aside an outstanding settlement position
      description: |
        The escape hatch, treated as one.

        **A second permission, stacked on top.**
        `b2b_offboarding.waive_settlement_platform` beside
        `b2b_offboarding.manage_platform`: driving a wind-up is an operational
        job, while deciding that a company may stop owing money and leave anyway
        is a commercial concession, and the two are not the same person on any
        organisation chart. A waiver reachable by everybody who can click through
        the other eight steps would be the escape hatch quietly becoming the
        path.

        The service demands a **callable authoriser** rather than reading a code
        itself, and the argument is required so a call site cannot default it to
        true by omission — which is what keeps a console command or a queued job
        from reaching this without consulting anything.

        **The waiver writes its own audit action**, never `settlement_cleared`,
        because a waiver recorded as a clearance erases the only difference a
        dispute turns on. The reason is required and is carried on the row.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveOffboardingSettlementRequest'
      responses:
        '200':
          description: The wind-up, settlement waived, at `awaiting_signoff`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/signoff-challenges:
    post:
      operationId: issueOffboardingSignoffChallenge
      tags:
        - B2B offboarding
      summary: Send the signatory their sign-off passcode
      description: |
        **To the agreement's signatory, never to whoever is driving the
        wind-up.** The destination is resolved from the agreement's
        `signatory_user_id` through that person's login contact — the one row
        that must agree with the login identity — so there is no question which
        of somebody's addresses is meant and no way for an operator to nominate
        one. The person who signed a company in is the person who signs it out.

        **That makes this different in kind from the agreement-signing
        challenge**, where the caller *is* the signatory and the code goes to
        their own contact. Here the caller is a platform operator and the
        recipient is somebody else entirely, which is why the response says only
        that a code was sent and where, in the masked form the verification
        module authors.

        `202`: a challenge is a message in flight, not a resource the caller may
        then read.

        An agreement naming a signatory the platform cannot reach is a `422` and
        a real state rather than a defect — the answer is to amend the agreement,
        not to invent a destination.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          description: The challenge, with a masked destination and a countdown. Never the code.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/signoff:
    post:
      operationId: signOffOffboarding
      tags:
        - B2B offboarding
      summary: Record the signatory's acceptance
      description: |
        **The permission is necessary and nowhere near sufficient.** The server
        demands a challenge that exists, carries purpose `b2b_signatory`, has
        been *consumed*, and belongs to the caller — so an operator driving the
        wind-up cannot sign it off from their own session, because they hold no
        such challenge. All four failures answer identically as
        `403 b2b.signatory_required`.

        **The passcode is verified before this operation, not by it.** The
        challenge must already be spent through
        `POST /verification/challenges/{challenge}/verify`, which is deliberate:
        evidence a caller asserts is not evidence, and an operation that also
        accepted the code would be one round trip in which both the proof and the
        thing it proves are claimed by the same request.

        Settlement is checked before the evidence: a wind-up whose settlement is
        neither cleared nor waived answers
        `409 offboarding.settlement_outstanding` with every blocker named.

        The two session hashes are computed server-side from what the connection
        carried and are deliberately not served back.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOffOffboardingRequest'
      responses:
        '200':
          description: The wind-up, signed off, with the evidence recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingSettlementOutstanding'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/revoke-access:
    post:
      operationId: revokeOffboardingAccess
      tags:
        - B2B offboarding
      summary: Start taking access away
      description: |
        **The irreversible one, and the only step in this family that carries
        `Idempotency-Key`.** Everything before it can be called off; from here it
        cannot, because "cancelling" a revocation would mean silently re-granting
        access somebody deliberately removed.

        The key is optional, as everywhere else. The state machine already
        refuses a second call — `revoking` to `revoking` is not a legal
        transition — so the key buys a clean replayed envelope rather than the
        only line of defence.

        **`202`: the transition is written here and the work is done by a job.**
        Ending every membership in an organisation, deleting tokens and closing
        the organisation is more work than a request should hold, and a queued job
        can be retried — the property the one step that can partially fail most
        needs. The response comes back at `revoking` with the counts still null;
        read the wind-up to see them fill in.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          description: The wind-up at `revoking`. The work is queued.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/archive:
    post:
      operationId: archiveOffboarding
      tags:
        - B2B offboarding
      summary: Purge the people, keep the company
      description: |
        **Re-runnable on purpose, which is why it has no `Idempotency-Key`.**
        `archiving` to `archiving` is a legal transition so a partial failure is
        retried rather than declared finished, and every write inside is
        idempotent — nulling an already-null column and bringing forward an
        already-past retention deadline both do nothing the second time. A replay
        guard would refuse the retry this step is designed to accept.

        **What goes and what stays is the decision worth reading.** The named
        contacts' names, emails, phones and notes go; the signatory block on the
        application goes; identity documents are made *due* rather than deleted,
        so the purge job removes them through the one code path that knows to
        delete the object before the row. What survives is the legal entity —
        legal name, registration number, tax number, incorporation date — because
        a corporate record carries retention obligations the people named on it do
        not.

        `archive.legal_entity_retained` is stated rather than left to be inferred
        from the summary's silence.

        The wind-up reaches `completed` in the same call — the one place this
        family does cascade, and barely: the purge either finished or it threw,
        and a state between "archived everything" and "done" would be one nothing
        could ever leave.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The completed wind-up, with the purge summary.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/cancel:
    post:
      operationId: cancelOffboarding
      tags:
        - B2B offboarding
      summary: Call a wind-up off
      description: |
        **A POST rather than a DELETE**, unlike a customer's own closure request,
        and the difference is what the caller is doing: an operator cancelling a
        wind-up is recording a commercial decision about a relationship that
        continues, and it needs a written reason a `DELETE` has nowhere to put.

        Legal right up to the moment memberships start ending, and not
        afterwards. From `revoking` the only legal transition is `archiving`: the
        honest answer to "can we undo this" is no, and re-granting access
        somebody deliberately removed is a different act needing a different
        door.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOffboardingRequest'
      responses:
        '200':
          description: The cancelled wind-up, with the reason on the row.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OffboardingRefused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/exports:
    post:
      operationId: requestRecordExport
      tags:
        - B2B offboarding
      summary: Ask for the company's records, packaged
      description: |
        **Nested under the wind-up rather than under the organisation**, which is
        a deliberate narrowing: a top-level export operation would package every
        record a company holds, available whenever anybody wanted one. Nesting it
        means an export is always attached to a reason. A standalone export
        surface is a real future need — a data-subject request against a
        corporate customer — and it should arrive with its own reason rather than
        by widening this one.

        **Its own permission, stacked on top.**
        `record_export.create_platform` beside
        `b2b_offboarding.manage_platform`: taking a complete copy of everything a
        company gave the platform is a different act with a different risk, the
        same argument that makes the KYC document read narrower than the
        application read.

        **`202`, because requesting is not building.** Assembling the bundle
        reads an organisation's whole history and hashes it; doing that inside a
        request would make the latency a function of how long a company has been
        a customer. The response comes back `requested` with no size and no
        digest.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          description: The bundle request. Building is queued.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordExportEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /platform/b2b/offboardings/{offboarding}/exports/{export}:
    get:
      operationId: showRecordExport
      tags:
        - B2B offboarding
      summary: Read a bundle, and optionally take a copy
      description: |
        **One operation for the status and the download, and `?purpose=` is what
        separates them.** Without it this is a read — the manifest, the row
        counts, the digest, whether it is ready. With it, a fifteen-minute signed
        URL is minted and the access is recorded as a `Confidential` read with
        the stated reason. Two operations would mean a client polling for
        readiness had to poll one and then call the other, and the second would
        be the one whose audit rows said "downloaded" for every poll.

        **The URL is in the envelope, never a 302.** A redirect would put an
        expiring credential into browser history, the referrer chain and every
        proxy log on the way to the bucket.

        **Fifteen minutes rather than the five a KYC document gets**: a bundle is
        a large download over whatever connection the recipient has, and a URL
        that expires mid-transfer is a failure the person cannot diagnose.
        Fifteen rather than a day, because a signed URL is a bearer credential
        and every extra hour is another hour it can be forwarded.

        A bundle that is still building, that failed, or whose window has closed
        is `409 record_export.unavailable` with `details.status` — never a 404,
        because the caller is looking at a row they may see.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/OffboardingPath'
        - $ref: '#/components/parameters/RecordExportPath'
        - $ref: '#/components/parameters/RecordExportPurpose'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The bundle, with a signed download URL when a purpose was stated.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordExportEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecordExportUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: healthy360_session
      description: |
        The Sanctum first-party session cookie, issued by `POST /auth/login`
        to clients whose `Origin` is a configured stateful domain.

        Before the first state-changing request the client calls
        `GET /sanctum/csrf-cookie` (outside `/api/v1`, part of the session
        handshake rather than the resource API) and then sends the
        `X-XSRF-TOKEN` header taken from the `XSRF-TOKEN` cookie.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A Sanctum personal access token from `POST /auth/token`, bound to a
        registered device and revocable at `DELETE /me/devices/{device}`.
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
      description: |
        The opaque capability token issued once by `POST /guest/sessions`
        (G1). It is not an authentication credential and names nobody: it
        carries a *capability* — a basket, and after a verified contact the
        right to place one order against it — and expires in seventy-two
        hours.

        Its own header rather than `Authorization`, so that a client holding
        both a personal access token and a guest token cannot send the wrong
        one by accident and a proxy cannot confuse the two.

        Unknown, expired, revoked and insufficiently graded all answer
        `401 guest.session_invalid` with nothing that tells them apart —
        distinguishing them would only help somebody who does not already hold
        the token.
  headers:
    XCorrelationId:
      description: |
        The server-generated correlation identifier for this request (UUIDv7).
        Returned on every response and repeated in the body.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
    ETag:
      description: |
        The current `lock_version` of a lock-versioned resource, quoted. A
        client keeps it and sends it back as `If-Match` when it writes.
      required: true
      schema:
        type: string
        examples:
          - '"3"'
    IdempotencyReplayed:
      description: |
        Present and `true` when the response was replayed from a stored
        envelope rather than produced by running the command again. A client
        that retried after a lost response can tell the difference between
        "it worked this time" and "it had already worked".
      required: false
      schema:
        type: string
        examples:
          - 'true'
  parameters:
    XOrganisationId:
      name: X-Organisation-Id
      in: header
      required: false
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XOrganisationIdRequired:
      name: X-Organisation-Id
      in: header
      required: true
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: |
        The active branch. Validated against the membership scope: a
        branch-scoped membership may only work inside its own branch.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Locale negotiation. Regional subtags are accepted.
      schema:
        type: string
        examples:
          - ar-LB
          - en
    XClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      description: |
        An opaque client-generated identifier for support correlation. Logged
        and echoed back; never used as the correlation identifier.
      schema:
        type: string
        maxLength: 128
    XAppMode:
      name: X-App-Mode
      in: header
      required: false
      description: The build family. Diagnostic only; never an authorisation input.
      schema:
        type: string
        enum:
          - customer
          - staff
          - kiosk
          - driver
          - all-dev
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: The client version, for diagnostics and deprecation telemetry.
      schema:
        type: string
        examples:
          - 1.4.0
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: The client platform.
      schema:
        type: string
        enum:
          - web
          - ios
          - android
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `ETag` the resource was last served with. Required on writes to
        lock-versioned resources: absent is **428**
        `request.precondition_required`, stale is **409** `resource.conflict`
        carrying `details.current_lock_version`. `*` is accepted and means
        "as long as the resource exists".
      schema:
        type: string
        examples:
          - '"3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen key that makes this command safe to retry (§4.14). The
        same key with the same request body replays the original envelope,
        status included, and carries `Idempotency-Replayed: true`. The same key
        with a *different* body is **409** `request.idempotency_key_reused` —
        the caller has reused a key that already means something else.

        Keys are scoped per endpoint and per caller and are honoured for
        twenty-four hours. The client attaches one deliberately; it is never
        inferred server-side.
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        As `Idempotency-Key`, but mandatory. Used where the command creates
        records that cannot be un-created — provisioning a tenant — and where
        a retry with no key would therefore be unrecoverable rather than
        merely wasteful. Absent is **400** `request.invalid`.
      schema:
        type: string
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `meta.next_cursor` of the previous page. Opaque — echo it back,
        never construct one. A cursor this endpoint did not issue is
        `400 request.invalid`, never a silent restart from the beginning.
      schema:
        type: string
        maxLength: 200
    CursorLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MarketplaceKitchenPath:
      name: kitchen
      in: path
      required: true
      description: The kitchen's identifier or its slug.
      schema:
        type: string
        maxLength: 160
    MarketplaceMealPath:
      name: meal
      in: path
      required: true
      description: The meal's identifier or its slug.
      schema:
        type: string
        maxLength: 160
    MarketplacePlanPath:
      name: plan
      in: path
      required: true
      description: The subscription plan's identifier or its slug.
      schema:
        type: string
        maxLength: 160
    IngredientPath:
      name: ingredient
      in: path
      required: true
      description: The ingredient identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    AllergenCodePath:
      name: code
      in: path
      required: true
      description: The canonical allergen class code.
      schema:
        $ref: '#/components/schemas/AllergenCode'
    RecipePath:
      name: recipe
      in: path
      required: true
      description: The recipe identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecipeVersionPath:
      name: version
      in: path
      required: true
      description: |
        The version identifier, or its `version_number`. Both are accepted
        because both are natural — a client that walked the list holds
        identifiers, a human reading a technical sheet holds "version 3" — and
        a number cannot be mistaken for a UUID. The version is always resolved
        inside the recipe in the path, so one recipe's number can never reach
        another's version.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            pattern: ^\d+$
    CatalogueItemPath:
      name: item
      in: path
      required: true
      description: |
        The item identifier, or its `slug`. Both are accepted because both are
        natural — a client that walked the list holds identifiers, a
        marketplace integration or a support engineer holds
        `harissa-paste-250g` — and a slug is unique per organisation and
        immutable, so the two answers cannot drift apart.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 140
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    SalesChannelPath:
      name: channel
      in: path
      required: true
      description: The channel identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PriceListPath:
      name: priceList
      in: path
      required: true
      description: |
        The price list identifier, or its `code`. Both are accepted for the
        reason the sales-channel path gives: a client that walked the list
        holds an identifier, an operator or an importer holds
        `greenlife-b2b-usd`, and the code is unique per organisation.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PlanCombinationPath:
      name: combination
      in: path
      required: true
      description: The meal combination identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    EnergyBandPath:
      name: band
      in: path
      required: true
      description: The energy band identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PlanDurationPath:
      name: duration
      in: path
      required: true
      description: The plan duration identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    XBranchIdRequired:
      name: X-Branch-Id
      in: header
      required: true
      description: |
        The active branch. Validated against the membership scope: a
        branch-scoped membership may only work inside its own branch.

        Required here rather than optional, because the resource *is* one
        branch's. An absent header is `400 context.branch_required` — the
        endpoint refuses rather than guessing which location the caller meant.
      schema:
        $ref: '#/components/schemas/Uuid'
    DeliveryZonePath:
      name: zone
      in: path
      required: true
      description: The delivery zone identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    DeliveryWindowPath:
      name: window
      in: path
      required: true
      description: The delivery window identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 30
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    CartPath:
      name: cart
      in: path
      required: true
      description: |
        The basket identifier. An identifier only — a cart has no stable code a
        human would hold, and there is nothing to guess at.
      schema:
        $ref: '#/components/schemas/Uuid'
    CartItemPath:
      name: item
      in: path
      required: true
      description: The basket line identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderPath:
      name: order
      in: path
      required: true
      description: |
        The order identifier. **Not** the order number, tempting though it is:
        the number is printed on a receipt that passes through a courier's
        hands, and a URL that accepted it would turn a scrap of paper into an
        address. The number is searchable through `GET /catalogue/orders`,
        behind the read permission.
      schema:
        $ref: '#/components/schemas/Uuid'
    B2bApplicationPath:
      name: application
      in: path
      required: true
      description: |
        The application identifier, or its `reference`. Both are accepted
        because both are natural — a client that walked the list holds
        identifiers, and a person reading an email holds `B2B-2026-7F3A9C21`
        — and a reference cannot be mistaken for a UUID.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            pattern: ^[A-Za-z0-9-]{6,40}$
    B2bApplicationSectionPath:
      name: section
      in: path
      required: true
      description: |
        The wizard step being saved. The section is in the path so the server
        can refuse a payload that wandered outside it; an unknown value is
        `400 request.invalid` with `details.parameter`, not a 404.
      schema:
        $ref: '#/components/schemas/B2bApplicationSection'
    B2bAgreementPath:
      name: agreement
      in: path
      required: true
      description: The agreement version's identifier. Always resolved inside the application in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    KycDocumentPath:
      name: document
      in: path
      required: true
      description: The document identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    KycAccessPurpose:
      name: purpose
      in: query
      required: true
      description: |
        Why the document is being opened, written verbatim onto the access
        audit event. Required and non-blank: a document read with no stated
        reason is the read an audit trail cannot explain afterwards, and an
        optional argument is one every call site eventually omits. Blank or
        absent is `400 request.invalid` with `details.parameter`.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        examples:
          - kyc_review
          - support_query_4821
    OrganisationPath:
      name: organisation
      in: path
      required: true
      description: |
        The organisation identifier. Must match the organisation
        `X-Organisation-Id` selected; a mismatch is **404**, never 403 —
        confirming that another tenant exists is not something this API does.
      schema:
        $ref: '#/components/schemas/Uuid'
    OrganisationInvitationPath:
      name: invitation
      in: path
      required: true
      description: The invitation identifier. Always resolved inside the organisation in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    OrganisationInvitationTokenPath:
      name: token
      in: path
      required: true
      description: |
        The single-use token from the invitation email. Never an identifier —
        only its SHA-256 is stored, so this value cannot be recovered from the
        platform and a lost one is replaced by re-inviting.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    SubscriptionPath:
      name: subscription
      in: path
      required: true
      description: |
        The subscription identifier. Always resolved inside the caller's own
        customer account: somebody else's is `404 resource.not_found`, never a
        403, because the row carries a delivery address, a weekday pattern and
        a price somebody negotiated.
      schema:
        $ref: '#/components/schemas/Uuid'
    ClosureRequestPath:
      name: closureRequest
      in: path
      required: true
      description: |
        The closure request identifier, always resolved inside the caller's own
        identity. Somebody else's is `404 resource.not_found`: the row says that
        a named person is leaving and why.
      schema:
        $ref: '#/components/schemas/Uuid'
    OffboardingPath:
      name: offboarding
      in: path
      required: true
      description: The offboarding identifier. Platform-only; there is no tenant read path.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecordExportPath:
      name: export
      in: path
      required: true
      description: |
        The records bundle identifier, always resolved *through* the offboarding
        in the path. An export resolved by identifier alone would let a caller
        read one company's bundle through another company's wind-up.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecordExportPurpose:
      name: purpose
      in: query
      required: false
      description: |
        Why the bundle is being taken, written verbatim onto the access audit
        event. **Its presence is what turns a status check into a download**:
        without it the operation reads the manifest and nothing is issued; with
        it a fifteen-minute signed URL is minted in the envelope and the access
        is recorded as a `Confidential` read. Blank is
        `400 request.invalid` with `details.parameter` — an access with no
        stated reason is the access an audit trail cannot explain afterwards.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        examples:
          - handover_to_customer
          - dsar_response_4821
    SubscriptionScheduleFrom:
      name: from
      in: query
      required: false
      description: The first day of the window. Defaults to today.
      schema:
        type: string
        format: date
    SubscriptionScheduleTo:
      name: to
      in: query
      required: false
      description: |
        The last day of the window. Defaults to thirteen days after `from`, and
        may be at most **sixty** days after it: the projection is
        O(subscriptions x days), so an unbounded window is a request a client can
        make that the kitchen cannot afford. Beyond that is
        `400 request.invalid` with `details.max_window_days`.
      schema:
        type: string
        format: date
    SubscriptionScheduleBranch:
      name: branch_id
      in: query
      required: false
      description: |
        Narrow to one production site. A *narrowing* of a book the caller can
        already see, never a widening of one they cannot — which is why it is a
        query filter and not `X-Branch-Id`.
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Accepted:
      description: Accepted for delivery.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: boolean
                    const: true
              meta:
                $ref: '#/components/schemas/Meta'
    LoginOutcome:
      description: |
        The sign-in resolved. `two_factor_required: false` means a session now
        exists; `true` means the client must complete
        `POST /auth/two-factor-challenge`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - two_factor_required
                properties:
                  two_factor_required:
                    type: boolean
              meta:
                $ref: '#/components/schemas/Meta'
    PasswordConfirmationStatus:
      description: The step-up state of the calling credential.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - confirmed
                  - timeout_seconds
                properties:
                  confirmed:
                    type: boolean
                  timeout_seconds:
                    type: integer
                    minimum: 0
                    description: How long a confirmation remains valid.
              meta:
                $ref: '#/components/schemas/Meta'
    TwoFactorStateResponse:
      description: |
        The two-factor state of the account. `enabled` means a secret exists;
        `confirmed` means two-factor authentication is armed and will be
        demanded at the next sign-in.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/TwoFactorState'
              meta:
                $ref: '#/components/schemas/Meta'
    RecoveryCodes:
      description: Single-use recovery codes.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - recovery_codes
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
              meta:
                $ref: '#/components/schemas/Meta'
    RequestInvalid:
      description: |
        The request could not be processed as sent — typically a session
        endpoint reached without a first-party `Origin`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.invalid
              message: This endpoint serves first-party session clients only; native clients must use /api/v1/auth/token.
              details:
                required_headers:
                  - Origin
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextRequired:
      description: |
        A context the endpoint needs was not supplied —
        `context.organisation_required` for a missing `X-Organisation-Id`, and
        `context.branch_required` for a missing `X-Branch-Id` on the
        branch-scoped operations. Distinct from
        `context.branch_out_of_scope` (403): the caller has not asked for a
        branch they may not have, they have not asked for one at all.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_required
              message: An X-Organisation-Id header is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    Unauthenticated:
      description: No usable credential was presented.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.unauthenticated
              message: Authentication is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    EmailUnverified:
      description: The address has not been verified.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.email_unverified
              message: Your email address must be verified before you can use this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    StepUpRequired:
      description: |
        The action is sensitive and needs a recent password confirmation.
        **HTTP 403, never 423** (plan §13).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.step_up_required
              message: This action requires you to confirm your password again.
              details:
                confirmation_endpoint: /api/v1/auth/confirm-password
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextDenied:
      description: |
        The organisation or branch could not be validated for this person. The
        message never reveals whether the organisation exists.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_forbidden
              message: You do not have an active membership in the requested organisation.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextOrPermissionDenied:
      description: |
        The context was refused (`context.organisation_forbidden`,
        `context.branch_out_of_scope`) or the membership's roles do not grant
        the required permission (`authz.permission_denied`, with the denying
        RBAC step in `details.reason`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: authz.permission_denied
              message: You do not have permission to perform this action.
              details:
                reason: permission_not_granted
                permission: organisation.view_current
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    NotFound:
      description: The resource does not exist, or is not the caller's to see.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.not_found
              message: The requested resource does not exist.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    InvalidCredentials:
      description: |
        The credentials were rejected. Deliberately not a field-level
        validation error: clients branch on the code.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.invalid_credentials
              message: These credentials do not match our records.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ValidationFailed:
      description: The submitted data is invalid.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: The submitted data is invalid.
              details:
                fields:
                  email:
                    - The email field must be a valid email address.
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    TooManyRequests:
      description: The rate limit for this endpoint was exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit.exceeded
              message: Too many requests. Please retry later.
              details:
                retry_after_seconds: 47
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PreconditionRequired:
      description: |
        The resource is lock-versioned and the write carried no `If-Match`.
        **HTTP 428, not 409 and not 400**: the client has not lost a race — it
        never entered one — and the fix is to read the resource and retry with
        its validator.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.precondition_required
              message: This resource requires an If-Match header carrying the version you last read.
              details:
                required_headers:
                  - If-Match
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ResourceConflict:
      description: |
        The change conflicts with the current state. On a lock-versioned
        write this is a lost race, and `details.current_lock_version` is the
        value to reload against, so a client can offer "reload" or "keep
        mine" without a second round trip.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This resource changed since you last read it. Reload it and reapply your change.
              details:
                current_lock_version: 4
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    AllergenBaselineWeakened:
      description: |
        The submitted data is invalid. On an allergen replacement this is
        usually the upgrade-only rule:
        `details.weakened_allergen_classes` names the platform baseline
        classes the request would have dropped or weakened.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: An organisation mapping may add to the platform allergen baseline but never weaken it.
              details:
                fields:
                  mappings:
                    - The platform baseline for this ingredient must be kept or strengthened.
                weakened_allergen_classes:
                  - gluten
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    RecipeArchiveBlocked:
      description: |
        The recipe still has a published version.
        `details.published_version_ids` names them. Withdrawing something from
        sale is retiring the version — its own action, its own permission —
        not a side effect of archiving.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This recipe still has a published version. Retire it before archiving the recipe.
              details:
                published_version_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    IngredientArchiveConflict:
      description: |
        Three codes share this status, because three different things can be
        wrong and the remedies differ.

        **`catalogue.in_use`** — the ingredient is still named by a recipe
        version that has not been retired. `details.recipe_ids` and
        `details.recipe_version_ids` name them, so the caller knows what to
        retire first. Retired versions are never a blocker: history is allowed
        to reference an archived ingredient.

        **`resource.conflict`** — either the ingredient is already archived, or
        the write lost a race and `details.current_lock_version` is the value
        to reload against.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This ingredient is still used by a recipe version that has not been retired.
              details:
                recipe_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41
                recipe_version_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    VersionImmutableOrConflict:
      description: |
        Either the version is frozen (`catalogue.version_immutable` — it is
        published or retired, and no amount of reloading will make it writable;
        the answer is a new draft version) or the write lost a race
        (`resource.conflict`, carrying `details.current_lock_version`). Two
        codes, because the remedies are different.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.version_immutable
              message: A published recipe version cannot be changed. Create a new draft version instead.
              details:
                status: published
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PublishBlocked:
      description: |
        The readiness evaluator refused. `details.reasons` carries **every**
        blocker rather than the first one found — a gate that reveals one
        problem per attempt turns a five-minute fix into five round trips.
        Each entry is a stable machine `reason` plus whatever identifies the
        offending rows.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This recipe version is not ready to be published.
              details:
                reasons:
                  - reason: line_quantity_missing
                    line_numbers:
                      - 2
                      - 5
                  - reason: ingredient_requires_review
                    ingredient_ids:
                      - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d43
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    AllergenUnmapped:
      description: |
        At least one line ingredient carries no allergen determination at all.
        Its own code rather than a `publish_blocked` reason because the fix is
        in a different place — the ingredient's mapping editor — and because
        silence must never be mistaken for a clean result. An ingredient
        passes when it holds a mapping row in any layer, **or** when its
        `verification_status` is `verified`, which is how "checked, and it
        carries nothing" is recorded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.allergen_unmapped
              message: Every ingredient in a published recipe must carry an allergen determination.
              details:
                ingredient_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d44
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    CatalogueItemPublishBlocked:
      description: |
        The K1.4 readiness gate refused. `details.reasons` carries **every**
        blocker rather than the first one found, so a kitchen fixes them in one
        pass.

        The vocabulary is `item_quarantined`, `item_not_a_draft`,
        `translation_incomplete`, `no_active_variant`, `no_allergen_basis` and
        `linked_recipe_quarantined`. The full readiness evaluator will add
        reasons to this list rather than replace the mechanism.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This catalogue item is not ready to be published.
              details:
                reasons:
                  - reason: translation_incomplete
                    fields:
                      - name_ar
                  - reason: linked_recipe_quarantined
                    recipe_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41
                    recipe_version_ids:
                      - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PriceListConflict:
      description: |
        The write conflicts with the state of the price list. `details.reason`
        distinguishes the cases, so a client knows whether to reload or to do
        something different:

        - `currency_locked` — the list already holds prices, so its currency
          cannot move. `details.current_currency`, `details.requested_currency`
          and `details.entry_count` say why. The answer is a new list.
        - `channel_assignments_active` — the list is still assigned to the
          channels in `details.sales_channel_ids`. Detach it first.
        - no `reason` — a plain lost race: the `If-Match` validator was stale,
          and `details.current_lock_version` carries the current one. Reload
          and retry.

        An archived list also answers `409` on every write.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This price list already holds amounts in USD. A currency cannot be changed under existing prices — create a new list instead.
              details:
                reason: currency_locked
                current_currency: USD
                requested_currency: AED
                entry_count: 312
                current_lock_version: 4
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PriceListPublishBlocked:
      description: |
        The activation gate refused. `details.reasons` carries **every**
        blocker rather than the first one found, the rule the recipe and
        catalogue-item gates already follow.

        The vocabulary is `price_list_not_a_draft`, `no_open_rows` and
        `amount_status_mismatch`. The last is structurally unreachable — a
        CHECK constraint refuses the combination at the database — and is
        stated anyway, because "the database would have stopped it" is not
        something a client can see.

        Note what is **not** a blocker: placeholder and market-priced rows.
        They are welcome on an active list, and the public projection is what
        keeps them from a customer.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This price list is not ready to be activated.
              details:
                reasons:
                  - reason: no_open_rows
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PlanCellConflict:
      description: |
        A matrix cell is already held by a different configuration —
        `details.existing_configuration` names its `code`, and
        `details.cell_index` points at the offending entry in the submission.

        The occupant may be **archived**, and that is the case worth
        understanding: a withdrawn cell keeps its coordinates because a price
        row still points at its variant, so re-selling that cell means reviving
        that configuration rather than opening a second one at the same address.

        Also served for a stale `If-Match`, as everywhere else.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This matrix cell already exists on this plan as configuration "lunch-dinner-standard".
              details:
                cell_index: 0
                existing_configuration: lunch-dinner-standard
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    DeliveryAreaConflict:
      description: |
        A place is already served by another zone **at the same scope**, and
        `details.occupying_zones` names it by `code` while
        `details.conflicts` pairs each offending area with the zone holding it.

        The rule is one area, one zone **per branch**. An organisation-wide
        zone and a branch-scoped zone may both claim the same area — that is
        the override, resolved branch-first — so this conflict only ever means
        two zones at *one* scope.

        `details.scope` says which scope collided: `organisation` for the
        organisation-wide map, `branch` for one location's.

        Also served for a stale `If-Match`, as everywhere else.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: Another zone at the same scope already serves one of these areas. An area is served by one zone per branch — move it out of the other zone first.
              details:
                reason: area_already_served
                scope: organisation
                conflicts:
                  - delivery_area_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
                    delivery_zone_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40
                occupying_zones:
                  - beirut-inner
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    B2bApplicationStateInvalid:
      description: |
        The application cannot make the move that was asked for.
        `details.status` is where it is, `details.requested_status` is where
        the caller wanted it, and `details.allowed_transitions` is what it
        *can* do — so a client learns the state machine from the refusal
        rather than from documentation it may not have read.

        Distinct from a plain `resource.conflict` on purpose: a reviewer's
        console has to tell "somebody got there first" from "that is not a
        move this application can make", and those are different screens.

        `details.current_lock_version` rides along, because a caller that lost
        an `If-Match` race needs the current validator to retry with.

        The section PATCH answers this code for a second reason — writing to a
        section the reviewer has not reopened — and then carries
        `details.writable_sections` instead.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: b2b.application_state_invalid
              message: An application that is declined cannot become approved.
              details:
                status: declined
                requested_status: approved
                allowed_transitions: []
                current_lock_version: 7
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
    B2bDocumentsIncomplete:
      description: |
        The application is not complete enough to send. **Both lists come back
        at once** — `details.missing_fields` and `details.missing_documents` —
        because an applicant should learn everything that is wrong in one
        round trip rather than one field at a time.

        This code is used when the *document* checklist is short. When only
        form fields are missing the answer is `422 validation.failed` with the
        same two lists, because finding a certificate and filling a blank
        field are different journeys and a client should not have to parse a
        details bag to know which screen to open.

        `missing_documents` names **kinds**, not files. A rejected or
        superseded document does not count towards the requirement; a pending
        one does, because review happens after submission and requiring an
        accepted document to submit would be a loop with no entrance.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: b2b.documents_incomplete
              message: This application is not complete enough to send yet.
              details:
                missing_fields:
                  - signatory_title
                missing_documents:
                  - signatory_identification
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
    B2bSignatoryRequired:
      description: |
        Signing requires the person the company **named** as its signatory,
        proving they are present with a passcode sent to the address on the
        application.

        One code covers every way of failing that, and carries no detail about
        which: the application has not named a signatory; the caller does not
        hold the named address; the challenge does not exist, belongs to
        somebody else, was raised for another purpose, or has not been spent.
        A caller holding somebody else's challenge identifier learns only that
        it did not work.

        The fix is never a permission. The named signatory signs in and signs
        for themselves — an office manager who can reach the mailbox is not
        the person the company bound itself through.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: b2b.signatory_required
              message: Only the signatory this application names may sign it. Ask them to sign in with the address on the application and sign for themselves.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
    SubscriptionRefused:
      description: |
        The subscription cannot be started as it stands, with **every** reason
        at once. `details.reasons` is a list of `{reason, ...context}`.

        All of them rather than the first, and the argument is sharper than it
        is for a checkout: a plan is a longer, more considered purchase, and
        telling somebody one problem per attempt — the plan is not published,
        now the duration is not offered, now nobody delivers to your address —
        is three round trips through a form they have already filled in.

        Its own code rather than `order.placement_refused`, which the domain
        borrowed while the error vocabulary was closed to it: a client branches
        on the code to decide which screen to render, and a checkout basket and
        a twenty-day plan are not the same screen.

        `GET /subscriptions/quote` answers with this code too, for the subset of
        reasons that are about the plan and its price — `plan_not_subscription`,
        `unpriced`, `duration_not_offered`, `duration_ambiguous`,
        `duration_not_fixed`, `pricing_basis_unsupported`.

        `duration_ambiguous` is the one that names a *configuration mistake*
        rather than a limit: the quote resolves a run by its number of days, and
        two offered runs sharing a day count cannot be told apart. It carries the
        competing `codes`, so a kitchen reading its own error can see which two.
        Guessing between them would quote one discount and capture the other.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: subscription.refused
              message: This subscription cannot be started as it stands.
              details:
                reasons:
                  - reason: duration_not_offered
                    plan_duration_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
                  - reason: area_not_served
                    delivery_area_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40
                    served_by_anyone: false
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    SubscriptionChangeRefused:
      description: |
        The change cannot be made to the subscription as it stands.

        **Mostly this is the change window.** Skip, pause, resume, address,
        window, weekdays and meal choices all take effect only for deliveries
        more than the plan's `change_cutoff_hours` away, and inside that window
        the next delivery proceeds as scheduled. `inside_cut_off` carries
        `cut_off_at` and `effective_from`, so a client can say "changes to
        Tuesday closed at 18:00 on Monday; the earliest day you can change is
        Wednesday" rather than "no".

        The rest of the vocabulary: `not_permitted` (the plan itself forbids the
        right — the kitchen's stored `skip_allowed` / `pause_allowed`, not an
        assumption), `invalid_transition`, `already_settled`,
        `not_a_delivery_day`, `exhausted` (the balance is spent and the answer
        is a renewal), `stale_version`, `address_not_owned`,
        `address_not_deliverable`, `area_not_served`, `zone_suspended`,
        `weekdays_empty`, `weekdays_invalid`, and for meal choices
        `meal_unknown`, `meal_not_a_meal` and `meal_not_published`.

        A 409 rather than a validation failure: the request is well-formed and
        the customer meant it. What has happened is that time passed.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: subscription.change_refused
              message: This change cannot be made to the subscription as it stands.
              details:
                reasons:
                  - reason: inside_cut_off
                    delivery_date: '2026-08-11'
                    cut_off_hours: 24
                    cut_off_at: '2026-08-09T21:00:00+00:00'
                    effective_from: '2026-08-13'
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ClosureRefused:
      description: |
        A closure request the platform will not handle as asked.
        `details.reason` is a stable string.

        **This is not the code for a blocked closure**, and the distinction is
        the whole shape of the journey. A blocker — open orders, a live
        subscription, a pending signature — is information a customer acts on,
        comes back inside a `200`/`202` acknowledgement as `blocked` and
        `blockers`, and leaves the request alive so they can return when their
        last order has arrived. An error code there would turn a checklist into
        a failure.

        What this code covers: `closure_already_in_flight` (a second request
        while one is still going somewhere — refused rather than silently
        returning the existing one, because the two may differ in scope and
        quietly handing back an older request would answer a question nobody
        asked), `closure_not_awaiting_verification`, `closure_not_cancellable`,
        and `closure_no_verifiable_contact`.

        Three closure refusals deliberately answer with **other** codes: a
        support actor trying to finish somebody else's erasure is
        `403 authz.permission_denied`, a passcode that did not verify is
        `422 otp.invalid` (one indistinguishable shape for wrong, expired,
        superseded and locked out), and a reason outside the vocabulary is
        `422 validation.failed`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: closure.refused
              message: A closure request is already in progress for this account.
              details:
                reason: closure_already_in_flight
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    OffboardingRefused:
      description: |
        The offboarding cannot do that from where it is. `details.reason` names
        which — `offboarding.already_in_flight`,
        `offboarding.transition_not_allowed`, `offboarding.no_active_agreement`
        — and `details.allowed_transitions` names what *is* legal from here, so
        a wind-up screen renders buttons from the refusal rather than
        reimplementing the state machine.

        `already_in_flight` is refused here as well as by the partial unique
        index, so an operator gets a sentence rather than a constraint
        violation, and the index stays as the thing nothing can route around.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: offboarding.refused
              message: An offboarding that is revoking cannot become cancelled.
              details:
                reason: offboarding.transition_not_allowed
                status: revoking
                requested_status: cancelled
                allowed_transitions:
                  - archiving
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    OffboardingSettlementOutstanding:
      description: |
        Sign-off refused because settlement is neither cleared nor waived.
        `details.blockers` names **every** outstanding check rather than the
        first: somebody winding up a relationship wants the list, not a sequence
        of discoveries.

        Its own code rather than `offboarding.refused` because the remedy is
        different and a client has to branch on it — settle, or waive through
        `POST .../settlement-waiver` with a written reason and the second
        permission.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: offboarding.settlement_outstanding
              message: Settlement is not resolved, so this offboarding cannot move to sign-off.
              details:
                reason: offboarding.settlement_outstanding
                blockers:
                  - open_buyer_orders
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    RecordExportUnavailable:
      description: |
        The bundle exists and cannot be downloaded. `details.status` says which
        of the three it is: still `building` or `requested`, `failed`, or
        `expired` — the window has closed and `purgeExpired` has deleted the
        bytes while keeping the row, because deleting the row would erase the
        evidence that an export was ever made.

        A 409 rather than a 404 deliberately: the caller is looking at an export
        that exists and that they may see, and a 404 would be a lie about a row
        in front of them.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: record_export.unavailable
              message: This bundle is not available to download.
              details:
                reason: record_export.not_downloadable
                status: building
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
  schemas:
    Uuid:
      type: string
      format: uuid
      description: A UUIDv7 identifier (plan §8).
      examples:
        - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
    Meta:
      type: object
      required:
        - correlation_id
      properties:
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: true
      description: |
        Envelope metadata. Always carries the correlation identifier;
        collections add `count`, and `/me` adds `permissions_version`.
    ErrorCode:
      type: string
      description: |
        The stable Healthy360 error vocabulary. Mirrors
        `Healthy360\Support\Api\ErrorCode`; a Pest test asserts the two agree.
      enum:
        - validation.failed
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.email_unverified
        - auth.two_factor_required
        - auth.two_factor_invalid
        - auth.step_up_required
        - auth.csrf_token_mismatch
        - auth.invalid_signature
        - context.organisation_required
        - context.organisation_forbidden
        - context.branch_out_of_scope
        - context.branch_required
        - authz.permission_denied
        - request.invalid
        - request.precondition_required
        - request.idempotency_key_reused
        - resource.not_found
        - resource.conflict
        - catalogue.in_use
        - catalogue.version_immutable
        - catalogue.allergen_unmapped
        - catalogue.publish_blocked
        - otp.invalid
        - otp.expired
        - otp.attempts_exceeded
        - otp.cooldown_active
        - otp.locked
        - otp.channel_unavailable
        - contact.already_in_use
        - account.verification_required
        - address.area_not_served
        - guest.session_invalid
        - cart.line_refused
        - order.placement_refused
        - b2b.application_state_invalid
        - b2b.documents_incomplete
        - b2b.signatory_required
        - subscription.refused
        - subscription.change_refused
        - closure.refused
        - offboarding.refused
        - offboarding.settlement_outstanding
        - record_export.unavailable
        - rate_limit.exceeded
        - server.internal_error
    Error:
      type: object
      required:
        - code
        - message
        - details
        - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A safe, human-readable summary. Never a stack trace.
        details:
          type: object
          description: |
            Structured, code-specific detail. `validation.failed` carries a
            `fields` map of field name to messages; `authz.permission_denied`
            carries the denying RBAC step; `auth.step_up_required` carries the
            confirmation endpoint.
          additionalProperties: true
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    User:
      type: object
      required:
        - id
        - email
        - email_verified
        - two_factor_enabled
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        two_factor_enabled:
          type: boolean
          description: True only once enrolment has been confirmed.
    Profile:
      description: |
        Person data for a global identity. Null until a profile exists.
      oneOf:
        - type: 'null'
        - type: object
          required:
            - given_name
            - family_name
            - preferred_language_code
            - timezone
            - numbering_system
          properties:
            given_name:
              type: string
            family_name:
              type: string
            preferred_language_code:
              type: string
              minLength: 2
              maxLength: 2
              examples:
                - ar
            country_code:
              type:
                - string
                - 'null'
              minLength: 2
              maxLength: 2
              examples:
                - LB
            timezone:
              type: string
              examples:
                - Asia/Beirut
            numbering_system:
              type: string
              enum:
                - latn
                - arab
            date_of_birth:
              type:
                - string
                - 'null'
              format: date
    Organisation:
      type: object
      required:
        - id
        - slug
        - name
        - type
        - status
        - country_code
        - default_currency_code
        - default_language_code
        - capabilities
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          examples:
            - cedar-clinic
        name:
          type: string
          examples:
            - Cedar Clinic
        type:
          type:
            - string
            - 'null'
          description: The organisation type code.
          examples:
            - clinic
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
            - closed
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        default_currency_code:
          type: string
          minLength: 3
          maxLength: 3
        default_language_code:
          type: string
          minLength: 2
          maxLength: 2
        capabilities:
          type: array
          description: Enabled capability codes.
          items:
            type: string
          examples:
            - - clinic_services
    Branch:
      type: object
      required:
        - id
        - name
        - city
        - timezone
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        city:
          type:
            - string
            - 'null'
        timezone:
          type: string
        status:
          type: string
          enum:
            - active
            - closed
    Membership:
      type: object
      required:
        - id
        - status
        - branch_id
        - joined_at
        - organisation
        - roles
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
          description: |
            Ended memberships are history and are never listed.
        branch_id:
          description: Set when the membership is scoped to a single branch.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        joined_at:
          type:
            - string
            - 'null'
          format: date-time
        organisation:
          $ref: '#/components/schemas/Organisation'
        roles:
          type: array
          description: Assigned role codes.
          items:
            type: string
          examples:
            - - organisation_owner
    ActiveContext:
      description: |
        The validated working context. Null when nothing valid was claimed.
      oneOf:
        - type: 'null'
        - type: object
          required:
            - organisation
            - branch
            - membership_id
            - permissions
            - entitlements
          properties:
            organisation:
              $ref: '#/components/schemas/Organisation'
            branch:
              oneOf:
                - $ref: '#/components/schemas/Branch'
                - type: 'null'
            membership_id:
              $ref: '#/components/schemas/Uuid'
            permissions:
              type: array
              description: Calculated permission codes, in `domain.action_scope` form.
              items:
                type: string
              examples:
                - - organisation.view_current
                  - branch.view_current
            entitlements:
              type: array
              description: Feature codes the organisation is currently entitled to.
              items:
                type: string
    PendingConsent:
      type: object
      required:
        - code
        - version
        - purpose
      properties:
        code:
          type: string
          examples:
            - consent.health_data_processing
        version:
          type: integer
          minimum: 1
        purpose:
          type: string
          examples:
            - health_data_processing
    Device:
      type: object
      required:
        - id
        - device_name
        - platform
        - app_version
        - last_seen_at
        - created_at
        - is_current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        device_name:
          type: string
          examples:
            - Nadia iPhone
        platform:
          type: string
          enum:
            - ios
            - android
            - web
        app_version:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        is_current:
          type: boolean
          description: Whether this device holds the credential making the request.
    TwoFactorState:
      type: object
      required:
        - enabled
        - confirmed
        - confirmed_at
      properties:
        enabled:
          type: boolean
          description: A secret exists.
        confirmed:
          type: boolean
          description: Enrolment is complete and two-factor authentication is armed.
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
        - given_name
        - family_name
        - accepts_terms
        - accepts_privacy
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
        given_name:
          type: string
          maxLength: 255
        family_name:
          type: string
          maxLength: 255
        preferred_language_code:
          type: string
          minLength: 2
          maxLength: 2
          description: An active platform language. Defaults to `en`.
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
          description: An IANA timezone. Defaults to `UTC`.
        accepts_terms:
          type: boolean
          const: true
          description: Acceptance of the terms of service. Recorded as a consent grant.
        accepts_privacy:
          type: boolean
          const: true
          description: Acknowledgement of the privacy notice. Recorded as a consent grant.
        account_type:
          type: string
          enum:
            - b2c
          description: |
            Opens the provisional consumer account in the same transaction as
            the identity (J1). Omitted for a kitchen operator, who has an
            identity and no customer account; `b2b` and `guest` accounts are
            provisioned by their own journeys and may not be declared here.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
    IssueTokenRequest:
      type: object
      required:
        - email
        - password
        - device_name
        - platform
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          description: A human-readable device name, shown in device management.
        platform:
          type: string
          enum:
            - ios
            - android
            - web
        app_version:
          type:
            - string
            - 'null'
          maxLength: 64
        two_factor_code:
          type:
            - string
            - 'null'
          maxLength: 32
          description: Required when the account has confirmed two-factor authentication.
        recovery_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: An alternative to `two_factor_code`. Consumed and replaced on use.
    ResetPasswordRequest:
      type: object
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    TwoFactorChallengeRequest:
      type: object
      description: Supply either `code` or `recovery_code`.
      properties:
        code:
          type:
            - string
            - 'null'
          description: The current one-time password.
        recovery_code:
          type:
            - string
            - 'null'
          description: A single-use recovery code.
    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required:
            - count
            - next_cursor
            - has_more
          properties:
            count:
              type: integer
              minimum: 0
              description: Items on this page, after the extra look-ahead row is trimmed.
            next_cursor:
              type:
                - string
                - 'null'
              description: Pass as `cursor` for the next page. Null when there is none.
            has_more:
              type: boolean
              description: |
                Whether another page exists. Answered by reading one row
                beyond the page rather than by a separate count, which would
                disagree with the page under concurrent writes.
    AllergenCode:
      type: string
      maxLength: 20
      pattern: ^[a-z][a-z0-9_]*$
      description: |
        A canonical allergen class code — an immutable regulatory identity.
        Never renamed and never deleted; a class that should no longer be
        offered is deactivated instead. The fourteen seeded values match the
        universal client's `AllergenCode` union one for one.
      examples:
        - gluten
        - tree_nut
        - sulphites
    IngredientStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
      description: |
        The operational lifecycle of an ingredient. Deliberately not the
        publication family (`draft`/`published`/…): an ingredient is never
        sold, so it has no publication state of its own.
    IngredientVerificationStatus:
      type: string
      enum:
        - verified
        - unverified
        - requires_review
      description: |
        How much the platform trusts what it holds about this ingredient.
        `requires_review` is a recorded contradiction awaiting a human — the
        seeded burghul and pita rows carry it because the source workbook
        tags them allergen-free while its own allergen key does not.
    AvailabilityTier:
      type:
        - string
        - 'null'
      enum:
        - core
        - common
        - specialty_imported
        - null
      description: Local availability in the launch market. Null where the source does not say.
    AdminIngredient:
      type: object
      required:
        - id
        - organisation_id
        - is_platform
        - slug
        - name_en
        - name_ar
        - ingredient_category_id
        - ingredient_subcategory_id
        - default_unit_id
        - yield_factor
        - status
        - verification_status
        - lock_version
      description: |
        The administrative shape of an ingredient. Carries **both** names and
        ignores `Accept-Language` for them: a bilingual editor has to see what
        it is editing. There is no public ingredient projection.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for a platform-library row.
        is_platform:
          type: boolean
          description: |
            Whether this is a platform-library row. On the wire so a client
            knows not to offer an edit control, rather than discovering it
            from a 403.
        slug:
          type: string
          maxLength: 120
        name_en:
          type: string
        name_ar:
          type: string
          description: Falls back to the English name where no Arabic exists.
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        default_unit_code:
          type:
            - string
            - 'null'
        yield_factor:
          type: string
          description: Decimal with four places, as a string so no client rounds it.
          examples:
            - '1.0000'
        forked_from_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        status:
          $ref: '#/components/schemas/IngredientStatus'
        verification_status:
          $ref: '#/components/schemas/IngredientVerificationStatus'
        notes:
          type:
            - string
            - 'null'
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    IngredientEnvelope:
