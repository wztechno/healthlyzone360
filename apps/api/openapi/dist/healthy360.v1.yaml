  /catalogue/plans/{item}/profile:
    get:
      operationId: showPlanProfile
      tags:
        - Subscription plans
      summary: A plan's commercial terms
      description: |
        **`profile` is null when nobody has written one**, rather than a
        fabricated set of defaults. "No commercial decision has been made about
        this plan" is exactly the state the publish gate refuses, and a surface
        that filled it in would leave a kitchen wondering why publication keeps
        failing on terms it can see on screen.

        A catalogue item that is not a subscription plan is `422`, not `404`:
        the caller can see the row perfectly well through
        `/catalogue/items/{item}`, so a 404 would send them hunting for a typo.

        The `ETag` is the **item's**, because that is the validator a PUT here
        has to carry.

        The one plan read that is **not** commercial, so it requires
        `catalogue.view_organisation` rather than `plan.manage_organisation`:
        these terms are what a customer will be shown on the plan page and what
        a chef needs to produce against. The discounts are the commercial part,
        and they are on `…/variant-durations`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and its terms, or a null profile.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: putPlanProfile
      tags:
        - Subscription plans
      summary: Write a plan's commercial terms
      description: |
        A PUT because the profile is one commercial statement, read whole to
        decide any part of it. A PATCH over eight interdependent switches would
        make "I left pausing alone" and "I turned pausing off" the same request,
        on a right a subscriber has been sold.

        Every field is optional and omitted ones take their documented
        defaults — `both`, `per_day`, skippable, pausable, 24 hours — so `{}`
        is the legitimate "the ordinary terms".

        **`change_cutoff_hours` defaults to 24 and the default is evidence**:
        the kitchen operating rule and the legacy amendment window say the same
        thing from opposite directions, so the merge keeps one column with that
        default. `0` is accepted — "change it until the van leaves" is a policy
        somebody may genuinely have.

        **`If-Match` carries the item's validator** and the write bumps it: the
        profile has no `lock_version` of its own, being the commercial face of
        the item rather than a separate thing to lock.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutPlanProfileRequest'
      responses:
        '200':
          description: The plan and its terms after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanProfileEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plans/{item}/variants:
    get:
      operationId: listPlanVariants
      tags:
        - Subscription plans
      summary: A plan's configuration matrix
      description: |
        Each cell carries its coordinates **and** the identity of the variant
        beneath it: the `catalogue_item_variant_id` a price row points at, the
        `code` a resubmission matches on, and the `status`.

        **Archived cells are served too**, so a grid can render "we used to sell
        this" differently from "nothing here" — which is what a merchandiser
        needs to know before trying to open a cell that is already occupied.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and every cell of its matrix.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePlanVariants
      tags:
        - Subscription plans
      summary: Replace a plan's configuration matrix
      description: |
        The body is *cells*; the server writes a `catalogue_item_variants` row
        and its plan profile for each, atomically. That is what keeps the thing
        a customer picks and the thing a price points at one object.

        **The code is derived and deterministic** —
        `combination-tier[-band]`, from the vocabulary rows' own codes — so the
        same cell submitted from two clients on two days produces the same
        variant and the same price keeps pointing at it. An explicit `code` is
        accepted for a kitchen migrating identifiers it already uses elsewhere.

        **Absent cells are archived, not deleted**, and their coordinates stay
        occupied: reviving a withdrawn cell means resubmitting *that* cell, not
        opening a second variant at the same address. Trying the second is
        `409` with the occupying code named.

        Stating one cell twice in a submission is `422` — and two cells that
        differ only by an omitted `energy_band_id` are the same cell, not two.

        `includes_snacks` and `snacks_per_day` are one fact stated twice, so
        the contradiction is `422` rather than silently resolved.

        A deactivated combination or band may keep a cell a plan already sells
        and may not open a new one.

        An empty `cells` array archives the whole matrix — a decision, not a
        forgotten field.

        **`If-Match` carries the item's validator.** Requires
        `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePlanVariantsRequest'
      responses:
        '200':
          description: |
            The plan and **every** cell it now has, including the ones this call
            archived — so a client sees what the submission did rather than what
            it sent.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanCellConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/plans/{item}/variant-durations:
    get:
      operationId: listPlanVariantDurations
      tags:
        - Subscription plans
      summary: The runs each configuration may be bought for
      description: |
        **`discount_percent` is served as `null` where nobody has stated one** —
        never as `"0.00"` and never omitted. The absence has to be visible,
        because the person reading this screen is the person who has to go and
        find the number. `meta.unstated_discount_count` says how many rows are
        in that state.

        Requires `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The plan and every duration assignment across its configurations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantDurationsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replacePlanVariantDurations
      tags:
        - Subscription plans
      summary: Replace a plan's duration assignments
      description: |
        The complete set of configuration × duration pairings, applied at once.
        A kitchen decides "every cell runs 5, 20 and 40 days, and the premium
        tier also runs 60" in one sitting, and splitting that across calls would
        make the half-applied states reachable and publishable.

        Rows name their configuration and duration by identifier **or by
        code**, so an importer holding codes does not have to round-trip through
        this API to learn identifiers it will never use again.

        **An absent `discount_percent` stays absent all the way to the
        column.** NULL is "nobody has stated one", `0` is "there is no
        discount", and this endpoint never turns the first into the second.

        **Absent rows are deleted**, and the asymmetry with the matrix is
        deliberate: an assignment carries nothing but itself, so there is
        nothing to strand. `is_available: false` is what says "we still run 40
        days, just not this month" without discarding the negotiated discount.

        A deactivated duration cannot be assigned.

        **`If-Match` carries the item's validator.** Requires
        `plan.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePlanVariantDurationsRequest'
      responses:
        '200':
          description: The plan and its duration assignments after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVariantDurationsEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones:
    get:
      operationId: listDeliveryZones
      tags:
        - Delivery
      summary: The delivery zones this organisation has drawn
      description: |
        Cursor-paginated. A kitchen with one map has three zones and a kitchen
        covering a country has a zone per district per branch, and the second
        is the one that has to keep working.

        Archived zones are excluded unless `status=archived` asks for them.

        `branch_id=organisation` selects the organisation-wide map — the one
        thing a plain identifier filter cannot express, because an absent
        parameter already means "no filter".

        The areas are **not** embedded: a zone can name a hundred places, and
        `…/{zone}/areas` answers that question one zone at a time.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          required: false
          description: Defaults to everything except `archived`.
          schema:
            $ref: '#/components/schemas/DeliveryZoneStatus'
        - name: branch_id
          in: query
          required: false
          description: |
            A branch identifier, or the literal `organisation` for the
            organisation-wide map.
          schema:
            oneOf:
              - $ref: '#/components/schemas/Uuid'
              - type: string
                const: organisation
        - name: query
          in: query
          required: false
          description: Case-insensitive substring over `name_en`, `name_ar` and `code`.
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of delivery zones.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZonesEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDeliveryZone
      tags:
        - Delivery
      summary: Draw a delivery zone
      description: |
        The zone is created `active` and covering nowhere, so there is no
        window in which a half-built map quotes a delivery. Areas are added
        through `PUT …/{zone}/areas`.

        `branch_id` is optional and usually absent: a zone with no branch is
        the organisation-wide map, and a branch-scoped zone overrides it for
        that branch.

        `currency_code` is optional and defaults to the organisation's own —
        unlike a price list, where a default would silently produce a USD
        tariff in an AED kitchen. A zone carries at most two amounts, in the
        kitchen's home market.

        A duplicate `code` inside the organisation is `409`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryZoneRequest'
      responses:
        '201':
          description: The zone as created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}:
    get:
      operationId: getDeliveryZone
      tags:
        - Delivery
      summary: One delivery zone
      description: |
        Returns `ETag: "<lock_version>"`. The **area set is versioned against
        this same number**: a zone and its map are one document, and two
        operators redrawing at once is the race the validator catches.

        `meta.area_count` comes with it, so a client can render "17 areas"
        without fetching them.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The delivery zone.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDeliveryZone
      tags:
        - Delivery
      summary: Rename, reprice or suspend a delivery zone
      description: |
        `code` and `status` are **rejected**, not ignored: a client that sent
        one believed it was writing something. Archiving is a POST action;
        suspension is `is_active`.

        Changing `branch_id` re-scopes the zone **and its area claims
        together**, in one transaction. It is refused with `409
        area_already_served` when another zone already serves one of those
        areas at the destination, and nothing is half-moved.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryZoneRequest'
      responses:
        '200':
          description: The zone after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryAreaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}/archive:
    post:
      operationId: archiveDeliveryZone
      tags:
        - Delivery
      summary: Withdraw a delivery zone
      description: |
        Terminal, and it **releases the zone's area claims**. An archived zone
        that kept them would occupy every place it ever served, and a kitchen
        redrawing its map would find the new zone refused by one nobody uses.

        A kitchen that wants to stop delivering *without* giving the areas up
        suspends the zone instead (`is_active: false` on the PATCH), which is
        reversible and keeps the map intact.

        Nothing is deleted: the fee, the promise and the name survive, so a
        delivery quoted from this zone last month can still be explained.

        There is deliberately no customer-address check. `customer_addresses`
        arrives in J1, so today there is nothing to consult and a blocker
        written against an empty table would be a permanently-green check.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The archived zone.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-zones/{zone}/areas:
    get:
      operationId: listDeliveryZoneAreas
      tags:
        - Delivery
      summary: The places a zone covers
      description: |
        Unpaginated: the set is bounded by the gazetteer and is the unit a
        client edits, so a picker showing half a map with a cursor to fetch the
        rest would be a worse contract than one response.

        Each entry is the **platform area** in admin shape, `is_active`
        included — a kitchen must be able to see that a place it still serves
        has been withdrawn from the gazetteer. Those claims are kept rather
        than silently dropped, and `meta.inactive_area_count` is what a screen
        puts a warning badge on.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The areas this zone covers.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneAreasEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceDeliveryZoneAreas
      tags:
        - Delivery
      summary: Redraw the map of a zone
      description: |
        Set-replace: the body is the desired whole map, and areas absent from
        it are released. That release is the only way to hand a place to a
        different zone, because **one area is served by one zone per branch**.

        `If-Match` carries the **zone's** validator — a zone and its map are
        one document.

        Three refusals are worth knowing. A place already served by another
        zone **at the same scope** is `409 area_already_served`, naming the
        occupying zone rather than an index. An area in another country is
        `422 area_country_mismatch`: the gazetteer is keyed `(country, code)`
        precisely because place names repeat. An area the platform has
        withdrawn is `422 area_inactive` — unless this zone already claimed it,
        in which case the claim stands and `meta.inactive_area_count` says so.

        An organisation-wide zone and a branch-scoped zone **may** both claim
        one area. That is the override mechanism, not a hole: the branch claim
        wins when a branch is in context, and the organisation-wide one answers
        when none is.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryZonePath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDeliveryZoneAreasRequest'
      responses:
        '200':
          description: The areas this zone covers after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneAreasEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeliveryAreaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-windows:
    get:
      operationId: listDeliveryWindows
      tags:
        - Delivery
      summary: The delivery slots this kitchen offers
      description: |
        Unpaginated, deliberately: a kitchen has morning, afternoon and
        evening, and perhaps a weekend slot. This is the set a checkout picker
        renders whole, so paging it would push every client into reassembling
        it.

        Deactivated windows are served **with** their flag rather than hidden —
        there is no delete, so the only way to see a withdrawn slot is to be
        shown it.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every delivery window, active and withdrawn.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDeliveryWindow
      tags:
        - Delivery
      summary: Name a delivery slot
      description: |
        No `If-Match`: these rows carry no `lock_version`, and the concurrency
        contract applies only to resources that do.

        A duplicate `code` inside the organisation is `409`; the same code in
        another kitchen is not a collision, because a window is one kitchen's
        word for one of its own slots.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryWindowRequest'
      responses:
        '201':
          description: The window as created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/delivery-windows/{window}:
    patch:
      operationId: updateDeliveryWindow
      tags:
        - Delivery
      summary: Edit or withdraw a delivery slot
      description: |
        **Precondition-free**: a window carries no `lock_version`, and
        `If-Match` applies only to resources that do.

        `code` is **rejected**, not ignored. `is_active: false` is the only
        withdrawal there is; there is no DELETE, because an order taken for the
        evening slot has to stay explainable.

        The pairing and ordering rules run against the **merged** row: sending
        only `ends_at` compares it with the stored `starts_at`. Turning a timed
        window back into an untimed one therefore means sending both as `null`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/DeliveryWindowPath'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryWindowRequest'
      responses:
        '200':
          description: The window after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryWindowEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /kitchen/branch-operating:
    get:
      operationId: getBranchOperating
      tags:
        - Kitchen operations
      summary: The current branch's operating week
      description: |
        The branch comes from `X-Branch-Id`. `branch.context` permits an absent
        header — an organisation-wide membership may legitimately select no
        branch — so this endpoint refuses that case with
        `400 context.branch_required` rather than guessing which location the
        caller meant.

        **Unconfigured days are absent, not filled in.** A week with three rows
        means four days nobody has decided about; inventing `is_open: false`
        for them would tell a customer the branch is shut on Thursday when the
        truth is that nobody has said. `meta.is_complete` is what a screen puts
        the "finish setting this up" prompt behind.

        No `ETag`: these rows carry no `lock_version`, because the week is
        replaced whole in one transaction.

        Requires `branch.view_current`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XBranchIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The branch's week, in weekday order.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOperatingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceBranchOperating
      tags:
        - Kitchen operations
      summary: Replace the current branch's operating week
      description: |
        Set-replace, in one transaction. The week is the unit of change — "we
        now close at six, and Sundays are off" is one decision, and applying
        half of it produces a schedule nobody agreed to. That is also why there
        is no `If-Match`: there is no half-week for a validator to protect.

        A **closed day is a row** with no times; an omitted weekday is a day
        nobody has decided about. Both are storable, and only that distinction
        lets a checkout say "we are shut on Sundays" rather than "we cannot
        answer". An empty `days` clears the week back to unconfigured.

        Three per-row rules, each refused with the day and the field named: a
        day is open with both times or closed with neither; a branch closes
        after it opens (no overnight service yet); and a closed day carries no
        cut-off. A cut-off **outside** the opening hours is accepted — "order
        by 22:00 the night before" is a real rule, and which day a cut-off
        governs is order capture's question rather than this table's.

        There is deliberately no `branch_id` in the body: the branch comes from
        `X-Branch-Id`, which is validated against the caller's membership
        scope.

        Requires `branch.manage_current`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XBranchIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBranchOperatingRequest'
      responses:
        '200':
          description: The branch's week after the write.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOperatingEnvelope'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/delivery-areas:
    get:
      operationId: listDeliveryAreas
      tags:
        - Reference data
      summary: The platform delivery gazetteer
      security: []
      description: |
        **Anonymous.** J1's onboarding asks a customer for their delivery area
        before an account exists, so an address form that only works after
        sign-in cannot be part of sign-up.

        Served through the public projection: one server-localised `name`
        chosen from `Accept-Language`, never both language columns. Inactive
        areas are excluded.

        **Cursor-paginated**, unlike the other two public vocabularies.
        Fourteen allergen classes and twelve diet classifications are
        constants; the gazetteer is 125 rows for one country today and grows
        with every market.

        `country_code` is **required**: area codes are unique within a country,
        not across the platform, and a default would serve Lebanon to a
        customer in Dubai. A code the platform does not recognise is `400`
        rather than an empty page, which would read as "we do not deliver there
        yet".

        `region` is carried and is currently `null` on every row (OD-12): the
        source does not record which governorate a place belongs to, and a
        client that wants to group the picker can see that the platform has
        nothing to group by.
      parameters:
        - name: country_code
          in: query
          required: true
          description: ISO 3166-1 alpha-2. Case-insensitive.
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of delivery areas, localised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDeliveryAreasEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: healthy360_session
      description: |
        The Sanctum first-party session cookie, issued by `POST /auth/login`
        to clients whose `Origin` is a configured stateful domain.

        Before the first state-changing request the client calls
        `GET /sanctum/csrf-cookie` (outside `/api/v1`, part of the session
        handshake rather than the resource API) and then sends the
        `X-XSRF-TOKEN` header taken from the `XSRF-TOKEN` cookie.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A Sanctum personal access token from `POST /auth/token`, bound to a
        registered device and revocable at `DELETE /me/devices/{device}`.
  headers:
    XCorrelationId:
      description: |
        The server-generated correlation identifier for this request (UUIDv7).
        Returned on every response and repeated in the body.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
    ETag:
      description: |
        The current `lock_version` of a lock-versioned resource, quoted. A
        client keeps it and sends it back as `If-Match` when it writes.
      required: true
      schema:
        type: string
        examples:
          - '"3"'
  parameters:
    XOrganisationId:
      name: X-Organisation-Id
      in: header
      required: false
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XOrganisationIdRequired:
      name: X-Organisation-Id
      in: header
      required: true
      description: |
        The active organisation. Never trusted without server-side validation
        against an active membership.
      schema:
        $ref: '#/components/schemas/Uuid'
    XBranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: |
        The active branch. Validated against the membership scope: a
        branch-scoped membership may only work inside its own branch.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Locale negotiation. Regional subtags are accepted.
      schema:
        type: string
        examples:
          - ar-LB
          - en
    XClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      description: |
        An opaque client-generated identifier for support correlation. Logged
        and echoed back; never used as the correlation identifier.
      schema:
        type: string
        maxLength: 128
    XAppMode:
      name: X-App-Mode
      in: header
      required: false
      description: The build family. Diagnostic only; never an authorisation input.
      schema:
        type: string
        enum:
          - customer
          - staff
          - kiosk
          - driver
          - all-dev
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: The client version, for diagnostics and deprecation telemetry.
      schema:
        type: string
        examples:
          - 1.4.0
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: The client platform.
      schema:
        type: string
        enum:
          - web
          - ios
          - android
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `ETag` the resource was last served with. Required on writes to
        lock-versioned resources: absent is **428**
        `request.precondition_required`, stale is **409** `resource.conflict`
        carrying `details.current_lock_version`. `*` is accepted and means
        "as long as the resource exists".
      schema:
        type: string
        examples:
          - '"3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `meta.next_cursor` of the previous page. Opaque — echo it back,
        never construct one. A cursor this endpoint did not issue is
        `400 request.invalid`, never a silent restart from the beginning.
      schema:
        type: string
        maxLength: 200
    CursorLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IngredientPath:
      name: ingredient
      in: path
      required: true
      description: The ingredient identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    AllergenCodePath:
      name: code
      in: path
      required: true
      description: The canonical allergen class code.
      schema:
        $ref: '#/components/schemas/AllergenCode'
    RecipePath:
      name: recipe
      in: path
      required: true
      description: The recipe identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecipeVersionPath:
      name: version
      in: path
      required: true
      description: |
        The version identifier, or its `version_number`. Both are accepted
        because both are natural — a client that walked the list holds
        identifiers, a human reading a technical sheet holds "version 3" — and
        a number cannot be mistaken for a UUID. The version is always resolved
        inside the recipe in the path, so one recipe's number can never reach
        another's version.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            pattern: ^\d+$
    CatalogueItemPath:
      name: item
      in: path
      required: true
      description: |
        The item identifier, or its `slug`. Both are accepted because both are
        natural — a client that walked the list holds identifiers, a
        marketplace integration or a support engineer holds
        `harissa-paste-250g` — and a slug is unique per organisation and
        immutable, so the two answers cannot drift apart.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 140
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    SalesChannelPath:
      name: channel
      in: path
      required: true
      description: The channel identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PriceListPath:
      name: priceList
      in: path
      required: true
      description: |
        The price list identifier, or its `code`. Both are accepted for the
        reason the sales-channel path gives: a client that walked the list
        holds an identifier, an operator or an importer holds
        `greenlife-b2b-usd`, and the code is unique per organisation.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PlanCombinationPath:
      name: combination
      in: path
      required: true
      description: The meal combination identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    EnergyBandPath:
      name: band
      in: path
      required: true
      description: The energy band identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    PlanDurationPath:
      name: duration
      in: path
      required: true
      description: The plan duration identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    XBranchIdRequired:
      name: X-Branch-Id
      in: header
      required: true
      description: |
        The active branch. Validated against the membership scope: a
        branch-scoped membership may only work inside its own branch.

        Required here rather than optional, because the resource *is* one
        branch's. An absent header is `400 context.branch_required` — the
        endpoint refuses rather than guessing which location the caller meant.
      schema:
        $ref: '#/components/schemas/Uuid'
    DeliveryZonePath:
      name: zone
      in: path
      required: true
      description: The delivery zone identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 40
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    DeliveryWindowPath:
      name: window
      in: path
      required: true
      description: The delivery window identifier, or its `code`.
      schema:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: string
            maxLength: 30
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  responses:
    Accepted:
      description: Accepted for delivery.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: boolean
                    const: true
              meta:
                $ref: '#/components/schemas/Meta'
    LoginOutcome:
      description: |
        The sign-in resolved. `two_factor_required: false` means a session now
        exists; `true` means the client must complete
        `POST /auth/two-factor-challenge`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - two_factor_required
                properties:
                  two_factor_required:
                    type: boolean
              meta:
                $ref: '#/components/schemas/Meta'
    PasswordConfirmationStatus:
      description: The step-up state of the calling credential.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - confirmed
                  - timeout_seconds
                properties:
                  confirmed:
                    type: boolean
                  timeout_seconds:
                    type: integer
                    minimum: 0
                    description: How long a confirmation remains valid.
              meta:
                $ref: '#/components/schemas/Meta'
    TwoFactorStateResponse:
      description: |
        The two-factor state of the account. `enabled` means a secret exists;
        `confirmed` means two-factor authentication is armed and will be
        demanded at the next sign-in.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/TwoFactorState'
              meta:
                $ref: '#/components/schemas/Meta'
    RecoveryCodes:
      description: Single-use recovery codes.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: object
                required:
                  - recovery_codes
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
              meta:
                $ref: '#/components/schemas/Meta'
    RequestInvalid:
      description: |
        The request could not be processed as sent — typically a session
        endpoint reached without a first-party `Origin`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.invalid
              message: This endpoint serves first-party session clients only; native clients must use /api/v1/auth/token.
              details:
                required_headers:
                  - Origin
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextRequired:
      description: |
        A context the endpoint needs was not supplied —
        `context.organisation_required` for a missing `X-Organisation-Id`, and
        `context.branch_required` for a missing `X-Branch-Id` on the
        branch-scoped operations. Distinct from
        `context.branch_out_of_scope` (403): the caller has not asked for a
        branch they may not have, they have not asked for one at all.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_required
              message: An X-Organisation-Id header is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    Unauthenticated:
      description: No usable credential was presented.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.unauthenticated
              message: Authentication is required for this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    EmailUnverified:
      description: The address has not been verified.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.email_unverified
              message: Your email address must be verified before you can use this endpoint.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    StepUpRequired:
      description: |
        The action is sensitive and needs a recent password confirmation.
        **HTTP 403, never 423** (plan §13).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.step_up_required
              message: This action requires you to confirm your password again.
              details:
                confirmation_endpoint: /api/v1/auth/confirm-password
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextDenied:
      description: |
        The organisation or branch could not be validated for this person. The
        message never reveals whether the organisation exists.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: context.organisation_forbidden
              message: You do not have an active membership in the requested organisation.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ContextOrPermissionDenied:
      description: |
        The context was refused (`context.organisation_forbidden`,
        `context.branch_out_of_scope`) or the membership's roles do not grant
        the required permission (`authz.permission_denied`, with the denying
        RBAC step in `details.reason`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: authz.permission_denied
              message: You do not have permission to perform this action.
              details:
                reason: permission_not_granted
                permission: organisation.view_current
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    NotFound:
      description: The resource does not exist, or is not the caller's to see.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.not_found
              message: The requested resource does not exist.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    InvalidCredentials:
      description: |
        The credentials were rejected. Deliberately not a field-level
        validation error: clients branch on the code.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: auth.invalid_credentials
              message: These credentials do not match our records.
              details: {}
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ValidationFailed:
      description: The submitted data is invalid.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: The submitted data is invalid.
              details:
                fields:
                  email:
                    - The email field must be a valid email address.
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    TooManyRequests:
      description: The rate limit for this endpoint was exceeded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit.exceeded
              message: Too many requests. Please retry later.
              details:
                retry_after_seconds: 47
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PreconditionRequired:
      description: |
        The resource is lock-versioned and the write carried no `If-Match`.
        **HTTP 428, not 409 and not 400**: the client has not lost a race — it
        never entered one — and the fix is to read the resource and retry with
        its validator.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request.precondition_required
              message: This resource requires an If-Match header carrying the version you last read.
              details:
                required_headers:
                  - If-Match
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    ResourceConflict:
      description: |
        The change conflicts with the current state. On a lock-versioned
        write this is a lost race, and `details.current_lock_version` is the
        value to reload against, so a client can offer "reload" or "keep
        mine" without a second round trip.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This resource changed since you last read it. Reload it and reapply your change.
              details:
                current_lock_version: 4
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    AllergenBaselineWeakened:
      description: |
        The submitted data is invalid. On an allergen replacement this is
        usually the upgrade-only rule:
        `details.weakened_allergen_classes` names the platform baseline
        classes the request would have dropped or weakened.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation.failed
              message: An organisation mapping may add to the platform allergen baseline but never weaken it.
              details:
                fields:
                  mappings:
                    - The platform baseline for this ingredient must be kept or strengthened.
                weakened_allergen_classes:
                  - gluten
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    RecipeArchiveBlocked:
      description: |
        The recipe still has a published version.
        `details.published_version_ids` names them. Withdrawing something from
        sale is retiring the version — its own action, its own permission —
        not a side effect of archiving.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This recipe still has a published version. Retire it before archiving the recipe.
              details:
                published_version_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    IngredientArchiveConflict:
      description: |
        Three codes share this status, because three different things can be
        wrong and the remedies differ.

        **`catalogue.in_use`** — the ingredient is still named by a recipe
        version that has not been retired. `details.recipe_ids` and
        `details.recipe_version_ids` name them, so the caller knows what to
        retire first. Retired versions are never a blocker: history is allowed
        to reference an archived ingredient.

        **`resource.conflict`** — either the ingredient is already archived, or
        the write lost a race and `details.current_lock_version` is the value
        to reload against.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.in_use
              message: This ingredient is still used by a recipe version that has not been retired.
              details:
                recipe_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41
                recipe_version_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    VersionImmutableOrConflict:
      description: |
        Either the version is frozen (`catalogue.version_immutable` — it is
        published or retired, and no amount of reloading will make it writable;
        the answer is a new draft version) or the write lost a race
        (`resource.conflict`, carrying `details.current_lock_version`). Two
        codes, because the remedies are different.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.version_immutable
              message: A published recipe version cannot be changed. Create a new draft version instead.
              details:
                status: published
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PublishBlocked:
      description: |
        The readiness evaluator refused. `details.reasons` carries **every**
        blocker rather than the first one found — a gate that reveals one
        problem per attempt turns a five-minute fix into five round trips.
        Each entry is a stable machine `reason` plus whatever identifies the
        offending rows.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This recipe version is not ready to be published.
              details:
                reasons:
                  - reason: line_quantity_missing
                    line_numbers:
                      - 2
                      - 5
                  - reason: ingredient_requires_review
                    ingredient_ids:
                      - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d43
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    AllergenUnmapped:
      description: |
        At least one line ingredient carries no allergen determination at all.
        Its own code rather than a `publish_blocked` reason because the fix is
        in a different place — the ingredient's mapping editor — and because
        silence must never be mistaken for a clean result. An ingredient
        passes when it holds a mapping row in any layer, **or** when its
        `verification_status` is `verified`, which is how "checked, and it
        carries nothing" is recorded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.allergen_unmapped
              message: Every ingredient in a published recipe must carry an allergen determination.
              details:
                ingredient_ids:
                  - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d44
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    CatalogueItemPublishBlocked:
      description: |
        The K1.4 readiness gate refused. `details.reasons` carries **every**
        blocker rather than the first one found, so a kitchen fixes them in one
        pass.

        The vocabulary is `item_quarantined`, `item_not_a_draft`,
        `translation_incomplete`, `no_active_variant`, `no_allergen_basis` and
        `linked_recipe_quarantined`. The full readiness evaluator will add
        reasons to this list rather than replace the mechanism.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This catalogue item is not ready to be published.
              details:
                reasons:
                  - reason: translation_incomplete
                    fields:
                      - name_ar
                  - reason: linked_recipe_quarantined
                    recipe_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d41
                    recipe_version_ids:
                      - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d42
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PriceListConflict:
      description: |
        The write conflicts with the state of the price list. `details.reason`
        distinguishes the cases, so a client knows whether to reload or to do
        something different:

        - `currency_locked` — the list already holds prices, so its currency
          cannot move. `details.current_currency`, `details.requested_currency`
          and `details.entry_count` say why. The answer is a new list.
        - `channel_assignments_active` — the list is still assigned to the
          channels in `details.sales_channel_ids`. Detach it first.
        - no `reason` — a plain lost race: the `If-Match` validator was stale,
          and `details.current_lock_version` carries the current one. Reload
          and retry.

        An archived list also answers `409` on every write.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This price list already holds amounts in USD. A currency cannot be changed under existing prices — create a new list instead.
              details:
                reason: currency_locked
                current_currency: USD
                requested_currency: AED
                entry_count: 312
                current_lock_version: 4
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PriceListPublishBlocked:
      description: |
        The activation gate refused. `details.reasons` carries **every**
        blocker rather than the first one found, the rule the recipe and
        catalogue-item gates already follow.

        The vocabulary is `price_list_not_a_draft`, `no_open_rows` and
        `amount_status_mismatch`. The last is structurally unreachable — a
        CHECK constraint refuses the combination at the database — and is
        stated anyway, because "the database would have stopped it" is not
        something a client can see.

        Note what is **not** a blocker: placeholder and market-priced rows.
        They are welcome on an active list, and the public projection is what
        keeps them from a customer.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: catalogue.publish_blocked
              message: This price list is not ready to be activated.
              details:
                reasons:
                  - reason: no_open_rows
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    PlanCellConflict:
      description: |
        A matrix cell is already held by a different configuration —
        `details.existing_configuration` names its `code`, and
        `details.cell_index` points at the offending entry in the submission.

        The occupant may be **archived**, and that is the case worth
        understanding: a withdrawn cell keeps its coordinates because a price
        row still points at its variant, so re-selling that cell means reviving
        that configuration rather than opening a second one at the same address.

        Also served for a stale `If-Match`, as everywhere else.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: This matrix cell already exists on this plan as configuration "lunch-dinner-standard".
              details:
                cell_index: 0
                existing_configuration: lunch-dinner-standard
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
    DeliveryAreaConflict:
      description: |
        A place is already served by another zone **at the same scope**, and
        `details.occupying_zones` names it by `code` while
        `details.conflicts` pairs each offending area with the zone holding it.

        The rule is one area, one zone **per branch**. An organisation-wide
        zone and a branch-scoped zone may both claim the same area — that is
        the override, resolved branch-first — so this conflict only ever means
        two zones at *one* scope.

        `details.scope` says which scope collided: `organisation` for the
        organisation-wide map, `branch` for one location's.

        Also served for a stale `If-Match`, as everywhere else.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: resource.conflict
              message: Another zone at the same scope already serves one of these areas. An area is served by one zone per branch — move it out of the other zone first.
              details:
                reason: area_already_served
                scope: organisation
                conflicts:
                  - delivery_area_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
                    delivery_zone_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d40
                occupying_zones:
                  - beirut-inner
              correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
  schemas:
    Uuid:
      type: string
      format: uuid
      description: A UUIDv7 identifier (plan §8).
      examples:
        - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
    Meta:
      type: object
      required:
        - correlation_id
      properties:
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: true
      description: |
        Envelope metadata. Always carries the correlation identifier;
        collections add `count`, and `/me` adds `permissions_version`.
    ErrorCode:
      type: string
      description: |
        The stable Healthy360 error vocabulary. Mirrors
        `Healthy360\Support\Api\ErrorCode`; a Pest test asserts the two agree.
      enum:
        - validation.failed
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.email_unverified
        - auth.two_factor_required
        - auth.two_factor_invalid
        - auth.step_up_required
        - auth.csrf_token_mismatch
        - auth.invalid_signature
        - context.organisation_required
        - context.organisation_forbidden
        - context.branch_out_of_scope
        - context.branch_required
        - authz.permission_denied
        - request.invalid
        - request.precondition_required
        - resource.not_found
        - resource.conflict
        - catalogue.in_use
        - catalogue.version_immutable
        - catalogue.allergen_unmapped
        - catalogue.publish_blocked
        - rate_limit.exceeded
        - server.internal_error
    Error:
      type: object
      required:
        - code
        - message
        - details
        - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A safe, human-readable summary. Never a stack trace.
        details:
          type: object
          description: |
            Structured, code-specific detail. `validation.failed` carries a
            `fields` map of field name to messages; `authz.permission_denied`
            carries the denying RBAC step; `auth.step_up_required` carries the
            confirmation endpoint.
          additionalProperties: true
        correlation_id:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    User:
      type: object
      required:
        - id
        - email
        - email_verified
        - two_factor_enabled
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        two_factor_enabled:
          type: boolean
          description: True only once enrolment has been confirmed.
    Profile:
      description: |
        Person data for a global identity. Null until a profile exists.
      oneOf:
        - type: 'null'
        - type: object
          required:
            - given_name
            - family_name
            - preferred_language_code
            - timezone
            - numbering_system
          properties:
            given_name:
              type: string
            family_name:
              type: string
            preferred_language_code:
              type: string
              minLength: 2
              maxLength: 2
              examples:
                - ar
            country_code:
              type:
                - string
                - 'null'
              minLength: 2
              maxLength: 2
              examples:
                - LB
            timezone:
              type: string
              examples:
                - Asia/Beirut
            numbering_system:
              type: string
              enum:
                - latn
                - arab
            date_of_birth:
              type:
                - string
                - 'null'
              format: date
    Organisation:
      type: object
      required:
        - id
        - slug
        - name
        - type
        - status
        - country_code
        - default_currency_code
        - default_language_code
        - capabilities
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          examples:
            - cedar-clinic
        name:
          type: string
          examples:
            - Cedar Clinic
        type:
          type:
            - string
            - 'null'
          description: The organisation type code.
          examples:
            - clinic
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
            - closed
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        default_currency_code:
          type: string
          minLength: 3
          maxLength: 3
        default_language_code:
          type: string
          minLength: 2
          maxLength: 2
        capabilities:
          type: array
          description: Enabled capability codes.
          items:
            type: string
          examples:
            - - clinic_services
    Branch:
      type: object
      required:
        - id
        - name
        - city
        - timezone
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        city:
          type:
            - string
            - 'null'
        timezone:
          type: string
        status:
          type: string
          enum:
            - active
            - closed
    Membership:
      type: object
      required:
        - id
        - status
        - branch_id
        - joined_at
        - organisation
        - roles
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
          description: |
            Ended memberships are history and are never listed.
        branch_id:
          description: Set when the membership is scoped to a single branch.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        joined_at:
          type:
            - string
            - 'null'
          format: date-time
        organisation:
          $ref: '#/components/schemas/Organisation'
        roles:
          type: array
          description: Assigned role codes.
          items:
            type: string
          examples:
            - - organisation_owner
    ActiveContext:
      description: |
        The validated working context. Null when nothing valid was claimed.
      oneOf:
        - type: 'null'
        - type: object
          required:
            - organisation
            - branch
            - membership_id
            - permissions
            - entitlements
          properties:
            organisation:
              $ref: '#/components/schemas/Organisation'
            branch:
              oneOf:
                - $ref: '#/components/schemas/Branch'
                - type: 'null'
            membership_id:
              $ref: '#/components/schemas/Uuid'
            permissions:
              type: array
              description: Calculated permission codes, in `domain.action_scope` form.
              items:
                type: string
              examples:
                - - organisation.view_current
                  - branch.view_current
            entitlements:
              type: array
              description: Feature codes the organisation is currently entitled to.
              items:
                type: string
    PendingConsent:
      type: object
      required:
        - code
        - version
        - purpose
      properties:
        code:
          type: string
          examples:
            - consent.health_data_processing
        version:
          type: integer
          minimum: 1
        purpose:
          type: string
          examples:
            - health_data_processing
    Device:
      type: object
      required:
        - id
        - device_name
        - platform
        - app_version
        - last_seen_at
        - created_at
        - is_current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        device_name:
          type: string
          examples:
            - Nadia iPhone
        platform:
          type: string
          enum:
            - ios
            - android
            - web
        app_version:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        is_current:
          type: boolean
          description: Whether this device holds the credential making the request.
    TwoFactorState:
      type: object
      required:
        - enabled
        - confirmed
        - confirmed_at
      properties:
        enabled:
          type: boolean
          description: A secret exists.
        confirmed:
          type: boolean
          description: Enrolment is complete and two-factor authentication is armed.
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
        - given_name
        - family_name
        - accepts_terms
        - accepts_privacy
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
        given_name:
          type: string
          maxLength: 255
        family_name:
          type: string
          maxLength: 255
        preferred_language_code:
          type: string
          minLength: 2
          maxLength: 2
          description: An active platform language. Defaults to `en`.
        country_code:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
          description: An IANA timezone. Defaults to `UTC`.
        accepts_terms:
          type: boolean
          const: true
          description: Acceptance of the terms of service. Recorded as a consent grant.
        accepts_privacy:
          type: boolean
          const: true
          description: Acknowledgement of the privacy notice. Recorded as a consent grant.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
    IssueTokenRequest:
      type: object
      required:
        - email
        - password
        - device_name
        - platform
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          description: A human-readable device name, shown in device management.
        platform:
          type: string
          enum:
            - ios
            - android
            - web
        app_version:
          type:
            - string
            - 'null'
          maxLength: 64
        two_factor_code:
          type:
            - string
            - 'null'
          maxLength: 32
          description: Required when the account has confirmed two-factor authentication.
        recovery_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: An alternative to `two_factor_code`. Consumed and replaced on use.
    ResetPasswordRequest:
      type: object
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
    TwoFactorChallengeRequest:
      type: object
      description: Supply either `code` or `recovery_code`.
      properties:
        code:
          type:
            - string
            - 'null'
          description: The current one-time password.
        recovery_code:
          type:
            - string
            - 'null'
          description: A single-use recovery code.
    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required:
            - count
            - next_cursor
            - has_more
          properties:
            count:
              type: integer
              minimum: 0
              description: Items on this page, after the extra look-ahead row is trimmed.
            next_cursor:
              type:
                - string
                - 'null'
              description: Pass as `cursor` for the next page. Null when there is none.
            has_more:
              type: boolean
              description: |
                Whether another page exists. Answered by reading one row
                beyond the page rather than by a separate count, which would
                disagree with the page under concurrent writes.
    AllergenCode:
      type: string
      maxLength: 20
      pattern: ^[a-z][a-z0-9_]*$
      description: |
        A canonical allergen class code — an immutable regulatory identity.
        Never renamed and never deleted; a class that should no longer be
        offered is deactivated instead. The fourteen seeded values match the
        universal client's `AllergenCode` union one for one.
      examples:
        - gluten
        - tree_nut
        - sulphites
    IngredientStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
      description: |
        The operational lifecycle of an ingredient. Deliberately not the
        publication family (`draft`/`published`/…): an ingredient is never
        sold, so it has no publication state of its own.
    IngredientVerificationStatus:
      type: string
      enum:
        - verified
        - unverified
        - requires_review
      description: |
        How much the platform trusts what it holds about this ingredient.
        `requires_review` is a recorded contradiction awaiting a human — the
        seeded burghul and pita rows carry it because the source workbook
        tags them allergen-free while its own allergen key does not.
    AvailabilityTier:
      type:
        - string
        - 'null'
      enum:
        - core
        - common
        - specialty_imported
        - null
      description: Local availability in the launch market. Null where the source does not say.
    AdminIngredient:
      type: object
      required:
        - id
        - organisation_id
        - is_platform
        - slug
        - name_en
        - name_ar
        - ingredient_category_id
        - ingredient_subcategory_id
        - default_unit_id
        - yield_factor
        - status
        - verification_status
        - lock_version
      description: |
        The administrative shape of an ingredient. Carries **both** names and
        ignores `Accept-Language` for them: a bilingual editor has to see what
        it is editing. There is no public ingredient projection.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for a platform-library row.
        is_platform:
          type: boolean
          description: |
            Whether this is a platform-library row. On the wire so a client
            knows not to offer an edit control, rather than discovering it
            from a 403.
        slug:
          type: string
          maxLength: 120
        name_en:
          type: string
        name_ar:
          type: string
          description: Falls back to the English name where no Arabic exists.
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        default_unit_code:
          type:
            - string
            - 'null'
        yield_factor:
          type: string
          description: Decimal with four places, as a string so no client rounds it.
          examples:
            - '1.0000'
        forked_from_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        status:
          $ref: '#/components/schemas/IngredientStatus'
        verification_status:
          $ref: '#/components/schemas/IngredientVerificationStatus'
        notes:
          type:
            - string
            - 'null'
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    IngredientEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - ingredient
          properties:
            ingredient:
              $ref: '#/components/schemas/AdminIngredient'
        meta:
          $ref: '#/components/schemas/Meta'
    IngredientAlias:
      type: object
      required:
        - id
        - alias
        - alias_normalised
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alias:
          type: string
          maxLength: 160
          description: Verbatim, as the source or the operator wrote it.
        alias_normalised:
          type: string
          maxLength: 160
          description: |
            Server-derived: lower-cased, trimmed, internal whitespace
            collapsed. Deliberately conservative — it does not stem or strip
            punctuation, because "Paprika Sweet" and "Paprika Smoked" are
            different ingredients.
        locale:
          type:
            - string
            - 'null'
          enum:
            - en
            - ar
            - null
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
      additionalProperties: false
    IngredientCategory:
      type: object
      required:
        - id
        - organisation_id
        - is_platform
        - parent_id
        - code
        - name_en
        - name_ar
        - display_order
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_platform:
          type: boolean
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for a top-level category.
        code:
          type: string
          maxLength: 40
        name_en:
          type: string
        name_ar:
          type: string
        display_order:
          type: integer
        is_active:
          type: boolean
      additionalProperties: false
    IngredientCategoryEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - category
          properties:
            category:
              $ref: '#/components/schemas/IngredientCategory'
        meta:
          $ref: '#/components/schemas/Meta'
    IngredientAllergenMapping:
      type: object
      required:
        - id
        - allergen_code
        - layer
        - organisation_id
        - containment
        - market_scope
        - source
        - verification_status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        layer:
          type: string
          enum:
            - platform_baseline
            - organisation_overlay
          description: |
            Derived, not stored. The client renders a baseline row read-only
            and its own overlay editable; asking it to infer that from a
            nullable identifier is how a UI ends up offering an edit control
            that always 403s.
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        containment:
          type: string
          enum:
            - contains
            - may_contain
          description: An ingredient of the ingredient, or a cross-contact risk. Legally different statements.
        market_scope:
          type: string
          enum:
            - all
            - us_only
            - eu_only
          description: |
            EU-14 and US Big-9 are different lists. Coconut is a tree nut
            under US law and not an EU allergen, so it is carried as a
            `us_only` mapping rather than a note nobody reads.
        source:
          type: string
          enum:
            - master_list
            - technical_sheet
            - supplier_declaration
            - kitchen_declared
            - inferred
        verification_status:
          type: string
          enum:
            - verified
            - unverified
            - requires_review
            - requires_supplier_confirmation
        evidence:
          type:
            - string
            - 'null'
          description: Free text supporting the statement — a supplier reference, a sheet, a note.
      additionalProperties: false
    IngredientAllergenCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IngredientAllergenMapping'
        meta:
          $ref: '#/components/schemas/Meta'
    CreateIngredientRequest:
      type: object
      required:
        - name_en
        - default_unit_id
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Falls back to the English name when absent.
        slug:
          type:
            - string
            - 'null'
          maxLength: 110
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Derived from the name when absent, and de-duplicated within the organisation.
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        yield_factor:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9999
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
      additionalProperties: false
    UpdateIngredientRequest:
      type: object
      minProperties: 1
      description: |
        A partial update. `slug` and `status` are absent by design — the slug
        is the handle a re-import converges on, and status changes are
        lifecycle actions with their own routes.
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        ingredient_category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        ingredient_subcategory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        default_unit_id:
          $ref: '#/components/schemas/Uuid'
        yield_factor:
          type: number
          exclusiveMinimum: 0
          maximum: 99.9999
        availability_tier:
          $ref: '#/components/schemas/AvailabilityTier'
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
      additionalProperties: false
    ReplaceIngredientAllergensRequest:
      type: object
      required:
        - mappings
      properties:
        market_scope:
          type: string
          enum:
            - all
            - us_only
            - eu_only
          default: all
          description: The scope whose set is being replaced. Other scopes are untouched.
        mappings:
          type: array
          maxItems: 50
          description: |
            The complete statement for this scope and this layer. An empty
            array means "no allergens", which is a statement rather than a
            missing field — and is refused where a platform baseline would be
            weakened by it.
          items:
            type: object
            required:
              - allergen_code
              - containment
            properties:
              allergen_code:
                $ref: '#/components/schemas/AllergenCode'
              containment:
                type: string
                enum:
                  - contains
                  - may_contain
              source:
                type:
                  - string
                  - 'null'
                enum:
                  - master_list
                  - technical_sheet
                  - supplier_declaration
                  - kitchen_declared
                  - inferred
                  - null
              verification_status:
                type:
                  - string
                  - 'null'
                enum:
                  - verified
                  - unverified
                  - requires_review
                  - requires_supplier_confirmation
                  - null
              evidence:
                type:
                  - string
                  - 'null'
                maxLength: 2000
            additionalProperties: false
      additionalProperties: false
    RecipeStatus:
      type: string
      enum:
        - active
        - archived
      description: |
        The operational lifecycle of a recipe *identity*. Deliberately not the
        publication family: a recipe is never published, its versions are.
        There is no `inactive` either — "temporarily not in use" is expressed
        by having no published version.
    RecipeConfidentiality:
      type: string
      enum:
        - internal
        - confidential
      default: confidential
      description: |
        How guarded a formulation is. Defaults to `confidential` because a
        recipe is a kitchen's commercial secret until somebody decides
        otherwise, and a default that leaks is a default that is wrong exactly
        once. Neither value makes a formulation public: recipe lines are on
        the public denylist regardless.
    RecipeVersionStatus:
      type: string
      enum:
        - draft
        - review_required
        - published
        - retired
      description: |
        The publication lifecycle of a version. `review_required` is a
        **stored** quarantine state, not a flag beside one: a critical
        allergen contradiction has to block publication structurally, and a
        boolean next to a status is something a publish path can forget to
        read. A quarantined version is still editable — the point is that
        somebody fixes it — and is as unpublishable as a draft.

        "Publishable" is never stored; it is the readiness evaluator's verdict
        at the moment of publication.
    RecipeCompleteness:
      type: string
      enum:
        - indicative
        - costed
      description: |
        `indicative` is a formulation without costs — which is what the
        sauces-and-dressings source provides, and recording that honestly
        beats inventing figures. `costed` is what a technical sheet is.
    DerivationState:
      type: string
      enum:
        - current
        - stale
        - failed
      description: |
        Whether the frozen allergen label still matches the ingredient
        mappings it was computed from. A new version is `stale` — nothing has
        been derived for it, and claiming `current` for an empty label would be
        the most dangerous default available. `failed` records that a recompute
        was attempted and could not complete, which must never be
        indistinguishable from "not tried yet".
    AllergenDerivation:
      type: string
      enum:
        - declared
        - derived
      description: |
        Where a label row came from. `derived` was computed from the effective
        ingredient mappings and carries the ingredient that caused it;
        `declared` is a human statement — a chef who knows the fryer is shared
        — that no mapping implies. A derivation never weakens a declaration.
    AdminRecipe:
      type: object
      required:
        - id
        - organisation_id
        - slug
        - name_en
        - name_ar
        - confidentiality
        - status
        - published_version_number
        - lock_version
      description: |
        The administrative shape of a recipe identity. Carries **both** names
        and ignores `Accept-Language` for them: a bilingual editor has to see
        what it is editing. There is no public recipe projection.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          $ref: '#/components/schemas/Uuid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        slug:
          type: string
          maxLength: 120
        name_en:
          type: string
        name_ar:
          type: string
          description: Falls back to the English name where no Arabic exists.
        recipe_category:
          type:
            - string
            - 'null'
          maxLength: 40
          description: |
            Free text, deliberately not an enumeration: the source vocabulary
            (sauce, dressing, marination, patty, topping, component) describes
            how one kitchen files its sheets, not a regulated identity, and an
            enum would turn "we started making dips" into a migration.
        source_kind:
          type:
            - string
            - 'null'
          maxLength: 40
          description: The source sheet's `Kind`, verbatim.
        confidentiality:
          $ref: '#/components/schemas/RecipeConfidentiality'
        status:
          $ref: '#/components/schemas/RecipeStatus'
        notes:
          type:
            - string
            - 'null'
        published_version_number:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            The live version, or null when nothing is published. Computed, not
            stored: there is no `current_version_id` column to fall out of
            step with the versions themselves.
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
        lock_version:
          type: integer
          minimum: 0
          description: Also served as the `ETag` of the single-resource GET.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    RecipeEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - recipe
          properties:
            recipe:
              $ref: '#/components/schemas/AdminRecipe'
        meta:
          $ref: '#/components/schemas/Meta'
    AdminRecipeVersion:
      type: object
      required:
        - id
        - recipe_id
        - version_number
        - status
        - completeness
        - waste_coefficient_percent
        - derivation_state
        - lock_version
      description: |
        The header of a recipe version. `derived_input_hash` is deliberately
        absent from the wire: it is an internal fingerprint, and publishing it
        would invite clients to compare hashes instead of reading
        `derivation_state`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recipe_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RecipeVersionStatus'
        completeness:
          $ref: '#/components/schemas/RecipeCompleteness'
        yield_quantity:
          type:
            - string
            - 'null'
          description: Decimal with four places, as a string so no client rounds it.
          examples:
            - '1000.0000'
        yield_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        yield_piece_count:
          type:
            - integer
            - 'null'
          minimum: 1
        input_quantity_total:
          type:
            - string
            - 'null'
          description: |
            The sum of the input lines, kept alongside the yield because the
            source sheets state both and they legitimately differ.
        waste_coefficient_percent:
          type: string
          description: |
            Decimal with two places, as a string. Defaults to `3.00` — the flat
            allowance the source technical sheets apply across the board.
          examples:
            - '3.00'
        derivation_state:
          $ref: '#/components/schemas/DerivationState'
        derived_at:
          type:
            - string
            - 'null'
          format: date-time
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        review_reason:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Why this version is quarantined, when it is.
        notes:
          type:
            - string
            - 'null'
        lock_version:
          type: integer
          minimum: 0
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    RecipeVersionEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - version
          properties:
            version:
              $ref: '#/components/schemas/AdminRecipeVersion'
        meta:
          $ref: '#/components/schemas/Meta'
    RecipeLine:
      type: object
      required:
        - id
        - line_number
        - ingredient_id
      description: |
        One formulation line.

        **No cost fields.** `recipe_version_lines` carries
        `unit_cost_amount`, `line_cost_amount` and `cost_currency_code`, and
        this projection reads none of them. The cost surface is K1.3, behind
        `recipe.view_costs_organisation`; until that permission exists there is
        no way to serve a cost to the right people, so the honest projection
        serves it to nobody.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        line_number:
          type: integer
          minimum: 1
          description: Server-authored from the submitted order.
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type:
            - string
            - 'null'
          description: |
            Decimal with four places, as a string. Null is legal only while the
            version is unpublished — the publish gate is where nullability
            ends.
        unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        source_designation:
          type:
            - string
            - 'null'
          maxLength: 160
          description: The import source wording, verbatim.
        comment:
          type:
            - string
            - 'null'
          maxLength: 255
      additionalProperties: false
    RecipeOutput:
      type: object
      required:
        - id
        - ingredient_id
        - output_quantity
        - unit_id
        - is_primary
      description: |
        What a version produces. An ingredient with a row here is what the
        design used to call an "intermediate"; there is no kind column
        anywhere, because being an intermediate is a fact about some version's
        outputs and not a property of the ingredient.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        output_quantity:
          type: string
          examples:
            - '1000.0000'
        unit_id:
          $ref: '#/components/schemas/Uuid'
        is_primary:
          type: boolean
          description: At most one per version, enforced by a partial unique index.
      additionalProperties: false
    RecipeStep:
      type: object
      required:
        - id
        - step_number
        - instruction_en
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        step_number:
          type: integer
          minimum: 1
        instruction_en:
          type: string
        instruction_ar:
          type:
            - string
            - 'null'
        minutes:
          type:
            - integer
            - 'null'
          minimum: 0
      additionalProperties: false
    RecipeVersionAllergen:
      type: object
      required:
        - id
        - allergen_code
        - containment
        - derivation
      description: |
        One row of a version's frozen label — the only part of a recipe version
        that is ever meant to reach a diner.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        allergen_code:
          $ref: '#/components/schemas/AllergenCode'
        containment:
          type: string
          enum:
            - contains
            - may_contain
        derivation:
          $ref: '#/components/schemas/AllergenDerivation'
        source_ingredient_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The line ingredient a derived row came from. Provenance is what
            makes a warning trusted: "sesame, from tahini" is acted on where a
            bare "sesame" is clicked past.
        source_note:
          type:
            - string
            - 'null'
          maxLength: 255
          description: |
            For a derived row, the market scopes that contributed. The label is
            one row per class, so a scope column would either duplicate rows or
            pick one scope and lose the rest.
      additionalProperties: false
    CostBasis:
      type: string
      enum:
        - as_recorded
        - recalculated
      description: |
        Where a snapshot's arithmetic came from.

        `recalculated` is arithmetic this system performed over the version's
        lines: reproducible, and re-derivable from data still in the database.

        `as_recorded` is what a source technical sheet stated, stored verbatim
        **including its errors**. Several of the source sheets do their own
        arithmetic and do it wrong; correcting one on import destroys the
        evidence that it needs correcting, and trusting one puts a wrong number
        behind a right-looking label. Storing both and saying which is which is
        the only honest option. Written by the private importer only.
    TechnicalSheetLine:
      type: object
      required:
        - id
        - line_number
        - ingredient_id
      description: |
        One costed formulation line. Served **only** from the technical sheet,
        behind `recipe.view_costs_organisation`; the ordinary `RecipeLine`
        projection carries none of these fields.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        line_number:
          type: integer
          minimum: 1
        ingredient_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type:
            - string
            - 'null'
          description: Decimal with four places, as a string so no client rounds it.
        unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        unit_cost_amount:
          type:
            - string
            - 'null'
          description: |
            Major currency units with six decimal places, as a string. Floats
            cannot represent `0.1`, and a cost whose total depends on the order
            the lines were summed in is not a cost.
          examples:
            - '3.900000'
        line_cost_amount:
          type:
            - string
            - 'null'
          description: |
            On the wire beside `unit_cost_amount` even though one is derivable
            from the other, because on an imported sheet they legitimately
            disagree: the source's own arithmetic is stored verbatim, and a
            reader who could only see the inputs would have no way to notice.
          examples:
            - '9.750000'
        cost_currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
        source_designation:
          type:
            - string
            - 'null'
          maxLength: 160
        comment:
          type:
            - string
            - 'null'
          maxLength: 255
      additionalProperties: false
    CostSnapshot:
      type: object
      required:
        - id
        - recipe_version_id
        - basis
        - currency_code
        - total_input_cost_amount
        - waste_coefficient_percent
        - basis_mismatch
        - calculated_at
      description: |
        What one version cost, at one moment, on one basis. Append-only:
        `UPDATE` and `DELETE` are revoked from the application database role,
        so a snapshot is superseded by a newer one and never edited.

        The per-unit figures are null when the version does not say what it
        yields. Inventing a denominator to fill a column is the fabrication
        this programme exists to avoid.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recipe_version_id:
          $ref: '#/components/schemas/Uuid'
        basis:
          $ref: '#/components/schemas/CostBasis'
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Every amount on this snapshot is in this one currency. Nothing converts between currencies.
        total_input_cost_amount:
          type: string
          description: The sum of the line costs, major units, six decimal places.
          examples:
            - '10.000000'
        cost_per_yield_unit_amount:
          type:
            - string
            - 'null'
          description: Total ÷ `yield_quantity`. Null unless the version states both a yield quantity and a yield unit.
        yield_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The unit `cost_per_yield_unit_amount` is per. A per-unit cost without its unit is a number, not a cost.
        cost_per_piece_amount:
          type:
            - string
            - 'null'
          description: Total ÷ `yield_piece_count`. Null unless the version counts pieces.
        waste_coefficient_percent:
          type: string
          description: |
            Copied from the version at calculation time rather than joined at
            read time: a kitchen that later revises its allowance must not
            retroactively rewrite what an old snapshot said. The source sheets
            apply a flat `3.00`.
          examples:
            - '3.00'
        cost_per_yield_unit_with_waste_amount:
          type:
            - string
            - 'null'
          description: The per-unit figure × (1 + waste ÷ 100), rounded once.
        cost_per_piece_with_waste_amount:
          type:
            - string
            - 'null'
        source_label:
          type:
            - string
            - 'null'
          maxLength: 60
          description: |
            The source sheet's own wording, verbatim — "Cost per kg", "U.P.".
            Kept as evidence and **never** consulted to decide what a number
            means: at least five source sheets label a figure "cost per kg"
            beside a piece count. The basis is derived from the version's yield
            fields instead.
        basis_mismatch:
          type: boolean
          description: |
            The label claims something the version's yield cannot support.
            Served with the figures and never without them: a number that looks
            authoritative while it is under review is worse than no number.
            Conservative by design — wording nobody can classify raises
            nothing, because a flag that cannot be substantiated teaches
            reviewers to ignore the flag.
        calculated_at:
          type: string
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    TechnicalSheet:
      type: object
      required:
        - version
        - completeness
        - currency_conflict
        - lines
        - uncosted_line_numbers
        - snapshots
      description: The confidential cost projection of one recipe version.
      properties:
        version:
          $ref: '#/components/schemas/AdminRecipeVersion'
        completeness:
          $ref: '#/components/schemas/RecipeCompleteness'
        currency_code:
          type:
            - string
            - 'null'
          minLength: 3
          maxLength: 3
          description: |
            The single currency the costed lines share. Null when nothing is
            costed **or** when an import left more than one behind;
            `currency_conflict` says which, because "no currency" and "several
            currencies" need different fixes.
        currency_conflict:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalSheetLine'
        uncosted_line_numbers:
          type: array
          description: |
            Lines that contributed nothing to a total, in line order — no
            quantity, no unit cost, or no currency. While this is non-empty no
            `recalculated` snapshot can be written, because a total that
            silently omits a line reads exactly like a total that did not.
          items:
            type: integer
            minimum: 1
        snapshots:
          type: object
          required:
            - recalculated
            - as_recorded
          description: |
            The latest snapshot of each basis. Both keys are always present, so
            a client never has to guess whether a missing key means "none" or
            "not asked for"; either value may be null.
          properties:
            recalculated:
              oneOf:
                - $ref: '#/components/schemas/CostSnapshot'
                - type: 'null'
            as_recorded:
              oneOf:
                - $ref: '#/components/schemas/CostSnapshot'
                - type: 'null'
          additionalProperties: false
      additionalProperties: false
    CreateRecipeRequest:
      type: object
      required:
        - name_en
      properties:
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Falls back to the English name when absent.
        slug:
          type:
            - string
            - 'null'
          maxLength: 110
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
