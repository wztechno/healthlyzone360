              schema:
                $ref: '#/components/schemas/CatalogueItemEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}:
    get:
      operationId: showCatalogueItem
      tags:
        - Sellable catalogue
      summary: A catalogue item and everything hanging off it
      description: |
        Returns `ETag: "<lock_version>"` — the item's validator, which every
        write on it and on its sub-resources sends back as `If-Match`.

        Variants, the public ingredient list, diet tags and channel
        availability come with it: opening a listing and asking what it is made
        of is one interaction, not five, and each set is bounded by what a
        human typed into one form.

        Diet classifications are returned as **codes**, matching what the
        setter accepts.

        An item belonging to another organisation is indistinguishable from one
        that does not exist: both are `resource.not_found`.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The item with its variants, ingredients, diet tags and channels.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - item
                      - variants
                      - ingredients
                      - diet_classifications
                      - channels
                    properties:
                      item:
                        $ref: '#/components/schemas/AdminCatalogueItem'
                      variants:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCatalogueItemVariant'
                      ingredients:
                        type: array
                        items:
