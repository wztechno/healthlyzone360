openapi: 3.1.0
info:
  title: Healthy360 Platform API
  version: 1.0.0
  summary: Authentication, identity and organisation context for the Healthy360 platform foundation.
  description: |
    The authoritative wire contract for the endpoints implemented in the
    platform foundation (plan §14, `docs/api/conventions.md`).

    **Envelopes.** Every response body is either
    `{"data": ..., "meta": {...}}` or
    `{"error": {"code", "message", "details", "correlation_id"}}`. The
    documented exceptions are `204 No Content` responses, file downloads,
    streaming responses and the health check at `/up`.

    **Error codes.** `error.code` is stable and machine-readable. Clients
    branch on the code, never on the message. Within `/api/v1` a code may be
    added but never renamed or repurposed.

    **Correlation.** The server generates `X-Correlation-Id` for every
    request and returns it as a header, in `meta.correlation_id` on success
    and in `error.correlation_id` on failure. A client may send
    `X-Client-Request-Id`; it is logged and echoed, and is never used as the
    correlation identifier.

    **Credentials.** First-party clients (the Expo web build) authenticate
    with a Sanctum cookie session and must send an `Origin` belonging to a
    configured stateful domain. Native clients exchange credentials for a
    device-bound personal access token at `POST /auth/token` and send it as a
    bearer token.
  license:
    name: Proprietary
    url: https://healthy360.com/legal/api-terms
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://{host}/api/v1
    description: Deployed environment
    variables:
      host:
        default: api.healthy360.com
        description: The API host for the target environment.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Authentication
    description: Sessions, tokens, password reset and email verification.
  - name: Two-factor authentication
    description: TOTP enrolment, challenge and recovery codes.
  - name: Current user
    description: Hydration, workspace selection and device management.
  - name: Organisations
    description: Organisation-scoped endpoints, reached with a validated context.
  - name: Kitchen catalogue
    description: Ingredients, categories, aliases and allergen mappings, managed by a kitchen.
  - name: Recipes
    description: |
      Recipes and their versions — lines, outputs, steps and the frozen
      allergen label — with the publication lifecycle and its quarantine gate.
      Confidential throughout: no operation here has an anonymous counterpart,
      and recipe lines are on the public denylist.
  - name: Sellable catalogue
    description: |
      Catalogue items — products, meals and subscription plans — with their
      variants, public ingredient lists, diet tags, sales channels and
      availability, under the publication lifecycle and its quarantine gate.
      **No operation in this family carries a price, a cost or a margin**: what
      is confidential about a catalogue is what it costs, and that lives in the
      pricing tables.
  - name: Pricing
    description: |
      Price lists, their effective-dated entries and their channel
      assignments.

      Three things are worth reading before the operations. **The currency
      lives on the list**, so every amount inside one is comparable by
      construction and there is no cross-currency arithmetic anywhere.
      **Amounts are integers of minor units** and are never formatted
      server-side — `4500` with `currency_code: AED`, never `"45.00 AED"` and
      never `45.0`. And **a price row is never edited**: the entries endpoint
      takes the desired current state and the server closes and reopens rows
      behind it, so what a customer was charged last March stays
      reconstructable.

      `price_status` is the honest badge: `confirmed` carries a number,
      `placeholder` and `market_priced` carry none and the absence is the
      statement. The admin operations here serve all three; the public
      projection (M1) will serve only `confirmed`.

      This family has **its own permission pair** — `price_list.view_organisation`
      and `price_list.manage_organisation` — because price visibility is
      commercial rather than culinary. A chef holds every catalogue and recipe
      permission and neither of these.
  - name: Subscription plans
    description: |
      The commercial definition of a subscription: the vocabularies a plan is
      built from, its terms, its configuration matrix and the runs it is sold
      for.

      Three things are worth reading before the operations. **A plan
      configuration is a catalogue item variant** — the same row a pack is —
      so a plan is priced through exactly the same path as everything else and
      `catalogue_item_variant_id` is what a price names. **Variant existence
      encodes the matrix**: a cell a kitchen sells is a configuration, a cell it
      does not is the absence of one, and there is no availability flag to
      disagree with that. And **a duration is a kind, not a number**:
      `one_off` carries no `duration_days` at all, which is what replaced the
      zero-day row the legacy design used.

      `discount_percent` is nullable and **null is a value**: it means nobody
      has stated a discount, which is commercially different from stating that
      there is none. It is never returned as `0`.

      This family has **its own permission pair** —
      `plan.manage_organisation` and `plan.publish_organisation` — because a
      subscription is a commercial instrument before it is a menu. Publication
      is not an operation here: it stays `POST /catalogue/items/{item}/publish`,
      which additionally requires `plan.publish_organisation` when the item is a
      plan.
  - name: Delivery
    description: |
      Where a kitchen delivers, what it charges to get there, and when the van
      goes.

      **Two levels of geography, and the split is the design.**
      `delivery_areas` is the platform gazetteer — the same Achrafieh for
      everybody — so an address captured once is comparable across kitchens and
      a customer never re-enters it because a kitchen redrew its map. A
      **zone** is one kitchen's commercial statement about a set of those
      places: a fee, a minimum order and a promise about how long it takes.

      **One area is served by one zone per branch.** An organisation-wide zone
      and a branch-scoped zone may both claim the same area — that is the
      override mechanism, and the branch claim wins when a branch is in
      context. Two zones at the *same* scope cannot, and the refusal names the
      zone that already holds it.

      Amounts are integers of minor units with the currency on the zone, and a
      `null` fee means nobody has decided rather than "free".

      Provider integration, driver allocation, tracking and proof of delivery
      are not here and are not implied: this family is configuration that
      precedes any delivery job.
  - name: Kitchen operations
    description: |
      Branch operating data — when a branch is open and how late an order for
      that day may still be placed.

      The only **branch-scoped** family in the kitchen programme: `X-Branch-Id`
      is required, and an absent one is `400 context.branch_required` rather
      than a guess about which location the caller meant. The week is read and
      replaced whole, so there is no `If-Match` and no half-week to protect.

      A **closed day is a row**; a day nobody has configured is an absent one.
  - name: Reference data
    description: Platform-governed vocabularies — public to read, platform-operator only to write.
paths:
  /auth/register:
    post:
      operationId: registerUser
      tags:
        - Authentication
      summary: Create an account
      description: |
        Creates the account, the person's profile and a consent grant for each
        accepted platform consent in one transaction, then sends an email
        verification link. A first-party caller also receives a session
        cookie; a native caller follows with `POST /auth/token`.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XClientPlatform'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAppMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - user
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  user:
                    id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c
                    email: nour@example.test
                    email_verified: false
                    two_factor_enabled: false
                meta:
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Start a first-party session
      description: |
        Authenticates a first-party client and establishes a Sanctum cookie
        session. The request must carry an `Origin` belonging to a configured
        stateful domain; a caller without one receives `request.invalid` and
        should use `POST /auth/token` instead.

        When the account has confirmed two-factor authentication the response
        is `200` with `two_factor_required: true` and **no** session; the
        client continues at `POST /auth/two-factor-challenge`.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginOutcome'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '422':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: End the first-party session
      description: |
        Destroys the session. Native clients revoke their credential with
        `DELETE /me/devices/{device}` instead.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The session was destroyed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - logged_out
                    properties:
                      logged_out:
                        type: boolean
                        const: true
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/token:
    post:
      operationId: issueDeviceToken
      tags:
        - Authentication
      summary: Exchange credentials for a device-bound token
      description: |
        The native credential flow. Registers (or re-registers) the device and
        returns a Sanctum personal access token. The plaintext token is
        returned exactly once; only its identifier is stored, on the device
        record. Re-registering the same device name and platform rotates the
        token and revokes the previous one.

        Throttling is shared with `POST /auth/login`: five attempts per minute
        per email address and IP address.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '201':
          description: The token was issued.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - token
                      - token_type
                      - user
                      - device
                    properties:
                      token:
                        type: string
                        description: The plaintext bearer token. Returned once and never again.
                        examples:
                          - 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3c|4Nx9…
                      token_type:
                        type: string
                        const: Bearer
                      user:
                        $ref: '#/components/schemas/User'
                      device:
                        $ref: '#/components/schemas/Device'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: |
            The account has two-factor authentication enabled and the request
            carried neither `two_factor_code` nor `recovery_code`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: auth.two_factor_required
                  message: A two-factor authentication code is required.
                  details: {}
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
        '422':
          description: |
            The credentials, the two-factor code or the request shape were
            rejected.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: auth.invalid_credentials
                  message: These credentials do not match our records.
                  details: {}
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      operationId: requestPasswordResetLink
      tags:
        - Authentication
      summary: Request a password reset link
      description: |
        Always answers `202`, whether or not the address has an account: this
        endpoint must not reveal which addresses are registered. The mailed
        link points at the client application, which posts the token back to
        `POST /auth/reset-password`. Limited to three requests per minute per
        email address.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags:
        - Authentication
      summary: Replace a forgotten password
      description: |
        No session is established: the client signs in again with the new
        password, which also proves it was received. An expired, forged or
        mismatched token is reported against the `token` field so the endpoint
        cannot be used to probe which accounts exist.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: The password was replaced.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - password_reset
                    properties:
                      password_reset:
                        type: boolean
                        const: true
                  meta:
                    $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/verification-notification:
    post:
      operationId: resendEmailVerification
      tags:
        - Authentication
      summary: Resend the email verification link
      description: |
        Answers `204` when the address is already verified — a documented
        envelope exception. Limited to six requests per minute.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '204':
          description: The address is already verified; nothing was sent.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-email/{id}/{hash}:
    get:
      operationId: verifyEmail
      tags:
        - Authentication
      summary: Verify an email address
      description: |
        The target of the signed link sent by the platform. Idempotent:
        following an already-used link returns the same body, because a mail
        client that pre-fetches the link must not break the flow for the
        person.
      parameters:
        - name: id
          in: path
          required: true
          description: The identifier of the account being verified.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: hash
          in: path
          required: true
          description: SHA-1 of the email address being verified.
          schema:
            type: string
        - name: expires
          in: query
          required: false
          description: Signature expiry, part of the signed link.
          schema:
            type: integer
        - name: signature
          in: query
          required: false
          description: The link signature.
          schema:
            type: string
      responses:
        '200':
          description: The address is verified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - email_verified
                    properties:
                      email_verified:
                        type: boolean
                        const: true
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The link is invalid, has expired, or belongs to another account.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: auth.invalid_signature
                  message: This link is invalid or has expired. Please request a new one.
                  details: {}
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/confirm-password:
    post:
      operationId: confirmPassword
      tags:
        - Authentication
      summary: Confirm the current password (step-up)
      description: |
        Unlocks the step-up protected endpoints for `timeout_seconds`. The
        confirmation is bound to the credential that performed it: a session
        confirmation does not unlock a bearer token, and the reverse.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/PasswordConfirmationStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/confirmed-password-status:
    get:
      operationId: showPasswordConfirmationStatus
      tags:
        - Authentication
      summary: Whether a step-up protected action may proceed
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PasswordConfirmationStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-challenge:
    post:
      operationId: completeTwoFactorChallenge
      tags:
        - Two-factor authentication
      summary: Complete a two-factor sign-in
      description: |
        Continues the login that answered `two_factor_required: true`. Supply
        either `code` (the current TOTP) or `recovery_code`. A recovery code
        is consumed and replaced. Limited to five attempts per minute.
      security: []
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorChallengeRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginOutcome'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '422':
          description: The code was rejected, or no sign-in is pending.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: auth.two_factor_invalid
                  message: The provided two-factor authentication code was invalid.
                  details:
                    field: code
                  correlation_id: 0198c5f2-7d3a-7b1e-9c4d-2f6a8b0e1d3d
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-authentication:
    post:
      operationId: enableTwoFactorAuthentication
      tags:
        - Two-factor authentication
      summary: Begin two-factor enrolment
      description: |
        Generates a secret and eight recovery codes. Two-factor authentication
        is **not** armed until `POST /auth/confirmed-two-factor-authentication`
        succeeds, so a person who cannot finish configuring their
        authenticator is never locked out.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Replace an existing secret rather than reusing it.
                  default: false
      responses:
        '201':
          $ref: '#/components/responses/TwoFactorStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: disableTwoFactorAuthentication
      tags:
        - Two-factor authentication
      summary: Switch two-factor authentication off
      description: |
        Step-up protected: confirm the password at `POST /auth/confirm-password`
        first, or the request is refused with `auth.step_up_required`.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          $ref: '#/components/responses/TwoFactorStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/confirmed-two-factor-authentication:
    post:
      operationId: confirmTwoFactorAuthentication
      tags:
        - Two-factor authentication
      summary: Complete two-factor enrolment
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: The current one-time password from the authenticator.
                  examples:
                    - '123456'
      responses:
        '200':
          $ref: '#/components/responses/TwoFactorStateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-qr-code:
    get:
      operationId: showTwoFactorQrCode
      tags:
        - Two-factor authentication
      summary: The provisioning QR code
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The QR code for the pending or active secret.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - svg
                      - url
                    properties:
                      svg:
                        type: string
                        description: An inline SVG element.
                      url:
                        type: string
                        description: The otpauth:// provisioning URI.
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-secret-key:
    get:
      operationId: showTwoFactorSecretKey
      tags:
        - Two-factor authentication
      summary: The shared secret
      description: For authenticator applications that cannot scan a QR code.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The shared secret.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - secret_key
                    properties:
                      secret_key:
                        type: string
                        examples:
                          - JBSWY3DPEHPK3PXP
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-recovery-codes:
    get:
      operationId: listTwoFactorRecoveryCodes
      tags:
        - Two-factor authentication
      summary: The remaining recovery codes
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: regenerateTwoFactorRecoveryCodes
      tags:
        - Two-factor authentication
      summary: Replace the recovery codes
      description: Invalidates every previous recovery code.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '201':
          $ref: '#/components/responses/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      operationId: showCurrentUser
      tags:
        - Current user
      summary: Hydrate the current user
      description: |
        Identity, profile, every workspace the person may act under, the
        active context with its calculated permissions and entitlements, and
        any consent still owed.

        The active context comes from `X-Organisation-Id` and `X-Branch-Id`
        when they are sent, and from the workspace remembered by
        `PUT /me/context` otherwise. A remembered context that no longer
        validates yields `active_context: null` rather than an error, so a
        returning client is never locked out of its own hydration.

        Deliberately reachable before email verification: the client needs
        this payload to render the "verify your email" state.
      parameters:
        - $ref: '#/components/parameters/XOrganisationId'
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
        - $ref: '#/components/parameters/XAppMode'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XClientPlatform'
      responses:
        '200':
          description: The current user.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - user
                      - profile
                      - memberships
                      - active_context
                      - pending_consents
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      profile:
                        $ref: '#/components/schemas/Profile'
                      memberships:
                        type: array
                        items:
                          $ref: '#/components/schemas/Membership'
                      active_context:
                        $ref: '#/components/schemas/ActiveContext'
                      pending_consents:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingConsent'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - permissions_version
                        properties:
                          permissions_version:
                            type: string
                            description: |
                              An opaque stamp over the platform and
                              organisation permission-version counters. A
                              change means a cached permission set is stale.
                            examples:
                              - '0.3'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/memberships:
    get:
      operationId: listMemberships
      tags:
        - Current user
      summary: List the workspaces available to the current user
      description: |
        The workspace picker's data source: the same collection `/me` embeds,
        without hydrating a context.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The memberships the person may act under.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                        properties:
                          count:
                            type: integer
                            minimum: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/context:
    put:
      operationId: updateActiveContext
      tags:
        - Current user
      summary: Select the active organisation and branch
      description: |
        Validated by exactly the same server-side rules the
        `X-Organisation-Id` and `X-Branch-Id` headers go through, so selection
        cannot reach a context that a per-request header would reject. The
        choice is remembered on the profile and returned hydrated.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organisation_id
              properties:
                organisation_id:
                  $ref: '#/components/schemas/Uuid'
                branch_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '200':
          description: The context was selected.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - active_context
                    properties:
                      active_context:
                        $ref: '#/components/schemas/ActiveContext'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/devices:
    get:
      operationId: listDevices
      tags:
        - Current user
      summary: List the registered devices
      description: |
        Active devices, newest first. Revoked devices are history rather than
        something a client can act on, so they are not listed.
      parameters:
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The caller's active devices.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - count
                        properties:
                          count:
                            type: integer
                            minimum: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailUnverified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/devices/{device}:
    delete:
      operationId: revokeDevice
      tags:
        - Current user
      summary: Revoke a device
      description: |
        Revokes the device and destroys the credential it carries. Step-up
        protected: this is how a stolen phone is cut off, so a hijacked
        session must not be able to perform it. Revoking the device backing
        the current request is allowed and takes effect immediately.

        A device belonging to somebody else is indistinguishable from one that
        does not exist: both are `resource.not_found`.
      parameters:
        - name: device
          in: path
          required: true
          description: The device identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The device was revoked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organisations/current:
    get:
      operationId: showCurrentOrganisation
      tags:
        - Organisations
      summary: The organisation of the active context
      description: |
        Requires `X-Organisation-Id`, an active membership in that
        organisation, and the `organisation.view_current` permission. Each
        failure mode carries its own code: `context.organisation_required`
        (400), `context.organisation_forbidden` (403),
        `context.branch_out_of_scope` (403) or `authz.permission_denied`
        (403, with the denying RBAC step in `details.reason`).
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XBranchId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The active organisation and branch.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - organisation
                      - branch
                    properties:
                      organisation:
                        $ref: '#/components/schemas/Organisation'
                      branch:
                        oneOf:
                          - $ref: '#/components/schemas/Branch'
                          - type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients:
    get:
      operationId: listIngredients
      tags:
        - Kitchen catalogue
      summary: List ingredients
      description: |
        The organisation's own ingredients **and** the platform library, in
        one cursor-paginated list. `is_platform` distinguishes them: platform
        rows are readable by every organisation and writable by none.

        Archived rows are excluded unless `status=archived` is asked for by
        name — an archived ingredient is history, and a list that quietly
        included it would invite somebody to build a recipe out of one.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match over both names and every alias.
          schema:
            type: string
            maxLength: 160
        - name: status
          in: query
          required: false
          description: Restrict to one lifecycle state. Omitted, the list covers `active` and `inactive`.
          schema:
            $ref: '#/components/schemas/IngredientStatus'
        - name: category
          in: query
          required: false
          description: Restrict to one category or sub-category identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of ingredients.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminIngredient'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createIngredient
      tags:
        - Kitchen catalogue
      summary: Create an ingredient
      description: |
        Adds an ingredient to the calling organisation's own catalogue. The
        row starts `active` and `unverified`: usable immediately, and checked
        by nobody yet.

        Derived values are never client-supplied — `status`,
        `verification_status`, `lock_version`, `organisation_id` and the
        source-provenance fields are all server-authored.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngredientRequest'
      responses:
        '201':
          description: The ingredient was created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients/{ingredient}:
    get:
      operationId: showIngredient
      tags:
        - Kitchen catalogue
      summary: An ingredient and its aliases
      description: |
        Returns `ETag: "<lock_version>"`. That header is the client's half of
        the optimistic-concurrency contract: read the resource, keep the
        validator, send it back as `If-Match` when writing.

        An ingredient belonging to another organisation is indistinguishable
        from one that does not exist: both are `resource.not_found`.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The ingredient.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - ingredient
                      - aliases
                    properties:
                      ingredient:
                        $ref: '#/components/schemas/AdminIngredient'
                      aliases:
                        type: array
                        items:
                          $ref: '#/components/schemas/IngredientAlias'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateIngredient
      tags:
        - Kitchen catalogue
      summary: Update an ingredient
      description: |
        Requires `If-Match` carrying the `ETag` the resource was last served
        with. Absent, the request is **428** `request.precondition_required`
        — the client has not lost a race, it never entered one. Stale, it is
        **409** `resource.conflict` with `details.current_lock_version`.

        Platform-library rows are readable and not writable: a write is
        refused with `authz.permission_denied` and
        `details.reason = policy_denied`, never a 404, because the caller can
        see the row.

        `slug` and `status` are not editable here — the slug is the handle an
        import converges on, and status changes are lifecycle actions with
        their own routes.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngredientRequest'
      responses:
        '200':
          description: The updated ingredient, with its new validator.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients/{ingredient}/archive:
    post:
      operationId: archiveIngredient
      tags:
        - Kitchen catalogue
      summary: Archive an ingredient
      description: |
        A lifecycle action as a POST sub-resource, never a `PATCH status`: it
        carries its own audit action and its own consequences. There is no
        delete — an ingredient that has ever appeared in a recipe is part of a
        food-safety record.

        `If-Match` is required, exactly as for an update. Archiving an already
        archived ingredient is `409 resource.conflict`.

        **Refused while a live recipe version names it** (K1.2) —
        `409 catalogue.in_use`, with the referencing recipes and versions in
        `details`. An archived ingredient a published formulation depends on
        would leave that recipe pointing at history. Retired versions are not
        a blocker.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The archived ingredient.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IngredientArchiveConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients/{ingredient}/allergens:
    get:
      operationId: listIngredientAllergens
      tags:
        - Kitchen catalogue
      summary: Allergen mappings for an ingredient
      description: |
        Both layers in one list, each labelled by `layer`: the platform
        baseline (`platform_baseline`) and the calling organisation's overlay
        (`organisation_overlay`). A mapping editor that showed only the
        overlay would let a kitchen believe an ingredient carries no allergens
        when the baseline says it carries milk.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The visible allergen mappings.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientAllergenCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceIngredientAllergens
      tags:
        - Kitchen catalogue
      summary: Replace the allergen mappings of one layer
      description: |
        A PUT, not a PATCH: the body is the complete allergen statement for
        one market scope, so an omitted class means "not present" and can be
        acted on. A partial merge would make "removed" and "omitted" the same
        request, which on an allergen list is the difference between a
        correction and a silent regression. An empty `mappings` array is a
        legitimate statement, not a missing field.

        The layer written is derived from the caller's organisation and is
        never a request field: a platform operator replaces the baseline, any
        other organisation replaces only its own overlay.

        **Upgrade-only.** An organisation overlay may add a class the baseline
        does not mention, and may raise a `may_contain` to a `contains`. It
        may never drop a baseline class or weaken one — that is
        `422 validation.failed` with
        `details.weakened_allergen_classes`. Over-declaring an allergen costs
        a customer a menu option; under-declaring one costs them an ambulance.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceIngredientAllergensRequest'
      responses:
        '200':
          description: The mappings now visible for this ingredient.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientAllergenCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AllergenBaselineWeakened'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients/{ingredient}/aliases:
    get:
      operationId: listIngredientAliases
      tags:
        - Kitchen catalogue
      summary: The other names an ingredient answers to
      description: |
        Aliases are what designation resolution matches on first — a supplier
        wording or kitchen shorthand is an explicit human decision that "this
        text means this ingredient", where a name match is only a coincidence
        of spelling.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The aliases of this ingredient.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IngredientAlias'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: addIngredientAlias
      tags:
        - Kitchen catalogue
      summary: Add an alias
      description: |
        `alias_normalised` is derived by the server — lower-cased, trimmed,
        internal whitespace collapsed — and is never accepted from a client,
        so two writers cannot normalise differently and break lookup. A name
        that normalises to one the ingredient already answers to is
        `409 resource.conflict`.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alias
              properties:
                alias:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Verbatim, as the operator wrote it.
                locale:
                  type:
                    - string
                    - 'null'
                  enum:
                    - en
                    - ar
                    - null
              additionalProperties: false
      responses:
        '201':
          description: The alias was added.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - alias
                    properties:
                      alias:
                        $ref: '#/components/schemas/IngredientAlias'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredients/{ingredient}/aliases/{alias}:
    delete:
      operationId: removeIngredientAlias
      tags:
        - Kitchen catalogue
      summary: Remove an alias
      description: |
        A real delete, unlike almost everything else in the catalogue: an
        alias is a lookup convenience, not a food-safety record, and a wrong
        one actively misroutes a designation. The removal is audited.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/IngredientPath'
        - name: alias
          in: path
          required: true
          description: The alias identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '204':
          description: The alias was removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredient-categories:
    get:
      operationId: listIngredientCategories
      tags:
        - Kitchen catalogue
      summary: The ingredient taxonomy
      description: |
        The platform taxonomy plus the organisation's own, flat, with
        `parent_id` carrying the two-level tree. Deliberately not paginated
        and not nested: the taxonomy is small, the client renders it in one
        pass, and paginating a tree would hand it half a hierarchy.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every visible category.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IngredientCategory'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createIngredientCategory
      tags:
        - Kitchen catalogue
      summary: Create a category
      description: |
        `code` must be unique across everything the caller can see, the
        platform taxonomy included: a tenant code that shadowed a platform
        code would make every later "which category is this?" ambiguous, in
        the interface and in an import alike. A collision is
        `409 resource.conflict`.

        Requires `catalogue.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name_en
              properties:
                code:
                  type: string
                  maxLength: 40
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                name_en:
                  type: string
                  maxLength: 255
                name_ar:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                  description: Falls back to the English name when absent.
                parent_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                display_order:
                  type: integer
                  minimum: 0
                  maximum: 100000
              additionalProperties: false
      responses:
        '201':
          description: The category was created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientCategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/ingredient-categories/{category}:
    patch:
      operationId: updateIngredientCategory
      tags:
        - Kitchen catalogue
      summary: Update a category
      description: |
        No `If-Match`: categories carry no `lock_version`, and the
        concurrency contract applies only to resources that do. Sending a
        validator a resource cannot honour would be worse than sending none.

        `code` is not editable — it is the handle an import maps onto.
        Platform categories are readable and not writable.

        Requires `catalogue.manage_organisation`.
      parameters:
        - name: category
          in: path
          required: true
          description: The category identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name_en:
                  type: string
                  maxLength: 255
                name_ar:
                  type: string
                  maxLength: 255
                parent_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                display_order:
                  type: integer
                  minimum: 0
                  maximum: 100000
                is_active:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: The updated category.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientCategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes:
    get:
      operationId: listRecipes
      tags:
        - Recipes
      summary: List recipes
      description: |
        The organisation's recipe book, cursor-paginated. There is no platform
        library of recipes: a recipe belongs to exactly one organisation,
        always.

        `published_version_number` answers "what is live" without a second
        request. It is computed, not stored — there is no
        `current_version_id` column to fall out of step with the versions.

        Archived recipes are excluded unless `status=archived` is asked for by
        name.

        Requires `recipe.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match over both names and the slug.
          schema:
            type: string
            maxLength: 160
        - name: status
          in: query
          required: false
          description: Restrict to one lifecycle state. Omitted, only `active` recipes are listed.
          schema:
            $ref: '#/components/schemas/RecipeStatus'
        - name: category
          in: query
          required: false
          description: Exact match on `recipe_category`.
          schema:
            type: string
            maxLength: 40
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of recipes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminRecipe'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRecipe
      tags:
        - Recipes
      summary: Create a recipe
      description: |
        Creates the recipe **and** its draft version 1, in one transaction. A
        recipe with no versions is a name with nothing behind it, and the
        version is the unit of work, so the response carries both rather than
        making the client fetch what the server just created.

        Derived values are never client-supplied: `status`, `lock_version`,
        `organisation_id` and the source-provenance fields are all
        server-authored.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeRequest'
      responses:
        '201':
          description: The recipe and its first draft version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - recipe
                      - version
                    properties:
                      recipe:
                        $ref: '#/components/schemas/AdminRecipe'
                      version:
                        $ref: '#/components/schemas/AdminRecipeVersion'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}:
    get:
      operationId: showRecipe
      tags:
        - Recipes
      summary: A recipe and its version history
      description: |
        Returns `ETag: "<lock_version>"` — the recipe's validator, which a
        write sends back as `If-Match`.

        The version summaries come with it: opening a recipe and asking which
        versions it has is one interaction, and the list is bounded by how
        many times a kitchen has revised one formulation.

        A recipe belonging to another organisation is indistinguishable from
        one that does not exist: both are `resource.not_found`.

        Requires `recipe.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The recipe and every version of it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - recipe
                      - versions
                    properties:
                      recipe:
                        $ref: '#/components/schemas/AdminRecipe'
                      versions:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminRecipeVersion'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateRecipe
      tags:
        - Recipes
      summary: Update a recipe
      description: |
        Requires `If-Match` carrying the `ETag` the resource was last served
        with: absent is **428** `request.precondition_required`, stale is
        **409** `resource.conflict` with `details.current_lock_version`.

        `slug` and `status` are not editable here — the slug is the handle an
        import converges on, and status changes are lifecycle actions with
        their own routes.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeRequest'
      responses:
        '200':
          description: The updated recipe, with its new validator.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/archive:
    post:
      operationId: archiveRecipe
      tags:
        - Recipes
      summary: Archive a recipe
      description: |
        A lifecycle action as a POST sub-resource, never a `PATCH status`.

        **Refused while a published version exists** —
        `409 catalogue.in_use`, with `details.published_version_ids`.
        Withdrawing something from sale is retiring the version, which has its
        own route and its own permission; letting archive do it implicitly
        would pull a live recipe through a route that never mentions
        publication.

        There is no delete. A recipe that has ever been published is part of a
        food-safety record.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The archived recipe.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecipeArchiveBlocked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions:
    get:
      operationId: listRecipeVersions
      tags:
        - Recipes
      summary: The version history of a recipe
      description: |
        Unpaginated: the collection is bounded by how many times one kitchen
        has revised one formulation, and a cursor over a dozen rows would add
        a walk to every client for no benefit.

        Requires `recipe.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: Every version, oldest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminRecipeVersion'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRecipeVersion
      tags:
        - Recipes
      summary: Open a new draft version
      description: |
        This is how a published version is changed: it is not. A published
        version is frozen, and the supported change is a new draft — optionally
        copied from an existing one, which is the normal path because a new
        version is almost always "last one, with a change".

        Copying carries lines, outputs, steps and **declared** allergen rows.
        Derived rows are not copied: they are a conclusion about a published
        state, and this version has none yet.

        No `If-Match` — nothing existing is being written.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeVersionRequest'
      responses:
        '201':
          description: The new draft version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions/{version}:
    get:
      operationId: showRecipeVersion
      tags:
        - Recipes
      summary: A version, with its lines, outputs, steps and allergen label
      description: |
        Everything in one response: a recipe editor needs all of it to render
        anything, and four requests to open one screen is four chances of a
        partial view of a formulation.

        `{version}` accepts either the version identifier or the version
        number — a client that walked the list holds identifiers, a human
        reading a technical sheet holds "version 3".

        **Lines carry no cost fields.** The cost projection is K1.3, behind
        `recipe.view_costs_organisation`; until that permission exists there is
        no way to serve a cost to the right people.

        `ETag: "<lock_version>"` is the version's validator — the one the
        line, output and step replacements require as `If-Match`.

        Requires `recipe.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The whole version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - version
                      - lines
                      - outputs
                      - steps
                      - allergens
                    properties:
                      version:
                        $ref: '#/components/schemas/AdminRecipeVersion'
                      lines:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeLine'
                      outputs:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeOutput'
                      steps:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeStep'
                      allergens:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeVersionAllergen'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateRecipeVersion
      tags:
        - Recipes
      summary: Update a draft version's header
      description: |
        Editable only while the version is `draft` or `review_required`. A
        published or retired version is **409**
        `catalogue.version_immutable` — not a conflict, because reloading will
        never make it writable and the answer is a new draft version.

        `status`, `derivation_state`, `derived_at`, `published_at` and
        `published_by` are absent from the body by design: each is a
        conclusion the server reached, and a client that could post
        `derivation_state: current` could declare an allergen label fresh
        without anything having been computed.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeVersionRequest'
      responses:
        '200':
          description: The updated version.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionEnvelope'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionImmutableOrConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/recipes/{recipe}/versions/{version}/lines:
    put:
      operationId: replaceRecipeLines
      tags:
        - Recipes
      summary: Replace the lines of a version
      description: |
        A PUT because the body is the complete formulation. A PATCH surface
        would make "I removed the sesame line" and "I forgot to send the
        sesame line" the same request, and on a formulation that difference is
        the whole point. An empty `lines` array is a legitimate statement, not
        a missing field.

        `line_number` is not a field: the array order is the sequence, so a
        client never keeps numbering in step with an insertion. Duplicate
        ingredients are **allowed** — a sheet that adds olive oil to the
        marinade and again to the finish is two lines.

        `quantity` may be null while the version is unpublished: the
        sauces-and-dressings source lists typical ingredients with no amounts,
        and refusing to store that would mean fabricating numbers. The publish
        gate is where nullability ends.

        `If-Match` carries the **version's** `lock_version`, not a line's: the
        set is the unit of change.

        Requires `recipe.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRecipeLinesRequest'
      responses:
        '200':
          description: The version and its new lines.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
