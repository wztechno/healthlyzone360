    UploadKycDocumentRequest:
      type: object
      description: |
        A `multipart/form-data` body. The size bound is checked before the
        bytes are read; **what the file is** is decided by sniffing, not by
        the part's `Content-Type` or its filename.
      required:
        - file
        - document_kind
      properties:
        file:
          type: string
          format: binary
          description: At most 10 MB. A PDF or a photograph — enforced on the sniffed type, never on the declared one.
        document_kind:
          allOf:
            - $ref: '#/components/schemas/B2bDocumentKind'
          description: '`signed_agreement` is refused: it is produced by the signing flow, never supplied by an applicant.'
        expires_on:
          type:
            - string
            - 'null'
          format: date
          description: Accepted for every kind, stored only for the kinds that expire.
    RequestB2bApplicationInformationRequest:
      type: object
      required:
        - information_request
      properties:
        information_request:
          type: string
          maxLength: 2000
          description: |
            Prose, and required. What a reviewer needs is rarely a field, and
            a closed vocabulary would force every real question through an
            `other` that says nothing. The applicant reads this verbatim.
        sections:
          type:
            - array
            - 'null'
          maxItems: 4
          description: |
            The sections to reopen. **An empty or absent list is meaningful**:
            it means the reviewer wants documents rather than answers, so
            nothing on the form reopens.
          items:
            $ref: '#/components/schemas/B2bApplicationSection'
    ApproveB2bApplicationRequest:
      type: object
      description: Both fields optional. An approval is self-explanatory; demanding a sentence would produce "approved" typed four hundred times.
      properties:
        internal_note:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: The reviewer's own record. Never served to the applicant.
        applicant_message:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: What the company reads.
    DeclineB2bApplicationRequest:
      type: object
      description: |
        `applicant_message` is required, and blank is refused. An unexplained
        refusal is not a decision the company can act on.
      required:
        - applicant_message
      properties:
        applicant_message:
          type: string
          minLength: 1
          maxLength: 2000
        internal_note:
          type:
            - string
            - 'null'
          maxLength: 2000
    SignB2bAgreementRequest:
      type: object
      description: |
        Every field is evidence. There is no `signature_ip_hash` or
        `signature_user_agent_hash` here and there must not be: those are
        observations of the request, taken by the server, and a
        client-supplied corroboration is not corroboration.
      required:
        - challenge_id
        - code
        - signatory_name
        - signatory_title
        - document_sha256
        - consent_statement
      properties:
        challenge_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 16
          description: The passcode from the signature challenge. Spent by this request.
        signatory_name:
          type: string
          maxLength: 160
        signatory_title:
          type: string
          maxLength: 120
          description: The capacity they sign in. Recorded because "who signed" without "on what authority" is half an answer.
        document_sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          description: |
            The digest of the exact bytes shown. Sixty-four hexadecimal
            characters or nothing — a truncated or base64 value would be
            recorded, would look plausible, and would prove nothing when it
            mattered.
        consent_statement:
          type: string
          maxLength: 2000
          description: The wording accepted, verbatim. A version number would be a pointer into copy somebody may later edit.
    ReviewKycDocumentRequest:
      type: object
      required:
        - verdict
      properties:
        verdict:
          type: string
          enum:
            - accepted
            - rejected
          description: |
            The two values a human may give. `pending` is where a document
            starts and `superseded` is what happens to an accepted one when a
            newer scan replaces it — neither is a decision.
        rejection_reason:
          oneOf:
            - $ref: '#/components/schemas/KycDocumentRejectionReason'
            - type: 'null'
          description: Required when rejecting. This half is what the applicant is shown.
        note:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: The reviewer's private note. Never served to the applicant.
    CreateOrganisationInvitationRequest:
      type: object
      required:
        - email
        - role_code
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: A live offer already outstanding to this address is superseded rather than refused.
        role_code:
          type: string
          maxLength: 60
          description: A platform template role, or one this organisation defined. Resolved inside the tenant scope.
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Must belong to this organisation.
        message:
          type:
            - string
            - 'null'
          maxLength: 1000
