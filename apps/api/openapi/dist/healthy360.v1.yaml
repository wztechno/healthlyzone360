      properties:
        code:
          $ref: '#/components/schemas/AllergenCode'
        name_en:
          type: string
        name_ar:
          type: string
        description_en:
          type:
            - string
            - 'null'
        description_ar:
          type:
            - string
            - 'null'
        regulatory_ref:
          type: string
          maxLength: 20
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
          type: boolean
        us_threshold_ppm:
          type:
            - integer
            - 'null'
        severe_by_default:
          type: boolean
        display_order:
