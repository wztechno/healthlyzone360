  /catalogue/recipes/{recipe}/versions/{version}/allergens:
    get:
      operationId: listRecipeVersionAllergens
      tags:
        - Recipes
      summary: The frozen allergen label of a version
      description: |
        Both kinds of row, each labelled by `derivation`: what was computed
        from the ingredients (`derived`, carrying the ingredient that caused
        it) and what a human stated (`declared`). A screen showing only one
        would either hide the chef's shared-fryer warning or hide the sesame
        the tahini brings.

        `meta.derivation_state` says whether the label still matches the
        mappings underneath it. A label read without that answer looks equally
        authoritative whether it is current or three mapping edits old.

        Requires `recipe.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/RecipePath'
        - $ref: '#/components/parameters/RecipeVersionPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
