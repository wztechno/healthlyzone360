          description: Restrict to one lifecycle state. Omitted, everything except `archived` is listed.
          schema:
            $ref: '#/components/schemas/PriceListStatus'
        - name: customer_scope
          in: query
          required: false
          description: Restrict to public tariffs or to negotiated agreements.
          schema:
