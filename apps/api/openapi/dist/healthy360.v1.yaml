          maxLength: 160
          description: Verbatim, as the source or the operator wrote it.
        alias_normalised:
          type: string
          maxLength: 160
          description: |
            Server-derived: lower-cased, trimmed, internal whitespace
            collapsed. Deliberately conservative — it does not stem or strip
            punctuation, because "Paprika Sweet" and "Paprika Smoked" are
            different ingredients.
        locale:
          type:
            - string
            - 'null'
          enum:
            - en
            - ar
            - null
        source_system:
          type:
            - string
            - 'null'
        source_ref:
          type:
            - string
            - 'null'
      additionalProperties: false
    IngredientCategory:
      type: object
      required:
        - id
        - organisation_id
        - is_platform
        - parent_id
        - code
        - name_en
        - name_ar
        - display_order
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organisation_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        is_platform:
          type: boolean
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
