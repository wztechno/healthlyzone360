    CreateAllergenClassRequest:
      type: object
      required:
        - code
        - name_en
        - name_ar
        - regulatory_ref
        - is_eu_14
        - is_us_big_9
      properties:
        code:
          $ref: '#/components/schemas/AllergenCode'
        name_en:
          type: string
          maxLength: 255
        name_ar:
          type: string
          maxLength: 255
        description_en:
          type:
            - string
            - 'null'
          maxLength: 2000
        description_ar:
          type:
            - string
            - 'null'
          maxLength: 2000
        regulatory_ref:
          type: string
          maxLength: 20
        is_eu_14:
          type: boolean
        is_us_big_9:
          type: boolean
        us_declaration_required:
