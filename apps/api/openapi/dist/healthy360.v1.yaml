            - staff
            - import
        display_name:
          type:
            - string
            - 'null'
        activated_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    UpdateB2bApplicationSectionRequest:
