  /catalogue/items/{item}/allergens:
    get:
      operationId: showCatalogueItemAllergens
      tags:
        - Sellable catalogue
      summary: An item's derived allergen set
      description: |
        Read-only, and **there is no writer** — that is the point. An item's
        allergens are never authored here: they come from a published recipe
        version's frozen label, or from the union of the item's own listed
        ingredients' effective mappings. An endpoint that let a merchandiser
        type an allergen onto a listing would be an endpoint that lets a
        merchandiser overrule a chef.

        Computed on read, never stored. There is no roll-up column and no
        per-item allergen table: the joins are cheap, and a stored copy goes
        stale the moment a mapping changes. Stored labels exist exactly where
        freezing is the point — on a published recipe version.

        `meta.basis` says which source answered:

        - `recipe_version` — the linked recipe's published version. Its frozen
          rows are the answer, with `declared` preserved as `declared`.
        - `item_ingredients` — the union of the listed ingredients' effective
          mappings, strongest containment winning, with `source_ingredient_id`
          naming the ingredient that made the stronger claim.
        - `none` — an empty set that means **"nobody has said"**, never "no
          allergens". Silence is not a statement of absence, and the publish
          gate refuses a meal in this state.

        Requires `catalogue.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The derived allergen set and the basis it was derived from.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - allergens
                    properties:
                      allergens:
                        type: array
                        items:
                          $ref: '#/components/schemas/DerivedAllergen'
                  meta:
                    $ref: '#/components/schemas/DerivedAllergenMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/items/{item}/readiness:
    get:
      operationId: showCatalogueItemReadiness
      tags:
        - Sellable catalogue
      summary: Whether a listing could be published, and why not
      description: |
        A read of the gate `POST …/publish` enforces — the same evaluator, not
        a second opinion about it. `CatalogueItemReadiness` is asked here and
        thrown from there, so an answer of `publishable: true` is the answer
        the publish attempt will give a moment later against the same rows.

        What that buys is a review queue that can show thirty listings'
        readiness without publishing any of them, and a plan editor that can
        show which cells of a price matrix are still empty while somebody is
        filling them in.

        Every reason is `{code, detail, context}`:

        - `code` is the stable machine key — the same vocabulary
          `catalogue.publish_blocked` uses in `details.reasons[].reason`.
        - `detail` is a sentence for a human. Clients that render their own
          copy per code should ignore it; clients that need to say *something*
          about a code they have not seen before should print it.
        - `context` carries whatever identifies the offending rows — `fields`,
          `status`, `review_reason`, `recipe_version_ids`,
          `catalogue_item_variant_ids` and the `configurations` beside them. It
          is a nested object rather than sibling keys so that a reason carrying
          new structure never changes the shape of a reason. It is `{}` when
          the code says everything there is to say.

        The vocabulary: `item_quarantined`, `item_not_a_draft`,
        `translation_incomplete`, `no_active_variant`, `no_allergen_basis`,
        `linked_recipe_quarantined`, and — for subscription plans only —
        `plan_profile_missing`, `no_active_plan_configuration`,
        `no_duration_assigned`, `plan_prices_incomplete`.

        `publishable` is exactly `reasons == []`. Both are on the wire because
        a badge wants the boolean and a checklist wants the list, and deriving
        one from the other at every call site is how the two drift apart in a
        UI.

        **`publishable: true` is not a statement about permission.** A
        subscription plan additionally needs `plan.publish_organisation`,
        checked inside the publish action because that is the only layer that
        has loaded the row and can therefore know it is a plan. This endpoint
        answers "is the data ready", never "may you"; conflating the two would
        make a merchandiser without plan authority read "not ready" about a
        plan that is perfectly ready.

        Requires **`catalogue.view_organisation`**, deliberately not
        `catalogue.publish_organisation`. Whoever has to complete a listing is
        the one who has to be able to see what it is still missing. It follows
        that a caller who can read this may learn that a plan is unpriced —
        which is a boolean about completeness and never an amount, the same
        line the confirmed-price port draws.

        No `ETag` and no `If-Match`. Readiness is not a resource with a version
        — it is a verdict about one, recomputed on every call because its
        inputs (prices, variants, the linked recipe's state) move underneath
        it.
      parameters:
        - $ref: '#/components/parameters/CatalogueItemPath'
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The verdict, and every reason behind it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/PublicationReadiness'
                  meta:
                    $ref: '#/components/schemas/CatalogueItemReadinessMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reference/diet-classifications:
    get:
      operationId: listDietClassifications
      tags:
        - Reference data
      summary: The platform diet vocabulary
      security: []
      description: |
        **Anonymous.** A diet filter that only works after sign-in is not a
        diet filter — the argument the public allergen-class list makes,
        applied to the softer of the two vocabularies.

        Served through the public projection: one server-localised `name`
        chosen from `Accept-Language`, never both language columns. Inactive
        classifications are excluded.

        A classification is a **preference filter, never a medical
        restriction**. What a dish contains is its allergen declaration; this
        says how a person describes the pattern of what they eat.

        Unpaginated: the list is small and constant.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: The active diet classifications, localised.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicDietClassification'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        properties:
                          count:
                            type: integer
                            minimum: 0
                          locale:
                            type: string
                            enum:
                              - en
                              - ar
                            description: The locale the names were rendered in.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /catalogue/price-lists:
    get:
      operationId: listPriceLists
      tags:
        - Pricing
      summary: List price lists
      description: |
        Every tariff this organisation quotes, cursor-paginated. Unlike the
        sales-channel list this one pages: a kitchen has a handful of channels
        but can accumulate a tariff per corporate client.

        Archived lists are excluded unless `status=archived` is asked for by
        name — a list offered by default is a list somebody assigns to a
        channel.

        **No amounts.** The header carries a currency and a status, never a
        price. Embedding rows here would serve an entire kitchen's negotiated
        pricing in one response, and a cursor page is exactly the shape that
        gets exported wholesale.

        Requires `price_list.view_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/CursorLimit'
        - $ref: '#/components/parameters/Cursor'
        - name: query
          in: query
          required: false
          description: Case-insensitive substring match over both names and the code.
          schema:
            type: string
            maxLength: 160
        - name: status
          in: query
          required: false
          description: Restrict to one lifecycle state. Omitted, everything except `archived` is listed.
          schema:
            $ref: '#/components/schemas/PriceListStatus'
        - name: customer_scope
          in: query
          required: false
          description: Restrict to public tariffs or to negotiated agreements.
          schema:
            $ref: '#/components/schemas/PriceListCustomerScope'
        - $ref: '#/components/parameters/XClientRequestId'
      responses:
        '200':
          description: A page of price lists.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPriceList'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ContextOrPermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createPriceList
      tags:
        - Pricing
      summary: Create a price list
      description: |
        Creates a **draft**. One created active would price customers before
        anybody had entered a price.

        `currency_code` is required and has no default: falling back to the
        organisation's default currency is the kind of helpfulness that
        produces a USD tariff in an AED kitchen with no way to tell whether
        anybody meant it. It is normalised to upper case, so a lowercase ISO
        code is not a second currency.

        A duplicate `code` is `409 resource.conflict`, not a second list.

        Requires `price_list.manage_organisation`.
      parameters:
        - $ref: '#/components/parameters/XOrganisationIdRequired'
        - $ref: '#/components/parameters/XClientRequestId'
